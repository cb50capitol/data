<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Barkod Tarayıcı</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    #reader {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    button, input[type="file"] {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      padding: 16px 30px;
      font-size: 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    input[type="file"] {
      top: 20px;
      bottom: auto;
      background-color: #28a745;
    }
    #log {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background-color: rgba(0,0,0,0.85);
      color: #fff;
      border-radius: 10px;
      font-size: 16px;
      font-family: monospace;
      z-index: 1002;
      max-width: 95%;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <input type="file" id="file-input" accept=".txt">
  <button id="start-btn">📷 Scan Et</button>
  <div id="reader" style="display: none;"></div>
  <div id="log" style="display: none;"></div>

  <script>
    const readerDiv = document.getElementById('reader');
    const startBtn = document.getElementById('start-btn');
    const fileInput = document.getElementById('file-input');
    const log = document.getElementById('log');

    let html5QrCode;
    let cameraId = null;
    let dataMap = {}; // Barkod: Satır eşleşmeleri
    let headers = [];

    // Dosya okuma
    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        const text = event.target.result;
        const lines = text.trim().split('\n').filter(line => line.trim() !== '');
        headers = lines[0].split('\t');

        dataMap = {};
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split('\t');
          if (cols[0]) {
            dataMap[cols[0]] = cols;
          }
        }

        alert("✅ Veri yüklendi: " + Object.keys(dataMap).length + " barkod");
      };
      reader.readAsText(file, 'UTF-8');
    });

    async function startCamera() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      if (!cameraId) {
        const devices = await Html5Qrcode.getCameras();
        if (devices.length === 0) throw new Error("Kamera bulunamadı");
        cameraId = devices.find(device => device.label.toLowerCase().includes("back"))?.id || devices[0].id;
      }

      await html5QrCode.start(
        cameraId,
        { fps: 10, qrbox: { width: 300, height: 300 }, aspectRatio: 1.7778 },
        qrCodeMessage => {
          showMatch(qrCodeMessage);
        },
        errorMessage => { }
      );
    }

    function showMatch(scannedCode) {
      if (dataMap[scannedCode]) {
        const values = dataMap[scannedCode];
        const line = headers.map((h, i) => `${h}: ${values[i]}`).join('\n');
        log.innerText = `✅ Eşleşme bulundu:\n\n${line}`;
      } else {
        log.innerText = `❌ Eşleşme bulunamadı:\n${scannedCode}`;
      }
      log.style.display = 'block';
    }

    startBtn.addEventListener('click', async () => {
      if (Object.keys(dataMap).length === 0) {
        alert("📄 Önce Scan.txt dosyasını yükleyin!");
        return;
      }

      readerDiv.style.display = 'block';
      startBtn.style.display = 'none';
      await startCamera();
    });
  </script>

</body>
</html>
