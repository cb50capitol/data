<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Barkod Tarayıcı</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    #reader {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #start-btn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      padding: 16px 30px;
      font-size: 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    #start-btn:active {
      background-color: #0056b3;
    }
    #log {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background-color: rgba(0,0,0,0.8);
      color: #fff;
      border-radius: 10px;
      font-size: 16px;
      font-family: monospace;
      z-index: 1002;
      max-width: 90%;
      word-wrap: break-word;
      display: none;
    }
  </style>
</head>
<body>

  <button id="start-btn">📷 Scan Et</button>
  <div id="reader" style="display: none;"></div>
  <div id="log">📋 Tarama sonucu burada görünecek.</div>

  <script>
    const log = document.getElementById('log');
    const readerDiv = document.getElementById('reader');
    const startBtn = document.getElementById('start-btn');

    let html5QrCode;
    let lastScanned = "";

    startBtn.addEventListener('click', () => {
      readerDiv.style.display = 'block';
      log.style.display = 'none';
      startBtn.style.display = 'none';

      html5QrCode = new Html5Qrcode("reader");

      Html5Qrcode.getCameras().then(devices => {
        if (devices.length === 0) throw new Error("Kamera bulunamadı");

        let backCamera = devices.find(device => device.label.toLowerCase().includes("back")) || devices[1] || devices[0];

        html5QrCode.start(
          backCamera.id,
          {
            fps: 10,
            qrbox: { width: 300, height: 300 },
            aspectRatio: 1.7778
          },
          qrCodeMessage => {
            if (qrCodeMessage !== lastScanned) {
              lastScanned = qrCodeMessage;
              log.innerHTML = "📦 Barkod: " + qrCodeMessage;
              log.style.display = 'block';

              html5QrCode.stop().then(() => {
                readerDiv.style.display = 'none';
                startBtn.style.display = 'inline-block';
              });
            }
          },
          errorMessage => {
            // Hatalar gösterilmiyor
          }
        );
      }).catch(err => {
        log.innerHTML = "❌ Kamera erişim hatası: " + err;
        log.style.display = 'block';
      });
    });
  </script>

</body>
</html>
