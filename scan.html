<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Barkod Tarayıcı</title>
  <style>
    :root {
      --bg: #f6f8fa; --card: #ffffff; --primary: #6366f1; --primary-hover: #4f46e5;
      --input-bg: #f9fafb; --input-border: #d1d5db; --text: #1f2937; --muted: #6b7280;
      --shadow: rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); margin: 0; padding: 20px 0;
      display: flex; justify-content: center; color: var(--text);
    }
    .wrapper {
      background: var(--card); padding: 30px 24px; border-radius: 20px;
      box-shadow: 0 10px 30px var(--shadow); max-width: 480px; width: 100%;
      text-align: center;
    }
    .search-box {
      position: relative; margin-bottom: 16px;
    }
    .search-box input {
      width: 100%; padding: 14px 44px 14px 14px; font-size: 15px;
      border-radius: 10px; border: 1px solid var(--input-border);
      font-family: 'Inter', sans-serif;
      background: var(--input-bg);
    }
    .search-box input:focus { border-color: var(--primary); outline: none; }
    .search-box button {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      font-size: 18px; color: var(--muted);
      padding: 0; margin: 0;
    }
    .search-box button:hover { color: var(--primary); }
    .button-group {
      display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap;
    }
    button.control {
      flex: 1; padding: 12px 18px; border-radius: 10px;
      font-size: 15px; font-weight: 500; cursor: pointer; border: none;
      transition: all 0.2s ease;
    }
    .primary { background: var(--primary); color: white; }
    .primary:hover { background: var(--primary-hover); }
    .secondary { background: #e5e7eb; color: var(--muted); }
    .secondary:hover { background: #d1d5db; }
    #video {
      width: 100%; max-height: 50vh; background: black; display: none;
      border-radius: 14px; margin-bottom: 16px;
    }
    .output {
      padding: 20px; background: #f3f4f6; border: 1px dashed #cbd5e1;
      border-radius: 14px; min-height: 100px;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; overflow-wrap: break-word;
      font-weight: 600; white-space: pre-line; /* satır kır */
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <!-- 📌 Manuel arama (numeric + ikonlu) -->
    <div class="search-box">
  <input 
    type="text" 
    id="searchInput" 
    placeholder="Barkod Ara..." 
    pattern="[0-9]*" 
    inputmode="numeric" 
  />
  <span class="search-icon" onclick="manualSearch()">🔍</span>
</div>

<div id="output" class="output">Sonuçlar burada görünecek...</div>

<script>
  async function manualSearch() {
    const input = document.getElementById("searchInput");
    const query = input.value.trim();

    if (!query) return;

    try {
      const response = await fetch("scan.txt");
      const text = await response.text();
      const lines = text.split("\n");

      let found = null;
      for (let line of lines) {
        const cols = line.trim().split(/\s+/); // boşluk/tab ile ayır
        if (cols[0] === query) {
          found = cols;
          break;
        }
      }

      let resultHtml = `<strong>Aranan:</strong> ${query}<br><strong>Sonuç:</strong><br>`;
      if (found) {
        resultHtml += found.slice(1).map(v => v).join("<br>");
      } else {
        resultHtml += "Barkod bulunamadı.";
      }

      document.getElementById("output").innerHTML = resultHtml;
    } catch (err) {
      document.getElementById("output").innerHTML = "scan.txt yüklenemedi.";
    }

    input.value = ""; // kutuyu temizle
  }

  // Enter ile arama
  document.getElementById("searchInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      manualSearch();
    }
  });

  // Numeric-only giriş
  document.getElementById("searchInput").addEventListener("input", function (e) {
    this.value = this.value.replace(/[^0-9]/g, ""); 
  });
</script>

</body>
</html>
