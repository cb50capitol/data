<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Barkod Tarayıcı</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin: 0; padding: 0; }
    #reader {
      width: 100vw;
      height: 100vh;
    }
    #log {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      font-family: monospace;
    }
    #start-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <button id="start-btn">📷 Scan Et</button>
  <div id="reader" style="display: none;"></div>
  <div id="log">📋 Tarama sonuçları burada görünecek.</div>

  <script>
    const log = document.getElementById('log');
    const readerDiv = document.getElementById('reader');
    const startBtn = document.getElementById('start-btn');

    let html5QrCode;

    startBtn.addEventListener('click', () => {
      readerDiv.style.display = 'block';
      startBtn.style.display = 'none';

      html5QrCode = new Html5Qrcode("reader");

      Html5Qrcode.getCameras().then(devices => {
        if (devices.length === 0) throw new Error("Kamera bulunamadı");

        // Arka kamerayı bulmaya çalış
        let backCamera = devices.find(device => device.label.toLowerCase().includes("back")) || devices[1] || devices[0];

        html5QrCode.start(
          backCamera.id,
          {
            fps: 10,
            qrbox: { width: 300, height: 300 }, // Ortalanmış kutu
            aspectRatio: 1.7778 // 16:9
          },
          qrCodeMessage => {
            log.innerHTML = "📦 Barkod: " + qrCodeMessage;
            html5QrCode.stop().then(() => {
              readerDiv.style.display = 'none';
              startBtn.style.display = 'inline-block';
            });
          },
          errorMessage => {
            // Sessizce hata geç
          }
        );
      }).catch(err => {
        log.innerHTML = "❌ Kamera erişim hatası: " + err;
      });
    });
  </script>
</body>
</html>
