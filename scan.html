<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Barkod Tarayıcı</title>
<style>
:root {
  --bg: #f6f8fa; --card: #ffffff; --primary: #6366f1; --primary-hover: #4f46e5;
  --input-bg: #f9fafb; --input-border: #d1d5db; --text: #1f2937; --muted: #6b7280;
  --shadow: rgba(0, 0, 0, 0.05);
}
* { box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px 0; display: flex; justify-content: center; color: var(--text);}
.wrapper { background: var(--card); padding: 30px 24px; border-radius: 20px; box-shadow: 0 10px 30px var(--shadow); max-width: 480px; width: 100%; text-align: center;}
.search-box { position: relative; margin-bottom: 16px; }
.search-box input { width: 100%; padding: 14px 44px 14px 14px; font-size: 15px; border-radius: 10px; border: 1px solid var(--input-border); font-family: 'Inter', sans-serif; background: var(--input-bg);}
.search-box input:focus { border-color: var(--primary); outline: none;}
.search-box button { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; color: var(--muted); padding: 0; margin: 0;}
.search-box button:hover { color: var(--primary); }

.button-group { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; align-items:center;}
button.control { flex: 0 0 120px; padding: 12px 18px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s ease;}
.primary { background: var(--primary); color: white; }
.primary:hover { background: var(--primary-hover);}
.secondary { background: #e5e7eb; color: var(--muted); }
.secondary:hover { background: #d1d5db;}

#video { width: 100%; max-height: 50vh; background: black; display: none; border-radius: 14px; margin-bottom: 16px;}

.output { padding: 20px; background: #f3f4f6; border: 1px dashed #cbd5e1; border-radius: 14px; min-height: 100px; display: flex; flex-direction: column; align-items: flex-start; font-weight: 600; white-space: pre-wrap; text-align: left; overflow-wrap: break-word;}

.other-output { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.other-item { padding: 16px; background: #eef2ff; border: 1px dashed #818cf8; border-radius: 14px; white-space: pre-wrap; text-align: left; }

label.switch-label { display:flex;align-items:center;gap:8px;font-size:14px; cursor:pointer; }
label.switch-label input[type="checkbox"] { width: 40px; height: 20px; position: relative; appearance: none; background: #e5e7eb; outline: none; border-radius: 20px; transition: 0.3s; }
label.switch-label input[type="checkbox"]:checked { background: var(--primary); }
label.switch-label input[type="checkbox"]::before { content:""; position:absolute; width:18px; height:18px; border-radius:50%; top:1px; left:1px; background:white; transition:0.3s; }
label.switch-label input[type="checkbox"]:checked::before { transform: translateX(20px); }
</style>
</head>
<body>
  
<!-- Onay ve uyarı sesleri -->
<audio id="beepSuccess" src="ok.mp3" preload="auto"></audio>
<audio id="beepError" src="no.mp3" preload="auto"></audio>

<div class="wrapper">
  <div class="search-box">
    <input type="text" id="manualInput" placeholder="Barkod.." inputmode="numeric" pattern="[0-9]*" autocomplete="off"/>
    <button id="searchBtn" aria-label="Ara">🔍</button>
  </div>

  <video id="video" autoplay playsinline></video>

  <div class="button-group">
    <button id="startBtn" class="control primary">Kamera Aç</button>

    <label class="switch-label">
      <input type="checkbox" id="keepOpenToggle">
      Kamera Açık Kalsın
    </label>

    <button id="stopBtn" class="control secondary" style="display:none;">Kamera Kapat</button>
  </div>

  <div id="result" class="output"> </div>
  <div id="otherResult" class="other-output"></div>
</div>

<script>
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const video = document.getElementById("video");
const resultDiv = document.getElementById("result");
const otherDiv = document.getElementById("otherResult");
const manualInput = document.getElementById("manualInput");
const searchBtn = document.getElementById("searchBtn");
const beepSuccess = document.getElementById("beepSuccess");
const beepError = document.getElementById("beepError");
const keepOpenToggle = document.getElementById("keepOpenToggle");
let stream;
let barcodeDetector;

// scan.txt'yi önceden yükle
const dataPromise = loadTxtData();

async function loadTxtData() {
  try {
    const response = await fetch("https://cb50capitol.vercel.app/scan.txt");
    const text = await response.text();
    return text.trim().split('\n').map(line=>line.trim().split(/\s+/)).filter(r=>r.length>=2);
  } catch(e) {
    console.error("scan.txt okunamadı:", e);
    resultDiv.textContent = "Hata: scan.txt dosyası yüklenemedi.";
    return [];
  }
}

async function showResult(code){
  const data = await dataPromise;
  const matches = data.filter(r=>r[0]===code);

  if(matches.length>0){
    const first = matches[0].slice(1).join("\n");
    resultDiv.textContent = `🔍 ${code}\n${first}`;

    otherDiv.innerHTML = "";
    if(matches.length>1){
      for(let i=1;i<matches.length;i++){
        const div = document.createElement("div");
        div.className="other-item";
        div.textContent = matches[i].slice(1).join("\n");
        otherDiv.appendChild(div);
      }
    }
  } else {
    resultDiv.textContent = `🔍 ${code}\nBarkod bulunamadı.`;
    otherDiv.innerHTML="";
  }
}

// Manuel arama
async function manualSearch(){
  const code = manualInput.value.trim();
  if(!code) return;

  const data = await dataPromise;
  const matches = data.filter(r => r[0] === code);

  if(matches.length > 0){
    try { await beepSuccess.play(); } catch(e){ console.log("Başarı sesi çalınamadı:", e); }
  } else {
    try { await beepError.play(); } catch(e){ console.log("Hata sesi çalınamadı:", e); }
  }

  await showResult(code);
  manualInput.value="";
}

searchBtn.addEventListener("click", manualSearch);
manualInput.addEventListener("keydown", e => { if(e.key==="Enter"){manualSearch();} });
manualInput.addEventListener("input", function(){ this.value=this.value.replace(/\D/g,""); });

// Kamera işlemleri
async function startCameraAndScan(){
  if(!("BarcodeDetector" in window)){alert("Tarayıcınız BarcodeDetector API'yi desteklemiyor."); return;}
  if(!barcodeDetector) barcodeDetector = new BarcodeDetector({formats:['ean_13','code_128','qr_code']});
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    video.srcObject=stream; video.style.display="block"; startBtn.style.display="none"; stopBtn.style.display="inline-block";
  }catch(err){console.error(err); resultDiv.textContent="Kamera açılamadı.";}
}

// Başlat düğmesi kullanıcı etkileşimiyle audio'u başlatır
startBtn.addEventListener("click", async () => {
  try {
    await beepSuccess.play(); beepSuccess.pause(); beepSuccess.currentTime = 0;
    await beepError.play(); beepError.pause(); beepError.currentTime = 0;
  } catch(err){ console.log("Ses başlatılamadı:", err); }
  startCameraAndScan();
});

// Kamera taramada barkod
video.addEventListener("click", async ()=> {
  if(!stream) return;
  try{
    const bitmap = await createImageBitmap(video);
    const barcodes = await barcodeDetector.detect(bitmap);
    if(barcodes.length>0){
      const code = barcodes[0].rawValue.trim();
      const data = await dataPromise;
      const matches = data.filter(r => r[0] === code);

      if(matches.length > 0){
        try { await beepSuccess.play(); } catch(e){ console.log("Başarı sesi çalınamadı:", e); }
      } else {
        try { await beepError.play(); } catch(e){ console.log("Hata sesi çalınamadı:", e); }
      }

      await showResult(code);

      // Toggle OFF ise mevcut davranış: kamera kapanır
      if(!keepOpenToggle.checked){
        stopCamera();
      }
    } else {
      try { await beepError.play(); } catch(e){ console.log("Hata sesi çalınamadı:", e); }
      resultDiv.textContent="🔍 -\nBarkod bulunamadı.";
      otherDiv.innerHTML="";
    }
  } catch(err){console.error(err);}
});

function stopCamera(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  video.srcObject=null; video.style.display="none"; startBtn.style.display="inline-block"; stopBtn.style.display="none";
}

stopBtn.addEventListener("click", stopCamera);
</script>
</body>
</html>
