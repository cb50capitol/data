<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Barkod Tarayıcı</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    #reader {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    button {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      padding: 16px 30px;
      font-size: 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    #cancel-btn {
      background-color: #dc3545; /* kırmızı */
      bottom: 70px; /* start-btn’ın üstünde */
      display: none;
    }
    #log {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background-color: rgba(0,0,0,0.85);
      color: #fff;
      border-radius: 10px;
      font-size: 16px;
      font-family: monospace;
      z-index: 1002;
      max-width: 95%;
      word-wrap: break-word;
      white-space: pre-wrap;
      max-height: 50vh;
      overflow-y: auto;
    }
    #checkbox-container {
      margin-top: 10px;
      text-align: center;
      user-select: none;
      font-family: sans-serif;
      color: white;
    }
    #checkbox-container label {
      display: inline-block;
      margin: 0 6px;
      cursor: pointer;
      user-select: none;
      font-weight: normal;
      color: white;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <button id="start-btn">📷 Scan Et</button>
  <button id="cancel-btn">❌ İptal</button>
  <div id="reader" style="display: none;"></div>
  <div id="log" style="display: none;">
    <div id="checkbox-container"></div>
  </div>

  <script>
    const readerDiv = document.getElementById('reader');
    const startBtn = document.getElementById('start-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const log = document.getElementById('log');
    const checkboxContainer = document.getElementById('checkbox-container');

    let html5QrCode;
    let cameraId = null;
    let barcodeData = {}; // EAN -> Satır
    let headers = [];

    function loadScanTxt() {
      const timestamp = new Date().getTime();
      return fetch('Scan.txt?t=' + timestamp)
        .then(response => {
          if (!response.ok) throw new Error("Scan.txt dosyası yüklenemedi");
          return response.text();
        })
        .then(text => {
          barcodeData = {};
          headers = [];

          const lines = text.trim().split('\n').filter(line => line.trim() !== '');
          headers = lines[0].split('\t');

          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split('\t');
            if (cols[0]) {
              barcodeData[cols[0].trim()] = cols;
            }
          }
          console.log("✅ Scan.txt verisi yüklendi:", Object.keys(barcodeData).length, "satır");
        })
        .catch(err => {
          log.innerText = "❌ Scan.txt yüklenemedi: " + err;
          log.style.display = 'block';
          checkboxContainer.innerHTML = '';
        });
    }

    async function startCamera() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      if (!cameraId) {
        const devices = await Html5Qrcode.getCameras();
        if (devices.length === 0) throw new Error("Kamera bulunamadı");
        cameraId = devices.find(device => device.label.toLowerCase().includes("back"))?.id || devices[0].id;
      }

      await html5QrCode.start(
        cameraId,
        { fps: 10, qrbox: { width: 300, height: 300 }, aspectRatio: 1.7778 },
        qrCodeMessage => {
          showMatch(qrCodeMessage.trim());
        },
        errorMessage => { }
      );
    }

    async function stopCamera() {
      if (html5QrCode) {
        await html5QrCode.stop();
        await html5QrCode.clear();
      }
      cameraId = null;
      readerDiv.style.display = 'none';
      cancelBtn.style.display = 'none';
      startBtn.style.display = 'block';
    }

    function saveCheckboxState(barcode, index, checked) {
      let savedData = JSON.parse(localStorage.getItem('checkboxState') || '{}');
      if (!savedData[barcode]) savedData[barcode] = {};
      savedData[barcode][index] = checked;
      localStorage.setItem('checkboxState', JSON.stringify(savedData));
    }

    function loadCheckboxState(barcode, index) {
      let savedData = JSON.parse(localStorage.getItem('checkboxState') || '{}');
      return savedData[barcode]?.[index] || false;
    }

    function showMatch(barcode) {
      loadScanTxt().then(() => {
        checkboxContainer.innerHTML = '';

        if (barcodeData[barcode]) {
          const values = barcodeData[barcode];
          const result = headers.map((h, i) => `${h}: ${values[i]}`).join('\n');
          log.innerText = `✅ Eşleşme:\n\n${result}`;

          const sasIndex = headers.indexOf('SAS');
          const sasCount = parseInt(values[sasIndex]) || 0;

          if (sasCount > 0) {
            let info = document.createElement('div');
            info.style.marginTop = '10px';
            info.style.color = 'white';
            info.style.fontWeight = 'bold';
            info.innerText = `SAS adetine göre ${sasCount} adet kutu işaretleyin:`;
            checkboxContainer.appendChild(info);

            for (let i = 0; i < sasCount; i++) {
              let label = document.createElement('label');

              let cb = document.createElement('input');
              cb.type = 'checkbox';
              cb.checked = loadCheckboxState(barcode, i);
              cb.addEventListener('change', (e) => {
                saveCheckboxState(barcode, i, e.target.checked);
              });

              label.appendChild(cb);
              label.appendChild(document.createTextNode(` ${i + 1}`));
              checkboxContainer.appendChild(label);
            }
          }

        } else {
          log.innerText = `❌ Eşleşme bulunamadı:\n${barcode}`;
          checkboxContainer.innerHTML = '';
        }
        log.style.display = 'block';
      });
    }

    startBtn.addEventListener('click', async () => {
      readerDiv.style.display = 'block';
      startBtn.style.display = 'none';
      cancelBtn.style.display = 'block';

      await loadScanTxt();
      await startCamera();
    });

    cancelBtn.addEventListener('click', async () => {
      await stopCamera();
      // Burada log'u gizlemiyoruz, böylece eşleşme görünür kalır
    });
  </script>

</body>
</html>
