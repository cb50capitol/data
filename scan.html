<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Barkod Tarayıcı</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
    }
    #reader {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    button {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      padding: 16px 30px;
      font-size: 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      cursor: pointer;
    }
    button:active {
      background-color: #0056b3;
    }
    #log {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background-color: rgba(0,0,0,0.85);
      color: #fff;
      border-radius: 10px;
      font-size: 16px;
      font-family: monospace;
      z-index: 1002;
      max-width: 90%;
      word-wrap: break-word;
    }
    #log-list {
      margin: 0;
      padding: 0;
      list-style: none;
      text-align: left;
    }
    #log-list li {
      border-bottom: 1px solid rgba(255,255,255,0.2);
      padding: 6px 0;
    }
    #continue-btn {
      display: none;
    }
  </style>
</head>
<body>

  <button id="start-btn">📷 Scan Et</button>
  <button id="continue-btn">📎 Devam Et</button>
  <div id="reader" style="display: none;"></div>
  <div id="log" style="display: none;">
    <strong>📋 Son 2 Barkod:</strong>
    <ul id="log-list"></ul>
  </div>

  <script>
    const logBox = document.getElementById('log');
    const logList = document.getElementById('log-list');
    const readerDiv = document.getElementById('reader');
    const startBtn = document.getElementById('start-btn');
    const continueBtn = document.getElementById('continue-btn');

    let html5QrCode;
    let scannedCodes = [];
    let cameraId = null;

    function updateLogList(newCode) {
      if (scannedCodes[0] === newCode) return; // aynıysa ekleme

      scannedCodes.unshift(newCode);
      if (scannedCodes.length > 2) {
        scannedCodes.pop();
      }

      logList.innerHTML = '';
      scannedCodes.forEach(code => {
        const li = document.createElement('li');
        li.textContent = code;
        logList.appendChild(li);
      });

      logBox.style.display = 'block';
    }

    async function startCamera() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      // Eğer kamera daha önce seçildiyse onu tekrar kullan
      if (!cameraId) {
        const devices = await Html5Qrcode.getCameras();
        if (devices.length === 0) throw new Error("Kamera bulunamadı");
        cameraId = devices.find(device => device.label.toLowerCase().includes("back"))?.id || devices[0].id;
      }

      await html5QrCode.start(
        cameraId,
        {
          fps: 10,
          qrbox: { width: 300, height: 300 },
          aspectRatio: 1.7778
        },
        qrCodeMessage => {
          updateLogList("📦 " + qrCodeMessage);
          html5QrCode.stop().then(() => {
            continueBtn.style.display = 'inline-block';
          });
        },
        errorMessage => {
          // Sessiz geç
        }
      );
    }

    startBtn.addEventListener('click', async () => {
      readerDiv.style.display = 'block';
      startBtn.style.display = 'none';
      await startCamera();
    });

    continueBtn.addEventListener('click', async () => {
      continueBtn.style.display = 'none';
      await startCamera();
    });
  </script>

</body>
</html>
