<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barkod Tarayıcı</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: #f0f0f0;
    }

    video {
      width: 100%;
      max-height: 60vh;
      background: black;
    }

    #result {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: bold;
    }

    button {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 1.2em;
    }
  </style>
</head>
<body>

  <h1>Barkod Tarayıcı</h1>
  <button id="startBtn">Kamera Aç</button>
  <video id="video" autoplay playsinline style="display: none;"></video>
  <div id="result">Sonuç: -</div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const video = document.getElementById("video");
    const resultDiv = document.getElementById("result");

    let stream;

    async function loadTxtData() {
      try {
        const response = await fetch("scan.txt");
        const text = await response.text();
        const lines = text.trim().split('\n').map(line => line.trim().split(' '));
        return lines;
      } catch (e) {
        console.error("scan.txt yüklenemedi:", e);
        resultDiv.textContent = "Hata: scan.txt dosyası okunamadı.";
        return [];
      }
    }

    async function startCameraAndScan() {
      if (!('BarcodeDetector' in window)) {
        alert("Tarayıcınız BarcodeDetector API'yi desteklemiyor.");
        return;
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.style.display = "block";
        startBtn.style.display = "none";
      } catch (err) {
        console.error("Kamera açılamadı:", err);
        resultDiv.textContent = "Kamera açılamadı.";
        return;
      }

      const barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'code_128', 'qr_code'] });

      // Tıklanınca tarama başlar
      video.addEventListener("click", async () => {
        try {
          const bitmap = await createImageBitmap(video);
          const barcodes = await barcodeDetector.detect(bitmap);

          if (barcodes.length > 0) {
            const code = barcodes[0].rawValue;
            console.log("Barkod bulundu:", code);
            resultDiv.textContent = "Barkod: " + code;

            // Verileri txt'den yükle ve ara
            const data = await loadTxtData();
            const match = data.find(row => row[0] === code);

            if (match) {
              resultDiv.textContent = "Sonuç: " + match.join(" ");
            } else {
              resultDiv.textContent = "Sonuç: Barkod bulunamadı.";
            }

            // Kamerayı durdur
            stream.getTracks().forEach(track => track.stop());
            video.style.display = "none";
            startBtn.style.display = "block";
          } else {
            resultDiv.textContent = "Barkod bulunamadı. Tekrar deneyin.";
          }
        } catch (err) {
          console.error("Tarama hatası:", err);
        }
      });
    }

    startBtn.addEventListener("click", startCameraAndScan);
  </script>

</body>
</html>
