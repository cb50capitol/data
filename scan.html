<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Barkod Tarayıcı</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 20px;
    }

    #video {
      width: 100%;
      max-height: 60vh;
      background: black;
      display: none;
    }

    #result {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: bold;
      white-space: pre-wrap; /* \n için */
    }

    button {
      padding: 15px 30px;
      font-size: 1.2em;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>Barkod Tarayıcı</h1>
  <button id="startBtn">Kamera Aç</button>
  <video id="video" autoplay playsinline></video>
  <div id="result">Sonuç: -</div>

 <script>
  const startBtn = document.getElementById("startBtn");
  const video = document.getElementById("video");
  const resultDiv = document.getElementById("result");
  let stream;
  let barcodeDetector;

  // 1) scan.txt'yi başta yükleyip cache'le
  const dataPromise = loadTxtData();

  async function loadTxtData() {
    try {
      const response = await fetch("scan.txt");
      const text = await response.text();
      return text.trim().split('\n').map(line => line.trim().split(/\s+/)).filter(row => row.length >= 2);
    } catch (e) {
      console.error("scan.txt okunamadı:", e);
      resultDiv.textContent = "Hata: scan.txt dosyası yüklenemedi.";
      return [];
    }
  }

  async function startCameraAndScan() {
    if (!("BarcodeDetector" in window)) {
      alert("Tarayıcınız BarcodeDetector API'yi desteklemiyor.");
      return;
    }
    // Detector'ı bir kez oluştur
    if (!barcodeDetector) {
      barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'code_128', 'qr_code'] });
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream;
      video.style.display = "block";
      startBtn.style.display = "none";
    } catch (err) {
      console.error("Kamera açılamadı:", err);
      resultDiv.textContent = "Kamera açılamadı.";
      return;
    }
  }

  // 2) Dinleyiciyi DIŞARIDA bir kez ekle (birikme yok)
  video.addEventListener("click", onVideoClick);

  async function onVideoClick() {
    if (!stream) return; // Kamera kapalıyken tıklandıysa yok say
    try {
      const bitmap = await createImageBitmap(video);
      const barcodes = await barcodeDetector.detect(bitmap);

      if (barcodes.length > 0) {
        const code = barcodes[0].rawValue.trim();
        resultDiv.textContent = "Barkod: " + code;

        const data = await dataPromise; // cache'den
        const match = data.find(row => row[0] === code);

        if (match) {
          resultDiv.textContent = "Sonuç:\n" + match.join(" ");
        } else {
          resultDiv.textContent = "Sonuç: Barkod bulunamadı.";
        }

        // Kamera kapat + tam temizle
        stream.getTracks().forEach(t => t.stop());
        stream = null;
        video.srcObject = null;
        video.style.display = "none";
        startBtn.style.display = "block";
      } else {
        resultDiv.textContent = "Barkod bulunamadı. Lütfen tekrar deneyin.";
      }
    } catch (err) {
      console.error("Tarama hatası:", err);
    }
  }

  startBtn.addEventListener("click", startCameraAndScan);
</script>

</body>
</html>
