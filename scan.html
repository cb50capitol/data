<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Barkod Tarayıcı</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
      overflow: hidden;
    }
    #reader {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #scan-line {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: red;
      z-index: 1001;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 1; }
    }

    button {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1002;
      padding: 16px 30px;
      font-size: 18px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    #log {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 20px;
      background-color: rgba(0,0,0,0.85);
      color: #fff;
      border-radius: 10px;
      font-size: 16px;
      font-family: monospace;
      z-index: 1002;
      max-width: 95%;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div id="reader">
    <div id="scan-line"></div>
  </div>

  <button id="scan-btn">📷 Scan Et</button>
  <div id="log" style="display: none;"></div>

  <script>
    const readerDiv = document.getElementById('reader');
    const scanBtn = document.getElementById('scan-btn');
    const log = document.getElementById('log');

    let html5QrCode;
    let cameraId = null;
    let scanning = false;
    let barcodeData = {};
    let headers = [];

    function loadScanTxt() {
      const timestamp = new Date().getTime();
      return fetch('Scan.txt?t=' + timestamp)
        .then(response => {
          if (!response.ok) throw new Error("Scan.txt dosyası yüklenemedi");
          return response.text();
        })
        .then(text => {
          barcodeData = {};
          headers = [];

          const lines = text.trim().split('\n').filter(line => line.trim() !== '');
          headers = lines[0].split('\t');

          for (let i = 1; i < lines.length; i++) {
            const cols = lines[i].split('\t');
            if (cols[0]) {
              barcodeData[cols[0].trim()] = cols;
            }
          }

          console.log("✅ Scan.txt verisi yüklendi:", Object.keys(barcodeData).length, "satır");
        })
        .catch(err => {
          log.innerText = "❌ Scan.txt yüklenemedi: " + err;
          log.style.display = 'block';
        });
    }

    async function startCamera() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      if (!cameraId) {
        const devices = await Html5Qrcode.getCameras();
        if (devices.length === 0) throw new Error("Kamera bulunamadı");
        cameraId = devices.find(device => device.label.toLowerCase().includes("back"))?.id || devices[0].id;
      }

      await html5QrCode.start(
        cameraId,
        { fps: 10, qrbox: { width: 300, height: 300 }, aspectRatio: 1.7778 },
        qrCodeMessage => {
          if (!scanning) return;
          scanning = false;
          processBarcode(qrCodeMessage.trim());
        },
        errorMessage => {
          // Hata bastırılıyor
        }
      );
    }

    function processBarcode(barcode) {
      navigator.vibrate?.(200); // Titreşim

      loadScanTxt().then(() => {
        if (barcodeData[barcode]) {
          const values = barcodeData[barcode];
          const result = headers.map((h, i) => `${h}: ${values[i]}`).join('\n');
          log.innerText = `✅ Eşleşme:\n\n${result}`;
        } else {
          log.innerText = `❌ Eşleşme bulunamadı:\n${barcode}`;
        }
        log.style.display = 'block';
        setTimeout(() => {
          scanning = true; // 1-2 saniye sonra yeniden okutma izni
        }, 1500);
      });
    }

    scanBtn.addEventListener('click', () => {
      log.style.display = 'none';
      scanning = true;
    });

    // Sayfa yüklenince kamera başlasın
    window.addEventListener('load', async () => {
      await loadScanTxt();
      await startCamera();
    });
  </script>

</body>
</html>
