<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Barkod Tarayıcı</title>
  <style>
    :root {
      --bg: #f6f8fa; --card: #ffffff; --primary: #6366f1; --primary-hover: #4f46e5;
      --input-bg: #f9fafb; --input-border: #d1d5db; --text: #1f2937; --muted: #6b7280;
      --shadow: rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); margin: 0; padding: 20px 0;
      display: flex; justify-content: center; color: var(--text);
    }
    .wrapper {
      background: var(--card); padding: 30px 24px; border-radius: 20px;
      box-shadow: 0 10px 30px var(--shadow); max-width: 480px; width: 100%;
      text-align: center;
    }
    input {
      width: 100%; padding: 14px; font-size: 15px;
      border-radius: 10px; border: 1px solid var(--input-border);
      font-family: 'Inter', sans-serif;
      margin-bottom: 16px; background: var(--input-bg);
    }
    input:focus { border-color: var(--primary); outline: none; }
    .button-group {
      display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap;
    }
    button {
      flex: 1; padding: 12px 18px; border-radius: 10px;
      font-size: 15px; font-weight: 500; cursor: pointer; border: none;
      transition: all 0.2s ease;
    }
    .primary { background: var(--primary); color: white; }
    .primary:hover { background: var(--primary-hover); }
    .secondary { background: #e5e7eb; color: var(--muted); }
    .secondary:hover { background: #d1d5db; }
    #video {
      width: 100%; max-height: 50vh; background: black; display: none;
      border-radius: 14px; margin-bottom: 16px;
    }
    .output {
      padding: 20px; background: #f3f4f6; border: 1px dashed #cbd5e1;
      border-radius: 14px; min-height: 100px;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; overflow-wrap: break-word;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="wrapper">

    <!-- 📌 Manuel arama -->
    <input type="text" id="manualInput" placeholder="Barkod giriniz">
    <button id="searchBtn" class="primary" style="width:100%; margin-bottom:16px;">Ara</button>

    <!-- 📌 Kamera alanı -->
    <video id="video" autoplay playsinline></video>

    <!-- 📌 Kamera kontrol butonları -->
    <div class="button-group">
      <button id="startBtn" class="primary">Kamera Aç</button>
      <button id="stopBtn" class="secondary" style="display:none;">Kamera Kapat</button>
    </div>

    <!-- 📌 Sonuç alanı -->
    <div id="result" class="output">Sonuç: -</div>

  </div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const video = document.getElementById("video");
    const resultDiv = document.getElementById("result");
    const manualInput = document.getElementById("manualInput");
    const searchBtn = document.getElementById("searchBtn");
    let stream;
    let barcodeDetector;

    // 📌 scan.txt'yi başta yükleyip cache'le
    const dataPromise = loadTxtData();

    async function loadTxtData() {
      try {
        const response = await fetch("scan.txt");
        const text = await response.text();
        return text.trim().split('\n').map(line => line.trim().split(/\s+/)).filter(row => row.length >= 2);
      } catch (e) {
        console.error("scan.txt okunamadı:", e);
        resultDiv.textContent = "Hata: scan.txt dosyası yüklenemedi.";
        return [];
      }
    }

    async function startCameraAndScan() {
      if (!("BarcodeDetector" in window)) {
        alert("Tarayıcınız BarcodeDetector API'yi desteklemiyor.");
        return;
      }
      if (!barcodeDetector) {
        barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'code_128', 'qr_code'] });
      }

      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        video.style.display = "block";
        startBtn.style.display = "none";
        stopBtn.style.display = "inline-block";
      } catch (err) {
        console.error("Kamera açılamadı:", err);
        resultDiv.textContent = "Kamera açılamadı.";
      }
    }

    video.addEventListener("click", onVideoClick);

    async function onVideoClick() {
      if (!stream) return;
      try {
        const bitmap = await createImageBitmap(video);
        const barcodes = await barcodeDetector.detect(bitmap);

        if (barcodes.length > 0) {
          const code = barcodes[0].rawValue.trim();
          showResult(code);
          stopCamera();
        } else {
          resultDiv.textContent = "Barkod bulunamadı. Lütfen tekrar deneyin.";
        }
      } catch (err) {
        console.error("Tarama hatası:", err);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;
      video.style.display = "none";
      startBtn.style.display = "inline-block";
      stopBtn.style.display = "none";
    }

    // 📌 Ortak sonuç gösterici
    async function showResult(code) {
      const data = await dataPromise;
      const match = data.find(row => row[0] === code);

      if (match) {
        resultDiv.textContent = "Sonuç:\n" + match.join(" ");
      } else {
        resultDiv.textContent = "Sonuç: Barkod bulunamadı.";
      }
    }

    // 📌 Manuel arama
    searchBtn.addEventListener("click", () => {
      const code = manualInput.value.trim();
      if (code) {
        showResult(code);
      } else {
        resultDiv.textContent = "Lütfen barkod giriniz.";
      }
    });

    startBtn.addEventListener("click", startCameraAndScan);
    stopBtn.addEventListener("click", stopCamera);
  </script>
</body>
</html>
