<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uygulama Menüsü - Modern Tasarım</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f0f4ff, #fff9f0);
      min-height: 100vh;
      padding: 3rem 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .container {
      max-width: 1100px;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.75rem 2rem;
    }

    a.card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: saturate(180%) blur(15px);
      border-radius: 1.25rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.07);
      padding: 2.5rem 2rem;
      text-align: center;
      color: #1e293b;
      text-decoration: none;
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      cursor: pointer;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    a.card:hover {
      transform: translateY(-10px) scale(1.05);
      box-shadow: 0 25px 50px rgba(0,0,0,0.12);
    }

    .icon-bg {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #e0e7ff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
      transition: background 0.3s ease, box-shadow 0.3s ease;
      flex-shrink: 0;
    }

    a.card:hover .icon-bg {
      background: #4f46e5;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.6);
    }

    i[data-lucide] {
      stroke-width: 1.75;
      color: #4f46e5;
      width: 40px;
      height: 40px;
      transition: color 0.3s ease;
    }

    a.card:hover i[data-lucide] {
      color: white;
    }

    h3 {
      font-size: 1.375rem;
      font-weight: 700;
      margin: 0;
      color: #1e293b;
      letter-spacing: 0.02em;
    }

    p {
      font-size: 0.95rem;
      color: #475569;
      margin: 0;
    }

    @media (max-width: 640px) {
      body {
        padding: 2rem 1rem;
      }
      .container {
        gap: 1.5rem 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <a href="https://cb50capitol.vercel.app/" class="card" aria-label="Envanter uygulamasına git">
      <div class="icon-bg" style="background:#c7d2fe; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);">
        <i data-lucide="package"></i>
      </div>
      <h3>Envanter</h3>
      <p>Mobil & Windows</p>
    </a>

    <a href="https://cb50capitol.vercel.app/test.html" class="card" aria-label="TKS / İKS uygulamasına git">
      <div class="icon-bg" style="background:#bbf7d0; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);">
        <i data-lucide="shuffle"></i>
      </div>
      <h3>TKS / İKS</h3>
      <p>Mobil & Windows</p>
    </a>

    <a href="https://cb50capitol.vercel.app/kargo.html" class="card" aria-label="E-Ticaret uygulamasına git">
      <div class="icon-bg" style="background:#bfdbfe; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);">
        <i data-lucide="truck"></i>
      </div>
      <h3>E-Ticaret</h3>
      <p>Windows</p>
    </a>

    <a href="https://cb50capitol.vercel.app/mipaket.html" class="card" aria-label="Mi Paket uygulamasına git">
      <div class="icon-bg" style="background:#ddd6fe; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);">
        <i data-lucide="package"></i>
      </div>
      <h3>Mi Paket</h3>
      <p>Windows</p>
    </a>

    <a href="https://cb50capitol.vercel.app/iptal.html" class="card" aria-label="İptal / Fark uygulamasına git">
      <div class="icon-bg" style="background:#fecaca; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);">
        <i data-lucide="x-octagon"></i>
      </div>
      <h3>İptal / Fark</h3>
      <p>Windows</p>
    </a>

    <a href="https://cb50capitol.vercel.app/barcode.html" class="card" aria-label="QR / Ean uygulamasına git">
      <div class="icon-bg" style="background:#fbcfe8; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);">
        <i data-lucide="qrcode"></i>
      </div>
      <h3>QR / Ean</h3>
      <p>Mobil & Windows</p>
    </a>

    <a href="https://cb50capitol.vercel.app/ptc.html" class="card" aria-label="PTC uygulamasına git">
      <div class="icon-bg" style="background:#fde68a; box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);">
        <i data-lucide="cpu"></i>
      </div>
      <h3>PTC</h3>
      <p>Android & Windows</p>
    </a>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
