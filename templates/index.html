<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Boyner Görsel Bulucu</title>
</head>
<body>
    <h2>Boyner Ürün Görsel Bulucu</h2>

    <form id="form">
        <label>Ürün Kodu:</label>
        <input type="text" id="kod" required>
        <button type="submit">Ara</button>
    </form>

    <hr>

    <div id="sonuc"></div>

<script>
    const form = document.getElementById("form");
    const sonuc = document.getElementById("sonuc");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        sonuc.innerHTML = "Yükleniyor...";

        let kod = document.getElementById("kod").value.trim();

        const res = await fetch(`/ara?kod=${encodeURIComponent(kod)}`);
        const data = await res.json();

        if (data.resim) {
            sonuc.innerHTML = `<img src="${data.resim}" style="max-width:300px;">`;
        } else {
            sonuc.innerHTML = "Hata: " + data.hata;
        }
    });
</script>

</body>
</html>
