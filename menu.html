<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capitol - Beyaz Tonlar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fafbfc, #e6ebf0);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      color: #222;
    }
    .container {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 28px;
      padding: 54px 48px;
      max-width: 420px;
      width: 100%;
      box-shadow:
        12px 12px 32px rgba(0,0,0,0.06),
        -12px -12px 32px rgba(255,255,255,0.9);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      text-align: center;
      transition: box-shadow 0.3s ease;
    }
    .container:hover {
      box-shadow:
        15px 15px 40px rgba(0,0,0,0.08),
        -15px -15px 40px rgba(255,255,255,1);
    }
    h1 {
      font-weight: 600;
      font-size: 3.6rem;
      margin-bottom: 10px;
      letter-spacing: 0.05em;
      user-select: text;
      color: #111;
    }
    p.subtitle {
      font-weight: 400;
      font-size: 1.4rem;
      margin-bottom: 56px;
      color: #555;
      user-select: text;
    }
    button {
      width: 100%;
      padding: 20px 0;
      margin-bottom: 24px;
      font-weight: 600;
      font-size: 1.3rem;
      color: #333;
      background: #f5f7fa;
      border: none;
      border-radius: 32px;
      cursor: pointer;
      box-shadow:
        inset 7px 7px 12px #d1d9e6,
        inset -7px -7px 12px #ffffff;
      transition:
        background-color 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.15s ease;
      user-select: none;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.06));
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    button:hover {
      background: #e1e6f0;
      box-shadow:
        10px 10px 20px rgba(130,140,170,0.3),
        -10px -10px 20px #ffffff;
      transform: translateY(-4px);
      color: #111;
    }
    button:active {
      background: #cdd5e4;
      box-shadow:
        inset 5px 5px 9px #aeb9cb,
        inset -5px -5px 9px #f3f6fb;
      transform: translateY(0);
      color: #000;
    }
    @media (max-width: 440px) {
      .container {
        padding: 44px 36px;
      }
      h1 {
        font-size: 3rem;
      }
      p.subtitle {
        font-size: 1.2rem;
        margin-bottom: 44px;
      }
      button {
        font-size: 1.15rem;
        padding: 18px 0;
        margin-bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container" role="main" aria-label="Capitol navigasyon">
    <h1>Capitol</h1>
    <p class="subtitle">CB50</p>
    <button onclick="window.location.href='https://cb50capitol.vercel.app/'" aria-label="Envanter sayfasına git">Envanter</button>
    <button onclick="window.location.href='https://cb50capitol.vercel.app/test.html'" aria-label="TKS / İKS sayfasına git">TKS / İKS</button>
    <button onclick="window.location.href='https://cb50capitol.vercel.app/ptc.html'" aria-label="PTC sayfasına git">PTC</button>
    <button onclick="window.location.href='https://cb50capitol.vercel.app/kargo.html'" aria-label="E-Ticaret Kargo sayfasına git">E-Ticaret Kargo</button>
    <button onclick="window.location.href='https://cb50capitol.vercel.app/iptal.html'" aria-label="İptal / Fark sayfasına git">İptal / Fark</button>
  </div>
</body>
</html>
