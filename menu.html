<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mobil Menü</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous"
  />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    body {
      background: linear-gradient(to bottom, #f3f6fb, #e4ecf4);
      /* padding-bottom kaldırıldı */
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding: 20px 16px;
      max-width: 500px;
      margin: auto;
      max-height: calc(100vh - 20px);
      overflow-y: auto;
    }

    .menu-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 130px;
      border-radius: 18px;
      color: #fff;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .menu-card i {
      font-size: 1.6rem;
      margin-bottom: 8px;
    }

    .menu-card span {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .menu-card small {
      font-size: 0.7rem;
      opacity: 0.9;
      margin-top: 2px;
      display: block;
    }

    .menu-card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: rgba(255, 255, 255, 0.08);
      transform: rotate(45deg);
      transition: all 0.3s ease-in-out;
    }

    .menu-card:hover::before {
      left: 100%;
      top: 100%;
    }

    .menu-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.15);
    }

    .envanter { background: linear-gradient(135deg, #a18cd1 , #fbc2eb); }
    .tks { background: linear-gradient(135deg, #fad0c4 , #ffd1ff); }
    .eticaret { background: linear-gradient(135deg, #ff9a9e , #fecfef); }
    .mipaket { background: linear-gradient(135deg, #ffecd2 , #fcb69f); }
    .paketara { background: linear-gradient(135deg, #a1c4fd , #c2e9fb); }
    .iptal { background: linear-gradient(135deg, #667eea , #764ba2); }
    .ean { background: linear-gradient(135deg, #89f7fe , #66a6ff); }
    .ptc { background: linear-gradient(135deg, #cfd9df, #e2ebf0); }
    .model { background: linear-gradient(135deg, #f6d365 , #fda085); }
    .full-width {
      grid-column: 1 / -1;
      width: 100%;
    }

    .duyurular {
      display: none;
      padding: 30px 20px;
      max-width: 500px;
      margin: auto;
      text-align: center;
      color: #333;
    }

    .duyurular h2 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .duyurular p {
      font-size: 0.95rem;
      color: #555;
    }

    @media (max-width: 480px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        padding: 24px 16px;
        gap: 16px;
        max-height: calc(100vh - 20px);
        overflow-y: auto;
      }
    }
  </style>
</head>
<body>

  <div class="grid" id="menu">
    <a href="https://cb50capitol.vercel.app/" class="menu-card envanter" target="_blank">
      <i class="fas fa-boxes"></i>
      <span>Envanter</span>
      <small>Mobil & Windows</small>
    </a>
    
    <a href="https://cb50capitol.vercel.app/test.html" class="menu-card tks" target="_blank">
      <i class="fas fa-right-left"></i>
      <span>Transfer</span>
      <small>Mobil & Windows</small>
    </a>
    
    <a href="https://cb50capitol.vercel.app/barcode.html" class="menu-card ean" target="_blank">
      <i class="fas fa-barcode"></i>
      <span>EAN & QR</span>
      <small>Mobil & Windows</small>
    </a>
    
    <a href="https://cb50capitol.vercel.app/model.html" class="menu-card model" target="_blank">
      <i class="fas fa-file-lines"></i>
      <span>Model & Article</span>
      <small>Mobil & Windows</small>
    </a>
    
    <a href="https://cb50capitol.vercel.app/ptc.html" class="menu-card ptc full-width" target="_blank">
      <i class="fas fa-mobile-screen-button"></i>
      <span>Terminal</span>
      <small>Android & Windows</small>
    </a>
    
    <a href="https://cb50capitol.vercel.app/mipaket.html" class="menu-card mipaket" target="_blank">
      <i class="fas fa-cube"></i>
      <span>Mi Paket</span>
      <small>Windows</small>
    </a>
    
    <a href="https://cb50capitol.vercel.app/kargo.html" class="menu-card eticaret" target="_blank">
      <i class="fas fa-store"></i>
      <span>E-Ticaret</span>
      <small>Windows</small>
    </a>
    
    <a href="https://cb50capitol.vercel.app/iptal.html" class="menu-card iptal" target="_blank">
      <i class="fas fa-ban"></i>
      <span>İptal / Fark</span>
      <small>Windows</small>
    </a>

    <a href="https://cb50capitol.vercel.app/paketara.html" class="menu-card paketara" target="_blank">
      <i class="fas fa-search"></i>
      <span>Paket Ara</span>
      <small>Windows</small>
    </a>
 
    
  </div>


  <script>
    document.addEventListener('contextmenu', function (e) {
      e.preventDefault();
    });

    document.addEventListener('keydown', function (e) {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) ||
        (e.ctrlKey && e.key === 'U')
      ) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
