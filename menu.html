<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capitol - Şık Beyaz Menü Tasarımı</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #ffffff; /* Tam beyaz arka plan */
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 20px;
    }

    /* Ana container */
    .container {
      background-color: #ffffff;
      border-radius: 30px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); /* Hafif gölge */
      padding: 40px 30px;
      text-align: center;
    }

    /* Başlık */
    h1 {
      font-size: 2.6rem;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
    }

    p.subtitle {
      font-size: 1.2rem;
      color: #7a7a7a;
      margin-bottom: 40px;
      font-weight: 400;
    }

    /* Beyaz Butonlar */
    button {
      width: 100%;
      padding: 18px 0;
      margin-bottom: 20px;
      font-size: 1.3rem;
      font-weight: 600;
      color: #333; /* Koyu metin rengi */
      background-color: #ffffff; /* Beyaz buton */
      border: 1px solid #ddd; /* İnce gri kenarlık */
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); /* Hafif gölge */
    }

    button:hover {
      background-color: #f1f1f1; /* Hover rengi */
      transform: translateY(-4px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1); /* Hover'da biraz daha belirgin gölge */
    }

    button:active {
      background-color: #e0e0e0; /* Tıklanma rengi */
      transform: translateY(2px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    button:focus {
      outline: none;
    }

    /* Media Query - Küçük ekranlar */
    @media (max-width: 420px) {
      .container {
        padding: 30px 25px;
      }
      h1 {
        font-size: 2.2rem;
      }
      p.subtitle {
        font-size: 1rem;
      }
      button {
        font-size: 1.2rem;
        padding: 16px 0;
      }
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>Capitol</h1>
    <p class="subtitle">CB50 - Yönetim Paneli</p>
    <button onclick="window.location.href='https://cb50capitol.vercel.app/'" aria-label="Envanter sayfasına git">
      Envanter
    </button>
    <button onclick="window.location.href='https://cb50capitol.vercel.app/test.html'" aria-label="TKS / İKS sayfasına git">
      TKS / İKS
    </button>
    <button onclick="window.location.href='https://cb50capitol.vercel.app/ptc.html'" aria-label="PTC sayfasına git">
      PTC
    </button>
    <button onclick="window.location.href='https://cb50capitol.vercel.app/kargo.html'" aria-label="E-Ticaret Kargo sayfasına git">
      E-Ticaret Kargo
    </button>
    <button onclick="window.location.href='https://cb50capitol.vercel.app/iptal.html'" aria-label="İptal / Fark sayfasına git">
      İptal / Fark
    </button>
  </div>
</body>
</html>
