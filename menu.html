<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Uygulama Menüsü</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05);
    }

    .icon-wrapper {
      transition: all 0.3s ease;
    }

    .group:hover .icon-wrapper {
      transform: scale(1.05);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-blue-50 min-h-screen flex items-center justify-center px-6 py-10">

  <div class="w-full max-w-md space-y-10">

    <!-- Başlık -->
    <div class="text-center">
      <h1 class="text-4xl font-bold text-gray-900">Capitol</h1>
      <p class="text-sm text-gray-500 mt-1">CB50</p>
    </div>

    <!-- Menü Grid -->
    <div class="grid grid-cols-2 gap-6">

      <!-- Envanter -->
      <a href="https://cb50capitol.vercel.app/" class="group glass rounded-2xl p-5 flex flex-col items-center text-center transition-all hover:shadow-xl hover:-translate-y-1">
        <div class="icon-wrapper bg-indigo-100 p-4 rounded-full mb-4">
          <i data-lucide="package" class="text-indigo-600 w-6 h-6"></i>
        </div>
        <span class="text-base font-semibold text-gray-800">Envanter</span>
        <span class="text-xs text-gray-500 mt-1">Mobil & PC</span>
      </a>

      <!-- TKS / İKS -->
      <a href="https://cb50capitol.vercel.app/test.html" class="group glass rounded-2xl p-5 flex flex-col items-center text-center transition-all hover:shadow-xl hover:-translate-y-1">
        <div class="icon-wrapper bg-green-100 p-4 rounded-full mb-4">
          <i data-lucide="shuffle" class="text-green-600 w-6 h-6"></i>
        </div>
        <span class="text-base font-semibold text-gray-800">TKS / İKS</span>
        <span class="text-xs text-gray-500 mt-1">Mobil & PC</span>
      </a>

      <!-- PTC -->
      <a href="https://cb50capitol.vercel.app/ptc.html" class="group glass rounded-2xl p-5 flex flex-col items-center text-center transition-all hover:shadow-xl hover:-translate-y-1">
        <div class="icon-wrapper bg-yellow-100 p-4 rounded-full mb-4">
          <i data-lucide="cpu" class="text-yellow-600 w-6 h-6"></i>
        </div>
        <span class="text-base font-semibold text-gray-800">PTC</span>
        <span class="text-xs text-gray-500 mt-1">Mobil & PC</span>
      </a>

      <!-- E-Ticaret -->
      <a href="https://cb50capitol.vercel.app/kargo.html" class="group glass rounded-2xl p-5 flex flex-col items-center text-center transition-all hover:shadow-xl hover:-translate-y-1">
        <div class="icon-wrapper bg-blue-100 p-4 rounded-full mb-4">
          <i data-lucide="truck" class="text-blue-600 w-6 h-6"></i>
        </div>
        <span class="text-base font-semibold text-gray-800">E-Ticaret</span>
        <span class="text-xs text-gray-500 mt-1">Yalnızca PC</span>
      </a>

      <!-- İptal / Fark -->
      <a href="https://cb50capitol.vercel.app/iptal.html" class="group glass rounded-2xl p-5 flex flex-col items-center text-center col-span-2 transition-all hover:shadow-xl hover:-translate-y-1">
        <div class="icon-wrapper bg-red-100 p-4 rounded-full mb-4">
          <i data-lucide="x-octagon" class="text-red-600 w-6 h-6"></i>
        </div>
        <span class="text-base font-semibold text-gray-800">İptal / Fark</span>
        <span class="text-xs text-gray-500 mt-1">Yalnızca PC</span>
      </a>

    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
