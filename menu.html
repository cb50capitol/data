<!DOCTYPE html>
<html lang="tr" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>iOS Tab Bar + Site içinde Site (Mobil uyumlu)</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    /* Reset ve temel */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #fff;
      overflow: hidden; /* tüm sayfa taşmasın */
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      /* position relative gerekirse eklenebilir */
    }

    /* İçerik alanı */
    .content {
      flex: 1;
      overflow-y: auto; /* içerik scroll olsun */
      padding-bottom: 60px; /* tab bar yüksekliği kadar boşluk */
      position: relative;
    }

    /* Sayfalar */
    .page {
      display: none;
      padding: 20px;
      box-sizing: border-box;
      height: 100%;
      width: 100%;
      position: absolute;
      top: 0; left: 0;
      background: white;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* smooth scroll iOS */
      flex-direction: column;
    }
    .page.active {
      display: flex;
    }

    /* iframe için */
    .iframe-container {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
    }

    /* Üstteki "tarayıcı çubuğu" - URL gösterme */
    .browser-bar {
      height: 40px;
      background: #eee;
      display: flex;
      align-items: center;
      padding: 0 12px;
      font-size: 14px;
      color: #333;
      border-bottom: 1px solid #ccc;
      user-select: none;
      font-family: monospace;
      flex-shrink: 0;
    }

    /* iOS Tab Bar - fixed altta */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      border-top: 1px solid #ccc;
      background-color: #fefefe;
      display: flex;
      box-shadow: 0 -1px 8px rgba(0,0,0,0.1);
      z-index: 1000;
    }

    .tab-item {
      flex: 1;
      text-align: center;
      padding: 6px 0 4px;
      color: #8e8e93;
      font-size: 11px;
      cursor: pointer;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: color 0.3s;
      border-top: 2px solid transparent;
    }

    .tab-item.active {
      color: #007aff;
      border-top-color: #007aff;
    }

    .tab-icon {
      width: 24px;
      height: 24px;
      margin-bottom: 2px;
      fill: currentColor;
    }
  </style>
</head>
<body>

<div class="app">

  <div class="content">

    <!-- Anasayfa -->
    <div id="home" class="page active" style="justify-content:center; align-items:center; font-size:18px;">
      <div>Anasayfa İçeriği</div>
    </div>

    <!-- Arama sayfası - iframe + browser bar -->
    <div id="search" class="page" style="flex-direction: column;">
      <div class="browser-bar">https://cb50capitol.vercel.app/</div>
      <iframe
        class="iframe-container"
        src="https://cb50capitol.vercel.app/"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
        frameborder="0"
      ></iframe>
    </div>

    <!-- Favoriler -->
    <div id="favorites" class="page" style="padding: 20px;">
      <h1>Favoriler</h1>
      <p>Favori içeriklerinizi burada görebilirsiniz.</p>
    </div>

    <!-- Profil -->
    <div id="profile" class="page" style="padding: 20px;">
      <h1>Profil</h1>
      <p>Kullanıcı ayarları ve profili.</p>
    </div>

  </div>

  <nav class="tab-bar">
    <div class="tab-item active" data-target="home" onclick="switchTab(event)">
      <svg class="tab-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 11L12 2l9 9v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2v-9z"/></svg>
      Anasayfa
    </div>
    <div class="tab-item" data-target="search" onclick="switchTab(event)">
      <svg class="tab-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M10 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm11 18-5.5-5.5"/></svg>
      Arama
    </div>
    <div class="tab-item" data-target="favorites" onclick="switchTab(event)">
      <svg class="tab-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5a5.5 5.5 0 0 1 11 0 5.5 5.5 0 0 1 11 0c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      Favoriler
    </div>
    <div class="tab-item" data-target="profile" onclick="switchTab(event)">
      <svg class="tab-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-7 2-7 5v1h14v-1c0-3-3-5-7-5z"/></svg>
      Profil
    </div>
  </nav>
</div>

<script>
  function switchTab(e) {
    const targetId = e.currentTarget.getAttribute('data-target');

    // Sayfaları göster/gizle
    document.querySelectorAll('.page').forEach(page => {
      page.classList.toggle('active', page.id === targetId);
    });

    // Aktif tabı ayarla
    document.querySelectorAll('.tab-item').forEach(tab => {
      tab.classList.toggle('active', tab.getAttribute('data-target') === targetId);
    });
  }
</script>

</body>
</html>
