<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>Excel Arama Uygulaması</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />

<style>
body {
    font-family: 'Roboto', sans-serif;
    background: linear-gradient(135deg, #f9fafb, #ffffff);
    margin: 0;
    padding: 30px;
    color: #444d56;
}

h2 {
    text-align: center;
    color: #222831;
    font-weight: 700;
    margin-bottom: 30px;
    letter-spacing: 1.2px;
}

#dropZone {
    border: 3px dashed #cbd2d9;
    border-radius: 16px;
    background-color: #fefefe;
    padding: 50px;
    text-align: center;
    color: #8892a0;
    font-weight: 600;
    font-size: 18px;
    transition: background-color 0.3s, border-color 0.3s, color 0.3s;
    max-width: 650px;
    margin: 0 auto 25px auto;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
}

#dropZone.dragover {
    background-color: #e1e6eb;
    border-color: #7f8fa4;
    color: #495670;
    font-weight: 700;
    box-shadow: 0 0 15px #aab6c1;
}

.button-bar {
    text-align: center;
    margin-bottom: 25px;
}

#fileInput {
    display: none;
}

button {
    padding: 12px 20px;
    font-size: 16px;
    background-color: #596275;
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    margin-left: 10px;
    box-shadow: 0 4px 12px rgba(89, 98, 117, 0.3);
    transition: background-color 0.3s ease, transform 0.15s ease;
}

button:hover {
    background-color: #444c5c;
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(68, 76, 92, 0.4);
}

button.clear-btn {
    background-color: #e05a5a;
    box-shadow: 0 4px 12px rgba(224, 90, 90, 0.3);
}

button.clear-btn:hover {
    background-color: #b23e3e;
    box-shadow: 0 6px 16px rgba(178, 62, 62, 0.4);
}

input[type="text"] {
    padding: 14px 18px;
    font-size: 16px;
    width: 320px;
    max-width: 90vw;
    border: 2px solid #ced4da;
    border-radius: 50px;
    outline: none;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
    transition: border-color 0.3s ease;
    color: #444d56;
}

input[type="text"]:focus {
    border-color: #596275;
    box-shadow: 0 0 10px #a3a9b5;
}

.search-container {
    text-align: center;
    margin-bottom: 30px;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.08);
    background-color: #ffffff;
    font-size: 15px;
}

th, td {
    padding: 14px 18px;
    text-align: left;
}

th {
    background-color: #596275;
    color: #fff;
    font-weight: 600;
    user-select: none;
}

tbody tr {
    transition: background-color 0.25s ease;
    cursor: default;
}

tbody tr:hover {
    background-color: #f2f6fa;
}

tbody tr:nth-child(even) {
    background-color: #f9fbfc;
}

#results {
    max-width: 1100px;
    margin: 0 auto;
}

/* Modal Stil */
.modal {
    display: none;
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.25);
    backdrop-filter: blur(5px);
}

.modal-content {
    background-color: white;
    margin: 15% auto;
    padding: 30px 25px;
    border-radius: 20px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    font-size: 17px;
    font-weight: 600;
    color: #444d56;
}

.modal-content button {
    background-color: #596275;
    margin-top: 25px;
    padding: 12px 30px;
    border-radius: 50px;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(89, 98, 117, 0.3);
    transition: background-color 0.3s ease;
}

.modal-content button:hover {
    background-color: #444c5c;
}


</style>


</head>
<body>

    <h2>Paket Arama</h2>

    <div id="dropZone">Dosya ekle veya sürükle bırak. (.xlsx, .xls)</div>

    <div class="button-bar">
        <input type="file" id="fileInput" multiple accept=".xls,.xlsx" />
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Sipariş & Fatura İD" />
        <button onclick="searchExcel()">Ara</button>
        <button onclick="clearAll()" class="clear-btn">Temizle</button>
    </div>

    <div id="results"></div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <p id="modalMessage"></p>
            <button onclick="closeModal()">Tamam</button>
        </div>
    </div>

    <script>
         const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

  if (isMobile) {
    document.body.innerHTML = `
      <div style="display:flex; height:100vh; justify-content:center; align-items:center; text-align:center; padding:20px; font-family:sans-serif;">
        <h2>Bu sayfaya mobil cihazlardan erişim desteklenmemektedir.<br>Lütfen masaüstü bilgisayarınızdan tekrar deneyin.</h2>
      </div>`;
    throw new Error("Mobil cihaz erişimi engellendi.");
  }

        let allData = [];

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = Array.from(e.dataTransfer.files);
            handleFiles(files);
        });

        // dropZone tıklanınca dosya seçici açılır
        dropZone.addEventListener('click', () => {
            fileInput.click();
        });

        // Dosya seçildiğinde otomatik yükle
        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            handleFiles(files);
        });

        function handleFiles(files) {
            if (files.length === 0) return;

            const fileReadPromises = files.map(file => {
                return new Promise((resolve, reject) => {
                    if (!file.name.endsWith('.xlsx') && !file.name.endsWith('.xls')) {
                        return resolve(); // geçerli değilse boş geç
                    }

                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });

                        workbook.SheetNames.forEach(sheetName => {
                            const sheet = workbook.Sheets[sheetName];
                            const json = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                            allData.push({
                                fileName: file.name,
                                data: json
                            });
                        });

                        resolve(file.name);
                    };

                    reader.onerror = () => reject(file.name);
                    reader.readAsArrayBuffer(file);
                });
            });

            Promise.all(fileReadPromises)
                .then(loadedFiles => {
                    const successfulFiles = loadedFiles.filter(name => name);
                    if (successfulFiles.length > 0) {
                        showModal(`${successfulFiles.length} adet dosya başarıyla yüklendi.`);
                    } else {
                        showModal("Geçerli Excel dosyası yüklenmedi.");
                    }
                });
        }

        function searchExcel() {
            const keyword = document.getElementById('searchInput').value.toLocaleLowerCase('tr-TR');
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = "";

            if (!keyword) {
                showModal("Lütfen aranacak bir kelime girin.");
                return;
            }

            let foundResults = [];

            allData.forEach(file => {
                file.data.forEach((row) => {
                    const match = row.some(cell =>
                        cell !== undefined &&
                        String(cell).toLocaleLowerCase('tr-TR').includes(keyword)
                    );
                    if (match) {
                        foundResults.push({ fileName: file.fileName, row });
                    }
                });
            });

            if (foundResults.length === 0) {
                resultsDiv.innerHTML = "<p>Sonuç bulunamadı.</p>";
                return;
            }

            const table = document.createElement("table");
            const headerRow = table.insertRow();

            const headers = ["Dosya", "Satır", "Sipariş İD", "Fatura İD", "Tarih / Saat", "Kargo"];
            headers.forEach(h => {
                const th = document.createElement("th");
                th.textContent = h;
                headerRow.appendChild(th);
            });

            foundResults.forEach(result => {
                const newRow = table.insertRow();
                const fileCell = newRow.insertCell();
                fileCell.textContent = result.fileName;

                for (let i = 0; i < 5; i++) {
                    const cell = result.row[i] ?? "";
                    const td = newRow.insertCell();
                    td.textContent = cell;
                }
            });

            resultsDiv.appendChild(table);
        }

        function clearAll() {
            allData = [];
            document.getElementById('results').innerHTML = "";
            document.getElementById('fileInput').value = "";
            document.getElementById('searchInput').value = "";
            showModal("Tüm veriler temizlendi.");
        }

        document.getElementById("searchInput").addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                searchExcel();
            }
        });

        function showModal(message) {
            document.getElementById('modalMessage').textContent = message;
            document.getElementById('modal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>

</body>
</html>
