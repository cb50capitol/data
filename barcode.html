<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR / Barkod Oluştur</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --input-bg: #f9fafb;
      --input-border: #d1d5db;
      --text: #1f2937;
      --muted: #6b7280;
      --shadow: rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px 0;
      display: flex;
      justify-content: center;
      color: var(--text);
    }

    .wrapper {
      background-color: var(--card);
      padding: 40px 28px;
      border-radius: 20px;
      box-shadow: 0 10px 30px var(--shadow);
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    input {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      border-radius: 10px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      margin-bottom: 20px;
      transition: 0.3s border;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .primary {
      background-color: var(--primary);
      color: white;
    }

    .primary:hover {
      background-color: var(--primary-hover);
    }

    .secondary {
      background-color: #e5e7eb;
      color: var(--muted);
    }

    .secondary:hover {
      background-color: #d1d5db;
    }

    .output {
      padding: 20px;
      background-color: #f3f4f6;
      border: 1px dashed #cbd5e1;
      border-radius: 14px;
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      flex-direction: column;
    }

    #barcode svg {
      max-width: 100%;
    }

    .log {
      margin-top: 10px;
      padding: 12px 16px;
      background-color: #eef2ff;
      border: 1px solid #c7d2fe;
      border-radius: 10px;
      font-size: 14px;
      color: #374151;
      text-align: left;
      min-height: 40px;
    }

    @media (max-width: 480px) {
      .wrapper {
        padding: 28px 16px;
        margin: 0 12px;
      }

      h1 {
        font-size: 20px;
      }

      button {
        font-size: 14px;
        padding: 10px 14px;
      }
    }

    /* Yazdırma için sadece output kısmını gösterecek */
    @media print {
      body * {
        visibility: hidden;
      }
      .output, .output * {
        visibility: visible;
      }
      .output {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        margin: 0;
        padding: 0;
        border: none;
        box-shadow: none;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <h1>QR / Barkod Oluştur</h1>

    <input
      type="number"
      id="textInput"
      placeholder="Bir sayı girin"
      inputmode="numeric"
    />

    <div class="buttons">
      <button class="primary" id="toggleBtn">QR Göster</button>
      <button class="secondary" id="resetBtn">Sıfırla</button>
      <!-- Yazdır butonu eklendi -->
      <button class="secondary" id="printBtn">Yazdır</button>
    </div>

    <div class="output">
      <div id="barcode"></div>
      <div id="qrcode"></div>
    </div>

    <div class="log" id="logArea"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>

  <script>
    const input = document.getElementById('textInput');
    const toggleBtn = document.getElementById('toggleBtn');
    const resetBtn = document.getElementById('resetBtn');
    const printBtn = document.getElementById('printBtn');
    const barcodeDiv = document.getElementById('barcode');
    const qrcodeDiv = document.getElementById('qrcode');
    const logArea = document.getElementById('logArea');

    let isQR = false;

    function logMessage(msg) {
      logArea.textContent = msg;
    }

    function clearOutput() {
      barcodeDiv.innerHTML = '';
      qrcodeDiv.innerHTML = '';
    }

    function render() {
      const value = input.value.trim();
      clearOutput();

      if (!value) {
        logMessage("Lütfen geçerli bir sayı girin.");
        return;
      }

      if (isQR) {
        new QRCode(qrcodeDiv, {
          text: value,
          width: 160,
          height: 160,
          colorDark: "#000000",
          colorLight: "#ffffff"
        });
        logMessage("QR kodu oluşturuldu.");
      } else {
        barcodeDiv.innerHTML = '<svg id="barcodeSvg"></svg>';
        JsBarcode("#barcodeSvg", value, {
          format: "CODE128",
          lineColor: "#000000",
          background: "#ffffff",
          width: 2,
          height: 80,
          displayValue: true,
          fontSize: 16,
          fontOptions: "bold",
          font: "Inter"
        });
        logMessage("Barkod (EAN) oluşturuldu.");
      }
    }

    input.addEventListener('input', render);

    toggleBtn.addEventListener('click', () => {
      isQR = !isQR;
      toggleBtn.textContent = isQR ? "EAN Göster" : "QR Göster";
      render();
    });

    resetBtn.addEventListener('click', () => {
      input.value = '';
      clearOutput();
      input.focus();
      logMessage("Alan temizlendi.");
    });

    printBtn.addEventListener('click', () => {
      if (!input.value.trim()) {
        logMessage("Yazdırmak için önce bir sayı girin.");
        return;
      }
      window.print();
    });
  </script>

</body>
</html>
