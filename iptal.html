<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İptal Kaydı</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 40px 20px;
      color: #333;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px 40px;
      max-width: 1100px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 25px;
    }
    h2 {
      font-weight: 600;
      font-size: 28px;
      margin: 0 0 15px;
      color: #222;
      text-align: center;
    }
    label {
      font-weight: 600;
      margin-bottom: 6px;
      display: block;
      color: #555;
      font-size: 14px;
      letter-spacing: 0.02em;
    }
    input[type="text"],
    select {
      width: 100%;
      padding: 12px 15px;
      border-radius: 8px;
      border: 1.8px solid #ddd;
      font-size: 15px;
      transition: border-color 0.25s ease;
      outline-offset: 2px;
    }
    input[type="text"]:focus,
    select:focus {
      border-color: #ff4d4f;
      box-shadow: 0 0 8px #ff4d4f44;
    }
    .buttons {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    button {
      font-weight: 600;
      font-size: 16px;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
      border: none;
      transition: background-color 0.3s ease;
      user-select: none;
      flex-shrink: 0;
      min-width: 100px;
    }
    #kaydetBtn {
      background-color: #1890ff;
      color: white;
      box-shadow: 0 6px 14px rgb(24 144 255 / 0.5);
      margin-right: auto;
    }
    #kaydetBtn:hover {
      background-color: #106cd6;
      box-shadow: 0 8px 18px rgb(16 108 214 / 0.7);
    }
    #temizleBtn {
      background-color: #ff4d4f;
      color: white;
      box-shadow: 0 6px 14px rgb(255 77 79 / 0.5);
    }
    #temizleBtn:hover {
      background-color: #d93638;
      box-shadow: 0 8px 18px rgb(217 54 56 / 0.7);
    }
    #excelBtn {
      background-color: #217346;
      color: white;
      box-shadow: 0 6px 14px rgb(33 115 70 / 0.6);
    }
    #excelBtn:hover {
      background-color: #1a5a3e;
      box-shadow: 0 8px 18px rgb(26 90 62 / 0.8);
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .table-header h3 {
      margin: 0;
      font-weight: 600;
      font-size: 20px;
      color: #222;
      flex-grow: 1;
    }
    #searchInput {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1.8px solid #ddd;
      font-size: 15px;
      width: 250px;
      max-width: 100%;
      transition: border-color 0.25s ease;
    }
    #searchInput:focus {
      border-color: #1890ff;
      box-shadow: 0 0 8px #1890ff44;
      outline-offset: 2px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      box-shadow: 0 2px 10px rgb(0 0 0 / 0.05);
      border-radius: 12px;
      overflow: hidden;
    }
    thead {
      background: linear-gradient(90deg, #ff4d4f, #d93638);
      color: white;
      font-weight: 700;
    }
    thead th {
      padding: 15px 20px;
      text-align: left;
    }
    tbody tr {
      background: white;
      border-bottom: 1px solid #eee;
      transition: background-color 0.3s ease;
    }
    tbody tr:hover {
      background-color: #ffe6e6;
    }
    tbody td {
      padding: 14px 20px;
      color: #444;
    }
    .checkbox-cell {
      width: 40px;
      text-align: center;
    }

    @keyframes highlight {
      0%, 100% { background-color: white; }
      50% { background-color: #fff8cc; }
    }
    .highlight {
      animation: highlight 1.2s ease 3;
    }

    /* MODAL STİLLERİ */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 30px;
      border-radius: 10px;
      max-width: 400px;
      width: 100%;
      animation: fadeIn 0.3s ease-in-out;
      text-align: center;
    }
    .modal-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 20px;
    }
    .modal-buttons button {
      padding: 10px 20px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #modalYes {
      background-color: #ff4d4f;
      color: white;
    }
    #modalNo {
      background-color: #ccc;
      color: #333;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* MOBİL UYUMLULUK */
    @media (max-width: 600px) {
      .buttons {
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
      }
      .modal-content {
        width: 90%;
        padding: 20px;
      }
      .modal-buttons {
        flex-direction: column;
        gap: 10px;
      }
      .modal-buttons button {
        width: 100%;
        font-size: 16px;
        padding: 12px;
      }

      /* Mobilde sadece checkbox, Ürün Kodu ve Tekrar Sayısı görünür diğer sütunları gizle */
      th.siparisKanali-cell,
      th.iptalSebebi-cell,
      th.tarih-cell,
      td.siparisKanali-cell,
      td.iptalSebebi-cell,
      td.tarih-cell {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>İptal Kaydı</h2>

    <div>
      <label for="urunKodu">Ürün Kodu</label>
      <input type="text" id="urunKodu" placeholder="Ürün kodunu giriniz" />
    </div>

    <div>
      <label for="siparisKanali">Sipariş Kanalı</label>
      <select id="siparisKanali">
        <option value="">-- Kanal Seçin --</option>
        <option value="Now">Now</option>
        <option value="E-Ticaret">E-Ticaret</option>
      </select>
    </div>

    <div>
      <label for="iptalSebebi">İptal Sebebi</label>
      <select id="iptalSebebi">
        <option value="">-- Sebep Seçin --</option>
        <option value="Fiilen Bulunamadı">Fiilen Bulunamadı</option>
        <option value="SDOM">SDOM</option>
      </select>
    </div>

    <div class="buttons">
      <button id="kaydetBtn" onclick="kaydet()">Kaydı Ekle</button>
      <button id="temizleBtn" onclick="temizleSecilenler()">Temizle</button>
      <button id="excelBtn" onclick="exportExcel()">Excel</button>
    </div>

    <hr />

    <div class="table-header">
      <h3>Kaydedilen İptaller</h3>
      <input type="text" id="searchInput" placeholder="Tabloda ara..." oninput="araTabloda()" />
    </div>

    <div id="kayıtListesi"></div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <p id="modalMessage">Mesaj...</p>
      <div class="modal-buttons">
        <button id="modalYes">Evet</button>
        <button id="modalNo">Hayır</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script>
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

if (isMobile) {
  document.body.innerHTML = `
    <div style="display:flex; flex-direction: column; height: 100vh; justify-content: flex-start; align-items: center; text-align: center; padding-top: 60px; font-family: sans-serif; color: #444;">
      <div style="font-size: 60px; margin-bottom: 20px;">📢</div>
      <h2 style="max-width: 320px; line-height: 1.4;">
        Bu sayfaya mobil cihazlardan erişim desteklenmemektedir.
      </h2>
    </div>`;
  throw new Error("Mobil cihaz erişimi engellendi.");
}
    
    let tumKayitlar = [];

    window.onload = () => {
      tumKayitlar = JSON.parse(localStorage.getItem("iptalKayitlari")) || [];
      listeyiGuncelle();
    };

    function kaydet() {
      const urunKodu = document.getElementById("urunKodu").value.trim();
      const iptalSebebi = document.getElementById("iptalSebebi").value;
      const siparisKanali = document.getElementById("siparisKanali").value;

      if (!urunKodu || !iptalSebebi || !siparisKanali) {
        showModal("Lütfen tüm alanları doldurun.");
        return;
      }

      // Aynı kaydı bul (Ürün Kodu + Sipariş Kanalı + İptal Sebebi eşleşmeli)
      const index = tumKayitlar.findIndex(k =>
        k.urunKodu.toLowerCase() === urunKodu.toLowerCase() &&
        k.siparisKanali === siparisKanali &&
        k.iptalSebebi === iptalSebebi
      );

      if (index !== -1) {
        // Var olan kaydı güncelle, tekrar sayısını artır ve tarihe yeni ekleme zamanı yaz
        tumKayitlar[index].tekrarSayisi = (tumKayitlar[index].tekrarSayisi || 1) + 1;
        tumKayitlar[index].tarih = new Date().toLocaleString("tr-TR");

        // Bu kaydı en üste çıkar
        const mevcut = tumKayitlar.splice(index,1)[0];
        tumKayitlar.unshift(mevcut);

        localStorage.setItem("iptalKayitlari", JSON.stringify(tumKayitlar));
        listeyiGuncelle(true);
      } else {
        // Yeni kayıt oluştur ve en üste ekle
        const kayit = {
          urunKodu,
          iptalSebebi,
          siparisKanali,
          tarih: new Date().toLocaleString("tr-TR"),
          tekrarSayisi: 1
        };
        tumKayitlar.unshift(kayit);
        localStorage.setItem("iptalKayitlari", JSON.stringify(tumKayitlar));
        listeyiGuncelle(true);
      }

      // Alanları temizle
      document.getElementById("urunKodu").value = "";
      document.getElementById("iptalSebebi").value = "";
      document.getElementById("siparisKanali").value = "";
    }

    function listeyiGuncelle(yeniEklendi = false) {
      const container = document.getElementById("kayıtListesi");
      if (tumKayitlar.length === 0) {
        container.innerHTML = "<p>Henüz kayıt yok.</p>";
        return;
      }

      let html = `
      <table>
        <thead>
          <tr>
            <th class="checkbox-cell"><input type="checkbox" id="selectAll" onclick="toggleAll(this)" /></th>
            <th class="urunKodu-cell">Ürün Kodu</th>
            <th class="siparisKanali-cell">Sipariş Kanalı</th>
            <th class="iptalSebebi-cell">İptal Sebebi</th>
            <th class="tarih-cell">Tarih</th>
            <th class="tekrarSayisi-cell">Tekrar Sayısı</th>
          </tr>
        </thead>
        <tbody>
      `;

      tumKayitlar.forEach((k, i) => {
        html += `
          <tr${yeniEklendi && i === 0 ? ' class="highlight"' : ''}>
            <td class="checkbox-cell"><input type="checkbox" class="secimCheckbox" data-index="${i}" /></td>
            <td class="urunKodu-cell">${k.urunKodu}</td>
            <td class="siparisKanali-cell">${k.siparisKanali}</td>
            <td class="iptalSebebi-cell">${k.iptalSebebi}</td>
            <td class="tarih-cell">${k.tarih}</td>
            <td class="tekrarSayisi-cell">${k.tekrarSayisi || 1}</td>
          </tr>
        `;
      });

      html += `
        </tbody>
      </table>
      `;

      container.innerHTML = html;
    }

    function araTabloda() {
      const filter = document.getElementById("searchInput").value.toLowerCase();
      const rows = document.querySelectorAll("#kayıtListesi tbody tr");

      rows.forEach(row => {
        const cells = Array.from(row.querySelectorAll("td"));
        const text = cells.map(td => td.textContent.toLowerCase()).join(" ");
        row.style.display = text.includes(filter) ? "" : "none";
      });
    }

    function toggleAll(master) {
      const checkboxes = document.querySelectorAll(".secimCheckbox");
      checkboxes.forEach(cb => cb.checked = master.checked);
    }

    function temizleSecilenler() {
      const secilenler = Array.from(document.querySelectorAll(".secimCheckbox:checked"));
      if (secilenler.length === 0) {
        showModal("Lütfen temizlemek için kayıt seçin.");
        return;
      }
      showModal("Seçili kayıtlar silinsin mi?", () => {
        const secilenIndexler = secilenler.map(cb => parseInt(cb.dataset.index));
        // En yüksek indexten başlayarak sil (diziyi bozma)
        secilenIndexler.sort((a,b) => b-a).forEach(i => {
          tumKayitlar.splice(i,1);
        });
        localStorage.setItem("iptalKayitlari", JSON.stringify(tumKayitlar));
        listeyiGuncelle();
        closeModal();
      });
    }

    // Modal fonksiyonları
    function showModal(mesaj, evetCallback = null) {
      const modal = document.getElementById("modal");
      const modalMessage = document.getElementById("modalMessage");
      const yesBtn = document.getElementById("modalYes");
      const noBtn = document.getElementById("modalNo");

      modalMessage.textContent = mesaj;
      modal.style.display = "flex";

      yesBtn.style.display = evetCallback ? "inline-block" : "none";
      noBtn.textContent = evetCallback ? "Hayır" : "Tamam";

      yesBtn.onclick = () => {
        evetCallback?.();
      };
      noBtn.onclick = closeModal;
    }
    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    // Excel export fonksiyonu
    function exportExcel() {
      if (tumKayitlar.length === 0) {
        showModal("İhracat için kayıt bulunamadı.");
        return;
      }
      const worksheet = XLSX.utils.json_to_sheet(tumKayitlar);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "İptaller");

      XLSX.writeFile(workbook, "iptal_kayitlari.xlsx");
    }
  </script>

  <script>
  // Sağ tıklamayı engelle
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // Belirli kısayolları engelle (F12, Ctrl+U, Ctrl+Shift+I, Ctrl+Shift+J)
  document.addEventListener('keydown', function(e) {
    if (
      e.key === "F12" ||
      (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) ||
      (e.ctrlKey && e.key === "U")
    ) {
      e.preventDefault();
    }
  });
</script>

  
</body>
</html>
