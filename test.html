<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transfer Listesi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f2f5;
      padding: 1rem;
      font-family: "Segoe UI", sans-serif;
    }

    h1 {
      font-size: 1.8rem;
    }

    #filterInfo {
      display: inline-block;
      background-color: #e9ecef;
      color: #0d6efd;
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 1rem;
      transition: background-color 0.2s ease;
    }

    #filterInfo:hover {
      background-color: #dbe2ea;
    }

    .card-alt {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 1.5rem;
      transition: all 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .card-alt:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    .card-alt.completed {
      border-color: #198754;
      background-color: #d1e7dd;
      position: relative;
    }

    .countdown-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #198754;
      color: white;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 14px;
      user-select: none;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .card-title {
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 1rem;
      color: #0d6efd;
    }

    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
      color: #333;
      flex-wrap: wrap;
    }

    .info-item i {
      width: 20px;
      text-align: center;
      color: #0d6efd;
      margin-right: 8px;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: 10px;
    }

    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }

    .col-custom {
      padding: 0.5rem;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      margin: -0.5rem;
    }

    .online-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
      transition: background-color 0.3s ease;
      margin-top: 15px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .online-btn:hover {
      background-color: #218838;
      color: white;
      text-decoration: none;
    }

    @media (min-width: 576px) {
      .col-custom {
        width: 50%;
      }
    }

    @media (max-width: 575.98px) {
      .col-custom {
        width: 100%;
      }
    }

    .scroll-arrow {
      position: fixed;
      right: 10px;
      background: rgba(0,0,0,0.1);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, opacity 0.4s;
      opacity: 0.3;
      z-index: 9999;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .scroll-arrow:hover {
      background: rgba(0,0,0,0.3);
      color: #0d6efd;
      opacity: 1;
    }

    #scrollBottomBtn {
      bottom: 10px;
    }

    #scrollTopBtn {
      bottom: 60px;
    }

    .scroll-arrow i {
      font-size: 20px;
    }
  </style>
</head>
<body>

<div class="container mt-4">
  <h1>Transfer Listesi</h1>
  <div id="filterInfo"></div>
  <div class="card-container" id="cardContainer"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="filterForm">
        <div class="modal-header">
          <h5 class="modal-title" id="filterModalLabel">Filtre Seçimi</h5>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="transfer" class="form-label">Transfer Listesi</label>
            <select id="transfer" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="kategori" class="form-label">Kategori</label>
            <select id="kategori" class="form-select" required></select>
          </div>
          <div class="mb-3 d-none" id="altKategoriWrapper">
            <label for="altKategori" class="form-label">Alt Kategori</label>
            <select id="altKategori" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label for="marka" class="form-label">Marka</label>
            <select id="marka" class="form-select" required></select>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" id="clearStorageBtn" class="btn btn-danger">Geçmişi Temizle</button>
          <button type="submit" class="btn btn-primary">Filtrele</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Onay Modal -->
<div class="modal fade" id="confirmClearModal" tabindex="-1" aria-labelledby="confirmClearModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmClearModalLabel">Onay Gerekiyor</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div class="modal-body">
        Geçmişi temizlemek istediğinizden emin misiniz?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
        <button type="button" id="confirmClearBtn" class="btn btn-danger">Evet, Temizle</button>
      </div>
    </div>
  </div>
</div>

<div id="scrollTopBtn" class="scroll-arrow" title="Sayfanın üstüne git">
  <i class="fas fa-chevron-up"></i>
</div>
<div id="scrollBottomBtn" class="scroll-arrow" title="Sayfanın sonuna git">
  <i class="fas fa-chevron-down"></i>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let data = [];

const transferSelect = document.getElementById('transfer');
const kategoriSelect = document.getElementById('kategori');
const altKategoriSelect = document.getElementById('altKategori');
const markaSelect = document.getElementById('marka');
const cardContainer = document.getElementById('cardContainer');
const filterModal = new bootstrap.Modal(document.getElementById('filterModal'));
const filterInfoDiv = document.getElementById('filterInfo');
const clearStorageBtn = document.getElementById('clearStorageBtn');
const altKategoriWrapper = document.getElementById('altKategoriWrapper');

const confirmClearModal = new bootstrap.Modal(document.getElementById('confirmClearModal'));
const confirmClearBtn = document.getElementById('confirmClearBtn');

filterInfoDiv.addEventListener('click', () => {
  filterModal.show();
});

function parseTSVLine(line) {
  return line.split('\t').map(cell => cell.trim());
}

async function loadData() {
  try {
    const response = await fetch('test.txt');
    if (!response.ok) throw new Error('test.txt dosyası okunamadı');
    const text = await response.text();
    const lines = text.split('\n').filter(l => l.trim().length > 0);
    lines.shift();
    data = lines.map(parseTSVLine);
    populateTransferSelect();
  } catch (e) {
    alert(e.message);
  }
}

function populateTransferSelect() {
  const transfers = [...new Set(data.map(row => row[0]))].sort();
  transferSelect.innerHTML = '<option value="">Seçiniz</option>';
  transfers.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    transferSelect.appendChild(opt);
  });
}

function populateKategoriSelect(selectedTransfer) {
  const filtered = data.filter(row => row[0] === selectedTransfer);
  const kategoriler = [...new Set(filtered.map(row => row[1]))].sort();
  kategoriSelect.innerHTML = '<option value="">Seçiniz</option>';
  kategoriler.forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = k;
    kategoriSelect.appendChild(opt);
  });
}

function populateAltKategoriSelect(selectedTransfer, selectedKategori) {
  const filtered = data.filter(row => row[0] === selectedTransfer && row[1] === selectedKategori);
  const altKategoriler = [...new Set(filtered.map(row => row[2]))].sort();
  if (altKategoriler.length > 1 || (altKategoriler.length === 1 && altKategoriler[0] !== '')) {
    altKategoriWrapper.classList.remove('d-none');
    altKategoriSelect.innerHTML = '<option value="">Seçiniz</option>';
    altKategoriler.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a;
      opt.textContent = a;
      altKategoriSelect.appendChild(opt);
    });
  } else {
    altKategoriWrapper.classList.add('d-none');
    altKategoriSelect.innerHTML = '';
  }
}

function populateMarkaSelect(selectedTransfer, selectedKategori, selectedAltKategori) {
  const filtered = data.filter(row => {
    return row[0] === selectedTransfer
      && row[1] === selectedKategori
      && (selectedAltKategori === '' || row[2] === selectedAltKategori);
  });
  const markalar = [...new Set(filtered.map(row => row[3]))].sort();
  markaSelect.innerHTML = '<option value="">Seçiniz</option>';
  markalar.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    markaSelect.appendChild(opt);
  });
}

transferSelect.addEventListener('change', () => {
  const val = transferSelect.value;
  if (val) {
    populateKategoriSelect(val);
  } else {
    kategoriSelect.innerHTML = '';
    altKategoriSelect.innerHTML = '';
    markaSelect.innerHTML = '';
    altKategoriWrapper.classList.add('d-none');
  }
});

kategoriSelect.addEventListener('change', () => {
  const transferVal = transferSelect.value;
  const kategoriVal = kategoriSelect.value;
  if (transferVal && kategoriVal) {
    populateAltKategoriSelect(transferVal, kategoriVal);
    markaSelect.innerHTML = '';
  } else {
    altKategoriSelect.innerHTML = '';
    markaSelect.innerHTML = '';
    altKategoriWrapper.classList.add('d-none');
  }
});

altKategoriSelect.addEventListener('change', () => {
  const transferVal = transferSelect.value;
  const kategoriVal = kategoriSelect.value;
  const altKategoriVal = altKategoriSelect.value;
  if (transferVal && kategoriVal) {
    populateMarkaSelect(transferVal, kategoriVal, altKategoriVal);
  } else {
    markaSelect.innerHTML = '';
  }
});

document.getElementById('filterForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const transferVal = transferSelect.value;
  const kategoriVal = kategoriSelect.value;
  const altKategoriVal = altKategoriSelect.value;
  const markaVal = markaSelect.value;

  if (!transferVal || !kategoriVal || !markaVal) {
    alert('Lütfen tüm zorunlu alanları doldurun.');
    return;
  }

  // Kaydet localStorage
  localStorage.setItem('transfer', transferVal);
  localStorage.setItem('kategori', kategoriVal);
  localStorage.setItem('altKategori', altKategoriVal);
  localStorage.setItem('marka', markaVal);

  filterModal.hide();
  displayFilterInfo();
  showCards();
});

function displayFilterInfo() {
  const transferVal = localStorage.getItem('transfer');
  const kategoriVal = localStorage.getItem('kategori');
  const altKategoriVal = localStorage.getItem('altKategori');
  const markaVal = localStorage.getItem('marka');

  if (transferVal && kategoriVal && markaVal) {
    filterInfoDiv.textContent = `${transferVal} > ${kategoriVal}${altKategoriVal ? ' > ' + altKategoriVal : ''} > ${markaVal}`;
  } else {
    filterInfoDiv.textContent = 'Filtre Seçiniz';
  }
}

function showCards() {
  cardContainer.innerHTML = '';
  const transferVal = localStorage.getItem('transfer');
  const kategoriVal = localStorage.getItem('kategori');
  const altKategoriVal = localStorage.getItem('altKategori');
  const markaVal = localStorage.getItem('marka');

  if (!transferVal || !kategoriVal || !markaVal) {
    return;
  }

  const filtered = data.filter(row => {
    return row[0] === transferVal
      && row[1] === kategoriVal
      && (altKategoriVal === '' || row[2] === altKategoriVal)
      && row[3] === markaVal;
  });

  filtered.forEach(row => {
    const card = document.createElement('div');
    card.classList.add('col-custom');
    const completed = row[9] === '1';
    card.innerHTML = `
      <div class="card-alt ${completed ? 'completed' : ''}">
        <h4 class="card-title">${row[4]}</h4>
        <div class="info-item"><i class="fa fa-money-bill"></i> ${row[5]}</div>
        <div class="info-item"><i class="fa fa-calendar-days"></i> ${row[7]}</div>
        <div class="info-item"><i class="fa fa-store"></i> ${row[6]}</div>
        <a href="${row[8]}" target="_blank" class="online-btn">Online</a>
        ${completed ? `<div class="countdown-badge">Tamamlandı</div>` : ''}
      </div>
    `;
    cardContainer.appendChild(card);
  });
}

// Scroll butonları
const scrollTopBtn = document.getElementById('scrollTopBtn');
const scrollBottomBtn = document.getElementById('scrollBottomBtn');

scrollTopBtn.addEventListener('click', () => {
  window.scrollTo({top: 0, behavior: 'smooth'});
});

scrollBottomBtn.addEventListener('click', () => {
  window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
});

// Geçmişi Temizle butonu: Modal onay ile
clearStorageBtn.addEventListener('click', () => {
  confirmClearModal.show();
});

confirmClearBtn.addEventListener('click', () => {
  localStorage.clear();
  location.reload();
});

// Sayfa açılırken
window.addEventListener('load', () => {
  // Eğer localStorage’da kayıtlı filtre varsa göster
  if (localStorage.getItem('transfer') && localStorage.getItem('kategori') && localStorage.getItem('marka')) {
    displayFilterInfo();
    showCards();
  } else {
    filterModal.show();
  }
});
</script>
</body>
</html>
