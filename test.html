<!DOCTYPE html>More actions
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title># Liste</title>
  <title>Transfer Listesi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f2f5;
      padding: 1rem;
      font-family: "Segoe UI", sans-serif;
    }
    h1 { font-size: 1.8rem; }
    #filterInfo {
      display: inline-block;
      background-color: #e9ecef;
      color: #0d6efd;
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 1rem;
      transition: background-color 0.2s ease;
    }
    #filterInfo:hover { background-color: #dbe2ea; }
    .card-alt {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 1.5rem;
      transition: all 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .card-alt:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
    .card-alt.completed {
      border-color: #198754;
      background-color: #d1e7dd;
      position: relative;
    }
    .countdown-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #198754;
      color: white;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 14px;
      user-select: none;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .card-title { font-weight: 600; font-size: 17px; margin-bottom: 1rem; color: #0d6efd; }
    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
      color: #333;
      flex-wrap: wrap;
    }
    .info-item i {
      width: 20px;
      text-align: center;
      color: #0d6efd;
      margin-right: 8px;
    }
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: 10px;
    }
    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }
    .col-custom { padding: 0.5rem; }
    .card-container {
      display: flex;
      flex-wrap: wrap;
      margin: -0.5rem;
    }
    .online-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
      transition: background-color 0.3s ease;
      margin-top: 15px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .online-btn:hover {
      background-color: #218838;
      color: white;
      text-decoration: none;
    }
    @media (min-width: 576px) {
      .col-custom { width: 50%; }
    }
    @media (max-width: 575.98px) {
      .col-custom { width: 100%; }
    }
    .scroll-arrow {
      position: fixed;
      right: 10px;
      background: rgba(0,0,0,0.1);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, opacity 0.4s;
      opacity: 0.3;
      z-index: 9999;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .scroll-arrow:hover {
      background: rgba(0,0,0,0.3);
      color: #0d6efd;
      opacity: 1;
    }
    #scrollBottomBtn { bottom: 10px; }
    #scrollTopBtn { bottom: 60px; }
    .scroll-arrow i { font-size: 20px; }
  </style>
</head>
<body>
<div class="container mt-4">
  <h1>Transfer Listesi</h1>
  <div id="filterInfo"></div>
  <div class="card-container" id="cardContainer"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="filterForm">
        <div class="modal-header">
          <h5 class="modal-title" id="filterModalLabel">Filtre Seçimi</h5>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="transfer" class="form-label">Transfer Listesi</label>
            <select id="transfer" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="kategori" class="form-label">Kategori</label>
            <select id="kategori" class="form-select" required></select>
          </div>
          <div class="mb-3" id="altKategoriWrapper" style="display:none;">
            <label for="altKategori" class="form-label">Alt Kategori</label>
            <select id="altKategori" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label for="marka" class="form-label">Marka</label>
            <select id="marka" class="form-select" required></select>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" id="clearStorageBtn" class="btn btn-danger">Geçmişi Temizle</button>
          <button type="submit" class="btn btn-primary">Filtrele</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="scrollTopBtn" class="scroll-arrow" title="Sayfanın üstüne git">
  <i class="fas fa-chevron-up"></i>
</div>
<div id="scrollBottomBtn" class="scroll-arrow" title="Sayfanın sonuna git">
  <i class="fas fa-chevron-down"></i>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let data = [];

const transferSelect = document.getElementById('transfer');
const kategoriSelect = document.getElementById('kategori');
const altKategoriWrapper = document.getElementById('altKategoriWrapper');
const altKategoriSelect = document.getElementById('altKategori');
const markaSelect = document.getElementById('marka');
const cardContainer = document.getElementById('cardContainer');
const filterModal = new bootstrap.Modal(document.getElementById('filterModal'));
const filterInfoDiv = document.getElementById('filterInfo');
const clearStorageBtn = document.getElementById('clearStorageBtn');

filterInfoDiv.addEventListener('click', () => {
  filterModal.show();
});

function parseTSVLine(line) {
  return line.split('\t').map(cell => cell.trim());
}

async function loadData() {
  try {
    const response = await fetch('test.txt');
    if (!response.ok) throw new Error('test.txt dosyası okunamadı');
    const text = await response.text();
    const lines = text.split('\n').filter(l => l.trim().length > 0);
    lines.shift();
    data = lines.map(parseTSVLine);
    populateSelect(transferSelect, [...new Set(data.map(row => row[0]))]);
    filterModal.show();
  } catch (error) {
    alert('Veri yüklenirken hata oluştu: ' + error.message);
  }
}

function populateSelect(selectElement, items) {
  selectElement.innerHTML = '<option value="">Seçiniz</option>';
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item;
    opt.textContent = item;
    selectElement.appendChild(opt);
  });
}

transferSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const categories = data.filter(row => row[0] === selectedTransfer).map(row => row[1]);
  populateSelect(kategoriSelect, [...new Set(categories)]);
  markaSelect.innerHTML = "";
  altKategoriSelect.innerHTML = "";
  altKategoriWrapper.style.display = "none";
});

kategoriSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;

  if (selectedKategori === "Shoes & Bags") {
    const altKategoriler = data
      .filter(row => row[0] === selectedTransfer && row[1] === selectedKategori)
      .map(row => row[2]);
    populateSelect(altKategoriSelect, [...new Set(altKategoriler)]);
    altKategoriWrapper.style.display = "block";
    markaSelect.innerHTML = "";
  } else {
    altKategoriWrapper.style.display = "none";
    altKategoriSelect.innerHTML = "";

    const brands = data
      .filter(row => row[0] === selectedTransfer && row[1] === selectedKategori)
      .map(row => row[3]);
    populateSelect(markaSelect, [...new Set(brands)]);
  }
});

altKategoriSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const selectedAltKategori = altKategoriSelect.value;

  const brands = data
    .filter(row => row[0] === selectedTransfer && row[1] === selectedKategori && row[2] === selectedAltKategori)
    .map(row => row[3]);

  populateSelect(markaSelect, [...new Set(brands)]);
});

document.getElementById('filterForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const selectedAltKategori = altKategoriSelect.value;
  const selectedMarka = markaSelect.value;

  filterInfoDiv.textContent =
    `${selectedTransfer} > ${selectedKategori}` +
    (selectedKategori === "Shoes & Bags" ? ` > ${selectedAltKategori}` : '') +
    ` > ${selectedMarka}`;

  const filteredData = data.filter(row =>
    row[0] === selectedTransfer &&
    row[1] === selectedKategori &&
    (selectedKategori !== "Shoes & Bags" || row[2] === selectedAltKategori) &&
    row[3] === selectedMarka
  );

  renderCards(filteredData);
  filterModal.hide();
});

function renderCards(rows) {
  cardContainer.innerHTML = "";
  if (rows.length === 0) {
    cardContainer.innerHTML = `<div class="alert alert-warning w-100">Hiçbir sonuç bulunamadı.</div>`;
    return;
  }

  const savedCheckboxes = JSON.parse(localStorage.getItem("checkedBoxes") || "{}");

  rows.forEach(row => {
    const col = document.createElement('div');
    col.className = "col-custom";

    const card = document.createElement('div');
    card.className = "card-alt";

    const sasCount = parseInt(row[9]) || 0;
    const ean = row[7];

    // Malzeme kodunu alıyoruz
    let malzemeKisa = row[6];
    if (malzemeKisa.length > 3) {
      malzemeKisa = malzemeKisa.slice(0, -3);
    }

    // Burada ürün resmi url'sini oluşturuyoruz
    const imageUrl = `https://statics-mp.boyner.com.tr/mnresize/300/-/Boynerimages/${malzemeKisa}_276_01.jpg?v=1747831704`;

    let checkboxHTML = "";

    for (let i = 0; i < sasCount; i++) {
      const checkboxId = `${ean}_sas_${i}`;
      const isChecked = savedCheckboxes[checkboxId] ? "checked" : "";
      checkboxHTML += `<input type="checkbox" class="form-check-input" id="${checkboxId}" ${isChecked} />`;
    }

    let malzemeKisa = row[6];
    if (malzemeKisa.length > 3) {
      malzemeKisa = malzemeKisa.slice(0, -3);
    }
    const onlineLink = `https://www.boyner.com.tr/search?q=${encodeURIComponent(malzemeKisa)}`;

    card.innerHTML = `
      <div>
        <img src="${imageUrl}" alt="Ürün Resmi" style="max-width: 100%; border-radius: 8px; margin-bottom: 10px;" />
        <div class="card-title">${row[4]}</div>
        <div class="info-item"><i class="fas fa-barcode"></i> <strong>Model:</strong> ${row[5]}</div>
        <div class="info-item"><i class="fas fa-box"></i> <strong>Malzeme:</strong> ${row[6]}</div>
        <div class="info-item"><i class="fas fa-qrcode"></i> <strong>EAN/UPC:</strong> ${row[7]}</div>
        <div class="info-item"><i class="fas fa-user"></i> <strong>Müşteri:</strong> ${row[8]}</div>
        <div class="info-item">
          <i class="fas fa-warehouse me-1"></i>
          <strong class="me-2">SAS:</strong> ${row[9]}
          <div class="checkbox-group ms-2">${checkboxHTML}</div>
        </div>
        <div class="info-item"><i class="fas fa-cubes"></i> <strong>Stok:</strong> ${row[10]}</div>
        <div class="info-item"><i class="fas fa-file-alt"></i> <strong>İş Emri:</strong> ${row[11]}</div>
      </div>
      <a href="${onlineLink}" target="_blank" class="online-btn">Online</a>
    `;

    col.appendChild(card);
    cardContainer.appendChild(col);
  });

  const countdownTimers = new Map();

  cardContainer.querySelectorAll("input[type='checkbox']").forEach(checkbox => {
    checkbox.addEventListener('change', () => {
      const savedCheckboxes = JSON.parse(localStorage.getItem("checkedBoxes") || "{}");
      const id = checkbox.id;
      savedCheckboxes[id] = checkbox.checked;
      localStorage.setItem("checkedBoxes", JSON.stringify(savedCheckboxes));

      const parentCard = checkbox.closest(".card-alt");
      const parentCol = checkbox.closest(".col-custom");
      const allCheckboxes = parentCard.querySelectorAll("input[type='checkbox']");
      const allChecked = Array.from(allCheckboxes).every(cb => cb.checked);

      if (allChecked && allCheckboxes.length > 0) {
        parentCard.classList.add("completed");

        let badge = parentCard.querySelector(".countdown-badge");
        if (!badge) {
          badge = document.createElement("div");
          badge.className = "countdown-badge";
          parentCard.appendChild(badge);
        }

        let countdown = 1;
        badge.textContent = `${countdown}`;

        if (countdownTimers.has(parentCard)) {
          clearInterval(countdownTimers.get(parentCard));
        }

        const intervalId = setInterval(() => {
          countdown--;
          if (countdown > 0) {
            badge.textContent = `${countdown}`;
          } else {
            clearInterval(intervalId);
            countdownTimers.delete(parentCard);
            badge.remove();
            cardContainer.appendChild(parentCol);
          }
        }, 1000);

        countdownTimers.set(parentCard, intervalId);
      } else {
        parentCard.classList.remove("completed");
        const badge = parentCard.querySelector(".countdown-badge");
        if (badge) badge.remove();
        if (countdownTimers.has(parentCard)) {
          clearInterval(countdownTimers.get(parentCard));
          countdownTimers.delete(parentCard);
        }
      }
    });
  });

  cardContainer.querySelectorAll('.col-custom').forEach(col => {
    const card = col.querySelector('.card-alt');
    const checkboxes = card.querySelectorAll('input[type="checkbox"]');
    if (checkboxes.length > 0) {
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      if (allChecked) {
        card.classList.add('completed');
        const badge = card.querySelector('.countdown-badge');
        if (badge) badge.remove();
        cardContainer.appendChild(col);
      } else {
        card.classList.remove('completed');
        const badge = card.querySelector('.countdown-badge');
        if (badge) badge.remove();
      }
    }
  });
}

clearStorageBtn.addEventListener('click', () => {
  if (confirm('Emin misiniz?')) {
    localStorage.clear();
    location.reload();
  }
  localStorage.clear();
  location.reload();
});


document.getElementById('scrollBottomBtn').addEventListener('click', () => {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
});
document.getElementById('scrollTopBtn').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

loadData();
</script>
</body>
</html>
