<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transfer Listesi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f2f5;
      padding: 1rem;
      font-family: "Segoe UI", sans-serif;
    }

    h1 {
      font-size: 1.8rem;
    }

    nav {
      margin-bottom: 1rem;
    }

    .card-alt {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 1.5rem;
      transition: all 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .card-alt:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    .card-alt.completed {
      border-color: #198754;
      background-color: #d1e7dd;
      position: relative;
    }

    .countdown-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #198754;
      color: white;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 14px;
      user-select: none;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .card-title {
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 1rem;
      color: #0d6efd;
    }

    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
      color: #333;
      flex-wrap: wrap;
    }

    .info-item i {
      width: 20px;
      text-align: center;
      color: #0d6efd;
      margin-right: 8px;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: 10px;
    }

    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }

    .col-custom {
      padding: 0.5rem;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      margin: -0.5rem;
    }

    .online-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
      transition: background-color 0.3s ease;
      margin-top: 15px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .online-btn:hover {
      background-color: #218838;
      color: white;
      text-decoration: none;
    }

    @media (min-width: 576px) {
      .col-custom {
        width: 50%;
      }
    }

    @media (max-width: 575.98px) {
      .col-custom {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container mt-4">
  <h1>Transfer Listesi</h1>
  <nav>
    <ul class="nav nav-tabs" id="filterTabs"></ul>
  </nav>
  <div class="card-container" id="cardContainer"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="filterForm">
        <div class="modal-header">
          <h5 class="modal-title" id="filterModalLabel">Filtre Seçimi</h5>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="transfer" class="form-label">Transfer Listesi</label>
            <select id="transfer" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="kategori" class="form-label">Kategori</label>
            <select id="kategori" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="marka" class="form-label">Marka</label>
            <select id="marka" class="form-select" required></select>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" id="clearStorageBtn" class="btn btn-danger">Geçmişi Temizle</button>
          <button type="submit" class="btn btn-primary">Filtrele</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let data = [];

const transferSelect = document.getElementById('transfer');
const kategoriSelect = document.getElementById('kategori');
const markaSelect = document.getElementById('marka');
const cardContainer = document.getElementById('cardContainer');
const filterModal = new bootstrap.Modal(document.getElementById('filterModal'));
const filterTabs = document.getElementById('filterTabs');
const clearStorageBtn = document.getElementById('clearStorageBtn');

let currentFilter = {
  transfer: null,
  kategori: null,
  marka: null,
};

function parseTSVLine(line) {
  return line.split('\t').map(cell => cell.trim());
}

async function loadData() {
  try {
    const response = await fetch('test.txt');
    if (!response.ok) throw new Error('test.txt dosyası okunamadı');
    const text = await response.text();
    const lines = text.split('\n').filter(l => l.trim().length > 0);
    lines.shift(); // başlığı çıkar
    data = lines.map(parseTSVLine);
    populateSelect(transferSelect, [...new Set(data.map(row => row[0]))]);
    filterModal.show();
  } catch (error) {
    alert('Veri yüklenirken hata oluştu: ' + error.message);
  }
}

function populateSelect(selectElement, items) {
  selectElement.innerHTML = '<option value="">Seçiniz</option>';
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item;
    opt.textContent = item;
    selectElement.appendChild(opt);
  });
}

transferSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const categories = data.filter(row => row[0] === selectedTransfer).map(row => row[1]);
  populateSelect(kategoriSelect, [...new Set(categories)]);
  markaSelect.innerHTML = "";
});

kategoriSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const brands = data
    .filter(row => row[0] === selectedTransfer && row[1] === selectedKategori)
    .map(row => row[3]);
  populateSelect(markaSelect, [...new Set(brands)]);
});

document.getElementById('filterForm').addEventListener('submit', function(e) {
  e.preventDefault();

  currentFilter.transfer = transferSelect.value;
  currentFilter.kategori = kategoriSelect.value;
  currentFilter.marka = markaSelect.value;

  updateFilterTabs();
  applyFilter();
  filterModal.hide();
});

function updateFilterTabs() {
  filterTabs.innerHTML = '';

  if (currentFilter.transfer) {
    const li = document.createElement('li');
    li.className = "nav-item";
    li.innerHTML = `<a href="#" class="nav-link active" data-filter="transfer">${currentFilter.transfer}</a>`;
    filterTabs.appendChild(li);
  }

  if (currentFilter.kategori) {
    const li = document.createElement('li');
    li.className = "nav-item";
    li.innerHTML = `<a href="#" class="nav-link active" data-filter="kategori">${currentFilter.kategori}</a>`;
    filterTabs.appendChild(li);
  }

  if (currentFilter.marka) {
    const li = document.createElement('li');
    li.className = "nav-item";
    li.innerHTML = `<a href="#" class="nav-link active" data-filter="marka">${currentFilter.marka}</a>`;
    filterTabs.appendChild(li);
  }

  filterTabs.querySelectorAll('a.nav-link').forEach(tab => {
    tab.addEventListener('click', (e) => {
      e.preventDefault();
      const filterType = tab.getAttribute('data-filter');

      // Modal’u aç ve sadece ilgili filtreyi aktif yap
      filterModal.show();

      if(filterType === "transfer") {
        transferSelect.disabled = false;
        kategoriSelect.disabled = true;
        markaSelect.disabled = true;

        kategoriSelect.innerHTML = "";
        markaSelect.innerHTML = "";

        transferSelect.value = currentFilter.transfer;
      }
      else if(filterType === "kategori") {
        transferSelect.disabled = true;
        kategoriSelect.disabled = false;
        markaSelect.disabled = true;

        transferSelect.value = currentFilter.transfer;

        const categories = data.filter(row => row[0] === currentFilter.transfer).map(row => row[1]);
        populateSelect(kategoriSelect, [...new Set(categories)]);
        kategoriSelect.value = currentFilter.kategori;

        markaSelect.innerHTML = "";
      }
      else if(filterType === "marka") {
        transferSelect.disabled = true;
        kategoriSelect.disabled = true;
        markaSelect.disabled = false;

        transferSelect.value = currentFilter.transfer;

        const categories = data.filter(row => row[0] === currentFilter.transfer).map(row => row[1]);
        populateSelect(kategoriSelect, [...new Set(categories)]);
        kategoriSelect.value = currentFilter.kategori;

        const brands = data
          .filter(row => row[0] === currentFilter.transfer && row[1] === currentFilter.kategori)
          .map(row => row[3]);
        populateSelect(markaSelect, [...new Set(brands)]);
        markaSelect.value = currentFilter.marka;
      }
    });
  });
}

function applyFilter() {
  const filteredData = data.filter(row =>
    row[0] === currentFilter.transfer &&
    row[1] === currentFilter.kategori &&
    row[3] === currentFilter.marka
  );

  renderCards(filteredData);
}

function renderCards(rows) {
  cardContainer.innerHTML = "";
  if (rows.length === 0) {
    cardContainer.innerHTML = `<div class="alert alert-warning w-100">Hiçbir sonuç bulunamadı.</div>`;
    return;
  }

  const savedCheckboxes = JSON.parse(localStorage.getItem("checkedBoxes") || "{}");

  rows.forEach(row => {
    const col = document.createElement('div');
    col.className = "col-custom";

    const card = document.createElement('div');
    card.className = "card-alt";

    const sasCount = parseInt(row[9]) || 0;
    const ean = row[7];
    let checkboxHTML = "";

    for (let i = 0; i < sasCount; i++) {
      const checkboxId = `${ean}_sas_${i}`;
      const isChecked = savedCheckboxes[checkboxId] ? "checked" : "";
      checkboxHTML += `<input type="checkbox" class="form-check-input" id="${checkboxId}" ${isChecked} />`;
    }

    let malzemeKisa = row[6];
    if (malzemeKisa.length > 3) {
      malzemeKisa = malzemeKisa.slice(0, -3);
    }
    const linkUrl = row[8];

    card.innerHTML = `
      <div class="countdown-badge" title="İşlem tamamlandıysa tıklayın."> ${sasCount} </div>
      <h5 class="card-title">${row[4]}</h5>
      <div class="info-item"><i class="fa-solid fa-tags"></i> <strong>Malzeme:</strong> ${malzemeKisa} <span class="checkbox-group">${checkboxHTML}</span></div>
      <div class="info-item"><i class="fa-solid fa-bolt"></i> <strong>Renk:</strong> ${row[5]}</div>
      <div class="info-item"><i class="fa-solid fa-truck-fast"></i> <strong>Tedarikçi:</strong> ${row[2]}</div>
      <a href="${linkUrl}" target="_blank" class="online-btn"><i class="fa-solid fa-arrow-up-right-from-square"></i> Online</a>
    `;

    // Checkbox değişimini dinle
    card.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
      checkbox.addEventListener('change', () => {
        const id = checkbox.id;
        if (!savedCheckboxes[id]) {
          savedCheckboxes[id] = true;
        } else {
          delete savedCheckboxes[id];
        }
        localStorage.setItem("checkedBoxes", JSON.stringify(savedCheckboxes));

        // Tüm checkboxlar seçiliyse tamamlandı olarak işaretle
        const allChecked = [...card.querySelectorAll('input[type="checkbox"]')].every(c => c.checked);
        if (allChecked && sasCount > 0) {
          card.classList.add('completed');
        } else {
          card.classList.remove('completed');
        }
      });
    });

    // İlk yüklemede tamamlandıysa işaretle
    const allCheckedOnLoad = [...card.querySelectorAll('input[type="checkbox"]')].every(c => c.checked);
    if (allCheckedOnLoad && sasCount > 0) {
      card.classList.add('completed');
    }

    col.appendChild(card);
    cardContainer.appendChild(col);
  });
}

clearStorageBtn.addEventListener('click', () => {
  localStorage.removeItem("checkedBoxes");
  alert('Kaydedilen tüm seçimler temizlendi.');
  applyFilter();
});

// Sayfa açıldığında veriyi yükle
loadData();
</script>
</body>
</html>
