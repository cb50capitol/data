<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transfer Listesi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
      padding: 1rem;
    }
    .card {
      border-left: 4px solid #0d6efd;
      max-width: 320px;
      margin: 0 auto;
      padding: 1rem;
      box-sizing: border-box;
      word-wrap: break-word;
    }
    .card div {
      margin-bottom: 6px;
    }
    #filterInfo {
      font-style: italic;
      color: #6c757d;
    }
  </style>
</head>
<body>

<div class="container mt-4">
  <h1 class="mb-4">Transfer Listesi</h1>
  <div id="filterInfo" class="mb-3"></div>
  <div class="row g-3" id="cardContainer"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="filterForm">
        <div class="modal-header">
          <h5 class="modal-title" id="filterModalLabel">Filtre Seçimi</h5>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="transfer" class="form-label">Transfer Listesi</label>
            <select id="transfer" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="kategori" class="form-label">Kategori</label>
            <select id="kategori" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="marka" class="form-label">Marka</label>
            <select id="marka" class="form-select" required></select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Filtrele</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let data = [];

const transferSelect = document.getElementById('transfer');
const kategoriSelect = document.getElementById('kategori');
const markaSelect = document.getElementById('marka');
const cardContainer = document.getElementById('cardContainer');
const filterModal = new bootstrap.Modal(document.getElementById('filterModal'));
const filterInfoDiv = document.getElementById('filterInfo');

function parseTSVLine(line) {
  return line.split('\t').map(cell => cell.trim());
}

async function loadData() {
  try {
    const response = await fetch('test.txt');
    if (!response.ok) throw new Error('test.txt dosyası okunamadı');
    const text = await response.text();
    const lines = text.split('\n').filter(l => l.trim().length > 0);
    // Başlık satırını atla
    lines.shift();
    data = lines.map(parseTSVLine);

    populateSelect(transferSelect, [...new Set(data.map(row => row[0]))]);
    filterModal.show();
  } catch (error) {
    alert('Veri yüklenirken hata oluştu: ' + error.message);
  }
}

function populateSelect(selectElement, items) {
  selectElement.innerHTML = '<option value="">Seçiniz</option>';
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item;
    opt.textContent = item;
    selectElement.appendChild(opt);
  });
}

transferSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const categories = data
    .filter(row => row[0] === selectedTransfer)
    .map(row => row[1]);
  populateSelect(kategoriSelect, [...new Set(categories)]);
  markaSelect.innerHTML = "";
});

kategoriSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const brands = data
    .filter(row => row[0] === selectedTransfer && row[1] === selectedKategori)
    .map(row => row[3]);
  populateSelect(markaSelect, [...new Set(brands)]);
});

function showFilterInfo(transfer, kategori, altKategori) {
  filterInfoDiv.textContent = `${transfer} > ${kategori} > ${altKategori}`;
}

document.getElementById('filterForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const selectedMarka = markaSelect.value;

  showFilterInfo(selectedTransfer, selectedKategori, selectedMarka);

  const filteredData = data.filter(row =>
    row[0] === selectedTransfer &&
    row[1] === selectedKategori &&
    row[3] === selectedMarka
  );

  renderCards(filteredData);
  filterModal.hide();
});

function renderCards(rows) {
  cardContainer.innerHTML = "";
  if (rows.length === 0) {
    cardContainer.innerHTML = `<div class="alert alert-warning">Hiçbir sonuç bulunamadı.</div>`;
    return;
  }

  rows.forEach(row => {
    const col = document.createElement('div');
    col.className = "col-12 col-md-4";

    const card = document.createElement('div');
    card.className = "card shadow-sm p-3 h-100";

    const content = `
      <div><strong>Tanım:</strong> ${row[4]}</div>
      <div><strong>Model:</strong> ${row[5]}</div>
      <div><strong>Malzeme:</strong> ${row[6]}</div>
      <div><strong>EAN/UPC:</strong> ${row[7]}</div>
      <div><strong>Müşteri:</strong> ${row[8]}</div>
      <div><strong>SAS:</strong> ${row[9]}</div>
      <div><strong>Stok:</strong> ${row[10]}</div>
    `;

    card.innerHTML = content;
    col.appendChild(card);
    cardContainer.appendChild(col);
  });
}

window.addEventListener('load', () => {
  loadData();
});
</script>
</body>
</html>
