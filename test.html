<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title># Liste</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f0f2f5; padding: 1rem; font-family: "Segoe UI", sans-serif; }
    h1 { font-size: 1.8rem; }
    #filterInfo {
      display: inline-block;
      background-color: #e9ecef;
      color: #0d6efd;
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 1rem;
      transition: background-color 0.2s ease;
    }
    #filterInfo:hover { background-color: #dbe2ea; }
    .card-alt {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 1.5rem;
      transition: all 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .card-alt:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
    .card-alt.completed {
      border-color: #198754;
      background-color: #d1e7dd;
      position: relative;
    }
    .countdown-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #198754;
      color: white;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 14px;
      user-select: none;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .card-title {
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 1rem;
      color: #0d6efd;
    }
    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
      color: #333;
      flex-wrap: wrap;
    }
    .info-item i {
      width: 20px;
      text-align: center;
      color: #0d6efd;
      margin-right: 8px;
    }
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: 10px;
    }
    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }
    .col-custom { padding: 0.5rem; }
    .card-container {
      display: flex;
      flex-wrap: wrap;
      margin: -0.5rem;
    }
    .online-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
      transition: background-color 0.3s ease;
      margin-top: 15px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .online-btn:hover {
      background-color: #218838;
      color: white;
      text-decoration: none;
    }
    @media (min-width: 576px) {
      .col-custom { width: 50%; }
    }
    @media (max-width: 575.98px) {
      .col-custom { width: 100%; }
    }
    .scroll-arrow {
      position: fixed;
      right: 10px;
      background: rgba(0,0,0,0.1);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, opacity 0.4s;
      opacity: 0.3;
      z-index: 9999;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .scroll-arrow:hover {
      background: rgba(0,0,0,0.3);
      color: #0d6efd;
      opacity: 1;
    }
    #scrollBottomBtn { bottom: 10px; }
    #scrollTopBtn { bottom: 60px; }
    .scroll-arrow i { font-size: 20px; }
  </style>
</head>
<body>

<div class="container mt-4">
  <h1># Liste</h1>
  <div id="filterInfo">Filtre Seç</div>
  <div class="card-container" id="cardContainer"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="filterForm">
        <div class="modal-header">
          <h5 class="modal-title" id="filterModalLabel">Filtre Seçimi</h5>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="transfer" class="form-label">Transfer Listesi</label>
            <select id="transfer" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="kategori" class="form-label">Kategori</label>
            <select id="kategori" class="form-select" required></select>
          </div>
          <div class="mb-3" id="altKategoriGroup" style="display: none;">
            <label for="altKategori" class="form-label">Alt Kategori</label>
            <select id="altKategori" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="marka" class="form-label">Marka</label>
            <select id="marka" class="form-select" required></select>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" id="clearStorageBtn" class="btn btn-danger">Geçmişi Temizle</button>
          <button type="submit" class="btn btn-primary">Filtrele</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="scrollTopBtn" class="scroll-arrow" title="Sayfanın üstüne git"><i class="fas fa-chevron-up"></i></div>
<div id="scrollBottomBtn" class="scroll-arrow" title="Sayfanın sonuna git"><i class="fas fa-chevron-down"></i></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let data = [];
const transferSelect = document.getElementById('transfer');
const kategoriSelect = document.getElementById('kategori');
const altKategoriSelect = document.getElementById('altKategori');
const altKategoriGroup = document.getElementById('altKategoriGroup');
const markaSelect = document.getElementById('marka');
const cardContainer = document.getElementById('cardContainer');
const filterModal = new bootstrap.Modal(document.getElementById('filterModal'));
const filterInfoDiv = document.getElementById('filterInfo');
const clearStorageBtn = document.getElementById('clearStorageBtn');

filterInfoDiv.addEventListener('click', () => filterModal.show());

function parseTSVLine(line) {
  return line.split('\t').map(cell => cell.trim());
}

async function loadData() {
  try {
    const response = await fetch('test.txt');
    if (!response.ok) throw new Error('test.txt dosyası okunamadı');
    const text = await response.text();
    const lines = text.split('\n').filter(l => l.trim().length > 0);
    lines.shift(); // Başlık satırını kaldır
    data = lines.map(parseTSVLine);
    populateSelect(transferSelect, [...new Set(data.map(row => row[0]))]);
    filterModal.show();
  } catch (error) {
    alert('Veri yüklenirken hata oluştu: ' + error.message);
  }
}

function populateSelect(selectElement, items) {
  selectElement.innerHTML = '<option value="">Seçiniz</option>';
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item;
    opt.textContent = item;
    selectElement.appendChild(opt);
  });
}

transferSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const categories = data.filter(row => row[0] === selectedTransfer).map(row => row[1]);
  populateSelect(kategoriSelect, [...new Set(categories)]);
  altKategoriGroup.style.display = "none";
  altKategoriSelect.required = false;   // gizliyken required kapat
  markaSelect.innerHTML = "";
});

kategoriSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const rows = data.filter(row => row[0] === selectedTransfer && row[1] === selectedKategori);

  if (selectedKategori === "Shoes & Bags") {
    altKategoriGroup.style.display = "block";
    altKategoriSelect.required = true;  // gösterirken required aç
    const altKategoriler = rows.map(row => row[2]);
    populateSelect(altKategoriSelect, [...new Set(altKategoriler)]);
    markaSelect.innerHTML = "";
    markaSelect.required = true;
  } else {
    altKategoriGroup.style.display = "none";
    altKategoriSelect.required = false; // gizliyken required kapat
    const markalar = rows.map(row => row[3]);
    populateSelect(markaSelect, [...new Set(markalar)]);
    markaSelect.required = true;
  }
});

altKategoriSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const selectedAltKategori = altKategoriSelect.value;
  const rows = data.filter(row => row[0] === selectedTransfer && row[1] === selectedKategori && row[2] === selectedAltKategori);
  const markalar = rows.map(row => row[3]);
  populateSelect(markaSelect, [...new Set(markalar)]);
});

document.getElementById('filterForm').addEventListener('submit', function(e) {
  e.preventDefault();
  // Konsola log eklendi, submitin çalıştığını görmek için
  console.log('Form submit tetiklendi');

  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const selectedAltKategori = altKategoriSelect.value;
  const selectedMarka = markaSelect.value;

  // Filtrelenmiş satırları bul
  let filteredRows = data.filter(row => row[0] === selectedTransfer && row[1] === selectedKategori);

  if (selectedKategori === "Shoes & Bags") {
    filteredRows = filteredRows.filter(row => row[2] === selectedAltKategori && row[3] === selectedMarka);
  } else {
    filteredRows = filteredRows.filter(row => row[3] === selectedMarka);
  }

  renderCards(filteredRows);

  filterModal.hide();

  // Filtre bilgisi göster
  let infoText = `${selectedTransfer} > ${selectedKategori}`;
  if (selectedKategori === "Shoes & Bags") {
    infoText += ` > ${selectedAltKategori}`;
  }
  infoText += ` > ${selectedMarka}`;
  filterInfoDiv.textContent = infoText;

  // Filtre bilgisini localStorage'a kaydet
  localStorage.setItem('filterInfo', infoText);
});

clearStorageBtn.addEventListener('click', () => {
  localStorage.removeItem('filterInfo');
  filterInfoDiv.textContent = 'Filtre Seç';
  filterModal.show();
  cardContainer.innerHTML = '';
});

function renderCards(rows) {
  cardContainer.innerHTML = "";
  if (rows.length === 0) {
    cardContainer.innerHTML = "<p>Filtreye uygun sonuç bulunamadı.</p>";
    return;
  }

  rows.forEach(row => {
    // Örnek: row = [transfer, kategori, altKategori, marka, ilanNo, satıcı, fiyat, adres, baslangic, bitis, tamamlandi]
    // Her satır için kart oluşturuyoruz
    const card = document.createElement('div');
    card.classList.add('col-custom');
    card.innerHTML = `
      <div class="card-alt ${row[10] === "TRUE" ? "completed" : ""}">
        <div class="countdown-badge">${row[10] === "TRUE" ? "Tamamlandı" : getTimeRemaining(row[9])}</div>
        <h3 class="card-title">${row[4]}</h3>
        <div class="info-item"><i class="fas fa-user"></i> ${row[5]}</div>
        <div class="info-item"><i class="fas fa-tag"></i> ${row[6]} TL</div>
        <div class="info-item"><i class="fas fa-map-marker-alt"></i> ${row[7]}</div>
        <a href="#" class="online-btn">Online</a>
      </div>
    `;
    cardContainer.appendChild(card);
  });
}

function getTimeRemaining(bitisStr) {
  // Basit örnek: bitisStr = "YYYY-MM-DD HH:mm:ss"
  // Gelecek tarih ise kalan süreyi göster, geçtiyse "Süresi Doldu"
  const now = new Date();
  const bitis = new Date(bitisStr);
  const diffMs = bitis - now;
  if (diffMs <= 0) return "Süresi Doldu";

  const diffDays = Math.floor(diffMs / (1000*60*60*24));
  const diffHours = Math.floor((diffMs / (1000*60*60)) % 24);
  const diffMinutes = Math.floor((diffMs / (1000*60)) % 60);

  return `${diffDays}g ${diffHours}s ${diffMinutes}d`;
}

// Sayfa açıldığında localStorage'dan filtre bilgisini alıp göster
window.addEventListener('load', () => {
  const savedFilterInfo = localStorage.getItem('filterInfo');
  if (savedFilterInfo) {
    filterInfoDiv.textContent = savedFilterInfo;
  }
  loadData();
});

// Scroll butonları
document.getElementById('scrollTopBtn').addEventListener('click', () => window.scrollTo({top: 0, behavior: 'smooth'}));
document.getElementById('scrollBottomBtn').addEventListener('click', () => window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'}));
</script>

</body>
</html>
