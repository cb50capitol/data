<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title># Liste</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f2f5;
      padding: 1rem;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    h1 {
      font-size: 1.8rem;
    }
    #filterInfo {
      display: inline-block;
      background-color: #e9ecef;
      color: #0d6efd;
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 1rem;
      transition: background-color 0.2s ease;
      user-select: none;
    }
    #filterInfo:hover {
      background-color: #dbe2ea;
    }
    .card-alt {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 1.5rem;
      transition: all 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .card-alt:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }
    .card-alt.completed {
      border-color: #198754;
      background-color: #d1e7dd;
      position: relative;
    }
    .countdown-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #198754;
      color: white;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 14px;
      user-select: none;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .card-title {
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 1rem;
      color: #0d6efd;
    }
    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
      color: #333;
      flex-wrap: wrap;
    }
    .info-item i {
      width: 20px;
      text-align: center;
      color: #0d6efd;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: 10px;
    }
    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }
    .col-custom {
      padding: 0.5rem;
      box-sizing: border-box;
      width: 100%;
    }
    @media (min-width: 576px) {
      .col-custom {
        width: 50%;
      }
    }
    .card-container {
      display: flex;
      flex-wrap: wrap;
      margin: -0.5rem;
    }
    .online-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
      transition: background-color 0.3s ease;
      margin-top: 15px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .online-btn:hover {
      background-color: #218838;
      color: white;
      text-decoration: none;
    }
    .scroll-arrow {
      position: fixed;
      right: 10px;
      background: rgba(0,0,0,0.1);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, opacity 0.4s;
      opacity: 0.3;
      z-index: 9999;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .scroll-arrow:hover {
      background: rgba(0,0,0,0.3);
      color: #0d6efd;
      opacity: 1;
    }
    #scrollBottomBtn {
      bottom: 10px;
    }
    #scrollTopBtn {
      bottom: 60px;
    }
    .scroll-arrow i {
      font-size: 20px;
    }
  </style>
</head>
<body>

<div class="container mt-4">
  <h1># Liste</h1>
  <div id="filterInfo" title="Filtreyi değiştirmek için tıklayın">Filtre Seç</div>
  <div class="card-container" id="cardContainer"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="filterForm">
        <div class="modal-header">
          <h5 class="modal-title" id="filterModalLabel">Filtre Seçimi</h5>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="transfer" class="form-label">Transfer Listesi</label>
            <select id="transfer" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="kategori" class="form-label">Kategori</label>
            <select id="kategori" class="form-select" required></select>
          </div>
          <div class="mb-3" id="altKategoriGroup" style="display: none;">
            <label for="altKategori" class="form-label">Alt Kategori</label>
            <select id="altKategori" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label for="marka" class="form-label">Marka</label>
            <select id="marka" class="form-select" required></select>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" id="clearStorageBtn" class="btn btn-danger">Geçmişi Temizle</button>
          <button type="submit" class="btn btn-primary">Filtrele</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="scrollTopBtn" class="scroll-arrow" title="Sayfanın üstüne git"><i class="fas fa-chevron-up"></i></div>
<div id="scrollBottomBtn" class="scroll-arrow" title="Sayfanın sonuna git"><i class="fas fa-chevron-down"></i></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let data = [];
const transferSelect = document.getElementById('transfer');
const kategoriSelect = document.getElementById('kategori');
const altKategoriSelect = document.getElementById('altKategori');
const altKategoriGroup = document.getElementById('altKategoriGroup');
const markaSelect = document.getElementById('marka');
const cardContainer = document.getElementById('cardContainer');
const filterModal = new bootstrap.Modal(document.getElementById('filterModal'));
const filterInfoDiv = document.getElementById('filterInfo');
const clearStorageBtn = document.getElementById('clearStorageBtn');

filterInfoDiv.addEventListener('click', () => filterModal.show());

function parseTSVLine(line) {
  return line.split('\t').map(cell => cell.trim());
}

async function loadData() {
  try {
    const response = await fetch('test.txt');
    if (!response.ok) throw new Error('test.txt dosyası okunamadı');
    const text = await response.text();
    const lines = text.split('\n').filter(l => l.trim().length > 0);
    lines.shift(); // Başlık satırını atla
    data = lines.map(parseTSVLine);
    populateSelect(transferSelect, [...new Set(data.map(row => row[0]))]);
    filterModal.show();
  } catch (error) {
    alert('Veri yüklenirken hata oluştu: ' + error.message);
  }
}

function populateSelect(selectElem, items, includeEmpty = false) {
  selectElem.innerHTML = '';
  if (includeEmpty) selectElem.innerHTML = `<option value="">Seçiniz</option>`;
  items.forEach(item => {
    selectElem.innerHTML += `<option value="${item}">${item}</option>`;
  });
}

function uniqueSorted(arr) {
  return [...new Set(arr)].sort();
}

transferSelect.addEventListener('change', () => {
  const filtered = data.filter(row => row[0] === transferSelect.value);
  populateSelect(kategoriSelect, uniqueSorted(filtered.map(r => r[1])));
  altKategoriGroup.style.display = 'none';
  altKategoriSelect.innerHTML = '';
  markaSelect.innerHTML = '';
});

kategoriSelect.addEventListener('change', () => {
  const filtered = data.filter(row =>
    row[0] === transferSelect.value &&
    row[1] === kategoriSelect.value
  );

  if (kategoriSelect.value === 'Shoes & Bags') {
    altKategoriGroup.style.display = 'block';
    populateSelect(altKategoriSelect, uniqueSorted(filtered.map(r => r[2])), true);
  } else {
    altKategoriGroup.style.display = 'none';
    altKategoriSelect.innerHTML = '';
  }

  let markaItems;
  if (kategoriSelect.value === 'Shoes & Bags') {
    markaItems = filtered.filter(r => r[2] === altKategoriSelect.value).map(r => r[3]);
  } else {
    markaItems = filtered.map(r => r[3]);
  }
  markaItems = uniqueSorted(markaItems);
  populateSelect(markaSelect, markaItems, true);
});

altKategoriSelect.addEventListener('change', () => {
  const filtered = data.filter(row =>
    row[0] === transferSelect.value &&
    row[1] === kategoriSelect.value &&
    row[2] === altKategoriSelect.value
  );
  const markaItems = uniqueSorted(filtered.map(r => r[3]));
  populateSelect(markaSelect, markaItems, true);
});

clearStorageBtn.addEventListener('click', () => {
  localStorage.clear();
  alert('Geçmiş temizlendi!');
});

document.getElementById('filterForm').addEventListener('submit', e => {
  e.preventDefault();

  const transferVal = transferSelect.value;
  const kategoriVal = kategoriSelect.value;
  const altKategoriVal = altKategoriSelect.value;
  const markaVal = markaSelect.value;

  if (!transferVal || !kategoriVal || !markaVal) {
    alert('Lütfen Transfer Listesi, Kategori ve Marka alanlarını seçiniz.');
    return;
  }
  if (kategoriVal === 'Shoes & Bags' && !altKategoriVal) {
    alert('Lütfen Alt Kategori seçiniz.');
    return;
  }

  let filteredData;
  if (kategoriVal === 'Shoes & Bags') {
    filteredData = data.filter(row =>
      row[0] === transferVal &&
      row[1] === kategoriVal &&
      row[2] === altKategoriVal &&
      row[3] === markaVal
    );
  } else {
    filteredData = data.filter(row =>
      row[0] === transferVal &&
      row[1] === kategoriVal &&
      row[3] === markaVal
    );
  }

  if (filteredData.length === 0) {
    alert('Seçilen filtreye uygun ürün bulunamadı.');
  }

  displayCards(filteredData);
  updateFilterInfo(transferVal, kategoriVal, altKategoriVal, markaVal);
  filterModal.hide();
  localStorage.setItem('filter', JSON.stringify({transferVal, kategoriVal, altKategoriVal, markaVal}));
});

function updateFilterInfo(transferVal, kategoriVal, altKategoriVal, markaVal) {
  let text = `${transferVal} > ${kategoriVal}`;
  if (kategoriVal === 'Shoes & Bags' && altKategoriVal) text += ` > ${altKategoriVal}`;
  text += ` > ${markaVal}`;
  filterInfoDiv.textContent = text;
}

function displayCards(filteredData) {
  cardContainer.innerHTML = '';
  if (filteredData.length === 0) {
    cardContainer.innerHTML = '<p>Filtreye uygun ürün bulunamadı.</p>';
    return;
  }

  filteredData.forEach(row => {
    const [transferList, kategori, altKategori, marka, tanim, model, malzeme, ean, musteri, sas, stok, isEmri] = row;
    const card = document.createElement('div');
    card.className = 'col-custom';
    card.innerHTML = `
      <div class="card-alt${isEmri.trim() ? ' completed' : ''}">
        <div class="card-title">${marka}</div>
        <div class="info-item"><i class="fas fa-list"></i> ${tanim}</div>
        <div class="info-item"><i class="fas fa-box"></i> Model: ${model}</div>
        <div class="info-item"><i class="fas fa-cubes"></i> Malzeme: ${malzeme}</div>
        <div class="info-item"><i class="fas fa-barcode"></i> EAN/UPC: ${ean}</div>
        <div class="info-item"><i class="fas fa-user"></i> Müşteri: ${musteri}</div>
        <div class="info-item"><i class="fas fa-layer-group"></i> Stok: ${stok}</div>
        <div><a href="#" class="online-btn">Online Sipariş</a></div>
      </div>
    `;
    cardContainer.appendChild(card);
  });
}

function loadFilterFromStorage() {
  const saved = localStorage.getItem('filter');
  if (!saved) return;

  const { transferVal, kategoriVal, altKategoriVal, markaVal } = JSON.parse(saved);
  transferSelect.value = transferVal;
  transferSelect.dispatchEvent(new Event('change'));

  setTimeout(() => {
    kategoriSelect.value = kategoriVal;
    kategoriSelect.dispatchEvent(new Event('change'));
  }, 100);

  setTimeout(() => {
    if (kategoriVal === 'Shoes & Bags') {
      altKategoriSelect.value = altKategoriVal;
      altKategoriSelect.dispatchEvent(new Event('change'));
    }
  }, 200);

  setTimeout(() => {
    markaSelect.value = markaVal;
    displayCards(data.filter(row => {
      if (row[0] !== transferVal) return false;
      if (row[1] !== kategoriVal) return false;
      if (kategoriVal === 'Shoes & Bags' && row[2] !== altKategoriVal) return false;
      if (row[3] !== markaVal) return false;
      return true;
    }));
    updateFilterInfo(transferVal, kategoriVal, altKategoriVal, markaVal);
  }, 300);
}

loadData().then(() => loadFilterFromStorage());

document.getElementById('scrollTopBtn').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('scrollBottomBtn').addEventListener('click', () => {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
});
</script>

</body>
</html>
