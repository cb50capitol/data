<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transfer Listesi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f2f5;
      padding: 1rem;
      font-family: "Segoe UI", sans-serif;
    }
    h1 { font-size: 1.8rem; }
    #filterInfo {
      font-style: italic;
      color: #6c757d;
      margin-bottom: 1rem;
    }
    #filterInfo a {
      text-decoration: none;
      color: #0d6efd;
      font-weight: bold;
    }
    .card-alt {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 1.5rem;
      transition: all 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .card-alt:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }
    .card-alt.completed {
      border-color: #198754;
      background-color: #d1e7dd;
    }
    .countdown-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #198754;
      color: white;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 14px;
    }
    .card-title {
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 1rem;
      color: #0d6efd;
    }
    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .info-item i {
      width: 20px;
      text-align: center;
      color: #0d6efd;
      margin-right: 8px;
    }
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: 10px;
    }
    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }
    .col-custom {
      padding: 0.5rem;
    }
    .card-container {
      display: flex;
      flex-wrap: wrap;
      margin: -0.5rem;
    }
    .online-btn {
      background-color: #28a745;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      margin-top: 15px;
      text-decoration: none;
      display: inline-block;
    }
    .online-btn:hover {
      background-color: #218838;
    }
    @media (min-width: 576px) {
      .col-custom { width: 50%; }
    }
    @media (max-width: 575.98px) {
      .col-custom { width: 100%; }
    }
    .scroll-arrow {
      position: fixed;
      right: 10px;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.1);
      border-radius: 50%;
      color: #000;
      cursor: pointer;
      opacity: 0.3;
      z-index: 9999;
    }
    .scroll-arrow:hover {
      background: rgba(0,0,0,0.3);
      color: #0d6efd;
      opacity: 1;
    }
    #scrollBottomBtn { bottom: 10px; }
    #scrollTopBtn { bottom: 60px; }
  </style>
</head>
<body>

<div class="container mt-4">
  <h1>Transfer Listesi</h1>
  <div id="filterInfo"></div>
  <div class="card-container" id="cardContainer"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="filterForm">
        <div class="modal-header">
          <h5 class="modal-title" id="filterModalLabel">Filtre Seçimi</h5>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="transfer" class="form-label">Transfer Listesi</label>
            <select id="transfer" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="kategori" class="form-label">Kategori</label>
            <select id="kategori" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="marka" class="form-label">Marka</label>
            <select id="marka" class="form-select" required></select>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" id="clearStorageBtn" class="btn btn-danger">Geçmişi Temizle</button>
          <button type="submit" class="btn btn-primary">Filtrele</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Scroll arrows -->
<div id="scrollTopBtn" class="scroll-arrow" title="Yukarı">
  <i class="fas fa-chevron-up"></i>
</div>
<div id="scrollBottomBtn" class="scroll-arrow" title="Aşağı">
  <i class="fas fa-chevron-down"></i>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let data = [];
const transferSelect = document.getElementById('transfer');
const kategoriSelect = document.getElementById('kategori');
const markaSelect = document.getElementById('marka');
const cardContainer = document.getElementById('cardContainer');
const filterModal = new bootstrap.Modal(document.getElementById('filterModal'));
const filterInfoDiv = document.getElementById('filterInfo');
const clearStorageBtn = document.getElementById('clearStorageBtn');
const countdownTimers = new Map();

function parseTSVLine(line) {
  return line.split('\t').map(cell => cell.trim());
}

async function loadData() {
  try {
    const response = await fetch('test.txt');
    const text = await response.text();
    const lines = text.trim().split('\n');
    lines.shift();
    data = lines.map(parseTSVLine);
    populateSelect(transferSelect, [...new Set(data.map(row => row[0]))]);
    filterModal.show();
  } catch (err) {
    alert('Veri yüklenirken hata: ' + err.message);
  }
}

function populateSelect(select, items) {
  select.innerHTML = '<option value="">Seçiniz</option>';
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item;
    opt.textContent = item;
    select.appendChild(opt);
  });
}

transferSelect.addEventListener('change', () => {
  const categories = data.filter(row => row[0] === transferSelect.value).map(row => row[1]);
  populateSelect(kategoriSelect, [...new Set(categories)]);
  markaSelect.innerHTML = "";
});

kategoriSelect.addEventListener('change', () => {
  const brands = data.filter(row =>
    row[0] === transferSelect.value &&
    row[1] === kategoriSelect.value
  ).map(row => row[3]);
  populateSelect(markaSelect, [...new Set(brands)]);
});

document.getElementById('filterForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const t = transferSelect.value;
  const k = kategoriSelect.value;
  const m = markaSelect.value;
  filterInfoDiv.innerHTML = `
    <a href="#" class="filter-link" data-type="transfer" data-value="${t}">${t}</a> >
    <a href="#" class="filter-link" data-type="kategori" data-value="${k}">${k}</a> >
    <a href="#" class="filter-link" data-type="marka" data-value="${m}">${m}</a>
  `;
  applyFilter(t, k, m);
  filterModal.hide();
});

filterInfoDiv.addEventListener('click', function(e) {
  if (e.target.classList.contains('filter-link')) {
    e.preventDefault();
    const type = e.target.dataset.type;
    const value = e.target.dataset.value;
    if (type === 'transfer') {
      applyFilter(value, "", "");
    } else if (type === 'kategori') {
      applyFilter(transferSelect.value, value, "");
    } else if (type === 'marka') {
      applyFilter(transferSelect.value, kategoriSelect.value, value);
    }
  }
});

function applyFilter(transferVal, kategoriVal, markaVal) {
  transferSelect.value = transferVal;
  const cats = data.filter(row => row[0] === transferVal).map(row => row[1]);
  populateSelect(kategoriSelect, [...new Set(cats)]);
  kategoriSelect.value = kategoriVal;

  const brands = data.filter(row => row[0] === transferVal && row[1] === kategoriVal).map(row => row[3]);
  populateSelect(markaSelect, [...new Set(brands)]);
  markaSelect.value = markaVal;

  const filtered = data.filter(row =>
    row[0] === transferVal &&
    row[1] === kategoriVal &&
    row[3] === markaVal
  );
  renderCards(filtered);
}

function renderCards(rows) {
  cardContainer.innerHTML = "";
  if (rows.length === 0) {
    cardContainer.innerHTML = `<div class="alert alert-warning w-100">Hiçbir sonuç bulunamadı.</div>`;
    return;
  }
  const savedCheckboxes = JSON.parse(localStorage.getItem("checkedBoxes") || "{}");

  rows.forEach(row => {
    const col = document.createElement('div');
    col.className = "col-custom";
    const card = document.createElement('div');
    card.className = "card-alt";

    const sasCount = parseInt(row[9]) || 0;
    const ean = row[7];
    let checkboxHTML = "";
    for (let i = 0; i < sasCount; i++) {
      const id = `${ean}_sas_${i}`;
      const checked = savedCheckboxes[id] ? "checked" : "";
      checkboxHTML += `<input type="checkbox" class="form-check-input" id="${id}" ${checked} />`;
    }

    const onlineLink = `https://www.boyner.com.tr/search?q=${encodeURIComponent(row[6].slice(0, -3))}`;
    card.innerHTML = `
      <div>
        <div class="card-title">${row[4]}</div>
        <div class="info-item"><i class="fas fa-barcode"></i> <strong>Model:</strong> ${row[5]}</div>
        <div class="info-item"><i class="fas fa-box"></i> <strong>Malzeme:</strong> ${row[6]}</div>
        <div class="info-item"><i class="fas fa-qrcode"></i> <strong>EAN/UPC:</strong> ${ean}</div>
        <div class="info-item"><i class="fas fa-user"></i> <strong>Müşteri:</strong> ${row[8]}</div>
        <div class="info-item"><i class="fas fa-warehouse me-1"></i><strong>SAS:</strong> ${row[9]}
          <div class="checkbox-group ms-2">${checkboxHTML}</div>
        </div>
        <div class="info-item"><i class="fas fa-cubes"></i> <strong>Stok:</strong> ${row[10]}</div>
        <div class="info-item"><i class="fas fa-file-alt"></i> <strong>İş Emri:</strong> ${row[11]}</div>
      </div>
      <a href="${onlineLink}" target="_blank" class="online-btn">Online</a>
    `;
    col.appendChild(card);
    cardContainer.appendChild(col);

    card.querySelectorAll("input[type='checkbox']").forEach(checkbox => {
      checkbox.addEventListener('change', () => {
        const id = checkbox.id;
        savedCheckboxes[id] = checkbox.checked;
        localStorage.setItem("checkedBoxes", JSON.stringify(savedCheckboxes));
        const all = card.querySelectorAll("input[type='checkbox']");
        const allChecked = Array.from(all).every(cb => cb.checked);

        if (allChecked && all.length > 0) {
          card.classList.add("completed");
          let badge = card.querySelector(".countdown-badge");
          if (!badge) {
            badge = document.createElement("div");
            badge.className = "countdown-badge";
            card.appendChild(badge);
          }
          let count = 3;
          badge.textContent = `Kapatılıyor: ${count}s`;

          if (countdownTimers.has(card)) clearInterval(countdownTimers.get(card));
          const interval = setInterval(() => {
            count--;
            if (count > 0) {
              badge.textContent = `Kapatılıyor: ${count}s`;
            } else {
              clearInterval(interval);
              badge.remove();
              cardContainer.appendChild(col);
            }
          }, 1000);
          countdownTimers.set(card, interval);
        } else {
          card.classList.remove("completed");
          const badge = card.querySelector(".countdown-badge");
          if (badge) badge.remove();
        }
      });
    });

    const allCheckboxes = card.querySelectorAll("input[type='checkbox']");
    const allChecked = Array.from(allCheckboxes).every(cb => cb.checked);
    if (allChecked && allCheckboxes.length > 0) {
      card.classList.add("completed");
      cardContainer.appendChild(col);
    }
  });
}

clearStorageBtn.addEventListener('click', () => {
  localStorage.removeItem("checkedBoxes");
  location.reload();
});

document.getElementById('scrollTopBtn').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('scrollBottomBtn').addEventListener('click', () => {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
});

loadData();
</script>
</body>
</html>
