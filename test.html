<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transfer Listesi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f2f5;
      padding: 1rem;
      font-family: "Segoe UI", sans-serif;
    }

    h1 {
      font-size: 1.8rem;
    }

    #filterInfo {
      font-style: italic;
      color: #6c757d;
      margin-bottom: 1rem;
    }

    .card-alt {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 1.5rem;
      transition: all 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .card-alt:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    .card-alt.completed {
      border-color: #198754;
      background-color: #d1e7dd;
      position: relative;
    }

    .countdown-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #198754;
      color: white;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 14px;
      user-select: none;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .card-title {
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 1rem;
      color: #0d6efd;
    }

    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
      color: #333;
      flex-wrap: wrap;
    }

    .info-item i {
      width: 20px;
      text-align: center;
      color: #0d6efd;
      margin-right: 8px;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: 10px;
    }

    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }

    .col-custom {
      padding: 0.5rem;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      margin: -0.5rem;
    }

    .online-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
      transition: background-color 0.3s ease;
      margin-top: 15px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .online-btn:hover {
      background-color: #218838;
      color: white;
      text-decoration: none;
    }

    @media (min-width: 576px) {
      .col-custom {
        width: 50%;
      }
    }

    @media (max-width: 575.98px) {
      .col-custom {
        width: 100%;
      }
    }

    /* === Sağ alt köşedeki yukarı ve aşağı oklar için stil === */
    .scroll-arrow {
      position: fixed;
      right: 10px;
      background: rgba(0,0,0,0.1);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, opacity 0.4s;
      opacity: 0.3;
      z-index: 9999;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .scroll-arrow:hover {
      background: rgba(0,0,0,0.3);
      color: #0d6efd;
      opacity: 1;
    }

    #scrollBottomBtn {
      bottom: 10px;
    }

    #scrollTopBtn {
      bottom: 60px; /* scrollBottomBtn’un üstünde, arada 10px boşluk */
    }

    .scroll-arrow i {
      font-size: 20px;
    }
  </style>
</head>
<body>

<div class="container mt-4">
  <h1>Transfer Listesi</h1>
  <div id="filterInfo"></div>
  <div class="card-container" id="cardContainer"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="filterForm">
        <div class="modal-header">
          <h5 class="modal-title" id="filterModalLabel">Filtre Seçimi</h5>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="transfer" class="form-label">Transfer Listesi</label>
            <select id="transfer" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="kategori" class="form-label">Kategori</label>
            <select id="kategori" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="marka" class="form-label">Marka</label>
            <select id="marka" class="form-select" required></select>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" id="clearStorageBtn" class="btn btn-danger">Geçmişi Temizle</button>
          <button type="submit" class="btn btn-primary">Filtrele</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Sayfanın sağ alt köşesinde yukarı ve aşağı oklar -->
<div id="scrollTopBtn" class="scroll-arrow" title="Sayfanın üstüne git">
  <i class="fas fa-chevron-up"></i>
</div>
<div id="scrollBottomBtn" class="scroll-arrow" title="Sayfanın sonuna git">
  <i class="fas fa-chevron-down"></i>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let data = [];

const transferSelect = document.getElementById('transfer');
const kategoriSelect = document.getElementById('kategori');
const markaSelect = document.getElementById('marka');
const cardContainer = document.getElementById('cardContainer');
const filterModal = new bootstrap.Modal(document.getElementById('filterModal'));
const filterInfoDiv = document.getElementById('filterInfo');
const clearStorageBtn = document.getElementById('clearStorageBtn');

function parseTSVLine(line) {
  return line.split('\t').map(cell => cell.trim());
}

async function loadData() {
  try {
    const response = await fetch('test.txt');
    if (!response.ok) throw new Error('test.txt dosyası okunamadı');
    const text = await response.text();
    const lines = text.split('\n').filter(l => l.trim().length > 0);
    lines.shift(); // başlığı çıkar
    data = lines.map(parseTSVLine);
    populateSelect(transferSelect, [...new Set(data.map(row => row[0]))]);
    filterModal.show();
  } catch (error) {
    alert('Veri yüklenirken hata oluştu: ' + error.message);
  }
}

function populateSelect(selectElement, items) {
  selectElement.innerHTML = '<option value="">Seçiniz</option>';
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item;
    opt.textContent = item;
    selectElement.appendChild(opt);
  });
}

transferSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const categories = data.filter(row => row[0] === selectedTransfer).map(row => row[1]);
  populateSelect(kategoriSelect, [...new Set(categories)]);
  markaSelect.innerHTML = "";
});

kategoriSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const marks = data.filter(row => row[0] === selectedTransfer && row[1] === selectedKategori).map(row => row[3]);
  populateSelect(markaSelect, [...new Set(marks)]);
});

document.getElementById('filterForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const selectedMarka = markaSelect.value;

  filterInfoDiv.textContent = `${selectedTransfer} > ${selectedKategori} > ${selectedMarka}`;

  const filteredData = data.filter(row =>
    row[0] === selectedTransfer &&
    row[1] === selectedKategori &&
    row[3] === selectedMarka
  );

  renderCards(filteredData);
  filterModal.hide();
});

clearStorageBtn.addEventListener('click', () => {
  if (confirm("Tüm kayıtlı checkbox seçimlerini temizlemek istediğinize emin misiniz?")) {
    localStorage.removeItem("checkedBoxes");
    alert("Seçimler temizlendi. Lütfen tekrar filtreleme yapınız.");
    filterModal.show();
  }
});

function renderCards(rows) {
  cardContainer.innerHTML = "";
  if (rows.length === 0) {
    cardContainer.innerHTML = `<div class="alert alert-warning w-100">Hiçbir sonuç bulunamadı.</div>`;
    return;
  }

  const savedCheckboxes = JSON.parse(localStorage.getItem("checkedBoxes") || "{}");
  const countdownTimers = new Map();

  rows.forEach(row => {
    const col = document.createElement('div');
    col.className = "col-custom";

    const card = document.createElement('div');
    card.className = "card-alt";

    const sasCount = parseInt(row[9]) || 0;
    const ean = row[7];
    let checkboxHTML = "";

    for (let i = 0; i < sasCount; i++) {
      const checkboxId = `${ean}_sas_${i}`;
      const isChecked = savedCheckboxes[checkboxId] ? "checked" : "";
      checkboxHTML += `<input type="checkbox" class="form-check-input" id="${checkboxId}" ${isChecked} />`;
    }

    let malzemeKisa = row[6];
    if (malzemeKisa.length > 3) malzemeKisa = malzemeKisa.slice(0, -3);
    const onlineLink = `https://www.boyner.com.tr/search?q=${encodeURIComponent(malzemeKisa)}`;

    card.innerHTML = `
      <div>
        <div class="card-title">${row[4]}</div>
        <div class="info-item"><i class="fas fa-barcode"></i> <strong>Model:</strong> ${row[5]}</div>
        <div class="info-item"><i class="fas fa-box"></i> <strong>Malzeme:</strong> ${row[6]}</div>
        <div class="info-item"><i class="fas fa-qrcode"></i> <strong>EAN/UPC:</strong> ${row[7]}</div>
        <div class="info-item"><i class="fas fa-user"></i> <strong>Müşteri:</strong> ${row[8]}</div>
        <div class="info-item">
          <i class="fas fa-warehouse me-1"></i>
          <strong class="me-2">SAS:</strong> ${row[9]}
          <div class="checkbox-group ms-2">${checkboxHTML}</div>
        </div>
        <div class="info-item"><i class="fas fa-cubes"></i> <strong>Stok:</strong> ${row[10]}</div>
        <div class="info-item"><i class="fas fa-file-alt"></i> <strong>İş Emri:</strong> ${row[11]}</div>
      </div>
      <a href="${onlineLink}" target="_blank" class="online-btn">Online</a>
    `;

    const checkboxes = card.querySelectorAll("input[type='checkbox']");
    const allCheckedOnLoad = checkboxes.length > 0 && Array.from(checkboxes).every(cb => cb.checked);

    if (allCheckedOnLoad && sasCount > 0) {
      card.classList.add("completed");

      const badge = document.createElement("div");
      badge.className = "countdown-badge";
      badge.textContent = "3";
      card.appendChild(badge);

      let count = 3;
      const intervalId = setInterval(() => {
        count--;
        if (count > 0) {
          badge.textContent = count;
        } else {
          clearInterval(intervalId);
          badge.remove();
        }
      }, 1000);
    }

    checkboxes.forEach(checkbox => {
      checkbox.addEventListener("change", () => {
        const saved = JSON.parse(localStorage.getItem("checkedBoxes") || "{}");
        saved[checkbox.id] = checkbox.checked;
        localStorage.setItem("checkedBoxes", JSON.stringify(saved));

        const allChecked = Array.from(checkboxes).every(cb => cb.checked);

        if (allChecked && sasCount > 0) {
          card.classList.add("completed");

          let badge = card.querySelector(".countdown-badge");
          if (!badge) {
            badge = document.createElement("div");
            badge.className = "countdown-badge";
            card.appendChild(badge);
          }

          if (card._intervalId) clearInterval(card._intervalId);

          let count = 3;
          badge.textContent = count;

          card._intervalId = setInterval(() => {
            count--;
            if (count > 0) {
              badge.textContent = count;
            } else {
              clearInterval(card._intervalId);
              badge.style.opacity = "0";
              setTimeout(() => badge.remove(), 300);
            }
          }, 1000);

        } else {
          card.classList.remove("completed");
          const badge = card.querySelector(".countdown-badge");
          if (badge) badge.remove();
          if (card._intervalId) clearInterval(card._intervalId);
        }
      });
    });

    col.appendChild(card);
    cardContainer.appendChild(col);
  });
}

// Sayfa yüklendiğinde veriyi yükle ve modalı göster
window.addEventListener('load', () => {
  loadData();
});

// Sayfanın üstüne ve sonuna git butonları
const scrollTopBtn = document.getElementById('scrollTopBtn');
const scrollBottomBtn = document.getElementById('scrollBottomBtn');

scrollTopBtn.addEventListener('click', () => {
  window.scrollTo({top: 0, behavior: 'smooth'});
});

scrollBottomBtn.addEventListener('click', () => {
  window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
});
</script>
</body>
</html>
