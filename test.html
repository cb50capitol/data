<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transfer Listesi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f2f5;
      padding: 1rem;
      font-family: "Segoe UI", sans-serif;
    }
    h1 {
      font-size: 1.8rem;
    }
    #filterInfo {
      font-style: italic;
      color: #6c757d;
      margin-bottom: 1rem;
      cursor: pointer;
    }
    .card-alt {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 1.5rem;
      transition: all 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .card-alt:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }
    .card-alt.completed {
      border-color: #198754;
      background-color: #d1e7dd;
      position: relative;
    }
    .countdown-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #198754;
      color: white;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 14px;
      user-select: none;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .card-title {
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 1rem;
      color: #0d6efd;
    }
    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
      color: #333;
      flex-wrap: wrap;
    }
    .info-item i {
      width: 20px;
      text-align: center;
      color: #0d6efd;
      margin-right: 8px;
    }
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: 10px;
    }
    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }
    .col-custom {
      padding: 0.5rem;
    }
    .card-container {
      display: flex;
      flex-wrap: wrap;
      margin: -0.5rem;
    }
    .online-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
      transition: background-color 0.3s ease;
      margin-top: 15px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .online-btn:hover {
      background-color: #218838;
      color: white;
      text-decoration: none;
    }
    @media (min-width: 576px) {
      .col-custom { width: 50%; }
    }
    @media (max-width: 575.98px) {
      .col-custom { width: 100%; }
    }
    .scroll-arrow {
      position: fixed;
      right: 10px;
      background: rgba(0,0,0,0.1);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      cursor: pointer;
      opacity: 0.3;
      z-index: 9999;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      transition: background 0.3s, color 0.3s, opacity 0.4s;
    }
    .scroll-arrow:hover {
      background: rgba(0,0,0,0.3);
      color: #0d6efd;
      opacity: 1;
    }
    #scrollBottomBtn { bottom: 10px; }
    #scrollTopBtn { bottom: 60px; }
    .scroll-arrow i { font-size: 20px; }
    /* Breadcrumb-like filter path styling */
    #filterPath {
      font-size: 14px;
      color: #0d6efd;
      margin-bottom: 1rem;
      user-select: none;
    }
    #filterPath span {
      cursor: pointer;
      text-decoration: underline;
    }
    #filterPath span:not(:last-child)::after {
      content: " > ";
      color: #6c757d;
      text-decoration: none;
    }
  </style>
</head>
<body>

<div class="container mt-4">
  <h1>Transfer Listesi</h1>
  <div id="filterPath"></div>
  <div id="filterInfo" title="Filtreyi değiştir">Filtre seçilmedi</div>
  <div class="card-container" id="cardContainer"></div>
</div>

<div class="modal fade" id="filterModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="filterForm">
        <div class="modal-header"><h5 class="modal-title">Filtre Seçimi</h5></div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="transfer">Transfer Listesi</label>
            <select id="transfer" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="kategori">Kategori</label>
            <select id="kategori" class="form-select" required></select>
          </div>
          <div class="mb-3" id="altKategoriContainer" style="display: none;">
            <label for="altKategori">Alt Kategori</label>
            <select id="altKategori" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label for="marka">Marka</label>
            <select id="marka" class="form-select" required></select>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" id="clearStorageBtn" class="btn btn-danger">Geçmişi Temizle</button>
          <button type="submit" class="btn btn-primary">Filtrele</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="scrollTopBtn" class="scroll-arrow"><i class="fas fa-chevron-up"></i></div>
<div id="scrollBottomBtn" class="scroll-arrow"><i class="fas fa-chevron-down"></i></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  let data = [];
  const transferSelect = document.getElementById('transfer');
  const kategoriSelect = document.getElementById('kategori');
  const altKategoriSelect = document.getElementById('altKategori');
  const altKategoriContainer = document.getElementById('altKategoriContainer');
  const markaSelect = document.getElementById('marka');
  const cardContainer = document.getElementById('cardContainer');
  const filterModal = new bootstrap.Modal(document.getElementById('filterModal'));
  const filterInfoDiv = document.getElementById('filterInfo');
  const clearStorageBtn = document.getElementById('clearStorageBtn');
  const filterPathDiv = document.getElementById('filterPath');

  // Parseliyor ve satırı dizi olarak döndürüyor
  function parseTSVLine(line) {
    return line.split('\t').map(cell => cell.trim());
  }

  // test.txt dosyasını yükleyip global data dizisine atıyor
  async function loadData() {
    try {
      const resp = await fetch('test.txt');
      const text = await resp.text();
      const lines = text.split('\n').filter(l => l.trim());
      lines.shift(); // Başlık satırını atla
      data = lines.map(parseTSVLine);
      // Transfer ve kategori doldur
      populateSelect(transferSelect, [...new Set(data.map(r => r[0]))]);
      populateSelect(kategoriSelect, [...new Set(data.map(r => r[1]))]);
      populateSelect(markaSelect, [...new Set(data.map(r => r[4]))]);
      loadFiltersFromStorage();
      filterModal.show();
    } catch (e) {
      alert('Veri yüklenirken hata oluştu: ' + e.message);
    }
  }

  // Seçilen elemanları seçeneğe ekliyor
  function populateSelect(selectElement, items) {
    selectElement.innerHTML = '<option value="">Seçiniz</option>';
    items.forEach(i => {
      const option = document.createElement('option');
      option.value = i;
      option.textContent = i;
      selectElement.appendChild(option);
    });
  }

  // Filtreleme işlemi
  function filterData(transfer, kategori, altKategori, marka) {
    return data.filter(row => {
      if (transfer && row[0] !== transfer) return false;
      if (kategori && row[1] !== kategori) return false;
      if (altKategori && altKategoriContainer.style.display !== 'none' && row[2] !== altKategori) return false;
      if (marka && row[4] !== marka) return false;
      return true;
    });
  }

  // Kartları oluşturup gösteriyor
  function renderCards(filtered) {
    cardContainer.innerHTML = '';
    if(filtered.length === 0) {
      cardContainer.innerHTML = '<p>Hiç kayıt bulunamadı.</p>';
      return;
    }
    filtered.forEach(item => {
      // item dizisinin elemanları: 0-Transfer,1-Kategori,2-AltKategori,3-Bilgi,4-Marka,5-Fiyat,6-Süreç,7-URL
      const col = document.createElement('div');
      col.className = 'col-custom';
      const card = document.createElement('div');
      card.className = 'card-alt';
      // Başlık
      const title = document.createElement('div');
      title.className = 'card-title';
      title.textContent = `${item[1]} > ${item[2] ? item[2] : ''}`.trim();
      card.appendChild(title);

      // Bilgi satırları
      const infoList = [
        { icon: 'fa-list', text: `Transfer: ${item[0]}` },
        { icon: 'fa-tag', text: `Marka: ${item[4]}` },
        { icon: 'fa-money-bill-wave', text: `Fiyat: ${item[5]}` },
        { icon: 'fa-clock', text: `Süreç: ${item[6]}` }
      ];
      infoList.forEach(info => {
        const div = document.createElement('div');
        div.className = 'info-item';
        div.innerHTML = `<i class="fas ${info.icon}"></i>${info.text}`;
        card.appendChild(div);
      });

      // Online link butonu
      if(item[7]) {
        const link = document.createElement('a');
        link.href = item[7];
        link.target = '_blank';
        link.className = 'online-btn';
        link.textContent = 'Online Git';
        card.appendChild(link);
      }

      // Tamamlandı butonu ve geri sayım
      const completeBtn = document.createElement('button');
      completeBtn.textContent = 'Tamamlandı';
      completeBtn.className = 'btn btn-success mt-3';
      completeBtn.style.alignSelf = 'flex-start';
      card.appendChild(completeBtn);

      completeBtn.addEventListener('click', () => {
        if(card.classList.contains('completed')) return;
        card.classList.add('completed');
        completeBtn.disabled = true;

        let countdown = 3;
        const badge = document.createElement('div');
        badge.className = 'countdown-badge';
        badge.textContent = countdown;
        card.appendChild(badge);

        const interval = setInterval(() => {
          countdown--;
          if (countdown > 0) {
            badge.textContent = countdown;
          } else {
            clearInterval(interval);
            badge.remove();
            // Kartı sona taşı
            cardContainer.appendChild(col);
            completeBtn.disabled = false;
            card.classList.remove('completed');
          }
        }, 1000);
      });

      col.appendChild(card);
      cardContainer.appendChild(col);
    });
  }

  // LocalStorage'dan filtreleri yükle
  function loadFiltersFromStorage() {
    const stored = localStorage.getItem('filterSettings');
    if(stored) {
      const filters = JSON.parse(stored);
      if(filters.transfer) transferSelect.value = filters.transfer;
      if(filters.kategori) kategoriSelect.value = filters.kategori;
      if(filters.altKategori) altKategoriSelect.value = filters.altKategori;
      if(filters.marka) markaSelect.value = filters.marka;
      handleAltKategoriVisibility();
      updateFilterPath();
    }
  }

  // LocalStorage'a filtreleri kaydet
  function saveFiltersToStorage(filters) {
    localStorage.setItem('filterSettings', JSON.stringify(filters));
  }

  // Alt kategori filtresinin görünürlüğünü ayarla
  function handleAltKategoriVisibility() {
    if(kategoriSelect.value === 'Shoes & Bags') {
      // Alt kategori seçeneklerini doldur (3. sütun) sadece "Shoes & Bags" kategorisindekiler
      const altKategorilerSet = new Set();
      data.forEach(r => {
        if(r[1] === 'Shoes & Bags' && r[2]) altKategorilerSet.add(r[2]);
      });
      const altKategoriler = Array.from(altKategorilerSet);
      if(altKategoriler.length) {
        populateSelect(altKategoriSelect, altKategoriler);
        altKategoriContainer.style.display = 'block';
      } else {
        altKategoriContainer.style.display = 'none';
        altKategoriSelect.innerHTML = '';
      }
    } else {
      altKategoriContainer.style.display = 'none';
      altKategoriSelect.innerHTML = '';
    }
  }

  // Filtre yolunu güncelle (breadcrumb-like)
  function updateFilterPath() {
    const t = transferSelect.value;
    const k = kategoriSelect.value;
    const a = altKategoriSelect.value;
    const m = markaSelect.value;

    if(!t && !k && !a && !m) {
      filterPathDiv.textContent = 'Filtre seçilmedi';
      filterInfoDiv.style.display = 'inline-block';
      return;
    }

    filterInfoDiv.style.display = 'none';
    const parts = [];
    if(t) parts.push({label: t, type: 'transfer'});
    if(k) parts.push({label: k, type: 'kategori'});
    if(a) parts.push({label: a, type: 'altKategori'});
    if(m) parts.push({label: m, type: 'marka'});

    filterPathDiv.innerHTML = '';
    parts.forEach((part, idx) => {
      const span = document.createElement('span');
      span.textContent = part.label;
      span.dataset.type = part.type;
      span.style.userSelect = 'none';
      span.addEventListener('click', () => {
        // Tıklanan kısmın ve sağdaki tüm filtreleri temizle
        const types = ['transfer', 'kategori', 'altKategori', 'marka'];
        const index = types.indexOf(part.type);
        // Sadece bu tipe kadar filtreyi tut diğerlerini temizle
        types.forEach((tp, i) => {
          if(i > index) {
            if(tp === 'transfer') transferSelect.value = '';
            else if(tp === 'kategori') kategoriSelect.value = '';
            else if(tp === 'altKategori') altKategoriSelect.value = '';
            else if(tp === 'marka') markaSelect.value = '';
          }
        });
        // Eğer altKategoriContainer görünürse, tekrar gizle/göster
        handleAltKategoriVisibility();
        applyFilter();
        filterModal.show();
      });
      filterPathDiv.appendChild(span);
    });
  }

  // Filtre uygula ve sonuçları göster
  function applyFilter() {
    const transfer = transferSelect.value;
    const kategori = kategoriSelect.value;
    const altKategori = altKategoriSelect.value;
    const marka = markaSelect.value;

    const filtered = filterData(transfer, kategori, altKategori, marka);
    renderCards(filtered);

    // Filtre yolunu güncelle
    updateFilterPath();

    // LocalStorage kaydet
    saveFiltersToStorage({transfer, kategori, altKategori, marka});
  }

  // Scroll butonları
  const scrollTopBtn = document.getElementById('scrollTopBtn');
  const scrollBottomBtn = document.getElementById('scrollBottomBtn');

  scrollTopBtn.addEventListener('click', () => {
    window.scrollTo({top: 0, behavior: 'smooth'});
  });
  scrollBottomBtn.addEventListener('click', () => {
    window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
  });

  // Eventler
  kategoriSelect.addEventListener('change', () => {
    handleAltKategoriVisibility();
  });

  filterInfoDiv.addEventListener('click', () => {
    filterModal.show();
  });

  clearStorageBtn.addEventListener('click', () => {
    if(confirm('Filtre geçmişini temizlemek istediğinize emin misiniz?')) {
      localStorage.removeItem('filterSettings');
      transferSelect.value = '';
      kategoriSelect.value = '';
      altKategoriSelect.value = '';
      markaSelect.value = '';
      altKategoriContainer.style.display = 'none';
      renderCards(data);
      filterPathDiv.textContent = 'Filtre seçilmedi';
      filterInfoDiv.style.display = 'inline-block';
      filterModal.hide();
    }
  });

  document.getElementById('filterForm').addEventListener('submit', e => {
    e.preventDefault();
    // Alt kategori gösteriliyorsa seçili değilse temizle
    if(altKategoriContainer.style.display === 'none') {
      altKategoriSelect.value = '';
    }
    applyFilter();
    filterModal.hide();
  });

  // Sayfa yüklendiğinde veri yükle ve açılışta modal göster
  window.addEventListener('load', () => {
    loadData();
  });
</script>

</body>
</html>
