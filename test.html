<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transfer Listesi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f2f5;
      padding: 1rem;
      font-family: "Segoe UI", sans-serif;
    }

    h1 {
      font-size: 1.8rem;
    }

    #filterInfo {
      display: inline-block;
      background-color: #e9ecef;
      color: #0d6efd;
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 1rem;
      transition: background-color 0.2s ease;
    }

    #filterInfo:hover {
      background-color: #dbe2ea;
    }

    .card-alt {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 1.5rem;
      transition: all 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .card-alt:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }

    .card-alt.completed {
      border-color: #198754;
      background-color: #d1e7dd;
      position: relative;
    }

    .countdown-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #198754;
      color: white;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 14px;
      user-select: none;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .card-title {
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 1rem;
      color: #0d6efd;
    }

    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
      color: #333;
      flex-wrap: wrap;
    }

    .info-item i {
      width: 20px;
      text-align: center;
      color: #0d6efd;
      margin-right: 8px;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: 10px;
    }

    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }

    .col-custom {
      padding: 0.5rem;
    }

    .card-container {
      display: flex;
      flex-wrap: wrap;
      margin: -0.5rem;
    }

    .online-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
      transition: background-color 0.3s ease;
      margin-top: 15px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .online-btn:hover {
      background-color: #218838;
      color: white;
      text-decoration: none;
    }

    @media (min-width: 576px) {
      .col-custom {
        width: 50%;
      }
    }

    @media (max-width: 575.98px) {
      .col-custom {
        width: 100%;
      }
    }

    .scroll-arrow {
      position: fixed;
      right: 10px;
      background: rgba(0,0,0,0.1);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, opacity 0.4s;
      opacity: 0.3;
      z-index: 9999;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .scroll-arrow:hover {
      background: rgba(0,0,0,0.3);
      color: #0d6efd;
      opacity: 1;
    }

    #scrollBottomBtn {
      bottom: 10px;
    }

    #scrollTopBtn {
      bottom: 60px;
    }

    .scroll-arrow i {
      font-size: 20px;
    }
  </style>
</head>
<body>

<div class="container mt-4">
  <h1>Transfer Listesi</h1>
  <div id="filterInfo"></div>
  <div class="card-container" id="cardContainer"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="filterForm">
        <div class="modal-header">
          <h5 class="modal-title" id="filterModalLabel">Filtre Seçimi</h5>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="transfer" class="form-label">Transfer Listesi</label>
            <select id="transfer" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="kategori" class="form-label">Kategori</label>
            <select id="kategori" class="form-select" required></select>
          </div>
          <div class="mb-3 d-none" id="altKategoriWrapper">
            <label for="altKategori" class="form-label">Alt Kategori</label>
            <select id="altKategori" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label for="marka" class="form-label">Marka</label>
            <select id="marka" class="form-select" required></select>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" id="clearStorageBtn" class="btn btn-danger">Geçmişi Temizle</button>
          <button type="submit" class="btn btn-primary">Filtrele</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Temizleme Onay Modal -->
<div class="modal fade" id="clearConfirmModal" tabindex="-1" aria-labelledby="clearConfirmModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-danger">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="clearConfirmModalLabel"><i class="fas fa-exclamation-triangle me-2"></i> Onay Gerekiyor</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div class="modal-body text-center">
        <p class="fs-5">Geçmişi temizlemek istediğinizden emin misiniz?</p>
        <img src="https://cdn-icons-png.flaticon.com/512/564/564619.png" alt="Uyarı" style="width:80px; opacity:0.6; margin-bottom: 15px;">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
        <button type="button" id="confirmClearBtn" class="btn btn-danger">Evet, temizle</button>
      </div>
    </div>
  </div>
</div>

<div id="scrollTopBtn" class="scroll-arrow" title="Sayfanın üstüne git">
  <i class="fas fa-chevron-up"></i>
</div>
<div id="scrollBottomBtn" class="scroll-arrow" title="Sayfanın sonuna git">
  <i class="fas fa-chevron-down"></i>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let data = [];

const transferSelect = document.getElementById('transfer');
const kategoriSelect = document.getElementById('kategori');
const altKategoriSelect = document.getElementById('altKategori');
const markaSelect = document.getElementById('marka');
const cardContainer = document.getElementById('cardContainer');
const filterModal = new bootstrap.Modal(document.getElementById('filterModal'));
const filterInfoDiv = document.getElementById('filterInfo');
const clearStorageBtn = document.getElementById('clearStorageBtn');
const altKategoriWrapper = document.getElementById('altKategoriWrapper');

const clearConfirmModal = new bootstrap.Modal(document.getElementById('clearConfirmModal'));
const confirmClearBtn = document.getElementById('confirmClearBtn');

filterInfoDiv.addEventListener('click', () => {
  filterModal.show();
});

function parseTSVLine(line) {
  return line.split('\t').map(cell => cell.trim());
}

async function loadData() {
  try {
    const response = await fetch('test.txt');
    if (!response.ok) throw new Error('test.txt dosyası okunamadı');
    const text = await response.text();
    const lines = text.split('\n').filter(l => l.trim().length > 0);
    lines.shift();
    data = lines.map(parseTSVLine);
    populateSelect(transferSelect, [...new Set(data.map(row => row[0]))]);
    filterModal.show();
  } catch (error) {
    alert('Veri yüklenirken hata oluştu: ' + error.message);
  }
}

function populateSelect(selectElement, items) {
  selectElement.innerHTML = '<option value="">Seçiniz</option>';
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item;
    opt.textContent = item;
    selectElement.appendChild(opt);
  });
}

transferSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const categories = data.filter(row => row[0] === selectedTransfer).map(row => row[1]);
  populateSelect(kategoriSelect, [...new Set(categories)]);
  markaSelect.innerHTML = "";
  altKategoriSelect.innerHTML = "";
  altKategoriWrapper.classList.add("d-none");
});

kategoriSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;

  if (!selectedKategori) {
    altKategoriWrapper.classList.add("d-none");
    altKategoriSelect.innerHTML = "";
    markaSelect.innerHTML = "";
    return;
  }

  // Alt kategori varsa veride varsa göster
  const altKats = data
    .filter(row => row[0] === selectedTransfer && row[1] === selectedKategori)
    .map(row => row[2])
    .filter(alt => alt && alt !== '-');

  if (altKats.length > 0) {
    populateSelect(altKategoriSelect, [...new Set(altKats)]);
    altKategoriWrapper.classList.remove("d-none");
  } else {
    altKategoriWrapper.classList.add("d-none");
    altKategoriSelect.innerHTML = "";
  }

  // Marka listesi
  let filtered = data.filter(row => row[0] === selectedTransfer && row[1] === selectedKategori);
  if (altKategoriSelect.value) {
    filtered = filtered.filter(row => row[2] === altKategoriSelect.value);
  }
  const markas = filtered.map(row => row[3]);
  populateSelect(markaSelect, [...new Set(markas)]);
});

altKategoriSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const selectedAltKategori = altKategoriSelect.value;

  let filtered = data.filter(row => row[0] === selectedTransfer && row[1] === selectedKategori);
  if (selectedAltKategori) {
    filtered = filtered.filter(row => row[2] === selectedAltKategori);
  }
  const markas = filtered.map(row => row[3]);
  populateSelect(markaSelect, [...new Set(markas)]);
});

document.getElementById('filterForm').addEventListener('submit', (e) => {
  e.preventDefault();
  filterModal.hide();

  const transfer = transferSelect.value;
  const kategori = kategoriSelect.value;
  const altKategori = altKategoriSelect.value;
  const marka = markaSelect.value;

  if (!transfer || !kategori || !marka) {
    alert('Lütfen tüm zorunlu alanları seçiniz.');
    return;
  }

  const filteredData = data.filter(row => {
    return row[0] === transfer &&
           row[1] === kategori &&
           (altKategoriWrapper.classList.contains('d-none') || row[2] === altKategori) &&
           row[3] === marka;
  });

  localStorage.setItem('lastFilter', JSON.stringify({ transfer, kategori, altKategori, marka }));

  filterInfoDiv.textContent = `Son filtre: ${transfer} / ${kategori}` +
    (altKategoriWrapper.classList.contains('d-none') ? '' : ` / ${altKategori}`) +
    ` / ${marka}`;

  renderCards(filteredData);
});

function renderCards(filteredData) {
  cardContainer.innerHTML = '';

  if (filteredData.length === 0) {
    cardContainer.innerHTML = '<p class="text-center text-muted">Filtreye uygun veri bulunamadı.</p>';
    return;
  }

  filteredData.forEach(row => {
    const [transfer, kategori, altKategori, marka, fiyat, link, tarih] = row;

    // Tarih alanı "dd/mm/yyyy" formatında olabilir
    const now = new Date();
    let deadline = null;
    if (tarih) {
      const parts = tarih.split('/');
      if(parts.length === 3){
        deadline = new Date(+parts[2], parts[1] - 1, +parts[0]);
      }
    }

    let remainingDays = null;
    if (deadline) {
      const diffMs = deadline.getTime() - now.getTime();
      remainingDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
    }

    const card = document.createElement('div');
    card.className = 'col-custom';

    const cardContent = document.createElement('div');
    cardContent.className = 'card-alt';
    if (remainingDays !== null && remainingDays <= 0) {
      cardContent.classList.add('completed');
    }

    const title = document.createElement('h5');
    title.className = 'card-title';
    title.textContent = `${transfer} - ${kategori} ${altKategori ? ('/ ' + altKategori) : ''}`;

    cardContent.appendChild(title);

    // Bilgiler
    const infoItems = [
      { icon: 'fa-tag', label: 'Marka:', value: marka },
      { icon: 'fa-money-bill-wave', label: 'Fiyat:', value: fiyat ? fiyat + ' ₺' : '-' },
      { icon: 'fa-calendar-days', label: 'Tarih:', value: tarih || '-' }
    ];

    infoItems.forEach(item => {
      const div = document.createElement('div');
      div.className = 'info-item';
      div.innerHTML = `<i class="fas ${item.icon}"></i> <strong>${item.label}</strong> ${item.value}`;
      cardContent.appendChild(div);
    });

    // Link butonu
    if(link){
      const linkBtn = document.createElement('a');
      linkBtn.className = 'online-btn';
      linkBtn.href = link;
      linkBtn.target = '_blank';
      linkBtn.textContent = 'Detaya Git';
      cardContent.appendChild(linkBtn);
    }

    // Gün sayısı (deadline)
    if (remainingDays !== null) {
      const badge = document.createElement('div');
      badge.className = 'countdown-badge';
      badge.textContent = remainingDays > 0 ? `${remainingDays} gün kaldı` : 'Süre doldu';
      cardContent.appendChild(badge);
    }

    card.appendChild(cardContent);
    cardContainer.appendChild(card);
  });
}

// Sayfa yüklendiğinde son filtre varsa otomatik yükle
window.addEventListener('load', () => {
  loadData().then(() => {
    const lastFilter = JSON.parse(localStorage.getItem('lastFilter'));
    if (lastFilter) {
      transferSelect.value = lastFilter.transfer || '';
      transferSelect.dispatchEvent(new Event('change'));
      setTimeout(() => {
        kategoriSelect.value = lastFilter.kategori || '';
        kategoriSelect.dispatchEvent(new Event('change'));
        setTimeout(() => {
          altKategoriSelect.value = lastFilter.altKategori || '';
          altKategoriSelect.dispatchEvent(new Event('change'));
          setTimeout(() => {
            markaSelect.value = lastFilter.marka || '';
            markaSelect.dispatchEvent(new Event('change'));
            document.getElementById('filterForm').dispatchEvent(new Event('submit'));
          }, 200);
        }, 200);
      }, 200);
    } else {
      filterModal.show();
    }
  });
});

clearStorageBtn.addEventListener('click', () => {
  clearConfirmModal.show();
});

confirmClearBtn.addEventListener('click', () => {
  localStorage.clear();
  location.reload();
});

document.getElementById('scrollTopBtn').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('scrollBottomBtn').addEventListener('click', () => {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
});
</script>
</body>
</html>
