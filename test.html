<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title># Liste</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body { background-color: #f0f2f5; padding: 1rem; font-family: "Segoe UI", sans-serif; }
    h1 { font-size: 1.8rem; }
    #filterInfo {
      display: inline-block;
      background-color: #e9ecef;
      color: #0d6efd;
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 1rem;
      transition: background-color 0.2s ease;
    }
    #filterInfo:hover { background-color: #dbe2ea; }
    .card-alt {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 1.5rem;
      transition: all 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .card-alt:hover { box-shadow: 0 4px 14px rgba(0,0,0,0.1); }
    .card-alt.completed {
      border-color: #198754;
      background-color: #d1e7dd;
      position: relative;
    }
    .countdown-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #198754;
      color: white;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 14px;
      user-select: none;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .card-title {
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 1rem;
      color: #0d6efd;
    }
    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
      color: #333;
      flex-wrap: wrap;
    }
    .info-item i {
      width: 20px;
      text-align: center;
      color: #0d6efd;
      margin-right: 8px;
    }
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: 10px;
    }
    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }
    .col-custom { padding: 0.5rem; }
    .card-container {
      display: flex;
      flex-wrap: wrap;
      margin: -0.5rem;
    }
    .online-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
      transition: background-color 0.3s ease;
      margin-top: 15px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .online-btn:hover {
      background-color: #218838;
      color: white;
      text-decoration: none;
    }
    @media (min-width: 576px) {
      .col-custom { width: 50%; }
    }
    @media (max-width: 575.98px) {
      .col-custom { width: 100%; }
    }
    .scroll-arrow {
      position: fixed;
      right: 10px;
      background: rgba(0,0,0,0.1);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, opacity 0.4s;
      opacity: 0.3;
      z-index: 9999;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .scroll-arrow:hover {
      background: rgba(0,0,0,0.3);
      color: #0d6efd;
      opacity: 1;
    }
    #scrollBottomBtn { bottom: 10px; }
    #scrollTopBtn { bottom: 60px; }
    .scroll-arrow i { font-size: 20px; }
  </style>
</head>
<body>

<div class="container mt-4">
  <h1># Liste</h1>
  <div id="filterInfo">Filtre Seç</div>
  <div class="card-container" id="cardContainer"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="filterForm">
        <div class="modal-header">
          <h5 class="modal-title" id="filterModalLabel">Filtre Seçimi</h5>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="transfer" class="form-label">Transfer Listesi</label>
            <select id="transfer" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="kategori" class="form-label">Kategori</label>
            <select id="kategori" class="form-select" required></select>
          </div>
          <div class="mb-3" id="altKategoriGroup" style="display: none;">
            <label for="altKategori" class="form-label">Alt Kategori</label>
            <select id="altKategori" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="marka" class="form-label">Marka</label>
            <select id="marka" class="form-select" required></select>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" id="clearStorageBtn" class="btn btn-danger">Geçmişi Temizle</button>
          <button type="submit" class="btn btn-primary">Filtrele</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div id="scrollTopBtn" class="scroll-arrow" title="Sayfanın üstüne git"><i class="fas fa-chevron-up"></i></div>
<div id="scrollBottomBtn" class="scroll-arrow" title="Sayfanın sonuna git"><i class="fas fa-chevron-down"></i></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let data = [];
const transferSelect = document.getElementById('transfer');
const kategoriSelect = document.getElementById('kategori');
const altKategoriSelect = document.getElementById('altKategori');
const altKategoriGroup = document.getElementById('altKategoriGroup');
const markaSelect = document.getElementById('marka');
const cardContainer = document.getElementById('cardContainer');
const filterModal = new bootstrap.Modal(document.getElementById('filterModal'));
const filterInfoDiv = document.getElementById('filterInfo');
const clearStorageBtn = document.getElementById('clearStorageBtn');

filterInfoDiv.addEventListener('click', () => filterModal.show());

function parseTSVLine(line) {
  return line.split('\t').map(cell => cell.trim());
}

function triggerSelectChange(selectElement) {
  const event = new Event('change');
  selectElement.dispatchEvent(event);
}

async function loadData() {
  try {
    const response = await fetch('test.txt');
    if (!response.ok) throw new Error('test.txt dosyası okunamadı');
    const text = await response.text();
    const lines = text.split('\n').filter(l => l.trim().length > 0);
    lines.shift();
    data = lines.map(parseTSVLine);
    populateSelect(transferSelect, [...new Set(data.map(row => row[0]))]);

    // İlk transfer seçeneğini otomatik seç ve change event tetikle
    if (transferSelect.options.length > 1) {
      transferSelect.selectedIndex = 1; // "Seçiniz" sonrası ilk seçenek
      triggerSelectChange(transferSelect);

      // Eğer kategori dolduysa ilkini seç ve değişiklik eventi tetikle
      if (kategoriSelect.options.length > 1) {
        kategoriSelect.selectedIndex = 1;
        triggerSelectChange(kategoriSelect);
      }
    }

    filterModal.show();
  } catch (error) {
    alert('Veri yüklenirken hata oluştu: ' + error.message);
  }
}

function populateSelect(select, items) {
  select.innerHTML = '<option value="">Seçiniz</option>';
  items.forEach(item => {
    const option = document.createElement('option');
    option.value = item;
    option.textContent = item;
    select.appendChild(option);
  });
}

transferSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  if (!selectedTransfer) {
    kategoriSelect.innerHTML = '<option value="">Seçiniz</option>';
    altKategoriSelect.innerHTML = '<option value="">Seçiniz</option>';
    markaSelect.innerHTML = '<option value="">Seçiniz</option>';
    altKategoriGroup.style.display = 'none';
    return;
  }
  const categories = [...new Set(data.filter(row => row[0] === selectedTransfer).map(row => row[1]))];
  populateSelect(kategoriSelect, categories);
  altKategoriGroup.style.display = 'none';
  altKategoriSelect.innerHTML = '<option value="">Seçiniz</option>';
  markaSelect.innerHTML = '<option value="">Seçiniz</option>';
});

kategoriSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  if (!selectedKategori) {
    altKategoriGroup.style.display = 'none';
    altKategoriSelect.innerHTML = '<option value="">Seçiniz</option>';
    markaSelect.innerHTML = '<option value="">Seçiniz</option>';
    return;
  }

  // Eğer kategori "Shoes & Bags" ise alt kategori göster ve doldur
  if (selectedKategori === 'Shoes & Bags') {
    altKategoriGroup.style.display = 'block';
    const altKategoriler = [...new Set(data.filter(row => row[0] === selectedTransfer && row[1] === selectedKategori).map(row => row[2]))];
    populateSelect(altKategoriSelect, altKategoriler);
    markaSelect.innerHTML = '<option value="">Seçiniz</option>';
  } else {
    altKategoriGroup.style.display = 'none';
    altKategoriSelect.innerHTML = '<option value="">Seçiniz</option>';
    // Marka select için filtre sadece transfer ve kategori ile
    const markalar = [...new Set(data.filter(row => row[0] === selectedTransfer && row[1] === selectedKategori).map(row => row[3]))];
    populateSelect(markaSelect, markalar);
  }
});

altKategoriSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const selectedAltKategori = altKategoriSelect.value;
  if (!selectedAltKategori) {
    markaSelect.innerHTML = '<option value="">Seçiniz</option>';
    return;
  }
  const markalar = [...new Set(data.filter(row => row[0] === selectedTransfer && row[1] === selectedKategori && row[2] === selectedAltKategori).map(row => row[3]))];
  populateSelect(markaSelect, markalar);
});

document.getElementById('filterForm').addEventListener('submit', e => {
  e.preventDefault();
  const transferVal = transferSelect.value;
  const kategoriVal = kategoriSelect.value;
  const altKategoriVal = altKategoriSelect.value;
  const markaVal = markaSelect.value;

  if (!transferVal || !kategoriVal || !markaVal) {
    alert('Lütfen tüm gerekli filtreleri seçiniz.');
    return;
  }

  filterModal.hide();

  let filteredData;
  if (kategoriVal === 'Shoes & Bags') {
    if (!altKategoriVal) {
      alert('Lütfen alt kategori seçiniz.');
      return;
    }
    filteredData = data.filter(row =>
      row[0] === transferVal &&
      row[1] === kategoriVal &&
      row[2] === altKategoriVal &&
      row[3] === markaVal
    );
  } else {
    filteredData = data.filter(row =>
      row[0] === transferVal &&
      row[1] === kategoriVal &&
      row[3] === markaVal
    );
  }

  displayCards(filteredData);
  updateFilterInfo(transferVal, kategoriVal, altKategoriVal, markaVal);
});

clearStorageBtn.addEventListener('click', () => {
  localStorage.clear();
  alert('Geçmiş temizlendi.');
});

function displayCards(filteredData) {
  cardContainer.innerHTML = '';
  if (filteredData.length === 0) {
    cardContainer.innerHTML = '<p>Sonuç bulunamadı.</p>';
    return;
  }

  filteredData.forEach(row => {
    // Örnek veriye göre dizinler değişebilir
    // row = [transfer, kategori, altKategori, marka, tarih, fiyat, durum, link, vb...]
    const [transfer, kategori, altKategori, marka, tarih, fiyat, durum, link] = row;

    const col = document.createElement('div');
    col.className = 'col-custom mb-3';

    const card = document.createElement('div');
    card.className = 'card-alt';
    if (durum && durum.toLowerCase() === 'tamamlandı') {
      card.classList.add('completed');
    }

    let countdownText = '';
    if (tarih) {
      const targetDate = new Date(tarih);
      const now = new Date();
      const diff = targetDate - now;
      if (diff > 0) {
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        countdownText = `${days} gün kaldı`;
      }
    }

    if (countdownText) {
      const badge = document.createElement('div');
      badge.className = 'countdown-badge';
      badge.textContent = countdownText;
      card.appendChild(badge);
    }

    const title = document.createElement('h5');
    title.className = 'card-title';
    title.textContent = `${kategori} > ${marka}${altKategori ? ' > ' + altKategori : ''}`;

    const infoList = document.createElement('div');

    const infoItems = [
      { icon: 'fa-calendar', label: 'Tarih', value: tarih },
      { icon: 'fa-tag', label: 'Fiyat', value: fiyat },
      { icon: 'fa-check-circle', label: 'Durum', value: durum },
    ];

    infoItems.forEach(({icon, label, value}) => {
      if (!value) return;
      const item = document.createElement('div');
      item.className = 'info-item';
      item.innerHTML = `<i class="fas ${icon}"></i><strong>${label}:</strong>&nbsp;${value}`;
      infoList.appendChild(item);
    });

    card.appendChild(title);
    card.appendChild(infoList);

    if (link) {
      const btn = document.createElement('a');
      btn.className = 'online-btn';
      btn.href = link;
      btn.target = '_blank';
      btn.rel = 'noopener noreferrer';
      btn.textContent = 'Online Görüntüle';
      card.appendChild(btn);
    }

    col.appendChild(card);
    cardContainer.appendChild(col);
  });
}

function updateFilterInfo(transfer, kategori, altKategori, marka) {
  let text = `${transfer} > ${kategori}`;
  if (altKategori) text += ` > ${altKategori}`;
  text += ` > ${marka}`;
  filterInfoDiv.textContent = text;
}

document.getElementById('scrollTopBtn').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('scrollBottomBtn').addEventListener('click', () => {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
});

// Sayfa yüklendiğinde veriyi çek ve filtre modalını aç
window.addEventListener('DOMContentLoaded', loadData);
</script>

</body>
</html>
