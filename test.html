<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transfer Listesi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f0f2f5;
      padding: 1rem;
      font-family: "Segoe UI", sans-serif;
    }
    h1 {
      font-size: 1.8rem;
    }
    #filterInfo {
      display: inline-block;
      background-color: #e9ecef;
      color: #0d6efd;
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      font-weight: 500;
      margin-bottom: 1rem;
      transition: background-color 0.2s ease;
    }
    #filterInfo:hover {
      background-color: #dbe2ea;
    }
    .card-alt {
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #dee2e6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 1.5rem;
      transition: all 0.3s ease;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .card-alt:hover {
      box-shadow: 0 4px 14px rgba(0,0,0,0.1);
    }
    .card-alt.completed {
      border-color: #198754;
      background-color: #d1e7dd;
      position: relative;
    }
    .countdown-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #198754;
      color: white;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 14px;
      user-select: none;
      pointer-events: none;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .card-title {
      font-weight: 600;
      font-size: 17px;
      margin-bottom: 1rem;
      color: #0d6efd;
    }
    .info-item {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      font-size: 15px;
      color: #333;
      flex-wrap: wrap;
    }
    .info-item i {
      width: 20px;
      text-align: center;
      color: #0d6efd;
      margin-right: 8px;
    }
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-left: 10px;
    }
    input[type="checkbox"] {
      transform: scale(1.2);
      cursor: pointer;
    }
    .col-custom {
      padding: 0.5rem;
    }
    .card-container {
      display: flex;
      flex-wrap: wrap;
      margin: -0.5rem;
    }
    .online-btn {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      align-self: flex-start;
      transition: background-color 0.3s ease;
      margin-top: 15px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    .online-btn:hover {
      background-color: #218838;
      color: white;
      text-decoration: none;
    }
    @media (min-width: 576px) {
      .col-custom {
        width: 50%;
      }
    }
    @media (max-width: 575.98px) {
      .col-custom {
        width: 100%;
      }
    }
    .scroll-arrow {
      position: fixed;
      right: 10px;
      background: rgba(0,0,0,0.1);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      cursor: pointer;
      transition: background 0.3s, color 0.3s, opacity 0.4s;
      opacity: 0.3;
      z-index: 9999;
      user-select: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .scroll-arrow:hover {
      background: rgba(0,0,0,0.3);
      color: #0d6efd;
      opacity: 1;
    }
    #scrollBottomBtn {
      bottom: 10px;
    }
    #scrollTopBtn {
      bottom: 60px;
    }
    .scroll-arrow i {
      font-size: 20px;
    }
  </style>
</head>
<body>

<div class="container mt-4">
  <h1>Transfer Listesi</h1>
  <div id="filterInfo"></div>
  <div class="card-container" id="cardContainer"></div>
</div>

<!-- Modal -->
<div class="modal fade" id="filterModal" tabindex="-1" aria-labelledby="filterModalLabel" aria-hidden="true" data-bs-backdrop="static">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="filterForm">
        <div class="modal-header">
          <h5 class="modal-title" id="filterModalLabel">Filtre Seçimi</h5>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="transfer" class="form-label">Transfer Listesi</label>
            <select id="transfer" class="form-select" required></select>
          </div>
          <div class="mb-3">
            <label for="kategori" class="form-label">Kategori</label>
            <select id="kategori" class="form-select" required></select>
          </div>
          <div class="mb-3 d-none" id="altKategoriWrapper">
            <label for="altKategori" class="form-label">Alt Kategori</label>
            <select id="altKategori" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label for="marka" class="form-label">Marka</label>
            <select id="marka" class="form-select" required></select>
          </div>
        </div>
        <div class="modal-footer d-flex justify-content-between">
          <button type="button" id="clearStorageBtn" class="btn btn-danger">Geçmişi Temizle</button>
          <button type="submit" class="btn btn-primary">Filtrele</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Confirm Clear Modal -->
<div class="modal fade" id="confirmClearModal" tabindex="-1" aria-labelledby="confirmClearModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title" id="confirmClearModalLabel">Emin misiniz?</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div class="modal-body">
        Geçmişi temizlemek istediğinizden emin misiniz? Bu işlem geri alınamaz.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">İptal</button>
        <button type="button" class="btn btn-danger" id="confirmClearBtn">Evet, Temizle</button>
      </div>
    </div>
  </div>
</div>

<div id="scrollTopBtn" class="scroll-arrow" title="Sayfanın üstüne git">
  <i class="fas fa-chevron-up"></i>
</div>
<div id="scrollBottomBtn" class="scroll-arrow" title="Sayfanın sonuna git">
  <i class="fas fa-chevron-down"></i>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
let data = [];

const transferSelect = document.getElementById('transfer');
const kategoriSelect = document.getElementById('kategori');
const altKategoriSelect = document.getElementById('altKategori');
const markaSelect = document.getElementById('marka');
const cardContainer = document.getElementById('cardContainer');
const filterModal = new bootstrap.Modal(document.getElementById('filterModal'));
const filterInfoDiv = document.getElementById('filterInfo');
const clearStorageBtn = document.getElementById('clearStorageBtn');

const confirmClearModal = new bootstrap.Modal(document.getElementById('confirmClearModal'));
const confirmClearBtn = document.getElementById('confirmClearBtn');

const altKategoriWrapper = document.getElementById('altKategoriWrapper');

filterInfoDiv.addEventListener('click', () => {
  filterModal.show();
});

function parseTSVLine(line) {
  return line.split('\t').map(cell => cell.trim());
}

async function loadData() {
  try {
    const response = await fetch('test.txt');
    if (!response.ok) throw new Error('test.txt dosyası okunamadı');
    const text = await response.text();
    const lines = text.split('\n').filter(l => l.trim().length > 0);
    lines.shift();
    data = lines.map(parseTSVLine);
    populateSelect(transferSelect, [...new Set(data.map(row => row[0]))]);
    filterModal.show();
  } catch (error) {
    alert('Veri yüklenirken hata oluştu: ' + error.message);
  }
}

function populateSelect(selectElement, items) {
  selectElement.innerHTML = '<option value="">Seçiniz</option>';
  items.forEach(item => {
    const opt = document.createElement('option');
    opt.value = item;
    opt.textContent = item;
    selectElement.appendChild(opt);
  });
}

transferSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const categories = data.filter(row => row[0] === selectedTransfer).map(row => row[1]);
  populateSelect(kategoriSelect, [...new Set(categories)]);
  markaSelect.innerHTML = "";
  altKategoriSelect.innerHTML = "";
  altKategoriWrapper.classList.add("d-none");
});

kategoriSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;

  const rows = data.filter(row => row[0] === selectedTransfer && row[1] === selectedKategori);

  if (selectedKategori === "Shoes & Bags") {
    const altKategoriler = [...new Set(rows.map(row => row[2]))];
    populateSelect(altKategoriSelect, altKategoriler);
    altKategoriWrapper.classList.remove("d-none");
    markaSelect.innerHTML = "";
  } else {
    altKategoriWrapper.classList.add("d-none");
    altKategoriSelect.innerHTML = "";
    const markalar = [...new Set(rows.map(row => row[3]))];
    populateSelect(markaSelect, markalar);
  }
});

altKategoriSelect.addEventListener('change', () => {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const selectedAltKategori = altKategoriSelect.value;

  const rows = data.filter(row => row[0] === selectedTransfer && row[1] === selectedKategori && row[2] === selectedAltKategori);
  const markalar = [...new Set(rows.map(row => row[3]))];
  populateSelect(markaSelect, markalar);
});

document.getElementById('filterForm').addEventListener('submit', e => {
  e.preventDefault();
  displayFilteredCards();
  filterModal.hide();
});

function displayFilteredCards() {
  const selectedTransfer = transferSelect.value;
  const selectedKategori = kategoriSelect.value;
  const selectedAltKategori = altKategoriWrapper.classList.contains("d-none") ? null : altKategoriSelect.value;
  const selectedMarka = markaSelect.value;

  const filtered = data.filter(row => {
    if (row[0] !== selectedTransfer) return false;
    if (row[1] !== selectedKategori) return false;
    if (!altKategoriWrapper.classList.contains("d-none") && row[2] !== selectedAltKategori) return false;
    if (row[3] !== selectedMarka) return false;
    return true;
  });

  cardContainer.innerHTML = "";

  if(filtered.length === 0){
    cardContainer.innerHTML = '<div class="text-center text-muted">Seçilen filtreye uygun kayıt bulunamadı.</div>';
    filterInfoDiv.textContent = "";
    return;
  }

  filtered.forEach(row => {
    const card = createCard(row);
    cardContainer.appendChild(card);
  });

  updateFilterInfo(selectedTransfer, selectedKategori, selectedAltKategori, selectedMarka);
}

function createCard(row) {
  // row: [Transfer, Kategori, AltKategori, Marka, Barcode, StartDate, EndDate, Price, StoreUrl]

  const [transfer, kategori, altKategori, marka, barcode, startDate, endDate, price, storeUrl] = row;

  const col = document.createElement('div');
  col.className = 'col-custom';

  const card = document.createElement('div');
  card.className = 'card-alt';

  const now = new Date();
  const end = new Date(endDate);
  const diffMs = end - now;
  const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

  if(diffDays < 0){
    card.classList.add('completed');
  }

  // Countdown badge
  const badge = document.createElement('div');
  badge.className = 'countdown-badge';
  if(diffDays < 0){
    badge.textContent = 'SÜRE DOLDU';
  } else if(diffDays === 0){
    badge.textContent = 'SON GÜN';
  } else {
    badge.textContent = diffDays + ' gün';
  }
  card.appendChild(badge);

  // Title
  const title = document.createElement('div');
  title.className = 'card-title';
  title.textContent = `${transfer} - ${kategori}`;
  card.appendChild(title);

  // Info list
  const infoItems = [
    {icon: 'fa-barcode', label: `Barkod: ${barcode}`},
    {icon: 'fa-calendar-day', label: `Başlangıç: ${startDate}`},
    {icon: 'fa-calendar-check', label: `Bitiş: ${endDate}`},
    {icon: 'fa-tag', label: `Fiyat: ${price}`},
    {icon: 'fa-store', label: `Mağaza:`}
  ];

  infoItems.forEach(({icon, label}) => {
    const div = document.createElement('div');
    div.className = 'info-item';
    div.innerHTML = `<i class="fas ${icon}"></i><span>${label}</span>`;
    card.appendChild(div);
  });

  // Store link button
  const storeBtn = document.createElement('a');
  storeBtn.href = storeUrl;
  storeBtn.target = '_blank';
  storeBtn.rel = 'noopener noreferrer';
  storeBtn.className = 'online-btn';
  storeBtn.textContent = 'Mağaza Sayfası';
  card.appendChild(storeBtn);

  col.appendChild(card);
  return col;
}

function updateFilterInfo(t, k, altK, m) {
  let text = `Seçilen filtre: ${t} / ${k}`;
  if (altK) text += ` / ${altK}`;
  text += ` / ${m}`;
  filterInfoDiv.textContent = text;
}

// Scroll buttons
const scrollTopBtn = document.getElementById('scrollTopBtn');
const scrollBottomBtn = document.getElementById('scrollBottomBtn');

scrollTopBtn.addEventListener('click', () => {
  window.scrollTo({top: 0, behavior: 'smooth'});
});
scrollBottomBtn.addEventListener('click', () => {
  window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
});

clearStorageBtn.addEventListener('click', () => {
  confirmClearModal.show();
});

confirmClearBtn.addEventListener('click', () => {
  localStorage.clear();
  location.reload();
});

loadData();
</script>

</body>
</html>
