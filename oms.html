<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orta Alan OCR</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      text-align: center;
    }

    #container {
      position: relative;
      max-width: 100%;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }

    #scan-area {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300px;
      height: 100px;
      transform: translate(-50%, -50%);
      border: 3px solid red;
      border-radius: 8px;
      box-sizing: border-box;
      pointer-events: none;
    }

    #toggle-camera {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      padding: 10px 16px;
      font-size: 16px;
    }

    #code-table {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: white;
      border-collapse: collapse;
      z-index: 5;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      font-size: 14px;
    }

    th {
      background: #eee;
    }
  </style>
</head>
<body>

<button id="toggle-camera">Kamerayı Aç</button>

<div id="container">
  <video id="video" autoplay playsinline></video>
  <div id="scan-area"></div>
  <canvas id="canvas" style="display:none;"></canvas>
</div>

<table id="code-table">
  <thead>
    <tr><th>#</th><th>Kod</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.1/dist/tesseract.min.js"></script>
<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scanArea = document.getElementById('scan-area');
  const tableBody = document.querySelector('#code-table tbody');
  const toggleBtn = document.getElementById('toggle-camera');

  let stream = null;
  let isCameraOn = false;
  const addedCodes = new Set();

  toggleBtn.onclick = async () => {
    if (isCameraOn) {
      stream.getTracks().forEach(track => track.stop());
      video.srcObject = null;
      isCameraOn = false;
      toggleBtn.textContent = 'Kamerayı Aç';
    } else {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        isCameraOn = true;
        toggleBtn.textContent = 'Kamerayı Kapat';

        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        };
      } catch (err) {
        alert('Kamera açılamadı: ' + err.message);
      }
    }
  };

  // Dokununca tarama başlat
  video.addEventListener('click', async () => {
    if (!isCameraOn) return;

    const videoRect = video.getBoundingClientRect();
    const scanRect = scanArea.getBoundingClientRect();

    const scaleX = video.videoWidth / videoRect.width;
    const scaleY = video.videoHeight / videoRect.height;

    const x = (scanRect.left - videoRect.left) * scaleX;
    const y = (scanRect.top - videoRect.top) * scaleY;
    const width = scanRect.width * scaleX;
    const height = scanRect.height * scaleY;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(x, y, width, height);

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = width;
    tempCanvas.height = height;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.putImageData(imageData, 0, 0);

    const result = await Tesseract.recognize(tempCanvas, 'eng');
    const matches = result.data.text.match(/\b500\d{10}\b/g);

    if (matches) {
      matches.forEach(code => {
        if (!addedCodes.has(code)) {
          addedCodes.add(code);
          const row = tableBody.insertRow();
          row.insertCell().textContent = tableBody.rows.length;
          row.insertCell().textContent = code;
        }
      });
    } else {
      alert("Kod bulunamadı. Kodu net şekilde kutuya denk getirdiğinizden emin olun.");
    }
  });
</script>

</body>
</html>
