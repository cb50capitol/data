<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seçim Alanı ile OCR</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f4f4f4;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    #container {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin-bottom: 20px;
    }

    video, canvas {
      width: 100%;
      border-radius: 8px;
      display: block;
    }

    canvas.overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: auto;
      touch-action: none;
    }

    #code-table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #eee;
    }
  </style>
</head>
<body>

<button id="toggle-camera">Kamerayı Aç</button>

<div id="container">
  <video id="video" autoplay playsinline></video>
  <canvas id="overlay" class="overlay"></canvas>
</div>

<h3>Okunan Kodlar</h3>
<table id="code-table">
  <thead>
    <tr><th>#</th><th>Kod</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.1/dist/tesseract.min.js"></script>
<script>
  const toggleBtn = document.getElementById('toggle-camera');
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const ctx = overlay.getContext('2d');
  const tableBody = document.querySelector('#code-table tbody');

  let stream = null;
  let isCameraOn = false;
  let startX, startY, endX, endY;
  let isDrawing = false;
  const addedCodes = new Set();

  // Kamera Aç / Kapat
  toggleBtn.onclick = async () => {
    if (isCameraOn) {
      stream.getTracks().forEach(track => track.stop());
      video.srcObject = null;
      isCameraOn = false;
      toggleBtn.textContent = 'Kamerayı Aç';
      ctx.clearRect(0, 0, overlay.width, overlay.height);
    } else {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        isCameraOn = true;
        toggleBtn.textContent = 'Kamerayı Kapat';

        video.onloadedmetadata = () => {
          overlay.width = video.videoWidth;
          overlay.height = video.videoHeight;
        };
      } catch (e) {
        alert('Kamera açılamadı: ' + e.message);
      }
    }
  };

  function getRelativeCoords(e) {
    const rect = overlay.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return { x, y };
  }

  overlay.addEventListener('pointerdown', (e) => {
    if (!isCameraOn) return;
    isDrawing = true;
    const pos = getRelativeCoords(e);
    startX = pos.x;
    startY = pos.y;
  });

  overlay.addEventListener('pointermove', (e) => {
    if (!isDrawing) return;
    const pos = getRelativeCoords(e);
    endX = pos.x;
    endY = pos.y;

    ctx.clearRect(0, 0, overlay.width, overlay.height);
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 2;
    ctx.strokeRect(startX, startY, endX - startX, endY - startY);
  });

  overlay.addEventListener('pointerup', async (e) => {
    if (!isDrawing) return;
    isDrawing = false;

    const x = Math.min(startX, endX);
    const y = Math.min(startY, endY);
    const w = Math.abs(endX - startX);
    const h = Math.abs(endY - startY);

    ctx.clearRect(0, 0, overlay.width, overlay.height);

    if (w < 10 || h < 10) return;

    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    tempCanvas.width = w;
    tempCanvas.height = h;

    tempCtx.drawImage(video, x, y, w, h, 0, 0, w, h);

    const result = await Tesseract.recognize(tempCanvas, 'eng');
    const matches = result.data.text.match(/\b500\d{10}\b/g);

    if (matches) {
      matches.forEach(code => {
        if (!addedCodes.has(code)) {
          addedCodes.add(code);
          const row = tableBody.insertRow();
          row.insertCell().textContent = tableBody.rows.length;
          row.insertCell().textContent = code;
        }
      });
    } else {
      alert("Geçerli kod bulunamadı.");
    }
  });
</script>

</body>
</html>
