<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barkod & Malzeme Numarası</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background: #f9f9f9;
      text-align: center;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      margin: 10px 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      background: #999;
    }
    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      margin: 10px 0;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background: #007bff;
      color: white;
    }
  </style>
</head>
<body>

  <h2>📦 Barkod & Malzeme Okuma</h2>
  <button id="startCamera">📷 Kamera Aç</button>
  <button id="capture" disabled>📸 Fotoğraf Çek</button>
  <br>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <table>
    <thead>
      <tr>
        <th>Barkod</th>
        <th>Malzeme No</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>

<script>
  const startBtn = document.getElementById("startCamera");
  const captureBtn = document.getElementById("capture");
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const results = document.getElementById("results");

  let stream;

  // Kamera başlat
  startBtn.addEventListener("click", async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream;
      captureBtn.disabled = false;
    } catch (err) {
      alert("Kamera açılamadı: " + err);
    }
  });

  // Fotoğraf çek ve OCR ile tara
  captureBtn.addEventListener("click", async () => {
    const context = canvas.getContext("2d");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0);

    const { data: { text } } = await Tesseract.recognize(canvas, 'eng');
    console.log("OCR sonucu:", text);

    // Sadece 10+ haneli sayıları çekelim
    const numbers = text.match(/\d{10,}/g) || [];

    // Çift çift al (barkod, malzeme no)
    for (let i = 0; i < numbers.length; i += 2) {
      const barkod = numbers[i] || "";
      const malzeme = numbers[i+1] || "";
      const row = `<tr><td>${barkod}</td><td>${malzeme}</td></tr>`;
      results.insertAdjacentHTML("beforeend", row);
    }
  });
</script>

</body>
</html>
