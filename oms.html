<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kod Tanıma</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f4f4f4;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      margin-bottom: 16px;
    }

    video, canvas {
      width: 100%;
      max-width: 100%;
      display: block;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    #detected-codes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .code-box {
      background-color: #ff4d4d;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .code-box.confirmed {
      background-color: #28a745;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>

  <button id="start-camera">Kamera Aç</button>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <h3>Algılanan Kodlar</h3>
  <div id="detected-codes"></div>

  <h3>Onaylanan Kodlar</h3>
  <table id="code-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Kod</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.1/dist/tesseract.min.js"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const detectedContainer = document.getElementById('detected-codes');
    const tableBody = document.querySelector('#code-table tbody');

    const seenCodes = new Set();
    const confirmedCodes = new Set();

    document.getElementById('start-camera').onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;

        setInterval(async () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const { data: { text } } = await Tesseract.recognize(canvas, 'eng');
          const matches = text.match(/\b500\d{2,}\b/g);

          if (matches) {
            matches.forEach(code => {
              if (!seenCodes.has(code)) {
                seenCodes.add(code);
                const codeBox = document.createElement('div');
                codeBox.className = 'code-box';
                codeBox.textContent = code;

                codeBox.onclick = () => {
                  if (!confirmedCodes.has(code)) {
                    confirmedCodes.add(code);
                    codeBox.classList.add('confirmed');

                    const row = tableBody.insertRow();
                    row.insertCell().textContent = tableBody.rows.length;
                    row.insertCell().textContent = code;
                  }
                };

                detectedContainer.appendChild(codeBox);
              }
            });
          }
        }, 3000);
      } catch (err) {
        alert('Kameraya erişilemedi: ' + err.message);
      }
    };
  </script>

</body>
</html>
