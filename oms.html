<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barkod & Malzeme Tarama</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background: #f9f9f9;
      text-align: center;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      margin: 10px 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    #camera-container {
      position: relative;
      display: inline-block;
    }
    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      border: 2px solid #007bff;
    }
    .box {
      position: absolute;
      border: 2px solid red;
      pointer-events: auto;
    }
    .box.selected {
      border: 2px solid green;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background: #007bff;
      color: white;
    }
    pre {
      text-align: left;
      background: #eee;
      padding: 10px;
      max-height: 200px;
      overflow: auto;
      margin-top: 15px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <h2>📦 Barkod & Malzeme Tarayıcı</h2>
  <button id="startCamera">📷 Kamera Aç</button>

  <div id="camera-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <table>
    <thead>
      <tr>
        <th>Barkod</th>
        <th>Malzeme No</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>

  <h3>🔍 OCR Debug Çıktısı</h3>
  <pre id="ocrDebug">Henüz tarama yapılmadı...</pre>

<script>
  const startBtn = document.getElementById("startCamera");
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const results = document.getElementById("results");
  const cameraContainer = document.getElementById("camera-container");
  const ocrDebug = document.getElementById("ocrDebug");

  let stream;
  let scanning = false;

  startBtn.addEventListener("click", async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream;
      scanning = true;
      startScanning();
    } catch (err) {
      alert("Kamera açılamadı: " + err.name + " - " + err.message);
    }
  });

  async function startScanning() {
    if (!scanning) return;

    // Video görüntüsünü canvas'a kopyala
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    // OCR yap
    const { data: { text, words } } = await Tesseract.recognize(canvas, 'eng');
    console.log("OCR:", text);
    ocrDebug.innerText = text;  // debug paneline yaz

    // Önceki kutuları sil
    document.querySelectorAll(".box").forEach(b => b.remove());

    const rect = video.getBoundingClientRect();

    // Kutuları oluştur
    words.forEach(word => {
      if (/^\d{6,}$/.test(word.text)) {  // 6 haneli ve üzeri sayılar
        const box = document.createElement("div");
        box.className = "box";

        // koordinatları video boyutuna göre ölçekle
        box.style.left = (rect.left + (word.bbox.x0 / canvas.width * rect.width)) + "px";
        box.style.top = (rect.top + (word.bbox.y0 / canvas.height * rect.height)) + "px";
        box.style.width = ((word.bbox.x1 - word.bbox.x0) / canvas.width * rect.width) + "px";
        box.style.height = ((word.bbox.y1 - word.bbox.y0) / canvas.height * rect.height) + "px";

        box.dataset.number = word.text;

        box.addEventListener("click", () => {
          box.classList.add("selected");

          // tabloya ekle
          const lastRow = results.lastElementChild;
          if (!lastRow || lastRow.cells[1].innerText !== "") {
            // yeni satır
            const row = `<tr><td>${word.text}</td><td></td></tr>`;
            results.insertAdjacentHTML("beforeend", row);
          } else {
            // malzeme no olarak ekle
            lastRow.cells[1].innerText = word.text;
          }
        });

        cameraContainer.appendChild(box);
      }
    });

    // 2 saniye sonra tekrar tara
    setTimeout(startScanning, 2000);
  }
</script>

</body>
</html>
