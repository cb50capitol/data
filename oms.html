<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kod Okuma (Hızlı)</title>
  <style>
    body { margin: 0; padding: 10px; font-family: sans-serif; }
    video, canvas { width: 100%; max-width: 480px; display: block; margin-bottom: 10px; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  </style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display: none;"></canvas>

<h3>Tanımlanan Kodlar</h3>
<table id="code-table">
  <thead>
    <tr><th>#</th><th>Kod</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.1/dist/tesseract.min.js"></script>
<script>
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const tableBody = document.querySelector('#code-table tbody');
  const addedCodes = new Set();

  async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;

    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      scanLoop();
    };
  }

  async function scanLoop() {
    setInterval(async () => {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const regions = [
        { x: 60, y: 260, w: 650, h: 50 },
        { x: 60, y: 590, w: 650, h: 50 },
        { x: 60, y: 910, w: 650, h: 50 }
      ];

      for (let region of regions) {
        const regionCanvas = document.createElement('canvas');
        regionCanvas.width = region.w;
        regionCanvas.height = region.h;

        const rCtx = regionCanvas.getContext('2d');
        rCtx.drawImage(canvas, region.x, region.y, region.w, region.h, 0, 0, region.w, region.h);

        const result = await Tesseract.recognize(regionCanvas, 'eng');
        const matches = result.data.text.match(/\b500\d{10}\b/g);

        if (matches) {
          matches.forEach(code => {
            if (!addedCodes.has(code)) {
              addedCodes.add(code);
              const row = tableBody.insertRow();
              row.insertCell().textContent = tableBody.rows.length;
              row.insertCell().textContent = code;
            }
          });
        }
      }
    }, 3000); // Her 3 saniyede bir tarama
  }

  startCamera();
</script>

</body>
</html>
