<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Kamera ile Kod Okuma</title>
  <style>
    video, canvas {
      width: 100%;
      max-width: 400px;
      margin-bottom: 1rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 8px;
      border: 1px solid #ccc;
      text-align: center;
    }
  </style>
</head>
<body>

  <button id="start-camera">Kamera Aç</button>
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <h3>Algılanan Kodlar</h3>
  <table id="code-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Kod</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.1/dist/tesseract.min.js"></script>
  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const tableBody = document.querySelector('#code-table tbody');
    const seenCodes = new Set();

    document.getElementById('start-camera').onclick = async () => {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;

        // Periyodik olarak görüntü al ve OCR uygula
        setInterval(async () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          const { data: { text } } = await Tesseract.recognize(canvas, 'eng');
          const matches = text.match(/\b500\d{2,}\b/g); // 500 ile başlayan 5+ haneli kodları yakala

          if (matches) {
            matches.forEach(code => {
              if (!seenCodes.has(code)) {
                seenCodes.add(code);
                const row = tableBody.insertRow();
                row.insertCell().textContent = tableBody.rows.length;
                row.insertCell().textContent = code;
              }
            });
          }
        }, 3000); // Her 3 saniyede bir tarama
      } catch (err) {
        alert('Kameraya erişilemedi: ' + err.message);
      }
    };
  </script>

</body>
</html>
