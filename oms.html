<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCR Sabit Çerçeve</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      background-color: #f4f4f4;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    #container {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin-bottom: 20px;
    }

    video {
      width: 100%;
      border-radius: 8px;
      display: block;
    }

    #fixed-frame {
      position: absolute;
      border: 2px solid red;
      width: 260px;
      height: 60px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-sizing: border-box;
      z-index: 10;
    }

    .hidden {
      display: none;
    }

    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }

    #code-table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    th {
      background-color: #eee;
    }
  </style>
</head>
<body>

<button id="toggle-camera">Kamerayı Aç</button>

<div id="container">
  <video id="video" autoplay playsinline></video>
  <div id="fixed-frame" class="hidden"></div>
  <div id="overlay"></div>
</div>

<h3>Okunan Kodlar</h3>
<table id="code-table">
  <thead>
    <tr><th>#</th><th>Kod</th></tr>
  </thead>
  <tbody></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.1/dist/tesseract.min.js"></script>
<script>
  const toggleBtn = document.getElementById('toggle-camera');
  const video = document.getElementById('video');
  const overlay = document.getElementById('overlay');
  const tableBody = document.querySelector('#code-table tbody');
  const fixedFrame = document.getElementById('fixed-frame');
  const addedCodes = new Set();

  let stream = null;
  let isCameraOn = false;

  toggleBtn.onclick = async () => {
    if (isCameraOn) {
      stream.getTracks().forEach(track => track.stop());
      video.srcObject = null;
      isCameraOn = false;
      toggleBtn.textContent = 'Kamerayı Aç';
      fixedFrame.classList.add('hidden');
    } else {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        isCameraOn = true;
        toggleBtn.textContent = 'Kamerayı Kapat';
        fixedFrame.classList.remove('hidden');
      } catch (e) {
        alert('Kamera açılamadı: ' + e.message);
      }
    }
  };

  overlay.addEventListener('click', async () => {
    if (!isCameraOn) return;

    const videoRect = video.getBoundingClientRect();
    const frameRect = fixedFrame.getBoundingClientRect();

    const scaleX = video.videoWidth / videoRect.width;
    const scaleY = video.videoHeight / videoRect.height;

    const x = (frameRect.left - videoRect.left) * scaleX;
    const y = (frameRect.top - videoRect.top) * scaleY;
    const w = frameRect.width * scaleX;
    const h = frameRect.height * scaleY;

    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    tempCanvas.width = w;
    tempCanvas.height = h;

    tempCtx.drawImage(video, x, y, w, h, 0, 0, w, h);

    const result = await Tesseract.recognize(tempCanvas, 'eng');
    const matches = result.data.text.match(/\b500\d{10}\b/g);

    if (matches) {
      matches.forEach(code => {
        if (!addedCodes.has(code)) {
          addedCodes.add(code);
          const row = tableBody.insertRow();
          row.insertCell().textContent = tableBody.rows.length;
          row.insertCell().textContent = code;
        }
      });
    } else {
      alert("Geçerli kod bulunamadı.");
    }
  });
</script>

</body>
</html>
