<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>OMS</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@2.1.5/dist/tesseract.min.js"></script>
  <style>
    #drop-zone {
      border: 3px dashed #aaa;
      padding: 50px;
      text-align: center;
      margin: 20px auto;
      max-width: 600px;
      background-color: #f9f9f9;
      cursor: pointer;
      user-select: none;
    }
    #drop-zone.hover {
      border-color: #555;
      background-color: #eee;
    }
    table {
      border-collapse: collapse;
      width: 90%;
      margin: 20px auto;
    }
    table, th, td {
      border: 1px solid #aaa;
    }
    th, td {
      padding: 10px;
      text-align: center;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <h2 style="text-align:center;">SikimsonikOMS</h2>

  <div id="drop-zone">
    SİKİMSONİKRESİMLER
    <input type="file" id="fileInput" accept="image/*" style="display:none;" multiple />
  </div>

  <table id="resultsTable">
    <thead>
      <tr><th>Bulunan Kod</th><th>Kaynak Dosya</th></tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('fileInput');
  const resultsTableBody = document.querySelector('#resultsTable tbody');

  dropZone.addEventListener('click', () => fileInput.click());

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('hover');
  });

  dropZone.addEventListener('dragleave', e => {
    dropZone.classList.remove('hover');
  });

  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('hover');
    const files = Array.from(e.dataTransfer.files);
    handleFiles(files);
  });

  fileInput.addEventListener('change', e => {
    const files = Array.from(e.target.files);
    handleFiles(files);
  });

  function handleFiles(files) {
    files.forEach(file => {
      if (!file.type.startsWith('image/')) return;

      const img = new Image();
      const reader = new FileReader();

      reader.onload = () => {
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;

          ctx.drawImage(img, 0, 0);

          // Görseli gri tonlamaya çevir ve threshold uygula
          let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          let data = imageData.data;

          for (let i = 0; i < data.length; i += 4) {
            // Ortalama gri ton hesapla
            let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
            // Threshold uygulama: 150 üstü beyaz (255), altı siyah (0)
            let val = avg > 150 ? 255 : 0;
            data[i] = data[i + 1] = data[i + 2] = val;
            // Alpha kanal aynen kalsın
          }
          ctx.putImageData(imageData, 0, 0);

          // OCR işlemi
          Tesseract.recognize(
            canvas.toDataURL(),
            'eng',
            {
              logger: m => console.log(m),
              tessedit_char_whitelist: '0123456789'
            }
          ).then(({ data: { text } }) => {
            console.log('Algılanan metin:', text);
            const codes = extractCodes(text);
            if (codes.length === 0) {
              alert(file.name + ' dosyasından kod bulunamadı.');
            }
            codes.forEach(code => addRow(code, file.name));
          }).catch(err => {
            console.error('OCR hatası:', err);
          });
        };
        img.src = reader.result;
      };

      reader.readAsDataURL(file);
    });
  }

  function extractCodes(text) {
    const regex = /\b500\d{10}\b/g;
    return text.match(regex) || [];
  }

  function addRow(code, fileName) {
    const row = document.createElement('tr');
    row.innerHTML = `<td>${code}</td><td>${fileName}</td>`;
    resultsTableBody.appendChild(row);
  }
</script>

</body>
</html>
