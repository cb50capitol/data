<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barkod & Malzeme Okuma</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 10px;
      background: #f9f9f9;
      text-align: center;
    }
    h2 {
      margin-bottom: 10px;
    }
    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      margin: 10px 0;
      border: 2px solid #007bff;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: center;
    }
    th {
      background: #007bff;
      color: white;
    }
  </style>
</head>
<body>

  <h2>📦 Barkod & Malzeme Tarayıcı</h2>
  <p>Ürün kutusundaki barkod/malzeme kısmına <b>dokun</b></p>
  
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <table>
    <thead>
      <tr>
        <th>Barkod</th>
        <th>Malzeme No</th>
      </tr>
    </thead>
    <tbody id="results"></tbody>
  </table>

<script>
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const results = document.getElementById("results");

  // Kamera aç
  navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
    .then(stream => video.srcObject = stream)
    .catch(err => alert("Kamera açılamadı: " + err.name + " - " + err.message));

  // Dokunulan yerde OCR
  video.addEventListener("click", async (e) => {
    const rect = video.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    // Video'yu canvas'a çiz
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    // Dokunulan bölgeden kırpma boyutları
    const cropWidth = 250, cropHeight = 100;
    const cropX = Math.max(0, (x / rect.width) * canvas.width - cropWidth / 2);
    const cropY = Math.max(0, (y / rect.height) * canvas.height - cropHeight / 2);

    const imageData = ctx.getImageData(cropX, cropY, cropWidth, cropHeight);

    // Geçici canvas
    const tmpCanvas = document.createElement("canvas");
    tmpCanvas.width = cropWidth;
    tmpCanvas.height = cropHeight;
    tmpCanvas.getContext("2d").putImageData(imageData, 0, 0);

    // OCR
    const { data: { text } } = await Tesseract.recognize(tmpCanvas, 'eng');
    console.log("OCR sonucu:", text);

    // 10 haneli+ sayıları seç
    const numbers = text.match(/\d{10,}/g) || [];

    if (numbers.length >= 2) {
      const barkod = numbers[0];
      const malzeme = numbers[1];
      const row = `<tr><td>${barkod}</td><td>${malzeme}</td></tr>`;
      results.insertAdjacentHTML("beforeend", row);
    } else {
      alert("📵 Sayı bulunamadı, tekrar deneyin.");
    }
  });
</script>

</body>
</html>
