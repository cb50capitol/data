<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PTC + OMS</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    #videoContainer {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: auto;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: auto;
      background: black;
    }

    #laserLine {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: red;
      z-index: 10;
      animation: laserMove 1.5s infinite;
      display: none;
    }

    @keyframes laserMove {
      0% { top: 20%; }
      50% { top: 50%; }
      100% { top: 80%; }
    }

    #ocrBox {
      position: absolute;
      width: 70%;
      height: 60px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid red;
      z-index: 30;
      display: none;
      pointer-events: none;
    }

    #bottomButtons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px auto;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      background: #333;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #555;
    }

    #barcodeOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 8px;
      background: rgba(0, 0, 0, 0.6);
      text-align: center;
      font-weight: bold;
      z-index: 20;
      display: none;
    }

    #modal {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      padding: 15px 25px;
      border-radius: 5px;
      z-index: 999;
      display: none;
    }
  </style>
</head>
<body oncontextmenu="return false">
  <div id="videoContainer">
    <video id="video" autoplay muted playsinline></video>
    <div id="laserLine"></div>
    <div id="ocrBox"></div>
    <div id="barcodeOverlay"></div>
  </div>

  <div id="bottomButtons">
    <button id="scanButton">Barkod Tara</button>
    <button id="omsButton">OMS</button>
  </div>

  <div id="modal">Bildirim</div>

  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.0/dist/tesseract.min.js"></script>
  <script>
    const video = document.getElementById('video');
    const scanButton = document.getElementById('scanButton');
    const omsButton = document.getElementById('omsButton');
    const laserLine = document.getElementById('laserLine');
    const ocrBox = document.getElementById('ocrBox');
    const overlay = document.getElementById('barcodeOverlay');
    const modal = document.getElementById('modal');

    let stream;
    let scanning = false;
    let omsMode = false;

    function showLaser() {
      laserLine.style.display = 'block';
    }

    function hideLaser() {
      laserLine.style.display = 'none';
    }

    function showOverlay(text) {
      overlay.innerText = text;
      overlay.style.display = 'block';
      setTimeout(() => overlay.style.display = 'none', 2000);
    }

    function showModal(message) {
      modal.innerText = message;
      modal.style.display = 'block';
      setTimeout(() => modal.style.display = 'none', 2500);
    }

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        video.srcObject = stream;
      } catch (err) {
        showModal("Kamera başlatılamadı.");
        console.error(err);
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    }

    scanButton.addEventListener('click', async () => {
      if (scanning) {
        stopCamera();
        scanning = false;
        scanButton.textContent = 'Barkod Tara';
        hideLaser();
        return;
      }

      await startCamera();
      scanning = true;
      scanButton.textContent = 'Durdur';
      if (!omsMode) showLaser();
    });

    omsButton.addEventListener('click', async () => {
      omsMode = !omsMode;

      if (omsMode) {
        stopCamera();
        await startCamera();
        ocrBox.style.display = 'block';
        hideLaser();
        scanButton.disabled = true;
        omsButton.textContent = 'OMS (Aktif)';
        showOverlay("OCR Modu Aktif");
      } else {
        stopCamera();
        await startCamera();
        ocrBox.style.display = 'none';
        showLaser();
        scanButton.disabled = false;
        omsButton.textContent = 'OMS';
        showOverlay("OCR Modu Kapalı");
      }
    });

    video.addEventListener('click', async () => {
      if (!omsMode) return;

      const canvas = document.createElement('canvas');
      const context = canvas.getContext('2d');
      const rect = video.getBoundingClientRect();
      const ocrRect = ocrBox.getBoundingClientRect();

      const scaleX = video.videoWidth / rect.width;
      const scaleY = video.videoHeight / rect.height;

      const cropX = (ocrRect.left - rect.left) * scaleX;
      const cropY = (ocrRect.top - rect.top) * scaleY;
      const cropWidth = ocrRect.width * scaleX;
      const cropHeight = ocrRect.height * scaleY;

      canvas.width = cropWidth;
      canvas.height = cropHeight;
      context.drawImage(video, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

      showOverlay("Metin taranıyor...");

      const worker = Tesseract.createWorker();
      await worker.load();
      await worker.loadLanguage('eng');
      await worker.initialize('eng');
      const { data: { text } } = await worker.recognize(canvas);
      await worker.terminate();

      const cleaned = text.replace(/\s/g, '');
      const match = cleaned.match(/500\d{10}/);
      if (match) {
        showModal("Kod bulundu: " + match[0]);
      } else {
        showModal("Geçerli kod bulunamadı.");
      }
    });

    // Sayfa yüklendiğinde kamera başlat
    window.onload = () => {
      startCamera();
      scanning = true;
      showLaser();
    };
  </script>
</body>
</html>
