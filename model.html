<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model Arama - Minimal Kartlı Tasarım</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

  body {
    margin: 0; padding: 0;
    font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #fafafa;
    color: #333;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .container {
    max-width: 840px;
    margin: 36px auto 60px;
    padding: 0 16px;
  }
  h1 {
    text-align: center;
    font-weight: 600;
    font-size: 1.75rem;
    margin-bottom: 24px;
    color: #222;
  }
  .search-area {
    display: flex;
    max-width: 560px;
    margin: 0 auto 36px;
    gap: 10px;
  }
  input[type="text"] {
    flex-grow: 1;
    padding: 10px 16px;
    font-size: 1rem;
    border: 1.8px solid #ccc;
    border-radius: 20px;
    transition: border-color 0.25s ease;
    color: #222;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #4a90e2;
    box-shadow: 0 0 6px rgba(74,144,226,0.3);
  }
  button {
    border: none;
    border-radius: 20px;
    padding: 10px 20px;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 2px 6px rgb(0 0 0 / 0.08);
    transition: background-color 0.25s ease;
    color: white;
  }
  #searchBtn {
    background-color: #4a90e2;
  }
  #searchBtn:hover {
    background-color: #357ABD;
  }
  #clearBtn {
    background-color: #e94e4e;
  }
  #clearBtn:hover {
    background-color: #b63737;
  }

  #cardsContainer {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }

  .product-card {
    background: white;
    border-radius: 14px;
    box-shadow: 0 3px 10px rgb(0 0 0 / 0.07);
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: box-shadow 0.3s ease;
  }
  .product-card:hover {
    box-shadow: 0 6px 18px rgb(0 0 0 / 0.12);
  }
  .product-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: #222;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .product-compatibility {
    font-weight: 700;
    color: #4a90e2;
    font-size: 0.85rem;
    margin-left: 8px;
  }
  .product-desc {
    font-size: 0.9rem;
    color: #555;
    min-height: 44px;
    line-height: 1.3;
  }
  .product-meta {
    font-size: 0.85rem;
    color: #777;
  }
  .product-actions {
    margin-top: auto;
    display: flex;
    gap: 12px;
  }
  .btn-boyner, .btn-google {
    flex: 1;
    padding: 8px 0;
    border-radius: 16px;
    text-align: center;
    font-weight: 600;
    text-decoration: none;
    color: white;
    user-select: none;
    font-size: 0.9rem;
    transition: background-color 0.25s ease;
  }
  .btn-boyner {
    background-color: #e94e4e;
  }
  .btn-boyner:hover {
    background-color: #b63737;
  }
  .btn-google {
    background-color: #4a90e2;
  }
  .btn-google:hover {
    background-color: #357abd;
  }

  #noMatchMessage {
    text-align: center;
    margin-top: 44px;
    font-weight: 600;
    font-size: 1.1rem;
    color: #e94e4e;
    user-select: none;
  }
  #googleSearchBtn {
    margin-top: 14px;
    background-color: #4a90e2;
    color: white;
    border: none;
    padding: 10px 28px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 24px;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.25s ease;
  }
  #googleSearchBtn:hover {
    background-color: #357abd;
  }

  @media (max-width: 600px) {
    .search-area {
      flex-direction: column;
    }
    button, input[type="text"] {
      width: 100%;
    }
    #cardsContainer {
      grid-template-columns: 1fr;
      gap: 18px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Model Arama</h1>
  <div class="search-area">
    <input type="text" id="searchInput" placeholder="Model numarası girin..." autocomplete="off" />
    <button id="searchBtn">Ara</button>
    <button id="clearBtn">Temizle</button>
  </div>

  <div id="cardsContainer"></div>

  <div id="noMatchMessage" style="display:none;">
    Eşleşme bulunamadı
    <br />
    <button id="googleSearchBtn">Google'da Ara</button>
  </div>
</div>

<script>
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const clearBtn = document.getElementById('clearBtn');
  const cardsContainer = document.getElementById('cardsContainer');
  const noMatchMessage = document.getElementById('noMatchMessage');
  const googleSearchBtn = document.getElementById('googleSearchBtn');

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      performSearch();
    }
  });

  searchBtn.onclick = performSearch;
  clearBtn.onclick = clearSearch;

  googleSearchBtn.onclick = () => {
    const query = encodeURIComponent(searchInput.value.trim());
    if (query) {
      window.open(`https://www.google.com/search?tbm=isch&q=${query}`, '_blank', 'noopener');
    }
  };

  function performSearch() {
    const input = searchInput.value.trim().toUpperCase();
    cardsContainer.innerHTML = '';
    noMatchMessage.style.display = 'none';

    if (!input) return;

    fetch('model.txt')
      .then(res => res.text())
      .then(text => {
        const lines = text.trim().split('\n');
        const data = lines.slice(1).map(line => {
          const parts = line.split('\t');
          return {
            Model: parts[0],
            Tanım: parts[1],
            Malzeme: parts[2],
            Barkod: parts[3]
          };
        });

        const results = data.map(row => {
          const model = row.Model.toUpperCase();
          let score = 0;
          if (model === input) score = 100;
          else if (model.includes(input)) score = Math.round((input.length / model.length) * 100);
          return {...row, Uyum: score};
        }).filter(r => r.Uyum > 0);

        if (results.length) {
          results.sort((a,b) => b.Uyum - a.Uyum);

          results.forEach(row => {
            const malzemeKodu = row.Malzeme;
            const onlineKodu = malzemeKodu.slice(0, -3);
            const boynerUrl = `https://www.boyner.com.tr/search?q=${onlineKodu}`;
            const googleUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(row.Model)}`;

            const card = document.createElement('div');
            card.classList.add('product-card');
            card.innerHTML = `
              <div class="product-title">${row.Model} <span class="product-compatibility">%${row.Uyum}</span></div>
              <div class="product-desc">${row.Tanım}</div>
              <div class="product-meta"><strong>Malzeme:</strong> ${row.Malzeme}</div>
              <div class="product-meta"><strong>Barkod:</strong> ${row.Barkod}</div>
              <div class="product-actions">
                <a class="btn-boyner" href="${boynerUrl}" target="_blank" rel="noopener noreferrer">Boyner</a>
                <a class="btn-google" href="${googleUrl}" target="_blank" rel="noopener noreferrer">Google</a>
              </div>
            `;
            cardsContainer.appendChild(card);
          });
        } else {
          noMatchMessage.style.display = 'block';
        }
      })
      .catch(err => {
        console.error('Hata:', err);
      });
  }

  function clearSearch() {
    searchInput.value = '';
    cardsContainer.innerHTML = '';
    noMatchMessage.style.display = 'none';
    searchInput.focus();
  }
</script>

</body>
</html>
