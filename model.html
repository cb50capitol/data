<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Model Arama</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    input[type="text"], button {
      width: 90%;
      max-width: 400px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 800px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      font-size: 14px;
    }

    th {
      background-color: #f2f2f2;
      text-align: left;
    }

    .btn {
      padding: 6px 10px;
      color: white;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      font-size: 13px;
      display: inline-block;
      cursor: pointer;
    }

    .btn-boyner {
      background-color: #db4437;
      margin-right: 5px;
    }

    .btn-boyner:hover {
      background-color: #a33328;
    }

    .btn-google {
      background-color: #4285F4;
    }

    .btn-google:hover {
      background-color: #3367d6;
    }

    #noMatchMessage {
      margin-top: 20px;
      font-weight: bold;
      color: #555;
      text-align: center;
    }

    #googleSearchBtn {
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      table, th, td {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <input type="text" id="searchInput" placeholder="Model numarası girin...">
  <button onclick="fetchAndSearch()">Ara</button>

  <table id="resultTable" style="display:none;">
    <thead>
      <tr>
        <th>Uyum</th>
        <th>Model</th>
        <th>Tanım</th>
        <th>Malzeme</th>
        <th>Barkod</th>
        <th>Online</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="noMatchMessage" style="display:none;">
    Eşleşme bulunamadı
    <br>
    <button id="googleSearchBtn" class="btn btn-google">Google'da Ara</button>
  </div>

  <script>
    function fetchAndSearch() {
      const inputElem = document.getElementById('searchInput');
      const input = inputElem.value.trim().toUpperCase();
      const table = document.getElementById('resultTable');
      const tbody = table.querySelector('tbody');
      const noMatchDiv = document.getElementById('noMatchMessage');
      const googleBtn = document.getElementById('googleSearchBtn');

      tbody.innerHTML = '';
      table.style.display = 'none';
      noMatchDiv.style.display = 'none';

      if (input === '') return;

      fetch('model.txt')
        .then(response => response.text())
        .then(text => {
          const lines = text.trim().split('\n');
          const data = lines.slice(1).map(line => {
            const parts = line.split('\t');
            return {
              Model: parts[0],
              Tanım: parts[1],
              Malzeme: parts[2],
              Barkod: parts[3]
            };
          });

          const scoredResults = data.map(row => {
            const model = row.Model.toUpperCase();
            let matchScore = 0;

            if (model === input) {
              matchScore = 100;
            } else if (model.includes(input)) {
              matchScore = Math.round((input.length / model.length) * 100);
            }

            return { ...row, Uyum: matchScore };
          }).filter(row => row.Uyum > 0);

          if (scoredResults.length > 0) {
            scoredResults.sort((a, b) => b.Uyum - a.Uyum);

            scoredResults.forEach(row => {
              const malzemeKodu = row.Malzeme;
              const onlineKodu = malzemeKodu.slice(0, -3); // Son 3 hane silinir
              const boynerUrl = `https://www.boyner.com.tr/search?q=${onlineKodu}`;
              const googleUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(row.Model)}`;

              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td>%${row.Uyum}</td>
                <td>${row.Model}</td>
                <td>${row.Tanım}</td>
                <td>${row.Malzeme}</td>
                <td>${row.Barkod}</td>
                <td>
                  <a class="btn btn-boyner" href="${boynerUrl}" target="_blank" rel="noopener noreferrer">Boyner</a>
                  <a class="btn btn-google" href="${googleUrl}" target="_blank" rel="noopener noreferrer">Google</a>
                </td>
              `;
              tbody.appendChild(tr);
            });
            table.style.display = 'table';
          } else {
            // Eşleşme yoksa mesaj ve google butonunu göster
            noMatchDiv.style.display = 'block';

            // Google'da ara butonuna tıklayınca inputtaki kelimeyle arama aç
            googleBtn.onclick = () => {
              const query = encodeURIComponent(inputElem.value.trim());
              if (query) {
                window.open(`https://www.google.com/search?tbm=isch&q=${query}`, '_blank', 'noopener');
              }
            };
          }
        })
        .catch(error => {
          console.error('Veri alınamadı:', error);
        });
    }
  </script>

</body>
</html>
