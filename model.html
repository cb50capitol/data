<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model Arama</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #f0f4ff, #e3f2fd);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      max-width: 600px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
      padding: 30px;
    }

    h1 {
      text-align: center;
      font-size: 26px;
      margin-bottom: 30px;
      color: #1e3a8a;
    }

    .search-bar {
      position: relative;
      margin-bottom: 24px;
    }

    .search-bar input {
      width: 100%;
      padding: 14px 50px 14px 20px;
      border: 2px solid #cbd5e1;
      border-radius: 30px;
      font-size: 16px;
      transition: 0.3s ease;
    }

    .search-bar input:focus {
      outline: none;
      border-color: #60a5fa;
      box-shadow: 0 0 8px rgba(96,165,250,0.3);
    }

    .search-bar svg {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      fill: #60a5fa;
      pointer-events: none;
    }

    .results {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #f9fafb;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.03);
      transition: 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }

    .model {
      font-weight: 600;
      font-size: 18px;
      color: #1f2937;
    }

    .description, .material, .barcode {
      font-size: 14px;
      color: #4b5563;
    }

    .score {
      font-size: 13px;
      font-weight: bold;
      color: #3b82f6;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 30px;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: 0.3s ease;
    }

    .btn-boyner {
      background: #fde68a;
      color: #92400e;
    }

    .btn-google {
      background: #a7f3d0;
      color: #065f46;
    }

    #noMatchMessage {
      text-align: center;
      margin-top: 20px;
      font-size: 16px;
      font-weight: 600;
      color: #ef4444;
    }

    #googleSearchBtn {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      background-color: #3b82f6;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Model Arama</h1>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Model numarası yazın..." />
      <svg viewBox="0 0 24 24">
        <path d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1010 16a6.5 6.5 0 005.43-2.84l.27.28v.79l5 5L20.49 19l-5-5zM10 14a4 4 0 110-8 4 4 0 010 8z"/>
      </svg>
    </div>

    <div id="results" class="results"></div>

    <div id="noMatchMessage" style="display:none;">
      Eşleşme bulunamadı<br>
      <button id="googleSearchBtn">Google'da Ara</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('searchInput');
    const results = document.getElementById('results');
    const noMatch = document.getElementById('noMatchMessage');
    const googleBtn = document.getElementById('googleSearchBtn');

    input.addEventListener('input', performSearch);

    function performSearch() {
      const value = input.value.trim().toUpperCase();
      results.innerHTML = '';
      noMatch.style.display = 'none';

      if (!value) return;

      fetch('model.txt')
        .then(res => res.text())
        .then(text => {
          const lines = text.trim().split('\n');
          const data = lines.slice(1).map(line => {
            const [Model, Tanım, Malzeme, Barkod] = line.split('\t');
            return { Model, Tanım, Malzeme, Barkod };
          });

          const matched = data.map(row => {
            const score = row.Model.toUpperCase() === value
              ? 100
              : row.Model.toUpperCase().includes(value)
                ? Math.round((value.length / row.Model.length) * 100)
                : 0;
            return { ...row, Uyum: score };
          }).filter(r => r.Uyum > 0);

          if (matched.length) {
            matched.sort((a, b) => b.Uyum - a.Uyum);
            matched.forEach(row => {
              const onlineCode = row.Malzeme.slice(0, -3);
              const boyner = `https://www.boyner.com.tr/search?q=${onlineCode}`;
              const google = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(row.Model)}`;

              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                <div class="score">Uyum: %${row.Uyum}</div>
                <div class="model">${row.Model}</div>
                <div class="description">${row.Tanım}</div>
                <div class="material">Malzeme: ${row.Malzeme}</div>
                <div class="barcode">Barkod: ${row.Barkod}</div>
                <div class="btn-group">
                  <a class="btn btn-boyner" href="${boyner}" target="_blank">Boyner</a>
                  <a class="btn btn-google" href="${google}" target="_blank">Google</a>
                </div>
              `;
              results.appendChild(card);
            });
          } else {
            noMatch.style.display = 'block';
            googleBtn.onclick = () => {
              window.open(`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(value)}`, '_blank');
            };
          }
        });
    }
  </script>
</body>
</html>
