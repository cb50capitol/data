<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model Arama</title>
<style>
  /* Temel sıfırlama ve font */
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f7f8fa;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 15px 80px;
    color: #2e3a59;
  }

  .container {
    width: 100%;
    max-width: 620px;
    background: #ffffff;
    padding: 30px 24px 48px;
    border-radius: 16px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  h1 {
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 14px 0;
    color: #344767;
    text-align: center;
    letter-spacing: 0.02em;
  }

  /* Arama alanı ve butonlar */
  .search-area {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .input-wrapper {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin-bottom: 14px;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 44px 12px 18px;
    font-size: 1rem;
    border: 1.5px solid #cbd5e1;
    border-radius: 22px;
    color: #344767;
    transition: border-color 0.3s ease;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #7f9cf5;
    box-shadow: 0 0 8px rgba(127,156,245,0.5);
  }

  .input-wrapper button#inputSearchBtn {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    padding: 0;
    cursor: pointer;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .input-wrapper button#inputSearchBtn svg {
    fill: #7f9cf5;
    width: 20px;
    height: 20px;
    transition: fill 0.25s ease;
  }
  .input-wrapper button#inputSearchBtn:hover svg {
    fill: #5a78d6;
  }

  .button-group {
    display: flex;
    gap: 16px;
    justify-content: center;
    width: 100%;
    max-width: 560px;
  }
  .button-group button {
    flex: 1;
    padding: 12px 0;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
  }
  #searchBtn {
    background-color: #a3bffa; /* pastel mavi */
    color: #344767;
  }
  #searchBtn:hover {
    background-color: #7f9cf5;
    box-shadow: 0 6px 12px rgba(127,156,245,0.45);
    color: white;
  }
  #clearBtn {
    background-color: #f4cccc; /* pastel kırmızı/pembe */
    color: #76332e;
  }
  #clearBtn:hover {
    background-color: #e79a95;
    box-shadow: 0 6px 12px rgba(231,154,149,0.45);
    color: white;
  }

  /* Kartlar için container */
  #results {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(280px,1fr));
    gap: 16px;
  }

  .card {
    background: #fefefe;
    border-radius: 14px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.07);
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: box-shadow 0.3s ease;
  }
  .card:hover {
    box-shadow: 0 10px 20px rgba(127,156,245,0.3);
  }

  .card .score {
    font-weight: 700;
    font-size: 14px;
    color: #7f9cf5;
  }
  .card .model {
    font-weight: 700;
    font-size: 20px;
    color: #344767;
  }
  .card .description {
    font-size: 14px;
    color: #556680;
  }
  .card .material,
  .card .barcode {
    font-size: 13px;
    color: #94a3b8;
  }
  .btn-group {
    display: flex;
    gap: 10px;
    margin-top: auto;
  }
  .btn {
    flex: 1;
    padding: 8px 0;
    border-radius: 14px;
    font-weight: 600;
    font-size: 14px;
    text-align: center;
    text-decoration: none;
    user-select: none;
    cursor: pointer;
    transition: background-color 0.3s ease;
    color: white;
  }
  .btn-boyner {
    background-color: #d04f48;
  }
  .btn-boyner:hover {
    background-color: #b03e3a;
  }
  .btn-google {
    background-color: #6486d4;
  }
  .btn-google:hover {
    background-color: #506fc1;
  }

  /* Eşleşme yok mesajı */
  #noMatchMessage {
    text-align: center;
    color: #d04f48;
    font-weight: 700;
    font-size: 18px;
    margin-top: 20px;
    user-select: none;
  }
  #googleSearchBtn {
    margin-top: 16px;
    background-color: #6486d4;
    color: white;
    border: none;
    padding: 12px 28px;
    font-size: 17px;
    font-weight: 700;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(100,134,212,0.6);
    transition: background-color 0.3s ease, box-shadow 0.3s ease;
  }
  #googleSearchBtn:hover {
    background-color: #506fc1;
    box-shadow: 0 8px 24px rgba(80,111,193,0.8);
  }

  /* Responsive */
  @media (max-width: 480px) {
    .button-group {
      gap: 12px;
    }
    .btn-group {
      flex-direction: column;
      gap: 10px;
    }
  }
</style>
</head>
<body>

  <div class="container">
    <h1>Model Arama</h1>

    <div class="search-area">
      <div class="input-wrapper">
        <input type="text" id="searchInput" placeholder="Model numarası girin..." autocomplete="off" />
        <button id="inputSearchBtn" aria-label="Ara" title="Ara">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16a6.471 6.471 0 004.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zM10 14a4 4 0 110-8 4 4 0 010 8z"/>
          </svg>
        </button>
      </div>

      <div class="button-group">
        <button id="searchBtn">Ara</button>
        <button id="clearBtn">Temizle</button>
      </div>
    </div>

    <div id="results"></div>

    <div id="noMatchMessage" style="display:none;">
      Eşleşme bulunamadı
      <br />
      <button id="googleSearchBtn">Google'da Ara</button>
    </div>
  </div>

<script>
  const inputElem = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const clearBtn = document.getElementById('clearBtn');
  const inputSearchBtn = document.getElementById('inputSearchBtn');
  const resultsContainer = document.getElementById('results');
  const noMatchDiv = document.getElementById('noMatchMessage');
  const googleBtn = document.getElementById('googleSearchBtn');

  function performSearch() {
    const input = inputElem.value.trim().toUpperCase();

    resultsContainer.innerHTML = '';
    noMatchDiv.style.display = 'none';

    if (!input) return;

    fetch('model.txt')
      .then(response => response.text())
      .then(text => {
        const lines = text.trim().split('\n');
        const data = lines.slice(1).map(line => {
          const parts = line.split('\t');
          return {
            Model: parts[0],
            Tanım: parts[1],
            Malzeme: parts[2],
            Barkod: parts[3]
          };
        });

        const scoredResults = data.map(row => {
          const model = row.Model.toUpperCase();
          let matchScore = 0;

          if (model === input) {
            matchScore = 100;
          } else if (model.includes(input)) {
            matchScore = Math.round((input.length / model.length) * 100);
          }

          return { ...row, Uyum: matchScore };
        }).filter(row => row.Uyum > 0);

        if (scoredResults.length > 0) {
          scoredResults.sort((a, b) => b.Uyum - a.Uyum);

          scoredResults.forEach(row => {
            const malzemeKodu = row.Malzeme;
            const onlineKodu = malzemeKodu.slice(0, -3);
            const boynerUrl = `https://www.boyner.com.tr/search?q=${onlineKodu}`;
            const googleUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(row.Model)}`;

            const card = document.createElement('div');
            card.className = 'card';

            card.innerHTML = `
              <div class="score">Uyum: %${row.Uyum}</div>
              <div class="model">${row.Model}</div>
              <div class="description">${row.Tanım}</div>
              <div class="material">Malzeme: ${row.Malzeme}</div>
              <div class="barcode">Barkod: ${row.Barkod}</div>
              <div class="btn-group">
                <a class="btn btn-boyner" href="${boynerUrl}" target="_blank" rel="noopener noreferrer">Boyner</a>
                <a class="btn btn-google" href="${googleUrl}" target="_blank" rel="noopener noreferrer">Google</a>
              </div>
            `;
            resultsContainer.appendChild(card);
          });
        } else {
          noMatchDiv.style.display = 'block';

          googleBtn.onclick = () => {
            const query = encodeURIComponent(inputElem.value.trim());
            if (query) {
              window.open(`https://www.google.com/search?tbm=isch&q=${query}`, '_blank', 'noopener');
            }
          };
        }
      })
      .catch(error => {
        console.error('Veri alınamadı:', error);
      });
  }

  searchBtn.onclick = performSearch;
  clearBtn.onclick = () => {
    inputElem.value = '';
    resultsContainer.innerHTML = '';
    noMatchDiv.style.display = 'none';
    inputElem.focus();
  };
  inputSearchBtn.onclick = performSearch;

  inputElem.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      performSearch();
    }
  });
</script>

</body>
</html>
