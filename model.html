<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model Arama</title>
<style>
  /* Temel reset */
  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f7f9fc;
    margin: 0;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #2c3e50;
  }

  /* Arama alanı */
  .search-wrapper {
    max-width: 480px;
    width: 100%;
    display: flex;
    gap: 12px;
    margin-bottom: 36px;
  }

  #searchInput {
    flex: 1;
    padding: 14px 18px;
    font-size: 17px;
    border: 2px solid #d1d9e6;
    border-radius: 8px;
    background: white;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  #searchInput:focus {
    border-color: #4a90e2;
    box-shadow: 0 0 8px rgba(74,144,226,0.4);
    outline: none;
  }

  /* Butonlar */
  button {
    padding: 14px 24px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgb(0 0 0 / 0.1);
    transition: background-color 0.3s, box-shadow 0.3s;
    user-select: none;
  }
  #searchBtn {
    background-color: #4a90e2;
    color: white;
  }
  #searchBtn:hover {
    background-color: #357ABD;
    box-shadow: 0 4px 12px rgba(53,122,189,0.4);
  }
  #clearBtn {
    background-color: #bdc3c7;
    color: #2c3e50;
  }
  #clearBtn:hover {
    background-color: #95a5a6;
    box-shadow: 0 4px 10px rgba(149,165,166,0.4);
  }

  /* Responsive butonlar */
  @media (max-width: 600px) {
    .search-wrapper {
      flex-direction: column;
    }
    button {
      width: 100%;
    }
  }

  /* Tablo kapsayıcı yatay scroll */
  .table-container {
    width: 100%;
    max-width: 900px;
    overflow-x: auto;
    background: white;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgb(0 0 0 / 0.1);
  }

  /* Tablo */
  table {
    border-collapse: separate;
    border-spacing: 0 10px;
    width: 100%;
    min-width: 700px;
  }

  thead tr {
    background: transparent;
  }
  th {
    font-weight: 700;
    font-size: 15px;
    color: #34495e;
    padding: 14px 20px;
    text-align: left;
  }

  tbody tr {
    background: white;
    box-shadow: 0 4px 12px rgb(0 0 0 / 0.05);
    border-radius: 12px;
    transition: box-shadow 0.3s;
  }
  tbody tr:hover {
    box-shadow: 0 8px 24px rgba(74, 144, 226, 0.25);
  }

  td {
    padding: 15px 20px;
    font-size: 14px;
    vertical-align: middle;
    border: none;
  }

  /* Butonlar tablo içinde */
  .btn {
    display: inline-block;
    padding: 7px 14px;
    font-size: 14px;
    border-radius: 6px;
    font-weight: 600;
    color: white;
    text-decoration: none;
    user-select: none;
    box-shadow: 0 3px 8px rgb(0 0 0 / 0.1);
    transition: background-color 0.3s, box-shadow 0.3s;
    cursor: pointer;
  }
  .btn-boyner {
    background-color: #db4437;
  }
  .btn-boyner:hover {
    background-color: #b73328;
    box-shadow: 0 6px 16px rgba(183, 51, 40, 0.5);
  }
  .btn-google {
    background-color: #4285f4;
  }
  .btn-google:hover {
    background-color: #3367d6;
    box-shadow: 0 6px 16px rgba(51, 103, 214, 0.5);
  }

  /* Eşleşme yok mesajı */
  #noMatchMessage {
    max-width: 480px;
    background: #ffeded;
    color: #cc3a3a;
    padding: 28px 24px;
    border-radius: 10px;
    font-weight: 700;
    text-align: center;
    box-shadow: 0 6px 16px rgb(204 58 58 / 0.18);
    display: none;
    user-select: none;
  }

  #googleSearchBtn {
    margin-top: 18px;
    padding: 12px 26px;
    background-color: #4285f4;
    color: white;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    font-size: 16px;
    box-shadow: 0 6px 16px rgb(66 133 244 / 0.45);
    transition: background-color 0.3s, box-shadow 0.3s;
  }
  #googleSearchBtn:hover {
    background-color: #3367d6;
    box-shadow: 0 8px 20px rgba(51, 103, 214, 0.7);
  }
</style>
</head>
<body>

  <div class="search-wrapper">
    <input type="text" id="searchInput" placeholder="Model numarası girin...">
    <button id="searchBtn" onclick="fetchAndSearch()">Ara</button>
    <button id="clearBtn" onclick="clearPage()">Temizle</button>
  </div>

  <div class="table-container">
    <table id="resultTable" style="display:none;">
      <thead>
        <tr>
          <th>Uyum</th>
          <th>Model</th>
          <th>Tanım</th>
          <th>Malzeme</th>
          <th>Barkod</th>
          <th>Online</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="noMatchMessage">
    Eşleşme bulunamadı
    <br>
    <button id="googleSearchBtn">Google'da Ara</button>
  </div>

<script>
  function fetchAndSearch() {
    const inputElem = document.getElementById('searchInput');
    const input = inputElem.value.trim().toUpperCase();
    const table = document.getElementById('resultTable');
    const tbody = table.querySelector('tbody');
    const noMatchDiv = document.getElementById('noMatchMessage');
    const googleBtn = document.getElementById('googleSearchBtn');

    tbody.innerHTML = '';
    table.style.display = 'none';
    noMatchDiv.style.display = 'none';

    if (!input) return;

    fetch('model.txt')
      .then(response => response.text())
      .then(text => {
        const lines = text.trim().split('\n');
        const data = lines.slice(1).map(line => {
          const parts = line.split('\t');
          return {
            Model: parts[0],
            Tanım: parts[1],
            Malzeme: parts[2],
            Barkod: parts[3]
          };
        });

        const scoredResults = data.map(row => {
          const model = row.Model.toUpperCase();
          let matchScore = 0;

          if (model === input) {
            matchScore = 100;
          } else if (model.includes(input)) {
            matchScore = Math.round((input.length / model.length) * 100);
          }

          return { ...row, Uyum: matchScore };
        }).filter(row => row.Uyum > 0);

        if (scoredResults.length > 0) {
          scoredResults.sort((a, b) => b.Uyum - a.Uyum);

          scoredResults.forEach(row => {
            const malzemeKodu = row.Malzeme;
            const onlineKodu = malzemeKodu.slice(0, -3);
            const boynerUrl = `https://www.boyner.com.tr/search?q=${onlineKodu}`;
            const googleUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(row.Model)}`;

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>%${row.Uyum}</td>
              <td>${row.Model}</td>
              <td>${row.Tanım}</td>
              <td>${row.Malzeme}</td>
              <td>${row.Barkod}</td>
              <td>
                <a class="btn btn-boyner" href="${boynerUrl}" target="_blank" rel="noopener noreferrer">Boyner</a>
                <a class="btn btn-google" href="${googleUrl}" target="_blank" rel="noopener noreferrer">Google</a>
              </td>
            `;
            tbody.appendChild(tr);
          });
          table.style.display = 'table';
        } else {
          noMatchDiv.style.display = 'block';

          googleBtn.onclick = () => {
            const query = encodeURIComponent(inputElem.value.trim());
            if (query) {
              window.open(`https://www.google.com/search?tbm=isch&q=${query}`, '_blank', 'noopener');
            }
          };
        }
      })
      .catch(error => {
        console.error('Veri alınamadı:', error);
      });
  }

  function clearPage() {
    document.getElementById('searchInput').value = '';
    document.getElementById('resultTable').style.display = 'none';
    document.querySelector('#resultTable tbody').innerHTML = '';
    document.getElementById('noMatchMessage').style.display = 'none';
  }
</script>

</body>
</html>
