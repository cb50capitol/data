<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Model Arama</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f8fa;
      color: #2e3a59;
      display: flex;
      justify-content: center;
      padding: 40px 15px;
    }

    .container {
      max-width: 500px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
      padding: 30px 24px 48px;
    }

    h1 {
      font-size: 24px;
      text-align: center;
      margin-bottom: 24px;
      color: #344767;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin: 0 auto 24px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 1rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 24px;
      color: #344767;
      transition: border-color 0.3s ease;
      display: block;
      box-sizing: border-box;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #7f9cf5;
      box-shadow: 0 0 8px rgba(127,156,245,0.5);
    }

    #inputSearchBtn {
      position: relative;
      background: #f1f5f9;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
    }

    #inputSearchBtn svg {
      fill: #7f9cf5;
      width: 20px;
      height: 20px;
      transition: fill 0.25s ease;
    }

    #inputSearchBtn:hover svg {
      fill: #5a78d6;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
      gap: 16px;
    }

    .card {
      background: #fefefe;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .score {
      font-weight: bold;
      color: #7f9cf5;
      font-size: 14px;
    }

    .model {
      font-size: 18px;
      font-weight: 600;
      color: #344767;
    }

    .description {
      font-size: 14px;
      color: #556680;
    }

    .material, .barcode {
      font-size: 13px;
      color: #94a3b8;
    }

    .btn-group {
      display: flex;
      flex-direction: row;
      gap: 10px;
      margin-top: auto;
    }

    .btn {
      flex: 1;
      padding: 8px 0;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
      color: white;
      transition: 0.3s ease;
    }

    .btn-boyner {
      background-color: #ffd6a5;
      color: #5c3b00;
    }

    .btn-boyner:hover {
      background-color: #ffbf75;
    }

    .btn-google {
      background-color: #b5ead7;
      color: #155f4b;
    }

    .btn-google:hover {
      background-color: #9adfc7;
    }

    #noMatchMessage {
      text-align: center;
      margin-top: 30px;
      font-size: 16px;
      font-weight: 600;
      color: #d04f48;
    }

    #googleSearchBtn {
      margin-top: 10px;
      padding: 10px 20px;
      background-color: #7f9cf5;
      color: white;
      border: none;
      border-radius: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Model Arama</h1>

    <div class="input-wrapper">
      <input type="text" id="searchInput" placeholder="Model numarası girin..." autocomplete="off" />
      <button id="inputSearchBtn" aria-label="Ara">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M15.5 14h-.79l-.28-.27A6.5 6.5 0 1010 16a6.5 6.5 0 005.43-2.84l.27.28v.79l5 5L20.49 19l-5-5zM10 14a4 4 0 110-8 4 4 0 010 8z"/>
        </svg>
      </button>
    </div>

    <div id="results"></div>

    <div id="noMatchMessage" style="display:none;">
      Eşleşme bulunamadı<br>
      <button id="googleSearchBtn">Google'da Ara</button>
    </div>
  </div>

  <script>
    const input = document.getElementById('searchInput');
    const inputSearchBtn = document.getElementById('inputSearchBtn');
    const results = document.getElementById('results');
    const noMatch = document.getElementById('noMatchMessage');
    const googleBtn = document.getElementById('googleSearchBtn');

    inputSearchBtn.onclick = performSearch;
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') performSearch();
    });

    function performSearch() {
      const value = input.value.trim().toUpperCase();
      results.innerHTML = '';
      noMatch.style.display = 'none';

      if (!value) return;

      fetch('model.txt')
        .then(res => res.text())
        .then(text => {
          const lines = text.trim().split('\n');
          const data = lines.slice(1).map(line => {
            const [Model, Tanım, Malzeme, Barkod] = line.split('\t');
            return { Model, Tanım, Malzeme, Barkod };
          });

          const matched = data.map(row => {
            const score = row.Model.toUpperCase() === value
              ? 100
              : row.Model.toUpperCase().includes(value)
                ? Math.round((value.length / row.Model.length) * 100)
                : 0;
            return { ...row, Uyum: score };
          }).filter(r => r.Uyum > 0);

          if (matched.length) {
            matched.sort((a, b) => b.Uyum - a.Uyum);
            matched.forEach(row => {
              const onlineCode = row.Malzeme.slice(0, -3);
              const boyner = `https://www.boyner.com.tr/search?q=${onlineCode}`;
              const google = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(row.Model)}`;

              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                <div class="score">Uyum: %${row.Uyum}</div>
                <div class="model">${row.Model}</div>
                <div class="description">${row.Tanım}</div>
                <div class="material">Malzeme: ${row.Malzeme}</div>
                <div class="barcode">Barkod: ${row.Barkod}</div>
                <div class="btn-group">
                  <a class="btn btn-boyner" href="${boyner}" target="_blank">Boyner</a>
                  <a class="btn btn-google" href="${google}" target="_blank">Google</a>
                </div>
              `;
              results.appendChild(card);
            });
          } else {
            noMatch.style.display = 'block';
            googleBtn.onclick = () => {
              window.open(`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(value)}`, '_blank');
            };
          }
        });
    }
  </script>
</body>
</html>
