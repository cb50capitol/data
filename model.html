<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Model Arama</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    input[type="text"], button {
      width: 90%;
      max-width: 400px;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      cursor: pointer;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 800px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      font-size: 14px;
    }

    th {
      background-color: #f2f2f2;
      text-align: left;
    }

    .online-btn {
      padding: 6px 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      font-size: 13px;
    }

    .online-btn:hover {
      background-color: #0056b3;
    }

    @media (max-width: 600px) {
      table, th, td {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <input type="text" id="searchInput" placeholder="Model numarası girin...">
  <button onclick="fetchAndSearch()">Ara</button>

  <table id="resultTable" style="display:none;">
    <thead>
      <tr>
        <th>Uyum</th>
        <th>Model</th>
        <th>Tanım</th>
        <th>Malzeme</th>
        <th>Barkod</th>
        <th>Online</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    function fetchAndSearch() {
      const input = document.getElementById('searchInput').value.trim().toUpperCase();
      const table = document.getElementById('resultTable');
      const tbody = table.querySelector('tbody');

      tbody.innerHTML = '';
      table.style.display = 'none';

      if (input === '') return;

      fetch('model.txt')
        .then(response => response.text())
        .then(text => {
          const lines = text.trim().split('\n');
          const data = lines.slice(1).map(line => {
            const parts = line.split('\t');
            return {
              Model: parts[0],
              Tanım: parts[1],
              Malzeme: parts[2],
              Barkod: parts[3]
            };
          });

          const scoredResults = data.map(row => {
            const model = row.Model.toUpperCase();
            let matchScore = 0;

            if (model === input) {
              matchScore = 100;
            } else if (model.includes(input)) {
              matchScore = Math.round((input.length / model.length) * 100);
            }

            return { ...row, Uyum: matchScore };
          }).filter(row => row.Uyum > 0);

          if (scoredResults.length > 0) {
            scoredResults.sort((a, b) => b.Uyum - a.Uyum);

            scoredResults.forEach(row => {
              const malzemeKodu = row.Malzeme;
              const onlineKodu = malzemeKodu.slice(0, -3); // Son 3 hane silinir
              const url = `https://www.boyner.com.tr/search?q=${onlineKodu}`;

              const tr = document.createElement('tr');
              tr.innerHTML = `
                <td>%${row.Uyum}</td>
                <td>${row.Model}</td>
                <td>${row.Tanım}</td>
                <td>${row.Malzeme}</td>
                <td>${row.Barkod}</td>
                <td><a class="online-btn" href="${url}" target="_blank">Online</a></td>
              `;
              tbody.appendChild(tr);
            });
            table.style.display = 'table';
          } else {
            table.style.display = 'none';
          }
        })
        .catch(error => {
          console.error('Veri alınamadı:', error);
        });
    }
  </script>

</body>
</html>
