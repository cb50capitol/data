<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Model Arama</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --input-bg: #f9fafb;
      --input-border: #d1d5db;
      --text: #1f2937;
      --muted: #6b7280;
      --shadow: rgba(0, 0, 0, 0.05);
      --error: #dc2626;
      --btn-boyner-bg: #ffe4b5;
      --btn-boyner-color: #5a3e00;
      --btn-boyner-hover: #ffd08a;
      --btn-google-bg: #b5ead7;
      --btn-google-color: #134e42;
      --btn-google-hover: #9cdac3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      margin: 0;
      padding: 20px 15px;
      display: flex;
      justify-content: center;
      color: var(--text);
      min-height: 100vh;
      align-items: flex-start;
    }

    .wrapper {
      background-color: var(--card);
      padding: 40px 28px;
      border-radius: 20px;
      box-shadow: 0 10px 30px var(--shadow);
      max-width: 900px; /* genişlik biraz arttı */
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .input-wrapper {
      position: relative;
      margin-bottom: 24px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 44px 14px 18px;
      font-size: 16px;
      border-radius: 10px;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      transition: 0.3s border;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 8px var(--primary);
    }

    .clear-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
    }
    .clear-icon:hover {
      color: var(--error);
    }

    #results {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* PC’de 3 yan yana */
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 12px var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.2s ease;
      text-align: left;
    }
    .card:hover {
      transform: translateY(-4px);
    }

    .score {
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
    }
    .model {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
    }
    .description {
      font-size: 14px;
      color: #475569;
    }
    .material, .barcode {
      font-size: 13px;
      color: var(--muted);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: auto;
      flex-wrap: nowrap;
      justify-content: flex-start;
    }

    .btn {
      flex: 1;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.3s ease;
      text-align: center;
      display: inline-block;
      color: white;
      border: none;
    }

    .btn-boyner {
      background-color: var(--btn-boyner-bg);
      color: var(--btn-boyner-color);
    }
    .btn-boyner:hover {
      background-color: var(--btn-boyner-hover);
    }

    .btn-google {
      background-color: var(--btn-google-bg);
      color: var(--btn-google-color);
    }
    .btn-google:hover {
      background-color: var(--btn-google-hover);
    }

    #noMatchMessage {
      font-size: 16px;
      font-weight: 600;
      color: var(--error);
      margin-top: 20px;
    }

    #noMatchButtons {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    #noMatchButtons .btn {
      flex: none;
      min-width: 120px;
    }

    @media (max-width: 900px) {
      #results {
        grid-template-columns: repeat(2, 1fr); /* orta ekranlarda 2 sütun */
      }
    }

    @media (max-width: 600px) {
      #results {
        grid-template-columns: 1fr; /* küçük ekranlarda 1 sütun */
      }
      .btn-group {
        flex-direction: row !important; /* butonlar her zaman yan yana */
        flex-wrap: nowrap;
      }
      #noMatchButtons {
        flex-direction: column;
      }
      #noMatchButtons .btn {
        width: 100%;
        min-width: unset;
      }
    }

  </style>
</head>
<body>

  <div class="wrapper">
    <h1>Model Arama</h1>
    <div class="input-wrapper">
      <input type="text" id="searchInput" placeholder="Model & Article" autocomplete="off" />
      <span class="clear-icon" onclick="clearSearch()">✕</span>
    </div>

    <div id="results"></div>

    <div id="noMatchMessage" style="display:none;">
      Eşleşme bulunamadı.
      <div id="noMatchButtons" style="display:none;">
        <button class="btn btn-boyner" onclick="searchBoyner()">Boyner'da Ara</button>
        <button class="btn btn-google" onclick="searchGoogle()">Google'da Ara</button>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('searchInput');
    const results = document.getElementById('results');
    const noMatch = document.getElementById('noMatchMessage');
    const noMatchButtons = document.getElementById('noMatchButtons');

    input.addEventListener('input', performSearch);

    function performSearch() {
      const value = input.value.trim().toUpperCase();
      results.innerHTML = '';
      noMatch.style.display = 'none';
      noMatchButtons.style.display = 'none';

      if (!value) return;

      fetch('model.txt')
        .then(res => res.text())
        .then(text => {
          const lines = text.trim().split('\n');
          const data = lines.slice(1).map(line => {
            const [Model, Tanım, Malzeme, Barkod] = line.split('\t');
            return { Model, Tanım, Malzeme, Barkod };
          });

          const matched = data.map(row => {
            const score = row.Model.toUpperCase() === value
              ? 100
              : row.Model.toUpperCase().includes(value)
                ? Math.round((value.length / row.Model.length) * 100)
                : 0;
            return { ...row, Eşleşme: score };
          }).filter(r => r.Eşleşme > 0);

          if (matched.length) {
            matched.sort((a, b) => b.Eşleşme - a.Eşleşme);
            matched.forEach(row => {
              const onlineCode = row.Malzeme.slice(0, -3);
              const boyner = `https://www.boyner.com.tr/search?q=${onlineCode}`;
              const google = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(row.Model)}`;

              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
                <div class="score">Eşleşme: %${row.Eşleşme}</div>
                <div class="model">${row.Model}</div>
                <div class="description">${row.Tanım}</div>
                <div class="material">Malzeme: ${row.Malzeme}</div>
                <div class="barcode">Barkod: ${row.Barkod}</div>
                <div class="btn-group">
                  <a class="btn btn-boyner" href="${boyner}" target="_blank" rel="noopener noreferrer">Boyner</a>
                  <a class="btn btn-google" href="${google}" target="_blank" rel="noopener noreferrer">Google</a>
                </div>
              `;
              results.appendChild(card);
            });
          } else {
            noMatch.style.display = 'block';
            noMatchButtons.style.display = 'flex';
          }
        });
    }

    function clearSearch() {
      input.value = '';
      results.innerHTML = '';
      noMatch.style.display = 'none';
      noMatchButtons.style.display = 'none';
      input.focus();
    }

    function searchBoyner() {
      const query = encodeURIComponent(input.value.trim());
      if (query) {
        window.open(`https://www.boyner.com.tr/search?q=${query}`, '_blank', 'noopener');
      }
    }

    function searchGoogle() {
      const query = encodeURIComponent(input.value.trim());
      if (query) {
        window.open(`https://www.google.com/search?tbm=isch&q=${query}`, '_blank', 'noopener');
      }
    }
  </script>

</body>
</html>
