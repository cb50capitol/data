<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model Arama - Kartlı Sistem</title>
<style>
  body {
    margin: 0; padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f5f7fa;
    color: #222;
  }
  .container {
    max-width: 900px;
    margin: 40px auto;
    padding: 0 20px 60px;
  }
  h1 {
    text-align: center;
    font-weight: 800;
    font-size: 2.2rem;
    margin-bottom: 28px;
    letter-spacing: 0.05em;
  }
  .search-area {
    display: flex;
    max-width: 600px;
    margin: 0 auto 40px;
    gap: 12px;
  }
  input[type="text"] {
    flex-grow: 1;
    padding: 14px 20px;
    font-size: 1.1rem;
    border: 2px solid #ccc;
    border-radius: 30px;
    transition: border-color 0.3s ease;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #007bff;
  }
  button {
    border: none;
    border-radius: 30px;
    padding: 14px 28px;
    font-weight: 700;
    font-size: 1.1rem;
    cursor: pointer;
    user-select: none;
    box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
    transition: background-color 0.3s ease;
    color: white;
  }
  #searchBtn {
    background-color: #007bff;
  }
  #searchBtn:hover {
    background-color: #0056b3;
  }
  #clearBtn {
    background-color: #dc3545;
  }
  #clearBtn:hover {
    background-color: #a71d2a;
  }

  #cardsContainer {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
  }

  .product-card {
    background: white;
    border-radius: 18px;
    box-shadow: 0 6px 16px rgb(0 0 0 / 0.1);
    padding: 22px 26px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: box-shadow 0.3s ease;
  }
  .product-card:hover {
    box-shadow: 0 12px 32px rgb(0 0 0 / 0.15);
  }
  .product-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #111;
  }
  .product-compatibility {
    font-weight: 700;
    color: #007bff;
  }
  .product-desc {
    font-size: 0.95rem;
    color: #555;
    min-height: 48px;
  }
  .product-meta {
    font-size: 0.9rem;
    color: #666;
  }
  .product-actions {
    margin-top: auto;
    display: flex;
    gap: 12px;
  }
  .btn-boyner, .btn-google {
    flex: 1;
    padding: 10px 0;
    border-radius: 16px;
    text-align: center;
    font-weight: 700;
    text-decoration: none;
    color: white;
    user-select: none;
    transition: background-color 0.3s ease;
  }
  .btn-boyner {
    background-color: #dc3545;
  }
  .btn-boyner:hover {
    background-color: #a71d2a;
  }
  .btn-google {
    background-color: #4285f4;
  }
  .btn-google:hover {
    background-color: #2a56c6;
  }

  #noMatchMessage {
    text-align: center;
    margin-top: 50px;
    font-weight: 700;
    font-size: 1.3rem;
    color: #dc3545;
    user-select: none;
  }
  #googleSearchBtn {
    margin-top: 14px;
    background-color: #4285f4;
    color: white;
    border: none;
    padding: 12px 36px;
    font-size: 1.1rem;
    font-weight: 700;
    border-radius: 30px;
    cursor: pointer;
    user-select: none;
  }
  #googleSearchBtn:hover {
    background-color: #2a56c6;
  }

  @media (max-width: 600px) {
    .search-area {
      flex-direction: column;
    }
    button, input[type="text"] {
      width: 100%;
    }
    #cardsContainer {
      grid-template-columns: 1fr;
      gap: 18px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Model Arama</h1>
  <div class="search-area">
    <input type="text" id="searchInput" placeholder="Model numarası girin..." autocomplete="off" />
    <button id="searchBtn">Ara</button>
    <button id="clearBtn">Temizle</button>
  </div>

  <div id="cardsContainer"></div>

  <div id="noMatchMessage" style="display:none;">
    Eşleşme bulunamadı
    <br />
    <button id="googleSearchBtn">Google'da Ara</button>
  </div>
</div>

<script>
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');
  const clearBtn = document.getElementById('clearBtn');
  const cardsContainer = document.getElementById('cardsContainer');
  const noMatchMessage = document.getElementById('noMatchMessage');
  const googleSearchBtn = document.getElementById('googleSearchBtn');

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      performSearch();
    }
  });

  searchBtn.onclick = performSearch;
  clearBtn.onclick = clearSearch;

  googleSearchBtn.onclick = () => {
    const query = encodeURIComponent(searchInput.value.trim());
    if (query) {
      window.open(`https://www.google.com/search?tbm=isch&q=${query}`, '_blank', 'noopener');
    }
  };

  function performSearch() {
    const input = searchInput.value.trim().toUpperCase();
    cardsContainer.innerHTML = '';
    noMatchMessage.style.display = 'none';

    if (!input) return;

    fetch('model.txt')
      .then(res => res.text())
      .then(text => {
        const lines = text.trim().split('\n');
        const data = lines.slice(1).map(line => {
          const parts = line.split('\t');
          return {
            Model: parts[0],
            Tanım: parts[1],
            Malzeme: parts[2],
            Barkod: parts[3]
          };
        });

        const results = data.map(row => {
          const model = row.Model.toUpperCase();
          let score = 0;
          if (model === input) score = 100;
          else if (model.includes(input)) score = Math.round((input.length / model.length) * 100);
          return {...row, Uyum: score};
        }).filter(r => r.Uyum > 0);

        if (results.length) {
          results.sort((a,b) => b.Uyum - a.Uyum);

          results.forEach(row => {
            const malzemeKodu = row.Malzeme;
            const onlineKodu = malzemeKodu.slice(0, -3);
            const boynerUrl = `https://www.boyner.com.tr/search?q=${onlineKodu}`;
            const googleUrl = `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(row.Model)}`;

            const card = document.createElement('div');
            card.classList.add('product-card');
            card.innerHTML = `
              <div class="product-title">${row.Model} <span class="product-compatibility">%${row.Uyum}</span></div>
              <div class="product-desc">${row.Tanım}</div>
              <div class="product-meta"><strong>Malzeme:</strong> ${row.Malzeme}</div>
              <div class="product-meta"><strong>Barkod:</strong> ${row.Barkod}</div>
              <div class="product-actions">
                <a class="btn-boyner" href="${boynerUrl}" target="_blank" rel="noopener noreferrer">Boyner</a>
                <a class="btn-google" href="${googleUrl}" target="_blank" rel="noopener noreferrer">Google</a>
              </div>
            `;
            cardsContainer.appendChild(card);
          });
        } else {
          noMatchMessage.style.display = 'block';
        }
      })
      .catch(err => {
        console.error('Hata:', err);
      });
  }

  function clearSearch() {
    searchInput.value = '';
    cardsContainer.innerHTML = '';
    noMatchMessage.style.display = 'none';
    searchInput.focus();
  }
</script>

</body>
</html>
