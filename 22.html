<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Barkod Tarayıcı</title>
<style>
:root {
  --bg: #f6f8fa; --card: #ffffff; --primary: #6366f1; --primary-hover: #4f46e5;
  --input-bg: #f9fafb; --input-border: #d1d5db; --text: #1f2937; --muted: #6b7280;
  --shadow: rgba(0, 0, 0, 0.05);
}
* { box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; padding: 20px 0; display: flex; justify-content: center; color: var(--text);}
.wrapper { background: var(--card); padding: 30px 24px; border-radius: 20px; box-shadow: 0 10px 30px var(--shadow); max-width: 480px; width: 100%; text-align: center;}
.search-box { position: relative; margin-bottom: 16px; }
.search-box input { width: 100%; padding: 14px 44px 14px 14px; font-size: 15px; border-radius: 10px; border: 1px solid var(--input-border); font-family: 'Inter', sans-serif; background: var(--input-bg);}
.search-box input:focus { border-color: var(--primary); outline: none;}
.search-box button { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; color: var(--muted); padding: 0; margin: 0;}
.search-box button:hover { color: var(--primary); }

.button-group { display: flex; gap: 12px; margin: 16px 0; flex-wrap: wrap; align-items:center; justify-content:center;}
button.control { flex: 0 0 48px; padding: 10px; border-radius: 10px; font-size: 15px; font-weight: 500; cursor: pointer; border: none; transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center;}
.primary { background: var(--primary); color: white; }
.primary:hover { background: var(--primary-hover);}
.secondary { background: #e5e7eb; color: var(--muted); padding: 10px 14px; flex: 0 0 auto;}
.secondary:hover { background: #d1d5db;}
#video { width: 100%; max-height: 50vh; background: black; display: none; border-radius: 14px; margin-bottom: 16px; margin-top: 0;}
.output {
  display: inline-block;
  background: #f3f4f6;
  border: 1px dashed #cbd5e1;
  border-radius: 10px;
  padding: 8px 12px;
  font-weight: 600;
  white-space: pre-wrap;
  text-align: left;
  overflow-wrap: break-word;
  max-width: 100%;
}

.other-output { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
.other-item { padding: 16px; background: #eef2ff; border: 1px dashed #818cf8; border-radius: 14px; white-space: pre-wrap; text-align: left; }
label.switch-label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer;}
label.switch-label input[type="checkbox"] { width: 36px; height: 20px; position: relative; appearance: none; background: #e5e7eb; outline: none; border-radius: 20px; transition: 0.3s;}
label.switch-label input[type="checkbox"]:checked { background: var(--primary); color: white;}
label.switch-label input[type="checkbox"]::before { content:""; position:absolute; width:18px; height:18px; border-radius:50%; top:1px; left:1px; background:white; transition:0.3s;}
label.switch-label input[type="checkbox"]:checked::before { transform: translateX(16px);}
label.switch-label span { user-select: none; font-weight: 500;}

/* SVG buton içi hizalama ve boyut */
button.control svg {
  display: inline-block;
  vertical-align: middle;
  width: 20px;
  height: 20px;
  pointer-events: none; /* tıklama butona gitsin */
}
</style>
</head>
<body>

<!-- Sesler -->
<audio id="beepSuccess" src="ok.mp3" preload="auto"></audio>
<audio id="beepError" src="no.mp3" preload="auto"></audio>
<audio id="specialBeep" src="aa.mp3" preload="auto"></audio>

<div class="wrapper">
  <!-- Video en üste -->
  <video id="video" autoplay playsinline></video>
  
  <!-- Arama kutusu -->
  <div class="search-box" id="searchBox">
    <input type="text" id="manualInput" placeholder="Barkod.." inputmode="numeric" pattern="[0-9]*" autocomplete="off"/>
    <button id="searchBtn" aria-label="Ara">🔍</button>
  </div>

  <div class="button-group">
    <label class="switch-label">
      <input type="checkbox" id="keepOpenToggle">
      <span> </span>
    </label>

    <!-- START butonu -->
    <button id="startBtn" class="control primary" aria-label="Barkod Okut">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 7V4h3" />
        <path d="M21 7V4h-3" />
        <path d="M3 17v3h3" />
        <path d="M21 17v3h-3" />
        <rect x="6" y="6" width="12" height="12" rx="2" ry="2" />
        <path d="M8.5 9v6" />
        <path d="M10.2 9v6" />
        <path d="M12 9v6" />
        <path d="M13.7 9v6" />
        <path d="M15.5 9v6" />
      </svg>
    </button>

    <button id="stopBtn" class="control secondary" style="display:none;">Kapat</button>
  </div>

  <div id="result" class="output"> </div>
  <div id="otherResult" class="other-output"></div>

  <button id="clearMemoryBtn" class="control secondary" style="margin-top: 20px;">Geçmişi Temizle</button>
</div>

<script>
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const video = document.getElementById("video");
const resultDiv = document.getElementById("result");
const otherDiv = document.getElementById("otherResult");
const manualInput = document.getElementById("manualInput");
const searchBtn = document.getElementById("searchBtn");
const beepSuccess = document.getElementById("beepSuccess");
const beepError = document.getElementById("beepError");
const specialBeep = document.getElementById("specialBeep");
const keepOpenToggle = document.getElementById("keepOpenToggle");
const searchBox = document.getElementById("searchBox");
const clearMemoryBtn = document.getElementById("clearMemoryBtn"); // ✅ eklendi

let stream;
let barcodeDetector;
let isScanning = false;
const dataPromise = loadTxtData();

/* --- TXT YÜKLE --- */
async function loadTxtData() {
  try {
    const response = await fetch("https://cb50capitol.vercel.app/scan.txt");
    const text = await response.text();
    return text.trim().split('\n').map(line => line.trim().split(/\s+/)).filter(r => r.length >= 2);
  } catch (e) {
    console.error("scan.txt okunamadı:", e);
    resultDiv.textContent = "Hata: scan.txt dosyası yüklenemedi.";
    return [];
  }
}

/* --- TÜRKÇE SESLENDİRME DÖNÜŞTÜRÜCÜLERİ --- */
// Harf ve rakam karşılıkları (kodlar için)
const turkishMap = {
  "A":"a","B":"be","C":"ce","Ç":"çe","D":"de","E":"e","F":"fe",
  "G":"ge","Ğ":"ğe","H":"he","I":"ı","İ":"i","J":"je","K":"ke",
  "L":"le","M":"me","N":"ne","O":"o","Ö":"ö","P":"pe","R":"re",
  "S":"se","Ş":"şe","T":"te","U":"u","Ü":"ü","V":"ve","Y":"ye","Z":"ze",
  "0":"sıfır","1":"bir","2":"iki","3":"üç","4":"dört","5":"beş",
  "6":"altı","7":"yedi","8":"sekiz","9":"dokuz"
};

function toTurkishSpeech(text) {
  return text.split("").map(ch => {
    const upper = ch.toUpperCase();
    return turkishMap[upper] || ch;
  }).join(" ");
}

/** Genel kural:
 *  - Sadece harf-rakamdan oluşan ve kısa (<=6) ise: heceleyerek/harf sayarak oku (örn CB50 → ce be elli)
 *  - Aksi halde: normal oku; alt çizgileri boşluğa çevir (örn CD01_EKOL_DEPO'YA_IADE → CD01 EKOL DEPO'YA IADE)
 */
function processForSpeech(text) {
  if (/^[A-Za-z0-9]+$/.test(text) && text.length <= 6) {
    return toTurkishSpeech(text);
  }
  return text.replace(/_/g, " ");
}

/* --- KONUŞMA --- */
function speak(text) {
  if (!text) return;
  // Yeni konuşmadan önce kuyruktakileri temizle
  try { window.speechSynthesis.cancel(); } catch (e) {}
  const processed = processForSpeech(text);
  const utterance = new SpeechSynthesisUtterance(processed);
  utterance.lang = "tr-TR";
  utterance.rate = 1;
  window.speechSynthesis.speak(utterance);
}

/* --- SONUÇ GÖSTER --- */
async function showResult(code) {
  const data = await dataPromise;
  const matches = data.filter(r => r[0] === code);

  resultDiv.textContent = `🔍 ${code}`;
  otherDiv.innerHTML = "";

  if (matches.length > 0) {
    // ✅ 3. sütunu BİR KEZ seslendir (ilk eşleşme)
    if (matches[0].length >= 3) {
      speak(matches[0][2]);
    }

    for (let i = 0; i < matches.length; i++) {
      const div = document.createElement("div");
      div.className = "other-item";

      const itemId = `${code}-${i}`;
      const content = matches[i].slice(1).join("\n");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.style.marginRight = "8px";
      checkbox.checked = isChecked(itemId);

      checkbox.addEventListener("change", () => {
        if (checkbox.checked) {
          saveChecked(itemId);
        } else {
          const confirmed = confirm("Bu işaretlemeyi kaldırmak istediğinize emin misiniz?");
          if (confirmed) {
            removeChecked(itemId);
          } else {
            checkbox.checked = true;
          }
        }
      });

      const label = document.createElement("label");
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(content));

      div.appendChild(label);
      otherDiv.appendChild(div);
    }
  } else {
    resultDiv.textContent = `🔍 ${code}\nBarkoda ait iş emri yok.`;
  }
}

/* --- MANUEL ARAMA --- */
async function manualSearch() {
  const code = manualInput.value.trim();
  console.log("Manuel barkod:", code);

  const data = await dataPromise;
  const matches = data.filter(r => r[0] === code);

  if (code === "3131") {
    specialBeep.currentTime = 0;
    specialBeep.play().catch(e => console.log("Özel ses çalınamadı:", e));
  } else if (matches.length > 0) {
    beepSuccess.currentTime = 0;
    beepSuccess.play().catch(e => console.log("Başarı sesi çalınamadı:", e));
  } else {
    beepError.currentTime = 0;
    beepError.play().catch(e => console.log("Hata sesi çalınamadı:", e));
  }

  await showResult(code);
  manualInput.value = "";
}

searchBtn.addEventListener("click", manualSearch);
manualInput.addEventListener("keydown", e => { if (e.key === "Enter") { manualSearch(); } });
manualInput.addEventListener("input", function () { this.value = this.value.replace(/\D/g, ""); });

/* --- KAMERA --- */
async function startCameraAndScan() {
  if (!("BarcodeDetector" in window)) { alert("Tarayıcınız BarcodeDetector API'yi desteklemiyor."); return; }
  if (!barcodeDetector) barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'code_128', 'qr_code'] });
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = stream;
    video.style.display = "block";
    searchBox.style.display = "none"; // input alanı gizlendi
    startBtn.style.display = "none";
    stopBtn.style.display = "inline-block";
  } catch (err) {
    console.error(err);
    resultDiv.textContent = "Kamera açılamadı.";
  }
}

startBtn.addEventListener("click", async () => {
  startCameraAndScan();
});

video.addEventListener("click", () => {
  if (!stream) return;
  if (!isScanning) { isScanning = true; scanLoop(); } else { isScanning = false; }
});

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
  video.style.display = "none";
  searchBox.style.display = "block"; // input geri geldi
  startBtn.style.display = "inline-flex";
  stopBtn.style.display = "none";
}

stopBtn.addEventListener("click", stopCamera);

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if (e.key === "F12" || (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "J")) || (e.ctrlKey && e.key === "U")) e.preventDefault();
});

async function scanLoop() {
  if (!isScanning) return;
  try {
    const bitmap = await createImageBitmap(video);
    const barcodes = await barcodeDetector.detect(bitmap);

    if (barcodes.length > 0) {
      const code = barcodes[0].rawValue.trim();
      console.log("Kamera barkod:", code);

      const data = await dataPromise;
      const matches = data.filter(r => r[0] === code);

      if (code === "3131") {
        specialBeep.currentTime = 0;
        specialBeep.play().catch(e => console.log("Özel ses çalınamadı:", e));
      } else if (matches.length > 0) {
        beepSuccess.currentTime = 0;
        beepSuccess.play().catch(e => console.log("Başarı sesi çalınamadı:", e));
      } else {
        beepError.currentTime = 0;
        beepError.play().catch(e => console.log("Hata sesi çalınamadı:", e));
      }

      await showResult(code);
      isScanning = false;
      if (!keepOpenToggle.checked) stopCamera();
      return;
    } else {
      resultDiv.textContent = "🔍 -\nBarkod okunamadı, tekrar okutuluyor...";
      otherDiv.innerHTML = "";
    }
  } catch (err) { console.error(err); }

  requestAnimationFrame(scanLoop);
}

/* --- CHECKED DURUMU --- */
function saveChecked(id) {
  const saved = JSON.parse(localStorage.getItem("checkedItems") || "[]");
  if (!saved.includes(id)) {
    saved.push(id);
    localStorage.setItem("checkedItems", JSON.stringify(saved));
  }
}

function removeChecked(id) {
  let saved = JSON.parse(localStorage.getItem("checkedItems") || "[]");
  saved = saved.filter(item => item !== id);
  localStorage.setItem("checkedItems", JSON.stringify(saved));
}

function isChecked(id) {
  const saved = JSON.parse(localStorage.getItem("checkedItems") || "[]");
  return saved.includes(id);
}

/* --- GEÇMİŞ TEMİZLE --- */
clearMemoryBtn.addEventListener("click", () => {
  const confirmClear = confirm("Geçmişi temizlemek istediğinize emin misiniz?");
  if (!confirmClear) return;

  localStorage.removeItem("checkedItems");
  document.querySelectorAll('.other-item input[type="checkbox"]').forEach(cb => {
    cb.checked = false;
  });
});
</script>

</body>
</html>
