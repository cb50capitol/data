<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>test</title>
  <style>
    body { font-family: Arial; max-width: 800px; margin: 0 auto; padding: 20px; background: #f9f9f9; }
    input { width: 80px; margin: 3px; }
    label { display: inline-block; width: 120px; }
    .section { margin-bottom: 20px; padding: 10px; background: #fff; border-radius: 6px; box-shadow: 0 0 5px #ccc; }
    #results { margin-top: 20px; background: #eef; padding: 15px; border-radius: 5px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 6px; text-align: center; }
  </style>
</head>
<body>
  <h2>test</h2>

  <div class="section">
    <h3>1X2 Oranları</h3>
    <label>Ev Sahibi (1):</label><input type="number" step="0.01" id="homeOdds" /><br />
    <label>Beraberlik (X):</label><input type="number" step="0.01" id="drawOdds" /><br />
    <label>Deplasman (2):</label><input type="number" step="0.01" id="awayOdds" /><br />
  </div>

  <div class="section">
    <h3>Over/Under Oranları</h3>
    <label>Alt 2.5:</label><input type="number" step="0.01" id="under25" />
    <label>Üst 2.5:</label><input type="number" step="0.01" id="over25" /><br />
  </div>

  <div class="section">
    <h3>Karşılıklı Gol (KG)</h3>
    <label>KG Var:</label><input type="number" step="0.01" id="bttsYes" />
    <label>KG Yok:</label><input type="number" step="0.01" id="bttsNo" /><br />
  </div>

  <button onclick="calculate()">HESAPLA</button>

  <div id="results"></div>

  <script>
    function poisson(k, lambda) {
      return (Math.pow(lambda, k) * Math.exp(-lambda)) / factorial(k);
    }

    function factorial(n) {
      if (n === 0) return 1;
      let result = 1;
      for (let i = 1; i <= n; i++) result *= i;
      return result;
    }

    function calculate() {
      const home = parseFloat(document.getElementById("homeOdds").value);
      const draw = parseFloat(document.getElementById("drawOdds").value);
      const away = parseFloat(document.getElementById("awayOdds").value);
      const under25 = parseFloat(document.getElementById("under25").value);
      const over25 = parseFloat(document.getElementById("over25").value);
      const bttsYes = parseFloat(document.getElementById("bttsYes").value);
      const bttsNo = parseFloat(document.getElementById("bttsNo").value);

      if (!home || !draw || !away || !under25 || !over25 || !bttsYes || !bttsNo) {
        alert("Tüm oranları eksiksiz ve doğru şekilde girin.");
        return;
      }

      // Bookmaker implied olasılıkları
      const implied1 = 1 / home;
      const impliedX = 1 / draw;
      const implied2 = 1 / away;
      const totalImplied = implied1 + impliedX + implied2;

      const prob1 = implied1 / totalImplied;
      const probX = impliedX / totalImplied;
      const prob2 = implied2 / totalImplied;

      // Model (normalize edilmiş) kazanma olasılıkları
      let p1 = prob1;  // Burada model olarak aynı bookmakers üzerinden başladım, 
      let px = probX;
      let p2 = prob2;

      // İstersen daha ileri modelleme koyabiliriz. Şimdilik oranlarla normalize oldu.

      // Over/Under implied goal model (basit)
      let pOver = 1 / over25;
      let pUnder = 1 / under25;
      let totalOU = pOver + pUnder;
      pOver /= totalOU;
      let totalGoals = 2.5 + (pOver - 0.5) * 1.5;
      totalGoals = Math.max(1.5, Math.min(4.0, totalGoals)); // sınırlandırma

      // Ev ve deplasman xG'lerini tahmin et (basit oranlara göre)
      const homeXG = totalGoals * p1;
      const awayXG = totalGoals * p2;

      // BTTS olasılığı
      let pBTTS = 1 / bttsYes;
      let pNoBTTS = 1 / bttsNo;
      let totalBTTS = pBTTS + pNoBTTS;
      pBTTS /= totalBTTS;

      // Poisson dağılımıyla skor tahminleri
      let scoreMatrix = [];
      for (let i = 0; i <= 4; i++) {
        for (let j = 0; j <= 4; j++) {
          const prob = poisson(i, homeXG) * poisson(j, awayXG);
          scoreMatrix.push({ score: `${i}-${j}`, prob });
        }
      }
      scoreMatrix.sort((a, b) => b.prob - a.prob);
      const topScores = scoreMatrix.slice(0, 3);

      // Value bet ve Kelly hesaplama (BTTS için)
      const impliedBTTS = 1 / bttsYes;
      const edge = pBTTS - impliedBTTS;
      const kelly = edge > 0 ? edge / (1 - impliedBTTS) : 0;

      // 1X2 farkları
      const diff1 = (p1 - prob1) * 100;
      const diffX = (px - probX) * 100;
      const diff2 = (p2 - prob2) * 100;

      // Sonuçları yazdır
      const resultHTML = `
        <h3>Sonuçlar:</h3>

        <p><strong>1X2 Karşılaştırma:</strong></p>
        <table>
          <tr>
            <th>Sonuç</th><th>Oran</th><th>İmplied %</th><th>Model %</th><th>Fark</th>
          </tr>
          <tr>
            <td>Ev Sahibi (1)</td>
            <td>${home.toFixed(2)}</td>
            <td>${(prob1 * 100).toFixed(1)}%</td>
            <td>${(p1 * 100).toFixed(1)}%</td>
            <td>${diff1 > 0 ? "✅ +" : "❌ "}${diff1.toFixed(1)}%</td>
          </tr>
          <tr>
            <td>Beraberlik (X)</td>
            <td>${draw.toFixed(2)}</td>
            <td>${(probX * 100).toFixed(1)}%</td>
            <td>${(px * 100).toFixed(1)}%</td>
            <td>${diffX > 0 ? "✅ +" : "❌ "}${diffX.toFixed(1)}%</td>
          </tr>
          <tr>
            <td>Deplasman (2)</td>
            <td>${away.toFixed(2)}</td>
            <td>${(prob2 * 100).toFixed(1)}%</td>
            <td>${(p2 * 100).toFixed(1)}%</td>
            <td>${diff2 > 0 ? "✅ +" : "❌ "}${diff2.toFixed(1)}%</td>
          </tr>
        </table>

        <p><strong>Toplam Beklenen Goller:</strong> ${totalGoals.toFixed(2)}</p>
        <p>Ev Sahibi xG: ${homeXG.toFixed(2)} | Deplasman xG: ${awayXG.toFixed(2)}</p>

        <p><strong>KG Var (BTTS) Olasılığı:</strong> ${(pBTTS * 100).toFixed(1)}%</p>

        <h4>En Muhtemel Skorlar:</h4>
        <ul>
          ${topScores.map(s => `<li>${s.score} – ${(s.prob * 100).toFixed(2)}%</li>`).join("")}
        </ul>

        <h4>Value Bet Analizi (KG Var):</h4>
        <p>Gerçek Olasılık: ${(pBTTS * 100).toFixed(1)}% | Bahis Oranından İmplied: ${(impliedBTTS * 100).toFixed(1)}%</p>
        <p><strong>${edge > 0 ? "✅ Value Bet VAR" : "❌ Value Bet YOK"}</strong></p>
        <p>📈 Kelly Bahis Miktarı: ${(kelly * 100).toFixed(2)}% (banka üzerinden)</p>
      `;

      document.getElementById("results").innerHTML = resultHTML;
    }
  </script>
</body>
</html>
