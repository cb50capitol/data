<!DOCTYPE html>
<html>
<body>
  <h2>Kamera Testi</h2>
  <video id="video" width="320" height="240" autoplay></video>
  <script>
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(stream => {
        document.getElementById('video').srcObject = stream;
      })
      .catch(error => {
        alert("Kamera açılamadı: " + error.name + " - " + error.message);
        console.error(error);
      });
  </script>
</body>
</html>
