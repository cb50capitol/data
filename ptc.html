<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barkod Tarayıcı</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
    body {
      font-family: Arial, sans-serif;
      margin: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #fafafa;
    }
    #videoContainer {
      position: relative;
      display: inline-block;
      margin-bottom: 20px; /* Kamera ile Toggle arası boşluk */
    }
    video {
      width: 90vw;
      max-width: 400px;
      border-radius: 8px;
      background: black;
      transition: filter 0.3s ease;
    }
    video.blurred {
      filter: blur(6px);
    }
    #flashOverlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.7);
      opacity: 0;
      pointer-events: none;
      border-radius: 8px;
      transition: opacity 0.2s ease;
    }
    #buttonContainer, #bottomButtons {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    #bottomButtons {
      margin-top: 20px;
    }
    button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #eee;
      transition: background-color 0.2s;
    }
    button:active {
      background-color: #ccc;
    }
    button.scanning {
      background-color: #e74c3c;
      color: white;
      border-color: #c0392b;
    }
    #scanButton {
      width: 150px;
    }
    #barcodeListContainer {
      width: 90vw;
      max-width: 400px;
    }
    h1 {
      margin-bottom: 10px;
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      background: #fff;
    }
    thead {
      background-color: #4CAF50;
      color: white;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    tbody tr:hover {
      background-color: #f1f1f1;
    }
    tfoot td {
      font-weight: bold;
      background: #eee;
    }

    /* Toggle Switch CSS */
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 26px; width: 26px;
      left: 4px; bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #4CAF50;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }

    /* Toggle scanning state */
    #okutToggle.scanning + .slider {
      background-color: #e74c3c !important;
    }
  </style>
</head>
<body oncontextmenu="return false">

<div id="videoContainer">
  <video id="video" autoplay muted playsinline style="display:none;"></video>
  <div id="flashOverlay"></div>
</div>

<div id="buttonContainer">
  <button id="scanButton">Kamera</button>

  <label class="switch" for="okutToggle">
    <input type="checkbox" id="okutToggle" disabled />
    <span class="slider round"></span>
  </label>
  <span id="toggleLabel" style="user-select:none; font-weight:bold; margin-left:10px; min-width:90px;">Barkod Ekle</span>
</div>

<div id="barcodeListContainer">
  <h1>Okutulan Barkodlar</h1>
  <table id="barcodeTable">
    <thead>
      <tr>
        <th>Barkod Değeri</th>
        <th>Adet</th>
      </tr>
    </thead>
    <tbody></tbody>
    <tfoot>
      <tr>
        <td>Kalem Miktarı</td>
        <td id="itemCount"></td>
      </tr>
      <tr>
        <td>Toplam Adet</td>
        <td id="totalCount"></td>
      </tr>
    </tfoot>
  </table>
</div>

<div id="bottomButtons">
  <button id="clearHistoryButton">Geçmişi Temizle</button>
  <button id="downloadExcelButton">Excel Olarak İndir</button>
  <button id="whatsappShareButton">WhatsApp'ta Paylaş</button>
</div>

<script>
  const scanButton = document.getElementById('scanButton');
  const okutToggle = document.getElementById('okutToggle');
  const toggleLabel = document.getElementById('toggleLabel');
  const clearHistoryButton = document.getElementById('clearHistoryButton');
  const downloadExcelButton = document.getElementById('downloadExcelButton');
  const whatsappShareButton = document.getElementById('whatsappShareButton');
  const video = document.getElementById('video');
  const flashOverlay = document.getElementById('flashOverlay');
  const barcodeTableBody = document.querySelector('#barcodeTable tbody');
  const beepSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

  let cameraStream = null;
  let scanning = false;
  let barcodeDetector;
  let scanInterval = null;

  let scannedBarcodes = JSON.parse(localStorage.getItem('scannedBarcodes') || '{}');
  const lastReadTimestamps = JSON.parse(localStorage.getItem('lastReadTimestamps') || '{}');
  const DEBOUNCE_TIME = 2000;

  if ('BarcodeDetector' in window) {
    barcodeDetector = new BarcodeDetector({formats: ['code_128', 'ean_13', 'qr_code', 'upc_a']});
  } else {
    alert('Bu cihazda BarcodeDetector API desteklenmiyor.');
  }

  window.addEventListener('DOMContentLoaded', updateTable);

  scanButton.addEventListener('click', async () => {
    if (cameraStream) {
      stopCamera();
      scanButton.textContent = "Kamera";
      okutToggle.disabled = true;
      okutToggle.checked = false;
      stopScanning();
      video.classList.remove('blurred');
      toggleLabel.textContent = "Barkod Ekle";
      okutToggle.classList.remove('scanning');
    } else {
      await startCamera();
      scanButton.textContent = "Kapat";
      okutToggle.disabled = false;
    }
  });

  okutToggle.addEventListener('change', () => {
    if (okutToggle.checked) {
      startScanning();
      toggleLabel.textContent = "Barkod Sil";
      okutToggle.classList.add('scanning');
    } else {
      stopScanning();
      video.classList.remove('blurred');
      toggleLabel.textContent = "Barkod Ekle";
      okutToggle.classList.remove('scanning');
    }
  });

  clearHistoryButton.addEventListener('click', () => {
    scannedBarcodes = {};
    localStorage.removeItem('scannedBarcodes');
    localStorage.removeItem('lastReadTimestamps');
    updateTable();
  });

  downloadExcelButton.addEventListener('click', () => {
    const wb = XLSX.utils.book_new();
    const rows = [['Barkod Değeri', 'Adet']];
    const keys = Object.keys(scannedBarcodes);
    let total = 0;

    keys.forEach(code => {
      const count = scannedBarcodes[code];
      rows.push([code, count]);
      total += count;
    });

    rows.push([]);
    rows.push(['Kalem Miktarı', keys.length]);
    rows.push(['Toplam Adet', total]);

    const ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, 'Barkodlar');
    XLSX.writeFile(wb, 'barkod_listesi.xlsx');
  });

  whatsappShareButton.addEventListener('click', () => {
    let text = "📦 Barkod Listesi:\n\n";
    const keys = Object.keys(scannedBarcodes);
    let total = 0;

    keys.forEach(code => {
      const count = scannedBarcodes[code];
      text += `🔹 ${code} — ${count} adet\n`;
      total += count;
    });

    text += `\n📌 Kalem Sayısı: ${keys.length}\n📊 Toplam Adet: ${total}`;

    const whatsappURL = `https://wa.me/?text=${encodeURIComponent(text)}`;
    window.open(whatsappURL, '_blank');
  });

  async function startCamera() {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
      video.srcObject = cameraStream;
      video.style.display = 'block';
      video.classList.remove('blurred');
    } catch (err) {
      alert('Kameraya erişilemedi: ' + err.message);
    }
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
    video.style.display = 'none';
  }

  function startScanning() {
    if (!cameraStream || scanning) return;
    scanning = true;
    if (scanInterval) clearInterval(scanInterval);
    scanInterval = setInterval(scanFrame, 500);
    // toggle ve video class'ları artık toggle eventinde kontrol ediliyor
  }

  function stopScanning() {
    if (!scanning) return;
    scanning = false;
    if (scanInterval) clearInterval(scanInterval);
  }

  async function scanFrame() {
    if (!scanning) return;
    try {
      const barcodes = await barcodeDetector.detect(video);
      if (barcodes.length > 0) {
        const now = Date.now();
        for (const barcode of barcodes) {
          const code = barcode.rawValue;
          if (lastReadTimestamps[code] && (now - lastReadTimestamps[code]) < DEBOUNCE_TIME) continue;
          lastReadTimestamps[code] = now;

          if (okutToggle.checked) {
            // Silme modu
            if (scannedBarcodes[code]) {
              if (scannedBarcodes[code] > 1) {
                scannedBarcodes[code] -= 1;
              } else {
                delete scannedBarcodes[code];
                delete lastReadTimestamps[code];
              }
            }
          } else {
            // Ekleme modu
            scannedBarcodes[code] = (scannedBarcodes[code] || 0) + 1;
          }

          saveData();
          updateTable();
          beepSound.play();
          flashEffect();

          stopScanning();
          video.classList.add('blurred');
          okutToggle.checked ? okutToggle.classList.add('scanning') : okutToggle.classList.remove('scanning');
          break;
        }
      }
    } catch (err) {
      console.error('Tarama hatası:', err);
    }
  }

  function updateTable() {
    barcodeTableBody.innerHTML = '';
    const keys = Object.keys(scannedBarcodes);
    let totalCount = 0;
    keys.forEach(code => {
      const count = scannedBarcodes[code];
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${code}</td><td>${count}</td>`;
      barcodeTableBody.appendChild(tr);
      totalCount += count;
    });

    document.getElementById('itemCount').textContent = keys.length;
    document.getElementById('totalCount').textContent = totalCount;
  }

  function saveData() {
    localStorage.setItem('scannedBarcodes', JSON.stringify(scannedBarcodes));
    localStorage.setItem('lastReadTimestamps', JSON.stringify(lastReadTimestamps));
  }

  function flashEffect() {
    flashOverlay.style.opacity = 1;
    setTimeout(() => {
      flashOverlay.style.opacity = 0;
    }, 100);
  }

</script>

</body>
</html>
