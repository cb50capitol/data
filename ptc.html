<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Barkod Tarayıcı</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  video {
    width: 90vw;
    max-width: 400px;
    border: 1px solid #ccc;
    margin-bottom: 15px;
    border-radius: 8px;
  }
  #scanButton {
    padding: 12px 24px;
    font-size: 18px;
    margin-bottom: 20px;
    cursor: pointer;
  }
  #barcodeListContainer {
    width: 90vw;
    max-width: 400px;
  }
  h1 {
    margin-bottom: 10px;
  }
  ol {
    background: #f5f5f5;
    padding: 15px;
    border-radius: 6px;
    max-height: 200px;
    overflow-y: auto;
    list-style-position: inside;
  }
</style>
</head>
<body>

<video id="video" autoplay muted playsinline style="display:none;"></video>

<button id="scanButton">Scan</button>

<div id="barcodeListContainer">
  <h1>Barcode</h1>
  <ol id="barcodeList"></ol>
</div>

<script>
  const scanButton = document.getElementById('scanButton');
  const video = document.getElementById('video');
  const barcodeList = document.getElementById('barcodeList');
  const beepSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

  let scanning = false;
  let barcodeDetector;
  let scanInterval = null;
  const scannedBarcodes = new Set();

  if ('BarcodeDetector' in window) {
    barcodeDetector = new BarcodeDetector({formats: ['code_128', 'ean_13', 'qr_code', 'upc_a']});
  } else {
    alert('Bu cihazda BarcodeDetector API desteklenmiyor.');
  }

  scanButton.addEventListener('click', async () => {
    if (scanning) {
      stopScan();
      scanButton.textContent = "Scan";
    } else {
      await startScan();
      scanButton.textContent = "Stop";
    }
  });

  async function startScan() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
      video.srcObject = stream;
      video.style.display = 'block';
      scanning = true;

      // 500ms aralıklarla tara
      scanInterval = setInterval(scanFrame, 500);
    } catch (err) {
      alert('Kameraya erişilemedi: ' + err.message);
    }
  }

  function stopScan() {
    scanning = false;
    video.style.display = 'none';
    clearInterval(scanInterval);
    scanInterval = null;
    scannedBarcodes.clear();

    const stream = video.srcObject;
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }
    video.srcObject = null;
  }

  async function scanFrame() {
    if (!scanning) return;
    try {
      const barcodes = await barcodeDetector.detect(video);
      if (barcodes.length > 0) {
        barcodes.forEach(barcode => {
          if (!scannedBarcodes.has(barcode.rawValue)) {
            scannedBarcodes.add(barcode.rawValue);

            const li = document.createElement('li');
            li.textContent = barcode.rawValue;

            // Listenin başına ekle (en üstte en son barkod)
            if (barcodeList.firstChild) {
              barcodeList.insertBefore(li, barcodeList.firstChild);
            } else {
              barcodeList.appendChild(li);
            }

            beepSound.play();
          }
        });
      }
    } catch (err) {
      console.error('Tarama hatası:', err);
    }
  }
</script>

</body>
</html>
