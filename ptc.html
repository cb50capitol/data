<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barkod Tarayıcı</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    /* Reset & temel */
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f9fc;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
    }

    /* Manual input form */
    #manualEntryForm {
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: nowrap;
      align-items: center;
      user-select: none;
    }
    #manualBarcodeInput {
      padding: 12px 16px;
      border-radius: 9999px;
      border: 1px solid #ccc;
      font-size: 16px;
      width: 220px;
      outline-offset: 2px;
      user-select: text;
    }
    #manualEntryForm button {
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 9999px;
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(52, 152, 219, 0.5);
      transition: background-color 0.3s ease;
      user-select: none;
      min-width: 70px;
    }
    #manualEntryForm button:hover {
      background-color: #2980b9;
    }

    h1 {
      font-weight: 700;
      margin-bottom: 12px;
      color: #2c3e50;
      text-align: center;
      user-select: text;
    }

    /* Video Container */
    #videoContainer {
      position: relative;
      width: 320px;
      max-width: 90vw;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      margin-bottom: 25px;
      background: #000;
      user-select: none;
    }
    video {
      width: 100%;
      height: auto;
      display: none;
      object-fit: cover;
      border-radius: 12px;
      transition: filter 0.3s ease;
      cursor: pointer; /* Tıklanabilir olduğunu göster */
    }
    #flashOverlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      border-radius: 12px;
      z-index: 10;
    }
    /* Yeni: Barkod overlay */
    #barcodeOverlay {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44, 62, 80, 0.8);
      color: white;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.3s ease;
      z-index: 15;
      max-width: 90%;
      text-align: center;
    }

    /* Button Container */
    #buttonContainer {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
      user-select: none;
    }
    button {
      background-color: #3498db;
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(52, 152, 219, 0.4);
      transition: background-color 0.25s ease;
      min-width: 120px;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
      box-shadow: none;
    }
    button:hover:not(:disabled) {
      background-color: #2980b9;
    }
    button.scanning {
      background-color: #e74c3c !important;
      box-shadow: 0 3px 8px rgba(231, 76, 60, 0.6);
    }

    /* Toggle switch */
    .switch-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      color: #2c3e50;
      user-select: none;
    }
    .switch {
      position: relative;
      width: 52px;
      height: 28px;
      display: inline-block;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #bdc3c7;
      transition: 0.4s;
      border-radius: 28px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    input:checked + .slider {
      background-color: #e74c3c;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* Table */
    #barcodeListContainer {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      padding: 20px 15px;
      user-select: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      color: #34495e;
    }
    thead {
      background-color: #3498db;
      color: white;
      font-weight: 700;
    }
    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #ecf0f1;
    }
    tbody tr:hover {
      background-color: #f0f8ff;
    }
    tfoot td {
      font-weight: 700;
      background-color: #f9f9f9;
      color: #2c3e50;
      padding: 12px;
    }

    /* Bottom buttons */
    #bottomButtons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    #bottomButtons button {
      min-width: 140px;
      background-color: #2ecc71;
      box-shadow: 0 3px 8px rgba(46, 204, 113, 0.5);
    }
    #bottomButtons button:hover {
      background-color: #27ae60;
    }
    #bottomButtons button:nth-child(2) {
      background-color: #f39c12;
      box-shadow: 0 3px 8px rgba(243, 156, 18, 0.5);
    }
    #bottomButtons button:nth-child(2):hover {
      background-color: #d68910;
    }
    #bottomButtons button:nth-child(3) {
      background-color: #25d366;
      box-shadow: 0 3px 8px rgba(37, 211, 102, 0.5);
    }
    #bottomButtons button:nth-child(3):hover {
      background-color: #1ebe58;
    }

    /* Responsive */
    @media (max-width: 440px) {
      #buttonContainer {
        flex-direction: column;
        gap: 12px;
      }
      #bottomButtons {
        flex-direction: column;
      }
      button, #bottomButtons button {
        width: 100%;
        min-width: unset;
      }
      #videoContainer {
        width: 100%;
      }
      #barcodeListContainer {
        max-width: 100%;
      }
    }
  </style>
</head>
<body oncontextmenu="return false">

  <!-- (HTML kod aynen korundu) -->
  <form id="manualEntryForm" autocomplete="off">
    <input
      type="tel"
      inputmode="numeric"
      pattern="[0-9]*"
      id="manualBarcodeInput"
      placeholder="Barkod girin"
      maxlength="100"
      required
    />
    <button type="submit">Ekle</button>
  </form>

  <div id="videoContainer">
    <video id="video" autoplay muted playsinline></video>
    <div id="flashOverlay"></div>
    <div id="barcodeOverlay" aria-live="polite" role="alert"></div>
  </div>

  <div id="buttonContainer">
    <button id="scanButton">Kamera Aç</button>

    <div class="switch-container" title="Silmek için okut modu">
      <label class="switch">
        <input type="checkbox" id="deleteModeToggle" />
        <span class="slider"></span>
      </label>
      <span>Silmek için okut</span>
    </div>
  </div>

  <div id="barcodeListContainer">
    <table id="barcodeTable" aria-label="Okutulan barkodlar">
      <thead>
        <tr>
          <th>Barkod Değeri</th>
          <th>Adet</th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <td>Kalem Miktarı</td>
          <td id="itemCount">0</td>
        </tr>
        <tr>
          <td>Toplam Adet</td>
          <td id="totalCount">0</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div id="bottomButtons">
    <button id="clearHistoryButton" title="Okutulan barkod listesini temizle">Geçmişi Temizle</button>
    <button id="downloadExcelButton" title="Barkod listesini Excel olarak indir">Excel Olarak İndir</button>
    <button id="whatsappShareButton" title="Barkod listesini WhatsApp'ta paylaş">WhatsApp'ta Paylaş</button>
  </div>

  <script type="module">
    import {
      BrowserMultiFormatReader,
      listVideoInputDevices
    } from 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.0.12/+esm';

    const video = document.getElementById('video');
    const scanButton = document.getElementById('scanButton');
    const manualEntryForm = document.getElementById('manualEntryForm');
    const manualBarcodeInput = document.getElementById('manualBarcodeInput');
    const deleteModeToggle = document.getElementById('deleteModeToggle');
    const barcodeTableBody = document.querySelector('#barcodeTable tbody');
    const itemCountEl = document.getElementById('itemCount');
    const totalCountEl = document.getElementById('totalCount');
    const clearHistoryButton = document.getElementById('clearHistoryButton');
    const downloadExcelButton = document.getElementById('downloadExcelButton');
    const whatsappShareButton = document.getElementById('whatsappShareButton');
    const barcodeOverlay = document.getElementById('barcodeOverlay');
    const flashOverlay = document.getElementById('flashOverlay');

    let codeReader = null;
    let scanning = false;
    let barcodes = new Map();

    // Kamerayı kapat
    function stopScanner() {
      if (codeReader) {
        codeReader.reset();
        codeReader = null;
      }
      video.style.display = 'none';
      scanButton.textContent = 'Kamera Aç';
      scanButton.classList.remove('scanning');
      scanning = false;
    }

    // Barkod eklendiğinde çağrılır
    function handleBarcode(barcode) {
      if (!barcode) return;

      if (deleteModeToggle.checked) {
        if (barcodes.has(barcode)) {
          barcodes.delete(barcode);
          updateTable();
          showOverlay('Silindi: ' + barcode);
        }
      } else {
        if (barcodes.has(barcode)) {
          barcodes.set(barcode, barcodes.get(barcode) + 1);
        } else {
          barcodes.set(barcode, 1);
        }
        updateTable();
        showOverlay('Okutuldu: ' + barcode);
        flashEffect();
      }
    }

    // Flash efekti (kamera açıldığında)
    function flashEffect() {
      flashOverlay.style.opacity = '1';
      setTimeout(() => {
        flashOverlay.style.opacity = '0';
      }, 150);
    }

    // Barkod yazısını kısa gösteren overlay
    let overlayTimeout;
    function showOverlay(text) {
      clearTimeout(overlayTimeout);
      barcodeOverlay.textContent = text;
      barcodeOverlay.style.opacity = '1';
      overlayTimeout = setTimeout(() => {
        barcodeOverlay.style.opacity = '0';
      }, 1500);
    }

    // Tablo güncelle
    function updateTable() {
      barcodeTableBody.innerHTML = '';
      let totalItems = 0;
      let totalQuantity = 0;

      for (const [code, count] of barcodes.entries()) {
        const tr = document.createElement('tr');
        const tdCode = document.createElement('td');
        tdCode.textContent = code;
        const tdCount = document.createElement('td');
        tdCount.textContent = count;
        tr.appendChild(tdCode);
        tr.appendChild(tdCount);
        barcodeTableBody.appendChild(tr);
        totalItems++;
        totalQuantity += count;
      }
      itemCountEl.textContent = totalItems;
      totalCountEl.textContent = totalQuantity;
    }

    // Excel indir
    function downloadExcel() {
      if (barcodes.size === 0) {
        alert('İndirilecek barkod yok!');
        return;
      }
      const wb = XLSX.utils.book_new();
      const wsData = [['Barkod', 'Adet']];
      for (const [code, count] of barcodes.entries()) {
        wsData.push([code, count]);
      }
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      XLSX.utils.book_append_sheet(wb, ws, 'Barkodlar');
      XLSX.writeFile(wb, 'barkodlar.xlsx');
    }

    // WhatsApp paylaş
    function shareOnWhatsApp() {
      if (barcodes.size === 0) {
        alert('Paylaşılacak barkod yok!');
        return;
      }
      let message = 'Barkod Listesi:\n';
      for (const [code, count] of barcodes.entries()) {
        message += `${code} - ${count} adet\n`;
      }
      const encodedMessage = encodeURIComponent(message);
      const whatsappURL = `https://wa.me/?text=${encodedMessage}`;
      window.open(whatsappURL, '_blank');
    }

    // Kamerayı aç/kapat
    scanButton.addEventListener('click', async () => {
      if (scanning) {
        stopScanner();
      } else {
        codeReader = new BrowserMultiFormatReader();
        try {
          const videoInputDevices = await listVideoInputDevices();
          if (videoInputDevices.length === 0) {
            alert('Kamera bulunamadı.');
            return;
          }

          const selectedDeviceId = videoInputDevices.find(device => device.label.toLowerCase().includes('back'))?.deviceId || videoInputDevices[0].deviceId;

          video.style.display = 'block';
          scanButton.textContent = 'Kamerayı Kapat';
          scanButton.classList.add('scanning');
          scanning = true;

          codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
            if (result) {
              handleBarcode(result.text);
            }
            if (err && !(err.name === 'NotFoundException')) {
              console.warn(err);
            }
          });
        } catch (e) {
          alert('Kameraya erişim sağlanamadı: ' + e.message);
          stopScanner();
        }
      }
    });

    // Manuel barkod ekleme
    manualEntryForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = manualBarcodeInput.value.trim();
      if (val.length > 0) {
        handleBarcode(val);
        manualBarcodeInput.value = '';
      }
    });

    // Geçmişi temizle
    clearHistoryButton.addEventListener('click', () => {
      if (confirm('Barkod listesini temizlemek istediğinize emin misiniz?')) {
        barcodes.clear();
        updateTable();
      }
    });

    // Excel indir butonu
    downloadExcelButton.addEventListener('click', downloadExcel);

    // WhatsApp paylaş butonu
    whatsappShareButton.addEventListener('click', shareOnWhatsApp);

    // Başlangıçta tablo boş
    updateTable();

  </script>

</body>
</html>
