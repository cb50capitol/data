<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barkod Tarayıcı</title>
    <style>
        /* Genel Stil */
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f9;
        }

        h1 {
            color: #333;
        }

        #video {
            width: 100%;
            height: auto;
            display: none;
            border: 2px solid #ccc;
        }

        #laserLine {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background-color: red;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .button {
            padding: 10px 15px;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 16px;
        }

        .button:hover {
            background-color: #2980b9;
        }

        .table-container {
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #3498db;
            color: white;
        }

        #totalCount {
            margin-top: 10px;
            font-size: 18px;
        }

        #barcodeOverlay {
            position: absolute;
            top: 50px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #e74c3c;
            opacity: 0;
            transition: opacity 1s;
        }

        #flashOverlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.5);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .scanner-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .scanner-controls button {
            background-color: #2ecc71;
        }

        .scanner-controls button:disabled {
            background-color: #95a5a6;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 6px;
            width: 300px;
            text-align: center;
        }

        .modal button {
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .modal button:hover {
            background-color: #2980b9;
        }

        /* Manual Entry Form */
        #manualEntryForm {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        #manualBarcodeInput {
            padding: 10px;
            width: 200px;
            font-size: 16px;
        }

        #clearAllBtn,
        #exportExcelBtn,
        #copyListBtn {
            margin-top: 20px;
            padding: 10px 15px;
            background-color: #e74c3c;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
        }

        #clearAllBtn:hover,
        #exportExcelBtn:hover,
        #copyListBtn:hover {
            background-color: #c0392b;
        }
    </style>
</head>

<body>

    <h1>Barkod Tarayıcı</h1>

    <div id="flashOverlay"></div>
    <div id="barcodeOverlay"></div>

    <video id="video"></video>
    <div id="laserLine"></div>

    <div class="scanner-controls">
        <button id="scanButton" class="button">Kamera Aç</button>
        <label for="deleteModeToggle">
            <input type="checkbox" id="deleteModeToggle"> Silme Modu
        </label>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Barkod</th>
                    <th>Adet</th>
                    <th>İşlem</th>
                </tr>
            </thead>
            <tbody id="barcodeTableBody">
            </tbody>
        </table>

        <div id="totalCount">Kalem Miktarı : 0</div>
    </div>

    <form id="manualEntryForm">
        <input type="text" id="manualBarcodeInput" placeholder="Barkod girin..." />
        <button class="button" type="submit">Ekle</button>
    </form>

    <div class="scanner-controls">
        <button id="clearAllBtn">Tümünü Temizle</button>
        <button id="exportExcelBtn">Excel Olarak İndir</button>
        <button id="copyListBtn">Listeyi Kopyala</button>
    </div>

    <!-- Modal -->
    <div id="customModal" class="modal">
        <div class="modal-content">
            <p id="modalContent"></p>
            <button id="modalOk">Tamam</button>
            <button id="modalCancel">İptal</button>
        </div>
    </div>

    <audio id="beepSound" src="https://www.soundjay.com/button/beep-07.wav" preload="auto"></audio>

    <script>
        (function () {
            const video = document.getElementById('video');
            const scanButton = document.getElementById('scanButton');
            const deleteModeToggle = document.getElementById('deleteModeToggle');
            const barcodeTableBody = document.getElementById('barcodeTableBody');
            const totalCountElem = document.getElementById('totalCount');
            const manualEntryForm = document.getElementById('manualEntryForm');
            const manualBarcodeInput = document.getElementById('manualBarcodeInput');
            const flashOverlay = document.getElementById('flashOverlay');
            const barcodeOverlay = document.getElementById('barcodeOverlay');
            const laserLine = document.getElementById('laserLine');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const exportExcelBtn = document.getElementById('exportExcelBtn');
            const copyListBtn = document.getElementById('copyListBtn');
            const beepSound = document.getElementById('beepSound');

            const modal = document.getElementById('customModal');
            const modalContent = document.getElementById('modalContent');
            const modalOk = document.getElementById('modalOk');
            const modalCancel = document.getElementById('modalCancel');

            let cameraStarted = false;
            let scanning = false;
            let animationFrameId = null;
            let selectedDeviceId = null;
            const barcodeMap = new Map();
            let barcodeDetector;

            async function showModal(message, withCancel = false) {
                return new Promise((resolve) => {
                    modalContent.textContent = message;
                    modal.style.display = 'flex';
                    modalCancel.style.display = withCancel ? 'inline-block' : 'none';

                    modalOk.onclick = () => {
                        modal.style.display = 'none';
                        resolve(true);
                    };
                    modalCancel.onclick = () => {
                        modal.style.display = 'none';
                        resolve(false);
                    };
                });
            }

            async function startCamera() {
                if (cameraStarted) return;
                barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'interleaved_2_of_5'] });
                try {
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const videoDevices = devices.filter(device => device.kind === 'videoinput');
                    if (videoDevices.length === 0) return showModal('Kamera bulunamadı.');

                    selectedDeviceId = videoDevices[0].deviceId;
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: selectedDeviceId } } });
                    video.srcObject = stream;
                    video.style.display = 'block';
                    await video.play();
                    cameraStarted = true;
                    scanButton.textContent = 'Kamerayı Kapat';
                    scanButton.classList.add('scanning');
                } catch (e) {
                    showModal('Kamera hatası: ' + e.message);
                }
            }

            function stopCamera() {
                if (!cameraStarted) return;
                const stream = video.srcObject;
                const tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
                video.srcObject = null;
                cameraStarted = false;
                scanButton.textContent = 'Kamera Aç';
                scanButton.classList.remove('scanning');
            }

            function startScanning() {
                if (!cameraStarted || scanning) return;
                scanning = true;
                beepSound.play();

                function scan() {
                    if (scanning) {
                        barcodeDetector.detect(video).then(barcodes => {
                            if (barcodes.length > 0) {
                                barcodes.forEach(barcode => {
                                    const code = barcode.rawValue;
                                    if (deleteModeToggle.checked) {
                                        if (barcodeMap.has(code)) {
                                            barcodeMap.delete(code);
                                        }
                                    } else {
                                        barcodeMap.set(code, (barcodeMap.get(code) || 0) + 1);
                                    }
                                    updateTable();
                                    barcodeOverlay.textContent = code;
                                    barcodeOverlay.style.opacity = 1;
                                    setTimeout(() => barcodeOverlay.style.opacity = 0, 1500);
                                    beepSound.play();
                                });
                            }
                        }).finally(() => {
                            animationFrameId = requestAnimationFrame(scan);
                        });
                    }
                }
                scan();
            }

            function stopScanning() {
                if (!scanning) return;
                scanning = false;
                cancelAnimationFrame(animationFrameId);
            }

            function updateTable() {
                barcodeTableBody.innerHTML = '';
                let total = 0;
                barcodeMap.forEach((count, code) => {
                    total += count;
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${code}</td>
                        <td>${count}</td>
                        <td><button onclick="deleteItem('${code}')">Sil</button></td>
                    `;
                    barcodeTableBody.appendChild(row);
                });
                totalCountElem.textContent = `Kalem Miktarı : ${total}`;
                saveToStorage();
            }

            function deleteItem(code) {
                barcodeMap.delete(code);
                updateTable();
            }

            function saveToStorage() {
                localStorage.setItem('barcodeData', JSON.stringify([...barcodeMap.entries()]));
            }

            function loadFromStorage() {
                const savedData = localStorage.getItem('barcodeData');
                if (savedData) {
                    const entries = JSON.parse(savedData);
                    entries.forEach(([code, count]) => barcodeMap.set(code, count));
                    updateTable();
                }
            }

            manualEntryForm.addEventListener('submit', (event) => {
                event.preventDefault();
                const barcode = manualBarcodeInput.value.trim();
                if (barcode) {
                    barcodeMap.set(barcode, (barcodeMap.get(barcode) || 0) + 1);
                    updateTable();
                    manualBarcodeInput.value = '';
                }
            });

            clearAllBtn.addEventListener('click', () => {
                barcodeMap.clear();
                updateTable();
            });

            exportExcelBtn.addEventListener('click', () => {
                let text = 'Barkod Adı\tAdet\n';
                barcodeMap.forEach((count, code) => {
                    text += `${code}\t${count}\n`;
                });
                const blob = new Blob([text], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'barkod_listesi.csv';
                link.click();
                URL.revokeObjectURL(url);
            });

            copyListBtn.addEventListener('click', () => {
                let text = 'Barkod Adı\tAdet\n';
                barcodeMap.forEach((count, code) => {
                    text += `${code}\t${count}\n`;
                });
                navigator.clipboard.writeText(text).then(() => showModal('Liste kopyalandı.'));
            });

            scanButton.addEventListener('click', () => {
                if (cameraStarted) {
                    stopCamera();
                    stopScanning();
                } else {
                    startCamera().then(() => {
                        startScanning();
                    });
                }
            });

            loadFromStorage();
        })();
    </script>
</body>

</html>
