<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Barkod Tarayıcı - Tıklanan Barkodu Algılama</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f7f9fc;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 10px;
    min-height: 100vh;
  }
  h1 {
    font-weight: 700;
    margin-bottom: 12px;
    color: #2c3e50;
    text-align: center;
    user-select: text;
  }
  #videoContainer {
    position: relative;
    width: 320px;
    max-width: 90vw;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.15);
    margin-bottom: 25px;
    background: #000;
    user-select: none;
  }
  video {
    width: 100%;
    height: auto;
    display: none;
    object-fit: cover;
    border-radius: 12px;
    cursor: pointer;
  }
  #flashOverlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.7);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    border-radius: 12px;
    z-index: 10;
  }
  #buttonContainer {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
    align-items: center;
  }
  button {
    border-radius: 8px;
    border: none;
    background: #0f72f0;
    color: white;
    font-weight: 600;
    font-size: 1rem;
    padding: 10px 14px;
    cursor: pointer;
    transition: background-color 0.25s ease;
    user-select: none;
  }
  button:hover {
    background: #085dc4;
  }
  #barcodeListContainer {
    width: 320px;
    max-width: 90vw;
    border-radius: 12px;
    overflow-x: auto;
    box-shadow: 0 6px 12px rgba(0,0,0,0.12);
    background: #fff;
    padding: 10px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 1rem;
  }
  th, td {
    padding: 8px 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
  }
  th {
    background: #0f72f0;
    color: white;
    position: sticky;
    top: 0;
  }
  tfoot td {
    font-weight: 700;
  }
  #bottomButtons {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 90vw;
  }
  .switch-container {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: #555;
    user-select: none;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 42px;
    height: 24px;
  }
  .switch input {
    opacity: 0;
    width: 0; height: 0;
  }
  .slider {
    position: absolute;
    cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: #ccc;
    transition: 0.4s;
    border-radius: 24px;
  }
  .slider:before {
    position: absolute;
    content: "";
    height: 18px;
    width: 18px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: 0.4s;
    border-radius: 50%;
  }
  input:checked + .slider {
    background-color: #0f72f0;
  }
  input:checked + .slider:before {
    transform: translateX(18px);
  }
</style>
</head>
<body oncontextmenu="return false">

<h1>Barkod Tarayıcı</h1>

<div id="videoContainer">
  <video id="video" autoplay muted playsinline></video>
  <div id="flashOverlay"></div>
</div>

<div id="buttonContainer">
  <button id="scanButton">Kamera Aç</button>
  <div class="switch-container" title="Silmek için okut modu">
    <label class="switch">
      <input type="checkbox" id="deleteModeToggle" />
      <span class="slider"></span>
    </label>
    <span>Silmek için okut</span>
  </div>
</div>

<div id="barcodeListContainer">
  <table id="barcodeTable" aria-label="Okutulan barkodlar">
    <thead>
      <tr>
        <th>Barkod Değeri</th>
        <th>Adet</th>
      </tr>
    </thead>
    <tbody></tbody>
    <tfoot>
      <tr>
        <td>Kalem Miktarı</td>
        <td id="itemCount">0</td>
      </tr>
      <tr>
        <td>Toplam Adet</td>
        <td id="totalCount">0</td>
      </tr>
    </tfoot>
  </table>
</div>

<div id="bottomButtons">
  <button id="clearHistoryButton" title="Okutulan barkod listesini temizle">Geçmişi Temizle</button>
  <button id="downloadExcelButton" title="Barkod listesini Excel olarak indir">Excel Olarak İndir</button>
  <button id="whatsappShareButton" title="Barkod listesini WhatsApp'ta paylaş">WhatsApp'ta Paylaş</button>
</div>

<script>
  const scanButton = document.getElementById('scanButton');
  const clearHistoryButton = document.getElementById('clearHistoryButton');
  const downloadExcelButton = document.getElementById('downloadExcelButton');
  const whatsappShareButton = document.getElementById('whatsappShareButton');
  const video = document.getElementById('video');
  const flashOverlay = document.getElementById('flashOverlay');
  const barcodeTableBody = document.querySelector('#barcodeTable tbody');
  const beepSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
  const deleteModeToggle = document.getElementById('deleteModeToggle');

  let cameraStream = null;
  let barcodeDetector;
  const scannedBarcodes = JSON.parse(localStorage.getItem('scannedBarcodes') || '{}');
  const lastReadTimestamps = JSON.parse(localStorage.getItem('lastReadTimestamps') || '{}');
  const DEBOUNCE_TIME = 2000;

  if ('BarcodeDetector' in window) {
    barcodeDetector = new BarcodeDetector({formats: ['code_128', 'ean_13', 'qr_code', 'upc_a']});
  } else {
    alert('Bu cihazda BarcodeDetector API desteklenmiyor.');
  }

  window.addEventListener('DOMContentLoaded', updateTable);

  scanButton.addEventListener('click', async () => {
    if (cameraStream) {
      stopCamera();
      scanButton.textContent = "Kamera Aç";
      video.style.display = 'none';
    } else {
      await startCamera();
      scanButton.textContent = "Kapat";
      video.style.display = 'block';
    }
  });

  video.addEventListener('click', async (event) => {
    if (!cameraStream) return;

    const rect = video.getBoundingClientRect();

    const clickX = event.clientX - rect.left;
    const clickY = event.clientY - rect.top;

    const videoWidth = video.videoWidth;
    const videoHeight = video.videoHeight;

    const displayedWidth = rect.width;
    const displayedHeight = rect.height;

    const scaleX = videoWidth / displayedWidth;
    const scaleY = videoHeight / displayedHeight;
    const scaledX = clickX * scaleX;
    const scaledY = clickY * scaleY;

    try {
      const barcodes = await barcodeDetector.detect(video);
      if (barcodes.length === 0) {
        alert('Barkod algılanamadı. Lütfen tekrar deneyin.');
        return;
      }

      const clickedBarcode = barcodes.find(barcode => {
        if (!barcode.boundingBox) return false;
        const box = barcode.boundingBox;
        return (
          scaledX >= box.x &&
          scaledX <= box.x + box.width &&
          scaledY >= box.y &&
          scaledY <= box.y + box.height
        );
      });

      if (!clickedBarcode) {
        alert('Tıklanan alanda barkod bulunamadı.');
        return;
      }

      const now = Date.now();
      const code = clickedBarcode.rawValue;

      if (lastReadTimestamps[code] && (now - lastReadTimestamps[code]) < DEBOUNCE_TIME) {
        return;
      }
      lastReadTimestamps[code] = now;

      if (deleteModeToggle.checked) {
        if (scannedBarcodes[code]) {
          if (scannedBarcodes[code] > 1) {
            scannedBarcodes[code] -= 1;
          } else {
            delete scannedBarcodes[code];
            delete lastReadTimestamps[code];
          }
          saveData();
          updateTable();
          beepSound.play();
          flashEffect();
        }
      } else {
        scannedBarcodes[code] = (scannedBarcodes[code] || 0) + 1;
        saveData();
        updateTable();
        beepSound.play();
        flashEffect();
      }

    } catch (err) {
      console.error('Tarama hatası:', err);
      alert('Barkod algılama sırasında hata oluştu.');
    }
  });

  async function startCamera() {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      });
      video.srcObject = cameraStream;
      video.style.display = 'block';
      await video.play();
    } catch (err) {
      alert('Kameraya erişilemedi: ' + err.message);
      console.error(err);
    }
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
    video.style.display = 'none';
  }

  function updateTable() {
    barcodeTableBody.innerHTML = '';
    const keys = Object.keys(scannedBarcodes).sort((a, b) => (lastReadTimestamps[b] || 0) - (lastReadTimestamps[a] || 0));
    let totalCount = 0;

    keys.forEach(code => {
      const count = scannedBarcodes[code];
      totalCount += count;
      const row = document.createElement('tr');
      row.innerHTML = `<td>${code}</td><td>${count}</td>`;
      barcodeTableBody.appendChild(row);
    });

    document.getElementById('itemCount').textContent = keys.length;
    document.getElementById('totalCount').textContent = totalCount;
  }

  function saveData() {
    localStorage.setItem('scannedBarcodes', JSON.stringify(scannedBarcodes));
    localStorage.setItem('lastReadTimestamps', JSON.stringify(lastReadTimestamps));
  }

  clearHistoryButton.addEventListener('click', () => {
    if (confirm('Barkod geçmişi silinecek, emin misiniz?')) {
      for (const key in scannedBarcodes) delete scannedBarcodes[key];
      for (const key in lastReadTimestamps) delete lastReadTimestamps[key];
      saveData();
      updateTable();
    }
  });

  downloadExcelButton.addEventListener('click', () => {
    const wb = XLSX.utils.book_new();
    const data = [['Barkod Değeri', 'Adet']];
    for (const code in scannedBarcodes) {
      data.push([code, scannedBarcodes[code]]);
    }
    const ws = XLSX.utils.aoa_to_sheet(data);
    XLSX.utils.book_append_sheet(wb, ws, 'Barkodlar');
    XLSX.writeFile(wb, 'barkodlar.xlsx');
  });

  whatsappShareButton.addEventListener('click', () => {
    if (Object.keys(scannedBarcodes).length === 0) {
      alert('Paylaşacak barkod yok.');
      return;
    }
    let message = 'Barkod Listesi:%0A';
    for (const code in scannedBarcodes) {
      message += `${code} x${scannedBarcodes[code]}%0A`;
    }
    const url = `https://wa.me/?text=${message}`;
    window.open(url, '_blank');
  });

  function flashEffect() {
    flashOverlay.style.opacity = '0.8';
    setTimeout(() => {
      flashOverlay.style.opacity = '0';
    }, 150);
  }
</script>

</body>
</html>
