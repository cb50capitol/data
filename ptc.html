<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barkod Tarayıcı</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    /* Reset & temel */
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f9fc;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
    }

    /* Input ve buton container */
    #inputContainer {
      width: 320px;
      max-width: 90vw;
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      user-select: none;
    }

    #manualBarcodeInput {
      flex-grow: 1;
      padding: 12px 14px;
      font-size: 16px;
      border: 2px solid #3498db;
      border-radius: 20px;
      outline: none;
      user-select: text;
      -webkit-appearance: none;
      -moz-appearance: textfield;
    }
    /* input number spinler kaldır */
    #manualBarcodeInput::-webkit-inner-spin-button,
    #manualBarcodeInput::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    #addBarcodeButton {
      background-color: #3498db;
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(52, 152, 219, 0.4);
      transition: background-color 0.25s ease;
      min-width: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    #addBarcodeButton:hover:not(:disabled) {
      background-color: #2980b9;
    }
    #addBarcodeButton:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Video Container */
    #videoContainer {
      position: relative;
      width: 320px;
      max-width: 90vw;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      margin-bottom: 25px;
      background: #000;
      user-select: none;
    }
    video {
      width: 100%;
      height: auto;
      display: none;
      object-fit: cover;
      border-radius: 12px;
      transition: filter 0.3s ease;
      cursor: pointer; /* Tıklanabilir olduğunu göster */
    }
    #flashOverlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      border-radius: 12px;
      z-index: 10;
    }
    /* Barkod overlay */
    #barcodeOverlay {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44, 62, 80, 0.8);
      color: white;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.3s ease;
      z-index: 15;
      max-width: 90%;
      text-align: center;
    }

    /* Button Container */
    #buttonContainer {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
      user-select: none;
    }
    button {
      background-color: #3498db;
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(52, 152, 219, 0.4);
      transition: background-color 0.25s ease;
      min-width: 120px;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
      box-shadow: none;
    }
    button:hover:not(:disabled) {
      background-color: #2980b9;
    }
    button.scanning {
      background-color: #e74c3c !important;
      box-shadow: 0 3px 8px rgba(231, 76, 60, 0.6);
    }

    /* Toggle switch */
    .switch-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      color: #2c3e50;
      user-select: none;
    }
    .switch {
      position: relative;
      width: 52px;
      height: 28px;
      display: inline-block;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #bdc3c7;
      transition: 0.4s;
      border-radius: 28px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    input:checked + .slider {
      background-color: #e74c3c;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* Table */
    #barcodeListContainer {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      padding: 20px 15px;
      user-select: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      color: #34495e;
    }
    thead {
      background-color: #3498db;
      color: white;
      font-weight: 700;
    }
    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #ecf0f1;
    }
    tbody tr:hover {
      background-color: #f0f8ff;
    }
    tfoot td {
      font-weight: 700;
      background-color: #f9f9f9;
      color: #2c3e50;
      padding: 12px;
    }

    /* Bottom buttons */
    #bottomButtons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    #bottomButtons button {
      min-width: 140px;
      background-color: #2ecc71;
      box-shadow: 0 3px 8px rgba(46, 204, 113, 0.5);
    }
    #bottomButtons button:hover {
      background-color: #27ae60;
    }
    #bottomButtons button:nth-child(2) {
      background-color: #f39c12;
      box-shadow: 0 3px 8px rgba(243, 156, 18, 0.5);
    }
    #bottomButtons button:nth-child(2):hover {
      background-color: #d68910;
    }
    #bottomButtons button:nth-child(3) {
      background-color: #25d366;
      box-shadow: 0 3px 8px rgba(37, 211, 102, 0.5);
    }
    #bottomButtons button:nth-child(3):hover {
      background-color: #1ebe58;
    }

    /* Responsive */
    @media (max-width: 440px) {
      #inputContainer {
        flex-direction: column;
      }
      #addBarcodeButton {
        width: 100%;
      }
      #buttonContainer {
        flex-direction: column;
        gap: 12px;
      }
      #bottomButtons {
        flex-direction: column;
      }
      button, #bottomButtons button {
        width: 100%;
        min-width: unset;
      }
      #videoContainer {
        width: 100%;
      }
      #barcodeListContainer {
        max-width: 100%;
      }
    }
  </style>
</head>
<body oncontextmenu="return false">

  <div id="inputContainer">
    <input 
      type="number" 
      inputmode="numeric" 
      pattern="[0-9]*" 
      id="manualBarcodeInput" 
      placeholder="Manuel barkod giriniz" 
      autocomplete="off" 
      title="Sadece sayısal giriş" 
      aria-label="Manuel barkod girişi" 
      min="0"
      step="1"
      onkeydown="if(event.key==='e' || event.key==='-' || event.key==='+') event.preventDefault()"
    />
    <button id="addBarcodeButton" disabled>Ekle</button>
  </div>

  <div id="videoContainer">
    <video id="video" playsinline></video>
    <div id="flashOverlay"></div>
    <div id="barcodeOverlay"></div>
  </div>

  <div id="buttonContainer">
    <button id="startScanButton">Tarayıcı Başlat</button>
    <button id="stopScanButton" disabled>Tarayıcı Durdur</button>

    <label class="switch-container" for="deleteModeToggle">
      Silme Modu
      <label class="switch">
        <input type="checkbox" id="deleteModeToggle" />
        <span class="slider"></span>
      </label>
    </label>
  </div>

  <div id="barcodeListContainer" aria-live="polite" aria-atomic="true" role="region">
    <table aria-label="Okunan barkodlar tablosu">
      <thead>
        <tr>
          <th>Barkod</th>
          <th>Adet</th>
        </tr>
      </thead>
      <tbody id="barcodeTableBody">
      </tbody>
      <tfoot>
        <tr>
          <td>Toplam Ürün</td>
          <td id="itemCount">0</td>
        </tr>
        <tr>
          <td>Toplam Adet</td>
          <td id="totalCount">0</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div id="bottomButtons">
    <button id="clearHistoryButton">Geçmişi Temizle</button>
    <button id="exportExcelButton">Excel'e Aktar</button>
    <button id="copyClipboardButton">Panoya Kopyala</button>
  </div>

  <audio id="beepSound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" preload="auto"></audio>

  <script>
    const video = document.getElementById('video');
    const startScanButton = document.getElementById('startScanButton');
    const stopScanButton = document.getElementById('stopScanButton');
    const deleteModeToggle = document.getElementById('deleteModeToggle');
    const manualBarcodeInput = document.getElementById('manualBarcodeInput');
    const addBarcodeButton = document.getElementById('addBarcodeButton');
    const barcodeTableBody = document.getElementById('barcodeTableBody');
    const clearHistoryButton = document.getElementById('clearHistoryButton');
    const exportExcelButton = document.getElementById('exportExcelButton');
    const copyClipboardButton = document.getElementById('copyClipboardButton');
    const flashOverlay = document.getElementById('flashOverlay');
    const barcodeOverlay = document.getElementById('barcodeOverlay');
    const beepSound = document.getElementById('beepSound');

    let scanning = false;
    let stream = null;

    // Barkodları ve sırasını tutan yapılar
    let barcodes = {};
    let barcodeOrder = [];

    // Kamera erişim ve tarama fonksiyonları
    async function startScanner() {
      if (scanning) return;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        await video.play();
        scanning = true;
        startScanButton.disabled = true;
        stopScanButton.disabled = false;
        video.style.display = 'block';

        // Kameraya tıklanınca barkod tarama başlar
        video.addEventListener('click', onVideoClick);

      } catch (e) {
        alert('Kameraya erişilemedi veya izin verilmedi.');
      }
    }

    function stopScanner() {
      if (!scanning) return;
      scanning = false;
      startScanButton.disabled = false;
      stopScanButton.disabled = true;
      video.pause();
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      video.style.display = 'none';

      video.removeEventListener('click', onVideoClick);
    }

    // Barkod algılaması (örnek amaçlı)
    // Burada barkod algılama kütüphanesi eklenmeli.
    // Bu örnekte tıklama ile test amaçlı sabit barkod okutuyoruz.
    function onVideoClick() {
      // Simüle barkod algılama: rastgele 12 haneli sayısal barkod
      const randomBarcode = Math.floor(100000000000 + Math.random() * 900000000000).toString();
      handleBarcode(randomBarcode);
    }

    // Barkod işlemleri
    function handleBarcode(value) {
      value = value.trim();
      if (!value) return;
      if (deleteModeToggle.checked) {
        if (barcodes[value]) {
          barcodes[value]--;
          if (barcodes[value] <= 0) {
            delete barcodes[value];
            barcodeOrder = barcodeOrder.filter(bc => bc !== value);
          }
          beepSound.play();
          updateTable();
        }
      } else {
        if (!barcodes[value]) {
          barcodes[value] = 0;
          barcodeOrder.unshift(value);
        } else {
          barcodeOrder = barcodeOrder.filter(bc => bc !== value);
          barcodeOrder.unshift(value);
        }
        barcodes[value]++;
        beepSound.play();
        updateTable();
      }
      flashOverlay.style.opacity = '1';
      setTimeout(() => {
        flashOverlay.style.opacity = '0';
      }, 150);
      barcodeOverlay.textContent = value;
      barcodeOverlay.style.opacity = 1;
      setTimeout(() => {
        barcodeOverlay.style.opacity = 0;
      }, 1500);
    }

    // Tablo güncelleme
    function updateTable() {
      barcodeTableBody.innerHTML = '';
      let totalItems = 0;
      let totalCount = 0;

      for (const code of barcodeOrder) {
        const count = barcodes[code];
        if (count === undefined) continue;
        const tr = document.createElement('tr');
        const tdCode = document.createElement('td');
        const tdCount = document.createElement('td');
        tdCode.textContent = code;
        tdCount.textContent = count;
        tr.appendChild(tdCode);
        tr.appendChild(tdCount);
        barcodeTableBody.appendChild(tr);
        totalItems++;
        totalCount += count;
      }
      document.getElementById('itemCount').textContent = totalItems;
      document.getElementById('totalCount').textContent = totalCount;
    }

    // Manuel giriş ve buton etkileşimleri
    manualBarcodeInput.addEventListener('input', () => {
      const val = manualBarcodeInput.value.trim();
      addBarcodeButton.disabled = val === '' || isNaN(val);
    });

    addBarcodeButton.addEventListener('click', () => {
      const val = manualBarcodeInput.value.trim();
      if (val) {
        handleBarcode(val);
        manualBarcodeInput.value = '';
        addBarcodeButton.disabled = true;
        manualBarcodeInput.focus();
      }
    });

    manualBarcodeInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !addBarcodeButton.disabled) {
        addBarcodeButton.click();
      }
    });

    // Butonlar
    startScanButton.addEventListener('click', startScanner);
    stopScanButton.addEventListener('click', stopScanner);

    clearHistoryButton.addEventListener('click', () => {
      if (confirm('Barkod geçmişi temizlensin mi?')) {
        barcodes = {};
        barcodeOrder = [];
        updateTable();
      }
    });

    exportExcelButton.addEventListener('click', () => {
      if (barcodeOrder.length === 0) {
        alert('İhracat için veri yok.');
        return;
      }
      const data = [['Barkod', 'Adet']];
      for (const code of barcodeOrder) {
        data.push([code, barcodes[code]]);
      }
      const ws = XLSX.utils.aoa_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Barkodlar");
      XLSX.writeFile(wb, "barkodlar.xlsx");
    });

    copyClipboardButton.addEventListener('click', async () => {
      if (barcodeOrder.length === 0) {
        alert('Kopyalanacak veri yok.');
        return;
      }
      let text = 'Barkod\tAdet\n';
      for (const code of barcodeOrder) {
        text += `${code}\t${barcodes[code]}\n`;
      }
      try {
        await navigator.clipboard.writeText(text);
        alert('Tablo panoya kopyalandı.');
      } catch {
        alert('Panoya kopyalama başarısız oldu.');
      }
    });

    // Başlangıçta tablo boş
    updateTable();
  </script>

</body>
</html>
