<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barkod Tarayıcı</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f9fc;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
    }
    #manualEntryForm {
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: nowrap;
      align-items: center;
      user-select: none;
    }
    #manualBarcodeInput {
      padding: 12px 16px;
      border-radius: 9999px;
      border: 1px solid #ccc;
      font-size: 16px;
      width: 220px;
      outline-offset: 2px;
      user-select: text;
    }
    #manualEntryForm button {
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 9999px;
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(52, 152, 219, 0.5);
      transition: background-color 0.3s ease;
      user-select: none;
      min-width: 70px;
    }
    #manualEntryForm button:hover {
      background-color: #2980b9;
    }
    h1 {
      font-weight: 700;
      margin-bottom: 12px;
      color: #2c3e50;
      text-align: center;
      user-select: text;
    }
    #videoContainer {
      position: relative;
      width: 320px;
      max-width: 90vw;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      margin-bottom: 25px;
      background: #000;
      user-select: none;
    }
    video {
      width: 100%;
      height: auto;
      display: none;
      object-fit: cover;
      border-radius: 12px;
      transition: filter 0.3s ease;
      cursor: pointer;
    }
    #flashOverlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      border-radius: 12px;
      z-index: 10;
    }
    #barcodeOverlay {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44, 62, 80, 0.8);
      color: white;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.3s ease;
      z-index: 15;
      max-width: 90%;
      text-align: center;
    }
    #buttonContainer {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
      user-select: none;
    }
    button {
      background-color: #3498db;
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(52, 152, 219, 0.4);
      transition: background-color 0.25s ease;
      min-width: 120px;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
      box-shadow: none;
    }
    button:hover:not(:disabled) {
      background-color: #2980b9;
    }
    button.scanning {
      background-color: #e74c3c !important;
      box-shadow: 0 3px 8px rgba(231, 76, 60, 0.6);
    }
    .switch-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      color: #2c3e50;
      user-select: none;
    }
    .switch {
      position: relative;
      width: 52px;
      height: 28px;
      display: inline-block;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #bdc3c7;
      transition: 0.4s;
      border-radius: 28px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    input:checked + .slider {
      background-color: #e74c3c;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    #barcodeListContainer {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      padding: 20px 15px;
      user-select: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      color: #34495e;
    }
    thead {
      background-color: #3498db;
      color: white;
      font-weight: 700;
    }
    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #ecf0f1;
    }
    tbody tr:hover {
      background-color: #f0f8ff;
    }
    tfoot td {
      font-weight: 700;
      background-color: #f9f9f9;
      color: #2c3e50;
      padding: 12px;
    }
    #bottomButtons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    #bottomButtons button {
      min-width: 140px;
      background-color: #2ecc71;
      box-shadow: 0 3px 8px rgba(46, 204, 113, 0.5);
    }
    #bottomButtons button:hover {
      background-color: #27ae60;
    }
    #bottomButtons button:nth-child(2) {
      background-color: #f39c12;
      box-shadow: 0 3px 8px rgba(243, 156, 18, 0.5);
    }
    #bottomButtons button:nth-child(2):hover {
      background-color: #d68910;
    }
    #bottomButtons button:nth-child(3) {
      background-color: #25d366;
      box-shadow: 0 3px 8px rgba(37, 211, 102, 0.5);
    }
    #bottomButtons button:nth-child(3):hover {
      background-color: #1ebe58;
    }
    @media (max-width: 440px) {
      #buttonContainer {
        flex-direction: column;
        gap: 12px;
      }
      #bottomButtons {
        flex-direction: column;
      }
      button, #bottomButtons button {
        width: 100%;
        min-width: unset;
      }
      #videoContainer {
        width: 100%;
      }
      #barcodeListContainer {
        max-width: 100%;
      }
    }
  </style>
</head>
<body oncontextmenu="return false">

  <form id="manualEntryForm" autocomplete="off">
    <input
      type="tel"
      inputmode="numeric"
      pattern="[0-9]*"
      id="manualBarcodeInput"
      placeholder="Barkod girin"
      maxlength="100"
      required
    />
    <button type="submit">Ekle</button>
  </form>

  <div id="videoContainer">
    <video id="video" autoplay muted playsinline></video>
    <div id="flashOverlay"></div>
    <div id="barcodeOverlay" aria-live="polite" role="alert"></div>
  </div>

  <div id="buttonContainer">
    <button id="scanButton">Kamera Aç</button>

    <div class="switch-container" title="Silmek için okut modu">
      <label class="switch">
        <input type="checkbox" id="deleteModeToggle" />
        <span class="slider"></span>
      </label>
      Silmek İçin Okut
    </div>
  </div>

  <div id="barcodeListContainer" aria-live="polite" role="list">
    <table>
      <thead>
        <tr>
          <th>Barkod</th>
          <th>Adet</th>
          <th>İşlem</th>
        </tr>
      </thead>
      <tbody id="barcodeTableBody"></tbody>
      <tfoot>
        <tr>
          <td>Toplam</td>
          <td id="totalCount" colspan="2">0</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div id="bottomButtons">
    <button id="clearAllBtn" title="Tümünü temizle">Temizle</button>
    <button id="exportExcelBtn" title="Excel olarak indir">Excel İndir</button>
    <button id="copyListBtn" title="Listeyi kopyala">Listeyi Kopyala</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    (function() {
      const { BrowserMultiFormatReader } = ZXing;
      const video = document.getElementById('video');
      const scanButton = document.getElementById('scanButton');
      const deleteModeToggle = document.getElementById('deleteModeToggle');
      const barcodeTableBody = document.getElementById('barcodeTableBody');
      const totalCountElem = document.getElementById('totalCount');
      const manualEntryForm = document.getElementById('manualEntryForm');
      const manualBarcodeInput = document.getElementById('manualBarcodeInput');
      const flashOverlay = document.getElementById('flashOverlay');
      const barcodeOverlay = document.getElementById('barcodeOverlay');
      const clearAllBtn = document.getElementById('clearAllBtn');
      const exportExcelBtn = document.getElementById('exportExcelBtn');
      const copyListBtn = document.getElementById('copyListBtn');

      let codeReader = null;
      let cameraStarted = false;
      let scanning = false;
      let animationFrameId = null;
      let selectedDeviceId = null;
      const barcodeMap = new Map();

      async function startCamera() {
        if (cameraStarted) return;
        codeReader = new BrowserMultiFormatReader();
        try {
          const videoInputDevices = await codeReader.listVideoInputDevices();
          if (videoInputDevices.length === 0) {
            alert('Kamera bulunamadı.');
            return;
          }
          selectedDeviceId = videoInputDevices.find(d => d.label.toLowerCase().includes('back'))?.deviceId || videoInputDevices[0].deviceId;

          // Video elementini görünür yap
          video.style.display = 'block';

          // Kamerayı başlat (stream'i al)
          await codeReader.decodeFromVideoDevice(selectedDeviceId, video, () => {});
          // Ama hemen tarama yapma, onun yerine manuel kontrol ile tarama yapacağız
          codeReader.reset(); // hemen durdur
          cameraStarted = true;
          scanButton.textContent = 'Kamerayı Kapat';
          scanButton.classList.add('scanning');
        } catch(e) {
          alert('Kameraya erişim sağlanamadı: ' + e.message);
          stopCamera();
        }
      }

      function stopCamera() {
        if (codeReader) {
          codeReader.reset();
          codeReader = null;
        }
        scanning = false;
        cameraStarted = false;
        video.style.display = 'none';
        scanButton.textContent = 'Kamera Aç';
        scanButton.classList.remove('scanning');
        cancelAnimationFrame(animationFrameId);
      }

      // Kare kare tarama fonksiyonu (manuel loop)
      function scanFrame() {
        if (!scanning) return;
        codeReader.decodeOnceFromVideoDevice(selectedDeviceId, video).then(result => {
          if (result) {
            handleBarcode(result.text);
            flashEffect();
            stopScanning();
            showOverlay('Barkod okundu');
          }
          if (scanning) { // devam et
            animationFrameId = requestAnimationFrame(scanFrame);
          }
        }).catch(err => {
          if (err && err.name !== 'NotFoundException' && err.name !== 'NotSupportedException') {
            console.warn(err);
          }
          if (scanning) {
            animationFrameId = requestAnimationFrame(scanFrame);
          }
        });
      }

      function startScanning() {
        if (!cameraStarted || scanning) return;
        scanning = true;
        scanFrame();
      }

      function stopScanning() {
        scanning = false;
        cancelAnimationFrame(animationFrameId);
      }

      function handleBarcode(text) {
        if (!text) return;
        if (deleteModeToggle.checked) {
          if (barcodeMap.has(text)) {
            let count = barcodeMap.get(text);
            if (count > 1) {
              barcodeMap.set(text, count - 1);
            } else {
              barcodeMap.delete(text);
            }
            updateTable();
            showOverlay(`Silindi: ${text}`);
          } else {
            showOverlay(`Bulunamadı: ${text}`);
          }
        } else {
          if (barcodeMap.has(text)) {
            barcodeMap.set(text, barcodeMap.get(text) + 1);
          } else {
            barcodeMap.set(text, 1);
          }
          updateTable();
          showOverlay(`Okundu: ${text}`);
        }
      }

      function updateTable() {
        barcodeTableBody.innerHTML = '';
        let total = 0;
        barcodeMap.forEach((count, code) => {
          total += count;
          const tr = document.createElement('tr');

          const tdCode = document.createElement('td');
          tdCode.textContent = code;
          tdCode.title = code;
          tr.appendChild(tdCode);

          const tdCount = document.createElement('td');
          tdCount.textContent = count;
          tr.appendChild(tdCount);

          const tdAction = document.createElement('td');
          const delBtn = document.createElement('button');
          delBtn.textContent = 'Sil';
          delBtn.style.backgroundColor = '#e74c3c';
          delBtn.style.padding = '6px 10px';
          delBtn.style.border = 'none';
          delBtn.style.color = 'white';
          delBtn.style.borderRadius = '6px';
          delBtn.style.cursor = 'pointer';
          delBtn.title = 'Barkodu sil';
          delBtn.addEventListener('click', () => {
            barcodeMap.delete(code);
            updateTable();
          });
          tdAction.appendChild(delBtn);
          tr.appendChild(tdAction);

          barcodeTableBody.appendChild(tr);
        });
        totalCountElem.textContent = total;
      }

      function flashEffect() {
        flashOverlay.style.opacity = '1';
        setTimeout(() => {
          flashOverlay.style.opacity = '0';
        }, 150);
      }

      let overlayTimeout = null;
      function showOverlay(text) {
        barcodeOverlay.textContent = text;
        barcodeOverlay.style.opacity = '1';
        if (overlayTimeout) clearTimeout(overlayTimeout);
        overlayTimeout = setTimeout(() => {
          barcodeOverlay.style.opacity = '0';
        }, 1500);
      }

      manualEntryForm.addEventListener('submit', e => {
        e.preventDefault();
        const val = manualBarcodeInput.value.trim();
        if (val) {
          handleBarcode(val);
          manualBarcodeInput.value = '';
          manualBarcodeInput.focus();
        }
      });

      scanButton.addEventListener('click', () => {
        if (cameraStarted) {
          stopCamera();
        } else {
          startCamera();
        }
      });

      video.addEventListener('click', () => {
        if (!cameraStarted) return;
        if (scanning) {
          stopScanning();
          showOverlay('Tarama durduruldu');
        } else {
          startScanning();
          showOverlay('Tarama başladı');
        }
      });

      clearAllBtn.addEventListener('click', () => {
        if (confirm('Tüm barkodları temizlemek istediğinize emin misiniz?')) {
          barcodeMap.clear();
          updateTable();
        }
      });

      exportExcelBtn.addEventListener('click', () => {
        if (barcodeMap.size === 0) {
          alert('İndirilecek barkod yok.');
          return;
        }
        const wb = XLSX.utils.book_new();
        const data = [['Barkod', 'Adet']];
        barcodeMap.forEach((count, code) => {
          data.push([code, count]);
        });
        const ws = XLSX.utils.aoa_to_sheet(data);
        XLSX.utils.book_append_sheet(wb, ws, 'Barkodlar');
        XLSX.writeFile(wb, 'barkodlar.xlsx');
      });

      copyListBtn.addEventListener('click', () => {
        if (barcodeMap.size === 0) {
          alert('Kopyalanacak barkod yok.');
          return;
        }
        let text = '';
        barcodeMap.forEach((count, code) => {
          text += `${code}\t${count}\n`;
        });
        navigator.clipboard.writeText(text)
          .then(() => alert('Liste kopyalandı!'))
          .catch(() => alert('Kopyalama başarısız.'));
      });

      manualBarcodeInput.focus();
    })();
  </script>

</body>
</html>
