<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barkod Tarayıcı</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    /* Reset & temel */
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f9fc;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
    }
    h1 {
      font-weight: 700;
      margin-bottom: 12px;
      color: #2c3e50;
      text-align: center;
      user-select: text;
    }

    /* Video Container */
    #videoContainer {
      position: relative;
      width: 320px;
      max-width: 90vw;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      margin-bottom: 25px;
      background: #000;
      user-select: none;
    }
    video {
      width: 100%;
      height: auto;
      display: none;
      object-fit: cover;
      border-radius: 12px;
      transition: filter 0.3s ease;
      cursor: pointer; /* Tıklanabilir olduğunu göster */
    }
    #flashOverlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      border-radius: 12px;
      z-index: 10;
    }

    /* Button Container */
    #buttonContainer {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
      user-select: none;
    }
    button {
      background-color: #3498db;
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(52, 152, 219, 0.4);
      transition: background-color 0.25s ease;
      min-width: 120px;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
      box-shadow: none;
    }
    button:hover:not(:disabled) {
      background-color: #2980b9;
    }
    button.scanning {
      background-color: #e74c3c !important;
      box-shadow: 0 3px 8px rgba(231, 76, 60, 0.6);
    }

    /* Toggle switch */
    .switch-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      color: #2c3e50;
      user-select: none;
    }
    .switch {
      position: relative;
      width: 52px;
      height: 28px;
      display: inline-block;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #bdc3c7;
      transition: 0.4s;
      border-radius: 28px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    input:checked + .slider {
      background-color: #e74c3c;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* Table */
    #barcodeListContainer {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      padding: 20px 15px;
      user-select: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      color: #34495e;
    }
    thead {
      background-color: #3498db;
      color: white;
      font-weight: 700;
    }
    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #ecf0f1;
    }
    tbody tr:hover {
      background-color: #f0f8ff;
    }
    tfoot td {
      font-weight: 700;
      background-color: #f9f9f9;
      color: #2c3e50;
      padding: 12px;
    }

    /* Bottom buttons */
    #bottomButtons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    #bottomButtons button {
      min-width: 140px;
      background-color: #2ecc71;
      box-shadow: 0 3px 8px rgba(46, 204, 113, 0.5);
    }
    #bottomButtons button:hover {
      background-color: #27ae60;
    }
    #bottomButtons button:nth-child(2) {
      background-color: #f39c12;
      box-shadow: 0 3px 8px rgba(243, 156, 18, 0.5);
    }
    #bottomButtons button:nth-child(2):hover {
      background-color: #d68910;
    }
    #bottomButtons button:nth-child(3) {
      background-color: #25d366;
      box-shadow: 0 3px 8px rgba(37, 211, 102, 0.5);
    }
    #bottomButtons button:nth-child(3):hover {
      background-color: #1ebe58;
    }

    /* Responsive */
    @media (max-width: 440px) {
      #buttonContainer {
        flex-direction: column;
        gap: 12px;
      }
      #bottomButtons {
        flex-direction: column;
      }
      button, #bottomButtons button {
        width: 100%;
        min-width: unset;
      }
      #videoContainer {
        width: 100%;
      }
      #barcodeListContainer {
        max-width: 100%;
      }
    }
  </style>
</head>
<body oncontextmenu="return false">

  <h1>Barkod Tarayıcı</h1>

  <div id="videoContainer">
    <video id="video" autoplay muted playsinline></video>
    <div id="flashOverlay"></div>
  </div>

  <div id="buttonContainer">
    <button id="scanButton">Kamera Aç</button>

    <div class="switch-container" title="Silmek için okut modu">
      <label class="switch">
        <input type="checkbox" id="deleteModeToggle" />
        <span class="slider"></span>
      </label>
      <span>Silmek için okut</span>
    </div>
  </div>

  <div id="barcodeListContainer">
    <table id="barcodeTable" aria-label="Okutulan barkodlar">
      <thead>
        <tr>
          <th>Barkod Değeri</th>
          <th>Adet</th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <td>Kalem Miktarı</td>
          <td id="itemCount">0</td>
        </tr>
        <tr>
          <td>Toplam Adet</td>
          <td id="totalCount">0</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div id="bottomButtons">
    <button id="clearHistoryButton" title="Okutulan barkod listesini temizle">Geçmişi Temizle</button>
    <button id="downloadExcelButton" title="Barkod listesini Excel olarak indir">Excel Olarak İndir</button>
    <button id="whatsappShareButton" title="Barkod listesini WhatsApp'ta paylaş">WhatsApp'ta Paylaş</button>
  </div>

<script>
  const scanButton = document.getElementById('scanButton');
  const clearHistoryButton = document.getElementById('clearHistoryButton');
  const downloadExcelButton = document.getElementById('downloadExcelButton');
  const whatsappShareButton = document.getElementById('whatsappShareButton');
  const video = document.getElementById('video');
  const flashOverlay = document.getElementById('flashOverlay');
  const barcodeTableBody = document.querySelector('#barcodeTable tbody');
  const beepSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
  const deleteModeToggle = document.getElementById('deleteModeToggle');

  let cameraStream = null;
  let barcodeDetector;
  const scannedBarcodes = JSON.parse(localStorage.getItem('scannedBarcodes') || '{}');
  const lastReadTimestamps = JSON.parse(localStorage.getItem('lastReadTimestamps') || '{}');
  const DEBOUNCE_TIME = 2000;

  let detectionInterval;
  let detectionTimeout;

  if ('BarcodeDetector' in window) {
    barcodeDetector = new BarcodeDetector({formats: ['code_128', 'ean_13', 'qr_code', 'upc_a']});
  } else {
    alert('Bu cihazda BarcodeDetector API desteklenmiyor.');
  }

  window.addEventListener('DOMContentLoaded', updateTable);

  scanButton.addEventListener('click', async () => {
    if (cameraStream) {
      stopCamera();
      scanButton.textContent = "Kamera Aç";
      scanButton.classList.remove('scanning');
      video.style.display = 'none';
    } else {
      await startCamera();
      scanButton.textContent = "Kapat";
      scanButton.classList.add('scanning');
      video.style.display = 'block';
    }
  });

  // Barkod algılama fonksiyonu (2 saniyelik algılama, sonra durur)
  async function detectBarcode() {
    if (!cameraStream) return;
    try {
      const barcodes = await barcodeDetector.detect(video);
      if (barcodes.length > 0) {
        const now = Date.now();
        for (const barcode of barcodes) {
          const code = barcode.rawValue;
          if (lastReadTimestamps[code] && (now - lastReadTimestamps[code]) < DEBOUNCE_TIME) {
            continue; // Çok hızlı tekrar okuma engelle
          }
          lastReadTimestamps[code] = now;

          if (deleteModeToggle.checked) {
            // Silme modu aktif: adet 1 azalt veya tamamen sil
            if (scannedBarcodes[code]) {
              if (scannedBarcodes[code] > 1) {
                scannedBarcodes[code] -= 1;
              } else {
                delete scannedBarcodes[code];
                delete lastReadTimestamps[code];
              }
              saveData();
              updateTable();
              beepSound.play();
              flashEffect();
              stopBarcodeDetection();
              break;
            }
          } else {
            // Normal mod: adet 1 arttır
            scannedBarcodes[code] = (scannedBarcodes[code] || 0) + 1;
            saveData();
            updateTable();
            beepSound.play();
            flashEffect();
            stopBarcodeDetection();
            break;
          }
        }
      }
    } catch (err) {
      console.error('Tarama hatası:', err);
      alert('Barkod algılama sırasında hata oluştu.');
      stopBarcodeDetection();
    }
  }

  // Barkod algılama başlatma (2 saniyelik tarama)
  function startBarcodeDetection() {
    if (detectionInterval) clearInterval(detectionInterval);
    if (detectionTimeout) clearTimeout(detectionTimeout);
    detectionInterval = setInterval(detectBarcode, 500);
    detectionTimeout = setTimeout(() => {
      stopBarcodeDetection();
    }, 2000);
  }

  // Barkod algılamayı durdurma
  function stopBarcodeDetection() {
    if (detectionInterval) {
      clearInterval(detectionInterval);
      detectionInterval = null;
    }
    if (detectionTimeout) {
      clearTimeout(detectionTimeout);
      detectionTimeout = null;
    }
  }

  // Kamera açma fonksiyonu
  async function startCamera() {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
      video.srcObject = cameraStream;
      video.style.display = 'block';
      // Barkod algılama başlatma burada yok
    } catch (error) {
      alert("Kamera açılamadı: " + error.message);
    }
  }

  // Kamera kapatma fonksiyonu
  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
      video.srcObject = null;
      stopBarcodeDetection();
    }
  }

  // Video tıklanınca barkod algılamayı başlat
  video.addEventListener('click', () => {
    if (!cameraStream) return;
    startBarcodeDetection();
  });

  // Flash efekti (1 saniye beyaz ekran)
  function flashEffect() {
    flashOverlay.style.opacity = '0.7';
    setTimeout(() => {
      flashOverlay.style.opacity = '0';
    }, 500);
  }

  // Tablo güncelle
  function updateTable() {
    barcodeTableBody.innerHTML = '';
    let totalCount = 0;
    let itemCount = Object.keys(scannedBarcodes).length;

    for (const code in scannedBarcodes) {
      const count = scannedBarcodes[code];
      totalCount += count;
      const row = document.createElement('tr');
      const codeCell = document.createElement('td');
      codeCell.textContent = code;
      const countCell = document.createElement('td');
      countCell.textContent = count;
      row.appendChild(codeCell);
      row.appendChild(countCell);
      barcodeTableBody.appendChild(row);
    }
    document.getElementById('itemCount').textContent = itemCount;
    document.getElementById('totalCount').textContent = totalCount;
  }

  // Veriyi localStorage'a kaydet
  function saveData() {
    localStorage.setItem('scannedBarcodes', JSON.stringify(scannedBarcodes));
    localStorage.setItem('lastReadTimestamps', JSON.stringify(lastReadTimestamps));
  }

  // Geçmişi temizle
  clearHistoryButton.addEventListener('click', () => {
    if (confirm("Barkod listesini temizlemek istediğine emin misin?")) {
      for (const key in scannedBarcodes) delete scannedBarcodes[key];
      for (const key in lastReadTimestamps) delete lastReadTimestamps[key];
      saveData();
      updateTable();
    }
  });

  // Excel indir butonu
  downloadExcelButton.addEventListener('click', () => {
    if (Object.keys(scannedBarcodes).length === 0) {
      alert('İndirilecek barkod bulunamadı.');
      return;
    }
    const wb = XLSX.utils.book_new();
    const wsData = [["Barkod", "Adet"]];
    for (const code in scannedBarcodes) {
      wsData.push([code, scannedBarcodes[code]]);
    }
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    XLSX.utils.book_append_sheet(wb, ws, "Barkodlar");
    XLSX.writeFile(wb, "barkodlar.xlsx");
  });

  // WhatsApp'ta paylaşma
  whatsappShareButton.addEventListener('click', () => {
    if (Object.keys(scannedBarcodes).length === 0) {
      alert('Paylaşılacak barkod bulunamadı.');
      return;
    }
    let message = "Barkod Listesi:\n";
    for (const code in scannedBarcodes) {
      message += `${code}: ${scannedBarcodes[code]} adet\n`;
    }
    const encodedMessage = encodeURIComponent(message);
    const url = `https://wa.me/?text=${encodedMessage}`;
    window.open(url, '_blank');
  });

</script>

</body>
</html>
