<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barkod Okuyucu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f0f0f0;
    }
    #video {
      width: 100%;
      max-width: 400px;
      border: 2px solid #333;
      border-radius: 8px;
      display: none;
      cursor: pointer;
      position: relative;
    }
    #laserLine {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      background: red;
      opacity: 0;
      animation: laserMove 1s linear infinite;
      pointer-events: none;
      z-index: 10;
    }
    @keyframes laserMove {
      0% { transform: translateY(-10px); }
      50% { transform: translateY(10px); }
      100% { transform: translateY(-10px); }
    }
    #flashOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      z-index: 1000;
    }
    #barcodeOverlay {
      position: fixed;
      top: 20px; left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      font-weight: bold;
      z-index: 1001;
    }
    table {
      width: 100%;
      max-width: 600px;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 0 6px #ccc;
    }
    th, td {
      padding: 8px 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background: #222;
      color: white;
    }
    button {
      cursor: pointer;
      background: #3498db;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      margin: 4px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background: #2980b9;
    }
    #scanButton.scanning {
      background: #e67e22;
    }
    #deleteModeToggle {
      margin-left: 10px;
    }
    #manualEntryForm {
      margin-top: 15px;
      max-width: 400px;
    }
    #manualBarcodeInput {
      padding: 8px;
      width: calc(100% - 100px);
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin-right: 8px;
    }
    #totalCount {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Barkod Okuyucu</h1>
  
  <button id="scanButton">Kamera Aç</button>
  <label>
    <input type="checkbox" id="deleteModeToggle" />
    Silme Modu
  </label>

  <div style="position:relative; max-width:400px; margin-top: 10px;">
    <video id="video" playsinline></video>
    <div id="laserLine"></div>
  </div>

  <form id="manualEntryForm">
    <input type="text" id="manualBarcodeInput" placeholder="Barkodu elle girin" autocomplete="off" />
    <button type="submit">Ekle</button>
  </form>

  <div id="flashOverlay"></div>
  <div id="barcodeOverlay"></div>

  <table>
    <thead>
      <tr>
        <th>Barkod</th>
        <th>Adet</th>
        <th>İşlem</th>
      </tr>
    </thead>
    <tbody id="barcodeTableBody"></tbody>
  </table>

  <div id="totalCount">Toplam: 0</div>

  <div style="margin-top: 15px;">
    <button id="clearAllBtn">Tümünü Sil</button>
    <button id="exportExcelBtn">Excel İndir</button>
    <button id="copyListBtn">Listeyi Kopyala</button>
  </div>

  <audio id="beepSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>

  <!-- ZXing library -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <!-- XLSX library -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <script>
    (function () {
      const { BrowserMultiFormatReader } = ZXing;
      const video = document.getElementById('video');
      const scanButton = document.getElementById('scanButton');
      const deleteModeToggle = document.getElementById('deleteModeToggle');
      const barcodeTableBody = document.getElementById('barcodeTableBody');
      const totalCountElem = document.getElementById('totalCount');
      const manualEntryForm = document.getElementById('manualEntryForm');
      const manualBarcodeInput = document.getElementById('manualBarcodeInput');
      const flashOverlay = document.getElementById('flashOverlay');
      const barcodeOverlay = document.getElementById('barcodeOverlay');
      const laserLine = document.getElementById('laserLine');
      const clearAllBtn = document.getElementById('clearAllBtn');
      const exportExcelBtn = document.getElementById('exportExcelBtn');
      const copyListBtn = document.getElementById('copyListBtn');
      const beepSound = document.getElementById('beepSound');

      let codeReader = null;
      let cameraStarted = false;
      let scanning = false;
      let animationFrameId = null;
      let selectedDeviceId = null;
      const barcodeMap = new Map();

      // localStorage'a kaydetme fonksiyonu
      function saveToLocalStorage() {
        const obj = Object.fromEntries(barcodeMap);
        localStorage.setItem('barcodeData', JSON.stringify(obj));
      }

      // localStorage'dan yükleme fonksiyonu
      function loadFromLocalStorage() {
        const data = localStorage.getItem('barcodeData');
        if (data) {
          const obj = JSON.parse(data);
          for (const [code, count] of Object.entries(obj)) {
            barcodeMap.set(code, count);
          }
          updateTable();
        }
      }

      async function startCamera() {
        if (cameraStarted) return;
        codeReader = new BrowserMultiFormatReader();
        try {
          const devices = await codeReader.listVideoInputDevices();
          if (devices.length === 0) return alert('Kamera bulunamadı.');
          selectedDeviceId = devices.find(d => d.label.toLowerCase().includes('back'))?.deviceId || devices[0].deviceId;
          const stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: selectedDeviceId } } });
          video.srcObject = stream;
          video.style.display = 'block';
          await video.play();
          cameraStarted = true;
          scanButton.textContent = 'Kamerayı Kapat';
          scanButton.classList.add('scanning');
        } catch (e) {
          alert('Kamera hatası: ' + e.message);
          stopCamera();
        }
      }

      function stopCamera() {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(track => track.stop());
          video.srcObject = null;
        }
        codeReader?.reset();
        codeReader = null;
        scanning = false;
        cameraStarted = false;
        video.style.display = 'none';
        laserLine.style.opacity = 0;
        scanButton.textContent = 'Kamera Aç';
        scanButton.classList.remove('scanning');
        cancelAnimationFrame(animationFrameId);
      }

      function scanFrame() {
        if (!scanning) return;
        codeReader.decodeOnce(video).then(result => {
          if (result?.text) {
            handleBarcode(result.text);
            flashEffect();
            beepSound.currentTime = 0;
            beepSound.play().catch(() => {});
            stopScanning();
          }
          if (scanning) animationFrameId = requestAnimationFrame(scanFrame);
        }).catch(() => {
          if (scanning) animationFrameId = requestAnimationFrame(scanFrame);
        });
      }

      function startScanning() {
        if (!cameraStarted || scanning) return;
        scanning = true;
        laserLine.style.opacity = 1;
        scanFrame();
      }

      function stopScanning() {
        scanning = false;
        laserLine.style.opacity = 0;
        cancelAnimationFrame(animationFrameId);
      }

      function handleBarcode(text) {
        if (!text) return;
        if (deleteModeToggle.checked) {
          if (barcodeMap.has(text)) {
            let count = barcodeMap.get(text);
            count > 1 ? barcodeMap.set(text, count - 1) : barcodeMap.delete(text);
            updateTable();
            saveToLocalStorage();  // localStorage güncelle
            showOverlay(`Silindi: ${text}`);
          } else {
            showOverlay(`Bulunamadı: ${text}`);
          }
        } else {
          barcodeMap.set(text, (barcodeMap.get(text) || 0) + 1);
          updateTable();
          saveToLocalStorage();  // localStorage güncelle
          showOverlay(text);
          beepSound.currentTime = 0;
          beepSound.play().catch(() => {});
        }
      }

      function updateTable() {
        barcodeTableBody.innerHTML = '';
        let total = 0;

        const entries = Array.from(barcodeMap.entries()).reverse();

        entries.forEach(([code, count]) => {
          total += count;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td title="${code}">${code}</td>
            <td>${count}</td>
            <td><button style="background:#e74c3c;color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer">Sil</button></td>`;
          tr.querySelector('button').addEventListener('click', () => {
            if (confirm(`"${code}" barkodunu silmek istediğinize emin misiniz?`)) {
              barcodeMap.delete(code);
              updateTable();
              saveToLocalStorage(); // silme sonrası güncelle
            }
          });
          barcodeTableBody.appendChild(tr);
        });

        totalCountElem.textContent = total;
      }

      function flashEffect() {
        flashOverlay.style.opacity = '1';
        setTimeout(() => flashOverlay.style.opacity = '0', 150);
      }

      function showOverlay(text) {
        barcodeOverlay.textContent = text;
        barcodeOverlay.style.opacity = '1';
        setTimeout(() => barcodeOverlay.style.opacity = '0', 1500);
      }

      manualEntryForm.addEventListener('submit', e => {
        e.preventDefault();
        const val = manualBarcodeInput.value.trim();
        if (val) {
          handleBarcode(val);
          manualBarcodeInput.value = '';
          manualBarcodeInput.focus();
        }
      });

      scanButton.addEventListener('click', () => {
        cameraStarted ? stopCamera() : startCamera();
      });

      video.addEventListener('click', () => {
        if (!cameraStarted) return;
        scanning ? (stopScanning(), showOverlay('Tarama durduruldu')) : (startScanning(), showOverlay('Tarama başladı'));
      });

      clearAllBtn.addEventListener('click', () => {
        if (confirm('Tüm barkodları silmek istiyor musunuz?')) {
          barcodeMap.clear();
          updateTable();
          localStorage.removeItem('barcodeData');  // localStorage temizle
        }
      });

      exportExcelBtn.addEventListener('click', () => {
        if (!barcodeMap.size) return alert('İndirilecek barkod yok.');
        const wb = XLSX.utils.book_new();
        const data = [['Barkod', 'Adet']];
        barcodeMap.forEach((count, code) => data.push([code, count]));
        const ws = XLSX.utils.aoa_to_sheet(data);
        XLSX.utils.book_append_sheet(wb, ws, 'Barkodlar');
        XLSX.writeFile(wb, 'barkodlar.xlsx');
      });

      copyListBtn.addEventListener('click', () => {
        if (!barcodeMap.size) return alert('Kopyalanacak barkod yok.');
        const text = Array.from(barcodeMap).map(([code, count]) => `${code}\t${count}`).join('\n');
        navigator.clipboard.writeText(text).then(() => alert('Liste kopyalandı!')).catch(() => alert('Kopyalama başarısız.'));
      });

      // Sayfa yüklendiğinde localStorage'dan veri yükle
      loadFromLocalStorage();

      manualBarcodeInput.focus();
    })();
  </script>

</body>
</html>
