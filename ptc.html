<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Barkod Tarayıcı</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fafafa;
  }
  video {
    width: 90vw;
    max-width: 400px;
    border: 1px solid #ccc;
    margin-bottom: 15px;
    border-radius: 8px;
    background: black;
  }
  #buttonContainer {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  button {
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
    user-select: none;
    border-radius: 6px;
    border: 1px solid #444;
    background-color: #eee;
    transition: background-color 0.2s;
  }
  button:active {
    background-color: #ccc;
  }
  #barcodeListContainer {
    width: 90vw;
    max-width: 400px;
  }
  h1 {
    margin-bottom: 10px;
    text-align: center;
    color: #333;
  }
  /* Tablo stili */
  #barcodeTable {
    width: 100%;
    border-collapse: collapse;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    background: #fff;
  }
  #barcodeTable thead {
    background-color: #4CAF50;
    color: white;
  }
  #barcodeTable th, #barcodeTable td {
    padding: 12px 15px;
    text-align: left;
    border-bottom: 1px solid #ddd;
  }
  #barcodeTable tbody tr:hover {
    background-color: #f1f1f1;
  }
</style>
</head>
<body>

<video id="video" autoplay muted playsinline style="display:none;"></video>

<div id="buttonContainer">
  <button id="scanButton">Scan</button>
  <button id="okutButton" disabled>Okut</button>
  <button id="clearHistoryButton" title="Geçmişi Temizle">Geçmişi Temizle</button>
</div>

<div id="barcodeListContainer">
  <h1>Okutulan Barkodlar</h1>
  <table id="barcodeTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Barkod Değeri</th>
        <th>Adet</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
  const scanButton = document.getElementById('scanButton');
  const okutButton = document.getElementById('okutButton');
  const clearHistoryButton = document.getElementById('clearHistoryButton');
  const video = document.getElementById('video');
  const barcodeTableBody = document.querySelector('#barcodeTable tbody');
  const beepSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

  let cameraStream = null;
  let scanning = false;
  let barcodeDetector;
  let scanInterval = null;

  // scannedBarcodes nesnesi: barkod => adet
  let scannedBarcodes = JSON.parse(localStorage.getItem('scannedBarcodes') || '{}');

  if ('BarcodeDetector' in window) {
    barcodeDetector = new BarcodeDetector({formats: ['code_128', 'ean_13', 'qr_code', 'upc_a']});
  } else {
    alert('Bu cihazda BarcodeDetector API desteklenmiyor.');
  }

  // Sayfa yüklendiğinde kayıtlı barkodları tabloya ekle
  window.addEventListener('DOMContentLoaded', () => {
    updateTable();
  });

  scanButton.addEventListener('click', async () => {
    if (cameraStream) {
      stopCamera();
      scanButton.textContent = "Scan";
      okutButton.disabled = true;
      stopScanning();
    } else {
      await startCamera();
      scanButton.textContent = "Stop";
      okutButton.disabled = false;
    }
  });

  okutButton.addEventListener('mousedown', startScanning);
  okutButton.addEventListener('touchstart', startScanning);
  okutButton.addEventListener('mouseup', stopScanning);
  okutButton.addEventListener('mouseleave', stopScanning);
  okutButton.addEventListener('touchend', stopScanning);
  okutButton.addEventListener('touchcancel', stopScanning);

  clearHistoryButton.addEventListener('click', () => {
    scannedBarcodes = {};
    localStorage.removeItem('scannedBarcodes');
    updateTable();
  });

  async function startCamera() {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
      video.srcObject = cameraStream;
      video.style.display = 'block';
    } catch (err) {
      alert('Kameraya erişilemedi: ' + err.message);
    }
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
    video.style.display = 'none';
  }

  function startScanning() {
    if (!cameraStream || scanning) return;
    scanning = true;
    scanInterval = setInterval(scanFrame, 500);
  }

  function stopScanning() {
    if (!scanning) return;
    scanning = false;
    clearInterval(scanInterval);
    scanInterval = null;
  }

  async function scanFrame() {
    if (!scanning) return;
    try {
      const barcodes = await barcodeDetector.detect(video);
      if (barcodes.length > 0) {
        barcodes.forEach(barcode => {
          const code = barcode.rawValue;
          if (scannedBarcodes[code]) {
            scannedBarcodes[code]++;
          } else {
            scannedBarcodes[code] = 1;
          }
          saveBarcodesToStorage();
          updateTable();
          beepSound.play();
        });
      }
    } catch (err) {
      console.error('Tarama hatası:', err);
    }
  }

  // Tabloyu güncelle
  function updateTable() {
    barcodeTableBody.innerHTML = '';
    const keys = Object.keys(scannedBarcodes);
    keys.forEach((code, i) => {
      const count = scannedBarcodes[code];
      const row = document.createElement('tr');

      const cellIndex = document.createElement('td');
      cellIndex.textContent = i + 1;
      const cellCode = document.createElement('td');
      cellCode.textContent = code;
      const cellCount = document.createElement('td');
      cellCount.textContent = count;

      row.appendChild(cellIndex);
      row.appendChild(cellCode);
      row.appendChild(cellCount);

      barcodeTableBody.appendChild(row);
    });
  }

  function saveBarcodesToStorage() {
    localStorage.setItem('scannedBarcodes', JSON.stringify(scannedBarcodes));
  }
</script>

</body>
</html>
