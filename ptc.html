<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barkod Tarayıcı</title>
  <style>
    /* Genel stiller */
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f9fc;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
    }

    /* Manuel giriş formu */
    #manualEntryForm {
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: nowrap;
      align-items: center;
    }
    #manualBarcodeInput {
      padding: 12px 16px;
      border-radius: 9999px;
      border: 1px solid #ccc;
      font-size: 16px;
      width: 220px;
      outline-offset: 2px;
      user-select: text;
    }
    #manualEntryForm button {
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 9999px;
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(52, 152, 219, 0.5);
    }
    #manualEntryForm button:hover {
      background-color: #2980b9;
    }

    h1 {
      font-weight: 700;
      margin-bottom: 12px;
      color: #2c3e50;
      text-align: center;
      user-select: text;
    }

    /* Video kutusu */
    #videoContainer {
      position: relative;
      width: 320px;
      max-width: 90vw;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      margin-bottom: 25px;
      background: #000;
    }
    video {
      width: 100%;
      height: auto;
      display: none;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
    }

    /* Lazer çizgisi */
    #laserLine {
      position: absolute;
      top: 50%;
      left: 5%;
      right: 5%;
      height: 3px;
      background: linear-gradient(to right, transparent, rgba(255, 0, 0, 0.8), transparent);
      transform: translateY(-50%);
      border-radius: 2px;
      box-shadow: 0 0 8px 2px rgba(255, 0, 0, 0.7);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 20;
    }

    #flashOverlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      border-radius: 12px;
      z-index: 10;
    }

    #barcodeOverlay {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44, 62, 80, 0.8);
      color: white;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 15;
      max-width: 90%;
      text-align: center;
    }

    /* Diğer butonlar */
    #buttonContainer, #bottomButtons {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }
    button {
      background-color: #3498db;
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(52, 152, 219, 0.4);
      transition: background-color 0.25s ease;
      min-width: 120px;
    }
    button:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background-color: #2980b9;
    }
    button.scanning {
      background-color: #e74c3c !important;
      box-shadow: 0 3px 8px rgba(231, 76, 60, 0.6);
    }

    .switch-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      color: #2c3e50;
    }

    .switch {
      position: relative;
      width: 52px;
      height: 28px;
      display: inline-block;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #bdc3c7;
      transition: 0.4s;
      border-radius: 28px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #e74c3c;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }

    #barcodeListContainer {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      padding: 20px 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      color: #34495e;
    }
    thead {
      background-color: #3498db;
      color: white;
      font-weight: 700;
    }
    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #ecf0f1;
    }
    tbody tr:hover {
      background-color: #f0f8ff;
    }
    tfoot td {
      font-weight: 700;
      background-color: #f9f9f9;
      color: #2c3e50;
      padding: 12px;
    }

    #bottomButtons button:nth-child(2) {
      background-color: #f39c12;
      box-shadow: 0 3px 8px rgba(243, 156, 18, 0.5);
    }
    #bottomButtons button:nth-child(2):hover {
      background-color: #d68910;
    }
    #bottomButtons button:nth-child(3) {
      background-color: #25d366;
      box-shadow: 0 3px 8px rgba(37, 211, 102, 0.5);
    }
    #bottomButtons button:nth-child(3):hover {
      background-color: #1ebe58;
    }

    @media (max-width: 440px) {
      #buttonContainer, #bottomButtons {
        flex-direction: column;
      }
      button {
        width: 100%;
        min-width: unset;
      }
    }
  </style>
</head>
<body oncontextmenu="return false">

  <form id="manualEntryForm" autocomplete="off">
    <input type="tel" inputmode="numeric" pattern="[0-9]*" id="manualBarcodeInput" placeholder="THM/EAN" maxlength="100" required />
    <button type="submit">Ekle</button>
  </form>

  <div id="videoContainer">
    <video id="video" autoplay muted playsinline></video>
    <div id="flashOverlay"></div>
    <div id="laserLine"></div>
    <div id="barcodeOverlay"></div>
  </div>

  <div id="buttonContainer">
    <button id="scanButton">Kamera Aç</button>
    <div class="switch-container">
      <label class="switch">
        <input type="checkbox" id="deleteModeToggle" />
        <span class="slider"></span>
      </label>
      Silmek İçin Okut
    </div>
  </div>

  <div id="barcodeListContainer">
    <table>
      <thead>
        <tr><th>Barkod</th><th>Adet</th><th>İşlem</th></tr>
      </thead>
      <tbody id="barcodeTableBody"></tbody>
      <tfoot><tr><td>Toplam</td><td id="totalCount" colspan="2">0</td></tr></tfoot>
    </table>
  </div>

  <div id="bottomButtons">
    <button id="clearAllBtn">Temizle</button>
    <button id="exportExcelBtn">Excel İndir</button>
    <button id="copyListBtn">Listeyi Kopyala</button>
  </div>

  <!-- 🔊 Bip sesi (çevrimiçi) -->
  <audio id="beepSound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg" preload="auto"></audio>

  <!-- Gerekli kütüphaneler -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    (function () {
      const { BrowserMultiFormatReader } = ZXing;
      const video = document.getElementById('video');
      const scanButton = document.getElementById('scanButton');
      const deleteModeToggle = document.getElementById('deleteModeToggle');
      const barcodeTableBody = document.getElementById('barcodeTableBody');
      const totalCountElem = document.getElementById('totalCount');
      const manualEntryForm = document.getElementById('manualEntryForm');
      const manualBarcodeInput = document.getElementById('manualBarcodeInput');
      const flashOverlay = document.getElementById('flashOverlay');
      const barcodeOverlay = document.getElementById('barcodeOverlay');
      const laserLine = document.getElementById('laserLine');
      const clearAllBtn = document.getElementById('clearAllBtn');
      const exportExcelBtn = document.getElementById('exportExcelBtn');
      const copyListBtn = document.getElementById('copyListBtn');
      const beepSound = document.getElementById('beepSound');

      let codeReader = null;
      let cameraStarted = false;
      let scanning = false;
      let animationFrameId = null;
      let selectedDeviceId = null;
      const barcodeMap = new Map();

      async function startCamera() {
        if (cameraStarted) return;
        codeReader = new BrowserMultiFormatReader();
        try {
          const devices = await codeReader.listVideoInputDevices();
          if (devices.length === 0) return alert('Kamera bulunamadı.');
          selectedDeviceId = devices.find(d => d.label.toLowerCase().includes('back'))?.deviceId || devices[0].deviceId;
          const stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: selectedDeviceId } } });
          video.srcObject = stream;
          video.style.display = 'block';
          await video.play();
          cameraStarted = true;
          scanButton.textContent = 'Kamerayı Kapat';
          scanButton.classList.add('scanning');
        } catch (e) {
          alert('Kamera hatası: ' + e.message);
          stopCamera();
        }
      }

      function stopCamera() {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach(track => track.stop());
          video.srcObject = null;
        }
        codeReader?.reset();
        codeReader = null;
        scanning = false;
        cameraStarted = false;
        video.style.display = 'none';
        laserLine.style.opacity = 0;
        scanButton.textContent = 'Kamera Aç';
        scanButton.classList.remove('scanning');
        cancelAnimationFrame(animationFrameId);
      }

      function scanFrame() {
        if (!scanning) return;
        codeReader.decodeOnce(video).then(result => {
          if (result?.text) {
            handleBarcode(result.text);
            flashEffect();
            beepSound.currentTime = 0;
            beepSound.play().catch(() => {});
            stopScanning();
          }
          if (scanning) animationFrameId = requestAnimationFrame(scanFrame);
        }).catch(() => {
          if (scanning) animationFrameId = requestAnimationFrame(scanFrame);
        });
      }

      function startScanning() {
        if (!cameraStarted || scanning) return;
        scanning = true;
        laserLine.style.opacity = 1;
        scanFrame();
      }

      function stopScanning() {
        scanning = false;
        laserLine.style.opacity = 0;
        cancelAnimationFrame(animationFrameId);
      }

     function handleBarcode(text) {
  if (!text) return;
  if (deleteModeToggle.checked) {
    if (barcodeMap.has(text)) {
      let count = barcodeMap.get(text);
      count > 1 ? barcodeMap.set(text, count - 1) : barcodeMap.delete(text);
      updateTable();
      showOverlay(`Silindi: ${text}`);
    } else {
      showOverlay(`Bulunamadı: ${text}`);
    }
  } else {
    barcodeMap.set(text, (barcodeMap.get(text) || 0) + 1);
    updateTable();
    showOverlay(text);  // Burayı değiştirdik
    beepSound.currentTime = 0;
    beepSound.play().catch(() => {});
  }
}


      function updateTable() {
        barcodeTableBody.innerHTML = '';
        let total = 0;
        barcodeMap.forEach((count, code) => {
          total += count;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td title="${code}">${code}</td>
            <td>${count}</td>
            <td><button style="background:#e74c3c;color:white;border:none;padding:6px 10px;border-radius:6px;cursor:pointer">Sil</button></td>`;
          tr.querySelector('button').addEventListener('click', () => {
            barcodeMap.delete(code);
            updateTable();
          });
          barcodeTableBody.appendChild(tr);
        });
        totalCountElem.textContent = total;
      }

      function flashEffect() {
        flashOverlay.style.opacity = '1';
        setTimeout(() => flashOverlay.style.opacity = '0', 150);
      }

      function showOverlay(text) {
        barcodeOverlay.textContent = text;
        barcodeOverlay.style.opacity = '1';
        setTimeout(() => barcodeOverlay.style.opacity = '0', 1500);
      }

      manualEntryForm.addEventListener('submit', e => {
        e.preventDefault();
        const val = manualBarcodeInput.value.trim();
        if (val) {
          handleBarcode(val);
          manualBarcodeInput.value = '';
          manualBarcodeInput.focus();
        }
      });

      scanButton.addEventListener('click', () => {
        cameraStarted ? stopCamera() : startCamera();
      });

      video.addEventListener('click', () => {
        if (!cameraStarted) return;
        scanning ? (stopScanning(), showOverlay('Tarama durduruldu')) : (startScanning(), showOverlay('Tarama başladı'));
      });

      clearAllBtn.addEventListener('click', () => {
        if (confirm('Tüm barkodları silmek istiyor musunuz?')) {
          barcodeMap.clear();
          updateTable();
        }
      });

      exportExcelBtn.addEventListener('click', () => {
        if (!barcodeMap.size) return alert('İndirilecek barkod yok.');
        const wb = XLSX.utils.book_new();
        const data = [['Barkod', 'Adet']];
        barcodeMap.forEach((count, code) => data.push([code, count]));
        const ws = XLSX.utils.aoa_to_sheet(data);
        XLSX.utils.book_append_sheet(wb, ws, 'Barkodlar');
        XLSX.writeFile(wb, 'barkodlar.xlsx');
      });

      copyListBtn.addEventListener('click', () => {
        if (!barcodeMap.size) return alert('Kopyalanacak barkod yok.');
        const text = Array.from(barcodeMap).map(([code, count]) => `${code}\t${count}`).join('\n');
        navigator.clipboard.writeText(text).then(() => alert('Liste kopyalandı!')).catch(() => alert('Kopyalama başarısız.'));
      });

      manualBarcodeInput.focus();
    })();
  </script>

</body>
</html>
