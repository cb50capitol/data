<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Barkod Okuyucu</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
  * { user-select: none; }
  body {
    font-family: Arial, sans-serif;
    margin: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fafafa;
  }
  #videoContainer {
    position: relative;
    margin-bottom: 20px;
  }
  video {
    width: 90vw;
    max-width: 400px;
    border-radius: 8px;
    background: black;
    transition: filter 0.3s ease;
    display: none;
  }
  video.blurred {
    filter: blur(6px);
  }
  #flashOverlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.7);
    opacity: 0;
    pointer-events: none;
    border-radius: 8px;
    transition: opacity 0.2s ease;
  }
  #buttonContainer, #bottomButtons {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 10px 18px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid #444;
    background-color: #eee;
    transition: background-color 0.2s;
  }
  button:active {
    background-color: #ccc;
  }
  button.scanning {
    background-color: #e74c3c;
    color: white;
    border-color: #c0392b;
  }
  #okutButton {
    width: 150px;
  }
  #barcodeListContainer {
    width: 90vw;
    max-width: 400px;
  }
  h1 {
    margin-bottom: 10px;
    text-align: center;
    color: #333;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    background: #fff;
  }
  thead {
    background-color: #4CAF50;
    color: white;
  }
  th, td {
    padding: 12px 15px;
    text-align: left;
    border-bottom: 1px solid #ddd;
  }
  tbody tr:hover {
    background-color: #f1f1f1;
  }
  tfoot td {
    font-weight: bold;
    background: #eee;
  }
  .delete-button {
    margin-left: 10px;
    color: white;
    background: #e74c3c;
    border: none;
    border-radius: 4px;
    padding: 2px 6px;
    cursor: pointer;
    font-weight: bold;
  }
  #manualBarcodeInput {
    padding: 8px;
    font-size: 16px;
    width: 220px;
    border-radius: 6px;
    border: 1px solid #ccc;
    margin-bottom: 10px;
  }
</style>
</head>
<body oncontextmenu="return false">

<div id="videoContainer">
  <video id="video" autoplay muted playsinline></video>
  <div id="flashOverlay"></div>
</div>

<div id="buttonContainer">
  <button id="scanButton">Kamera</button>
  <button id="okutButton" disabled>Okut</button>
</div>

<div style="margin-bottom: 20px;">
  <input type="text" id="manualBarcodeInput" placeholder="Barkod gir..." />
  <button onclick="addManualBarcode()">Ekle</button>
</div>

<div id="barcodeListContainer">
  <h1>Okutulan Barkodlar</h1>
  <table id="barcodeTable">
    <thead>
      <tr>
        <th>Barkod Değeri</th>
        <th>Adet</th>
      </tr>
    </thead>
    <tbody></tbody>
    <tfoot>
      <tr>
        <td>Kalem Miktarı</td>
        <td id="itemCount"></td>
      </tr>
      <tr>
        <td>Toplam Adet</td>
        <td id="totalCount"></td>
      </tr>
    </tfoot>
  </table>
</div>

<div id="bottomButtons">
  <button id="clearHistoryButton">Geçmişi Temizle</button>
  <button id="downloadExcelButton">Excel Olarak İndir</button>
  <button id="whatsappShareButton">WhatsApp'ta Paylaş</button>
</div>

<script>
  const scanButton = document.getElementById('scanButton');
  const okutButton = document.getElementById('okutButton');
  const clearHistoryButton = document.getElementById('clearHistoryButton');
  const downloadExcelButton = document.getElementById('downloadExcelButton');
  const whatsappShareButton = document.getElementById('whatsappShareButton');
  const video = document.getElementById('video');
  const flashOverlay = document.getElementById('flashOverlay');
  const barcodeTableBody = document.querySelector('#barcodeTable tbody');
  const beepSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

  let cameraStream = null;
  let scanning = false;
  let barcodeDetector;
  let scanInterval = null;

  let scannedBarcodes = JSON.parse(localStorage.getItem('scannedBarcodes') || '{}');
  let lastReadTimestamps = JSON.parse(localStorage.getItem('lastReadTimestamps') || '{}');
  const DEBOUNCE_TIME = 2000;

  if ('BarcodeDetector' in window) {
    barcodeDetector = new BarcodeDetector({formats: ['code_128', 'ean_13', 'qr_code', 'upc_a']});
  } else {
    alert('Bu cihazda BarcodeDetector API desteklenmiyor.');
  }

  window.addEventListener('DOMContentLoaded', updateTable);

  scanButton.addEventListener('click', async () => {
    if (cameraStream) {
      stopCamera();
      scanButton.textContent = "Kamera";
      okutButton.disabled = true;
      stopScanning();
      okutButton.classList.remove('scanning');
      video.classList.remove('blurred');
    } else {
      await startCamera();
      scanButton.textContent = "Kapat";
      okutButton.disabled = false;
      video.classList.remove('blurred'); // Kamera açılınca net başla
    }
  });

  okutButton.addEventListener('mousedown', startScanning);
  okutButton.addEventListener('touchstart', startScanning);

  okutButton.addEventListener('mouseup', stopScanningAndReset);
  okutButton.addEventListener('mouseleave', stopScanningAndReset);
  okutButton.addEventListener('touchend', stopScanningAndReset);
  okutButton.addEventListener('touchcancel', stopScanningAndReset);

  clearHistoryButton.addEventListener('click', () => {
    if (confirm("Tüm geçmişi silmek istediğinizden emin misiniz?")) {
      scannedBarcodes = {};
      lastReadTimestamps = {};
      localStorage.removeItem('scannedBarcodes');
      localStorage.removeItem('lastReadTimestamps');
      updateTable();
    }
  });

  downloadExcelButton.addEventListener('click', () => {
    const wb = XLSX.utils.book_new();
    const rows = [['Barkod Değeri', 'Adet']];
    const keys = Object.keys(scannedBarcodes);
    let total = 0;

    keys.forEach(code => {
      const count = scannedBarcodes[code];
      rows.push([code, count]);
      total += count;
    });

    rows.push([]);
    rows.push(['Kalem Miktarı', keys.length]);
    rows.push(['Toplam Adet', total]);

    const ws = XLSX.utils.aoa_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, 'Barkodlar');
    XLSX.writeFile(wb, 'barkod_listesi.xlsx');
  });

  whatsappShareButton.addEventListener('click', () => {
    let text = "📦 Barkod Listesi:\n\n";
    const keys = Object.keys(scannedBarcodes);
    let total = 0;

    keys.forEach(code => {
      const count = scannedBarcodes[code];
      text += `🔹 ${code} — ${count} adet\n`;
      total += count;
    });

    text += `\n📌 Kalem Sayısı: ${keys.length}\n📊 Toplam Adet: ${total}`;

    const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
    window.open(url, '_blank');
  });

  function startCamera() {
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        cameraStream = stream;
        video.srcObject = stream;
        video.style.display = 'block';
        return new Promise(resolve => {
          video.onloadedmetadata = () => {
            video.play();
            resolve();
          };
        });
      })
      .catch(err => {
        alert("Kameraya erişilemedi: " + err);
      });
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
      video.style.display = 'none';
    }
  }

  function startScanning() {
    if (!cameraStream || scanning) return;

    scanning = true;
    okutButton.classList.add('scanning');
    flashOverlay.style.opacity = '1';
    video.classList.remove('blurred'); // Başlangıçta net

    scanInterval = setInterval(() => {
      barcodeDetector.detect(video)
        .then(barcodes => {
          if (barcodes.length === 0) return;

          const now = Date.now();
          barcodes.forEach(barcode => {
            const code = barcode.rawValue;
            if (!code) return;

            if ((now - (lastReadTimestamps[code] || 0)) > DEBOUNCE_TIME) {
              beepSound.play();
              lastReadTimestamps[code] = now;
              scannedBarcodes[code] = (scannedBarcodes[code] || 0) + 1;
              saveData();
              updateTable();
              // Barkod okunduğunda kamera flu olacak:
              video.classList.add('blurred');
              flashOverlay.style.opacity = '0';
            }
          });
        })
        .catch(e => console.error('Barcode detection error:', e));
    }, 300);
  }

  function stopScanningAndReset() {
    scanning = false;
    clearInterval(scanInterval);
    okutButton.classList.remove('scanning');
    flashOverlay.style.opacity = '0';
    video.classList.remove('blurred'); // Okut butonu bırakılınca kamera net olsun
  }

  function stopScanning() {
    scanning = false;
    clearInterval(scanInterval);
    okutButton.classList.remove('scanning');
    flashOverlay.style.opacity = '0';
    video.classList.remove('blurred');
  }

  function saveData() {
    localStorage.setItem('scannedBarcodes', JSON.stringify(scannedBarcodes));
    localStorage.setItem('lastReadTimestamps', JSON.stringify(lastReadTimestamps));
  }

  function updateTable() {
    barcodeTableBody.innerHTML = '';
    const keys = Object.keys(scannedBarcodes).sort((a, b) => (lastReadTimestamps[b] || 0) - (lastReadTimestamps[a] || 0));
    let totalCount = 0;

    keys.forEach(code => {
      const count = scannedBarcodes[code];
      totalCount += count;

      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${code}</td>
        <td>
          ${count}
          <button class="delete-button" onclick="confirmDeleteBarcode('${code}')">-</button>
        </td>
      `;
      barcodeTableBody.appendChild(row);
    });

    document.getElementById('itemCount').textContent = keys.length;
    document.getElementById('totalCount').textContent = totalCount;
  }

  function confirmDeleteBarcode(code) {
    if (confirm(`"${code}" barkodunu silmek istediğinizden emin misiniz?`)) {
      delete scannedBarcodes[code];
      delete lastReadTimestamps[code];
      saveData();
      updateTable();
    }
  }

  function addManualBarcode() {
    const input = document.getElementById('manualBarcodeInput');
    const code = input.value.trim();
    if (code === '') return;

    scannedBarcodes[code] = (scannedBarcodes[code] || 0) + 1;
    lastReadTimestamps[code] = Date.now();
    saveData();
    updateTable();
    input.value = '';
  }
</script>

</body>
</html>
