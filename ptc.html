<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barkod Tarayıcı</title>
  <style>
     * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f9fc;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
    }

    #manualEntryForm {
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: nowrap;
      align-items: center;
    }
    #manualBarcodeInput {
      padding: 12px 16px;
      border-radius: 9999px;
      border: 1px solid #ccc;
      font-size: 16px;
      width: 220px;
      outline-offset: 2px;
      user-select: text;
    }
    #manualEntryForm button {
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 9999px;
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(52, 152, 219, 0.5);
    }
    #manualEntryForm button:hover {
      background-color: #2980b9;
    }

    h1 {
      font-weight: 700;
      margin-bottom: 12px;
      color: #2c3e50;
      text-align: center;
      user-select: text;
    }

    #videoContainer {
      position: relative;
      width: 320px;
      max-width: 90vw;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      margin-bottom: 25px;
      background: #000;
    }
    video {
      width: 100%;
      height: auto;
      display: none;
      object-fit: cover;
      border-radius: 12px;
      cursor: pointer;
    }

    #laserLine {
      position: absolute;
      top: 50%;
      left: 5%;
      right: 5%;
      height: 3px;
      background: linear-gradient(to right, transparent, rgba(255, 0, 0, 0.8), transparent);
      transform: translateY(-50%);
      border-radius: 2px;
      box-shadow: 0 0 8px 2px rgba(255, 0, 0, 0.7);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 20;
    }

    #flashOverlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      border-radius: 12px;
      z-index: 10;
    }

    #barcodeOverlay {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44, 62, 80, 0.8);
      color: white;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 15;
      max-width: 90%;
      text-align: center;
      white-space: nowrap;
      user-select: text;
    }

    #buttonContainer, #bottomButtons {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
    }

    button {
      background-color: #3498db;
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(52, 152, 219, 0.4);
      transition: background-color 0.25s ease;
      min-width: 120px;
    }
    button:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background-color: #2980b9;
    }
    button.scanning {
      background-color: #e74c3c !important;
      box-shadow: 0 3px 8px rgba(231, 76, 60, 0.6);
    }

    .switch-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      color: #2c3e50;
      user-select: text;
    }

    .switch {
      position: relative;
      width: 52px;
      height: 28px;
      display: inline-block;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #bdc3c7;
      transition: 0.4s;
      border-radius: 28px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #e74c3c;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }

    #barcodeListContainer {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      padding: 20px 15px;
      margin-bottom: 20px;
      user-select: text;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      color: #34495e;
    }
    thead {
      background-color: #3498db;
      color: white;
      font-weight: 700;
    }
    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #ecf0f1;
      vertical-align: middle;
    }
    tbody tr:hover {
      background-color: #f0f8ff;
    }
    tfoot td {
      font-weight: 700;
      background-color: #f9f9f9;
      color: #2c3e50;
      padding: 12px;
      white-space: pre-line;
    }

    #bottomButtons button:nth-child(1) {
      background-color: #e74c3c;
      box-shadow: 0 3px 8px rgba(231, 76, 60, 0.5);
    }
    #bottomButtons button:nth-child(1):hover {
      background-color: #c0392b;
    }
    #bottomButtons button:nth-child(2) {
      background-color: #217346;
      box-shadow: 0 3px 8px rgba(33, 115, 70, 0.5);
    }
    #bottomButtons button:nth-child(2):hover {
      background-color: #1e633d;
    }
    #bottomButtons button:nth-child(3) {
      background-color: #34495e;
      box-shadow: 0 3px 8px rgba(52, 73, 94, 0.5);
    }
    #bottomButtons button:nth-child(3):hover {
      background-color: #2c3e50;
    }

    @media (max-width: 440px) {
      #buttonContainer, #bottomButtons {
        flex-direction: column;
      }
      button {
        width: 100%;
        min-width: unset;
      }
    }
  </style>
</head>
<body oncontextmenu="return false">
<form id="manualEntryForm" autocomplete="off">
    <input type="tel" inputmode="numeric" pattern="[0-9]*" id="manualBarcodeInput" placeholder="THM/EAN" maxlength="100" required />
    <button type="submit">Ekle</button>
  </form>

  <div id="videoContainer">
    <video id="video" autoplay muted playsinline></video>
    <div id="flashOverlay"></div>
    <div id="laserLine"></div>
    <div id="barcodeOverlay"></div>
  </div>

  <div id="buttonContainer">
    <button id="scanButton">Kamera Aç</button>
    <div class="switch-container">
      <label class="switch">
        <input type="checkbox" id="deleteModeToggle" />
        <span class="slider"></span>
      </label>
      Silmek İçin Okut
    </div>
  </div>

  <div id="barcodeListContainer">
    <table>
      <thead>
        <tr><th>Barkod</th><th>Adet</th><th>İşlem</th></tr>
      </thead>
      <tbody id="barcodeTableBody"></tbody>
      <tfoot>
        <tr>
          <td colspan="3" id="totalCount">Kalem Miktarı : 0\nToplam Adet : 0</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div id="bottomButtons">
    <button id="clearAllBtn">Sıfırla</button>
    <button id="exportExcelBtn">Excel</button>
    <button id="copyListBtn">Kopyala</button>
  </div>

  <audio id="beepSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

  <!-- MODAL PENCERESİ -->
  <div id="customModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background-color:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;">
    <div style="background:#fff;padding:24px 20px;border-radius:12px;max-width:320px;width:90%;box-shadow:0 6px 20px rgba(0,0,0,0.3);font-family:sans-serif;">
      <div id="modalContent" style="font-size:16px;margin-bottom:20px;text-align:center;color:#2c3e50;"></div>
      <div style="display:flex;justify-content:center;gap:10px;">
        <button id="modalOk" style="padding:10px 20px;background-color:#3498db;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;">Tamam</button>
        <button id="modalCancel" style="padding:10px 20px;background-color:#e74c3c;color:white;border:none;border-radius:6px;cursor:pointer;font-weight:bold;display:none;">İptal</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const modal = document.getElementById('customModal');
    const modalContent = document.getElementById('modalContent');
    const modalOk = document.getElementById('modalOk');
    const modalCancel = document.getElementById('modalCancel');

    function showModal(message, showCancel = false) {
      modalContent.textContent = message;
      modal.style.display = 'flex';
      modalCancel.style.display = showCancel ? 'inline-block' : 'none';
      return new Promise((resolve) => {
        modalOk.onclick = () => {
          modal.style.display = 'none';
          resolve(true);
        };
        modalCancel.onclick = () => {
          modal.style.display = 'none';
          resolve(false);
        };
      });
    }

    async function alertModal(message) {
      await showModal(message);
    }

    async function confirmModal(message) {
      return await showModal(message, true);
    }

    // Örnek kullanım:
    // await alertModal("Bir hata oldu");
    // if (await confirmModal("Silmek istiyor musunuz?")) {...}

    // Önceden alert() ve confirm() kullanılan tüm yerleri bu yeni modal fonksiyonlarla değiştir.
    // Örneğin:
    // - alert("Kameraya erişim sağlanamadı") → await alertModal(...)
    // - if (confirm(...)) → if (await confirmModal(...))
  </script>
</body>
</html>
