<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barkod Tarayıcı (QuaggaJS)</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>
  <style>
    /* Reset & temel */
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f9fc;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
    }

    /* Manual input form */
    #manualEntryForm {
      margin-bottom: 20px;
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: nowrap;
      align-items: center;
      user-select: none;
    }
    #manualBarcodeInput {
      padding: 12px 16px;
      border-radius: 9999px;
      border: 1px solid #ccc;
      font-size: 16px;
      width: 220px;
      outline-offset: 2px;
      user-select: text;
    }
    #manualEntryForm button {
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 9999px;
      background-color: #3498db;
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(52, 152, 219, 0.5);
      transition: background-color 0.3s ease;
      user-select: none;
      min-width: 70px;
    }
    #manualEntryForm button:hover {
      background-color: #2980b9;
    }

    h1 {
      font-weight: 700;
      margin-bottom: 12px;
      color: #2c3e50;
      text-align: center;
      user-select: text;
    }

    /* Video Container */
    #videoContainer {
      position: relative;
      width: 320px;
      max-width: 90vw;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      margin-bottom: 25px;
      background: #000;
      user-select: none;
    }
    #interactive.viewport {
      width: 100%;
      height: auto;
      border-radius: 12px;
    }
    video, canvas {
      border-radius: 12px;
      user-select: none;
    }
    #flashOverlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      border-radius: 12px;
      z-index: 10;
    }
    #barcodeOverlay {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44, 62, 80, 0.8);
      color: white;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.3s ease;
      z-index: 15;
      max-width: 90%;
      text-align: center;
    }

    /* Button Container */
    #buttonContainer {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
      user-select: none;
    }
    button {
      background-color: #3498db;
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(52, 152, 219, 0.4);
      transition: background-color 0.25s ease;
      min-width: 120px;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
      box-shadow: none;
    }
    button:hover:not(:disabled) {
      background-color: #2980b9;
    }
    button.scanning {
      background-color: #e74c3c !important;
      box-shadow: 0 3px 8px rgba(231, 76, 60, 0.6);
    }

    /* Toggle switch */
    .switch-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      color: #2c3e50;
      user-select: none;
    }
    .switch {
      position: relative;
      width: 52px;
      height: 28px;
      display: inline-block;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #bdc3c7;
      transition: 0.4s;
      border-radius: 28px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    input:checked + .slider {
      background-color: #e74c3c;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* Table */
    #barcodeListContainer {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      padding: 20px 15px;
      user-select: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      color: #34495e;
    }
    thead {
      background-color: #3498db;
      color: white;
      font-weight: 700;
    }
    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #ecf0f1;
    }
    tbody tr:hover {
      background-color: #f0f8ff;
    }
    tfoot td {
      font-weight: 700;
      background-color: #f9f9f9;
      color: #2c3e50;
      padding: 12px;
    }

    /* Bottom buttons */
    #bottomButtons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    #bottomButtons button {
      min-width: 140px;
      background-color: #2ecc71;
      box-shadow: 0 3px 8px rgba(46, 204, 113, 0.5);
    }
    #bottomButtons button:hover {
      background-color: #27ae60;
    }
    #bottomButtons button:nth-child(2) {
      background-color: #f39c12;
      box-shadow: 0 3px 8px rgba(243, 156, 18, 0.5);
    }
    #bottomButtons button:nth-child(2):hover {
      background-color: #d68910;
    }
    #bottomButtons button:nth-child(3) {
      background-color: #25d366;
      box-shadow: 0 3px 8px rgba(37, 211, 102, 0.5);
    }
    #bottomButtons button:nth-child(3):hover {
      background-color: #1ebe58;
    }

    /* Responsive */
    @media (max-width: 440px) {
      #buttonContainer {
        flex-direction: column;
        gap: 12px;
      }
      #bottomButtons {
        flex-direction: column;
      }
      button, #bottomButtons button {
        width: 100%;
        min-width: unset;
      }
      #videoContainer {
        width: 100%;
      }
      #barcodeListContainer {
        max-width: 100%;
      }
    }
  </style>
</head>
<body oncontextmenu="return false">

  <h1>Barkod Tarayıcı (QuaggaJS)</h1>

  <!-- Manual barcode entry form -->
  <form id="manualEntryForm" autocomplete="off">
    <input
      type="tel"
      inputmode="numeric"
      pattern="[0-9]*"
      id="manualBarcodeInput"
      placeholder="Barkod girin"
      maxlength="100"
      required
    />
    <button type="submit">Ekle</button>
  </form>

  <div id="videoContainer">
    <div id="interactive" class="viewport"></div>
    <div id="flashOverlay"></div>
    <div id="barcodeOverlay" aria-live="polite" role="alert"></div>
  </div>

  <div id="buttonContainer">
    <button id="scanButton">Kamera Aç</button>

    <div class="switch-container" title="Silmek için okut modu">
      <label class="switch">
        <input type="checkbox" id="deleteModeToggle" />
        <span class="slider"></span>
      </label>
      <span>Silmek için okut</span>
    </div>
  </div>

  <div id="barcodeListContainer">
    <table id="barcodeTable" aria-label="Okutulan barkodlar">
      <thead>
        <tr>
          <th>Barkod</th>
          <th>Adet</th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <td>Toplam</td>
          <td id="totalCount">0</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div id="bottomButtons">
    <button id="clearListButton">Listeyi Temizle</button>
    <button id="downloadExcelButton">Excel İndir</button>
    <button id="shareWhatsAppButton">WhatsApp Paylaş</button>
  </div>

  <script>
    const scanButton = document.getElementById('scanButton');
    const deleteModeToggle = document.getElementById('deleteModeToggle');
    const barcodeOverlay = document.getElementById('barcodeOverlay');
    const flashOverlay = document.getElementById('flashOverlay');
    const manualEntryForm = document.getElementById('manualEntryForm');
    const manualBarcodeInput = document.getElementById('manualBarcodeInput');
    const barcodeTableBody = document.querySelector('#barcodeTable tbody');
    const totalCountElem = document.getElementById('totalCount');
    const clearListButton = document.getElementById('clearListButton');
    const downloadExcelButton = document.getElementById('downloadExcelButton');
    const shareWhatsAppButton = document.getElementById('shareWhatsAppButton');

    let scanning = false;
    let barcodeCounts = {};

    function updateTable() {
      barcodeTableBody.innerHTML = '';
      let total = 0;
      for (const [code, count] of Object.entries(barcodeCounts)) {
        const tr = document.createElement('tr');
        const tdCode = document.createElement('td');
        const tdCount = document.createElement('td');
        tdCode.textContent = code;
        tdCount.textContent = count;
        tr.appendChild(tdCode);
        tr.appendChild(tdCount);
        barcodeTableBody.appendChild(tr);
        total += count;
      }
      totalCountElem.textContent = total;
    }

    function flashEffect() {
      flashOverlay.style.opacity = '0.7';
      setTimeout(() => {
        flashOverlay.style.opacity = '0';
      }, 150);
    }

    function showBarcodeOverlay(code) {
      barcodeOverlay.textContent = `Okutulan: ${code}`;
      barcodeOverlay.style.opacity = '1';
      setTimeout(() => {
        barcodeOverlay.style.opacity = '0';
      }, 1500);
    }

    function addBarcode(code) {
      if (!code) return;

      if (deleteModeToggle.checked) {
        // Silmek için okut modu
        if (barcodeCounts[code]) {
          barcodeCounts[code]--;
          if (barcodeCounts[code] <= 0) delete barcodeCounts[code];
        }
      } else {
        // Normal ekleme modu
        if (barcodeCounts[code]) {
          barcodeCounts[code]++;
        } else {
          barcodeCounts[code] = 1;
        }
      }
      updateTable();
      flashEffect();
      showBarcodeOverlay(code);
    }

    // Quagga config
    const quaggaConfig = {
      inputStream: {
        name: "Live",
        type: "LiveStream",
        target: document.querySelector('#interactive'),
        constraints: {
          facingMode: "environment",
          aspectRatio: { min: 1, max: 100 },
          // ideal resolution low for speed
          width: { min: 320, ideal: 640, max: 1280 },
          height: { min: 240, ideal: 480, max: 720 }
        }
      },
      decoder: {
        readers: [
          "code_128_reader",
          "ean_reader",
          "ean_8_reader",
          "code_39_reader",
          "code_39_vin_reader",
          "codabar_reader",
          "upc_reader",
          "upc_e_reader",
          "i2of5_reader",
          "2of5_reader",
          "code_93_reader"
        ]
      },
      locate: true,
      numOfWorkers: navigator.hardwareConcurrency || 4,
      frequency: 10,
      // debug: true,
      // debugCanvas: document.createElement('canvas'),
    };

    function startScanner() {
      Quagga.init(quaggaConfig, err => {
        if (err) {
          alert("Kamera başlatılamadı: " + err.message || err);
          scanButton.disabled = false;
          scanButton.textContent = "Kamera Aç";
          scanning = false;
          return;
        }
        Quagga.start();
        scanning = true;
        scanButton.textContent = "Kamerayı Kapat";
        scanButton.classList.add('scanning');
      });

      Quagga.onDetected(result => {
        if (!result || !result.codeResult || !result.codeResult.code) return;
        const code = result.codeResult.code.trim();
        if (!code) return;

        // Debounce aynı barkodu hızlıca tekrar okumayı önle
        if (addBarcode.lastCode === code) return;
        addBarcode.lastCode = code;
        setTimeout(() => { addBarcode.lastCode = null; }, 1500);

        addBarcode(code);
      });

      Quagga.onProcessed(result => {
        // İstersen işaretleme için burada canvas çizimi yapılabilir
      });
    }

    function stopScanner() {
      Quagga.stop();
      scanning = false;
      scanButton.textContent = "Kamera Aç";
      scanButton.classList.remove('scanning');
    }

    scanButton.addEventListener('click', () => {
      if (scanning) {
        stopScanner();
      } else {
        startScanner();
      }
    });

    manualEntryForm.addEventListener('submit', e => {
      e.preventDefault();
      const val = manualBarcodeInput.value.trim();
      if (val.length === 0) return;
      addBarcode(val);
      manualBarcodeInput.value = '';
      manualBarcodeInput.focus();
    });

    clearListButton.addEventListener('click', () => {
      if (confirm("Listeyi temizlemek istediğinize emin misiniz?")) {
        barcodeCounts = {};
        updateTable();
      }
    });

    downloadExcelButton.addEventListener('click', () => {
      if (Object.keys(barcodeCounts).length === 0) {
        alert("İndirilecek barkod yok.");
        return;
      }
      const wb = XLSX.utils.book_new();
      const wsData = [["Barkod", "Adet"]];
      for (const [code, count] of Object.entries(barcodeCounts)) {
        wsData.push([code, count]);
      }
      const ws = XLSX.utils.aoa_to_sheet(wsData);
      XLSX.utils.book_append_sheet(wb, ws, "Barkodlar");
      XLSX.writeFile(wb, "barkodlar.xlsx");
    });

    shareWhatsAppButton.addEventListener('click', () => {
      if (Object.keys(barcodeCounts).length === 0) {
        alert("Paylaşılacak barkod yok.");
        return;
      }
      let message = "Barkod Listesi:\n";
      for (const [code, count] of Object.entries(barcodeCounts)) {
        message += `${code} - ${count} adet\n`;
      }
      const encodedMessage = encodeURIComponent(message);
      const whatsappUrl = `https://wa.me/?text=${encodedMessage}`;
      window.open(whatsappUrl, '_blank');
    });

    // İlk tabloyu güncelle
    updateTable();
  </script>

</body>
</html>
