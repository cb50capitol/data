<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Barkod Okuyucu</title>
<style>
  /* Seçim engelleme */
  body, table, #videoContainer {
    user-select: none;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  td, th {
    border: 1px solid #ccc;
    padding: 8px;
    text-align: left;
  }
  /* Sil butonu stili */
  .delete-btn {
    margin-left: 10px;
    background-color: #e74c3c;
    border: none;
    color: white;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    user-select: none;
  }
  /* Kamera video kapsayıcısı */
  #videoContainer {
    position: relative;
    width: 320px;
    height: 240px;
    margin-bottom: 20px;
  }
  video {
    width: 100%;
    height: 100%;
    background: #000;
  }
  /* Barkod overlay görünümü */
  #barcodeOverlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #e74c3c;
    font-size: 24px;
    font-weight: 700;
    background: rgba(255,255,255,0.85);
    padding: 8px 16px;
    border-radius: 8px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
    user-select: none;
  }
</style>
</head>
<body oncontextmenu="return false">

<h2>Barkod Okuyucu</h2>

<div id="videoContainer">
  <video id="video" autoplay></video>
  <div id="barcodeOverlay"></div>
</div>

<table>
  <thead>
    <tr><th>Barkod</th><th>Adet</th></tr>
  </thead>
  <tbody id="barcodeTableBody"></tbody>
</table>

<p>Toplam farklı barkod: <span id="itemCount">0</span></p>
<p>Toplam adet: <span id="totalCount">0</span></p>

<audio id="beep" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>

<script>
  // Seçim engelleme (kopyalamayı engelle)
  document.addEventListener('selectstart', e => e.preventDefault());

  const video = document.getElementById('video');
  const beepSound = document.getElementById('beep');
  const barcodeTableBody = document.getElementById('barcodeTableBody');
  const barcodeOverlay = document.getElementById('barcodeOverlay');

  // Barkod ve zaman bilgisi
  let scannedBarcodes = {}; // { barkod: adet }
  let lastReadTimestamps = {}; // { barkod: timestamp }

  // Uzun basma için timer ve süre
  let longPressTimer;
  const LONG_PRESS_DURATION = 600; // ms

  // Kamera erişimi ve barkod okutma simülasyonu (örnek, gerçek barkod okuma yok)
  // Normalde burada barkod kütüphanesi ile okutulacak.
  // Örnek için video tıklayınca rastgele barkod ekleniyor.

  video.addEventListener('click', () => {
    // Rastgele barkod örneği (6 haneli)
    const code = 'BC' + Math.floor(100000 + Math.random()*900000);

    // Barkodu göster
    showBarcodeOverlay(code);

    // Ses ve efekt
    beepSound.play();
    flashEffect();

    // Barkodu say
    if (scannedBarcodes[code]) {
      scannedBarcodes[code]++;
    } else {
      scannedBarcodes[code] = 1;
    }
    lastReadTimestamps[code] = Date.now();

    saveData();
    updateTable();
  });

  // Barkod overlay gösterme fonksiyonu
  function showBarcodeOverlay(code) {
    barcodeOverlay.textContent = code;
    barcodeOverlay.style.opacity = '1';
    setTimeout(() => {
      barcodeOverlay.style.opacity = '0';
    }, 1000);
  }

  // Flash efekti (örnek)
  function flashEffect() {
    const originalBg = video.style.backgroundColor;
    video.style.backgroundColor = '#fff';
    setTimeout(() => {
      video.style.backgroundColor = originalBg;
    }, 100);
  }

  // LocalStorage'a kaydetme
  function saveData() {
    localStorage.setItem('scannedBarcodes', JSON.stringify(scannedBarcodes));
    localStorage.setItem('lastReadTimestamps', JSON.stringify(lastReadTimestamps));
  }

  // LocalStorage'dan yükleme
  function loadData() {
    const b = localStorage.getItem('scannedBarcodes');
    const t = localStorage.getItem('lastReadTimestamps');
    if (b) scannedBarcodes = JSON.parse(b);
    if (t) lastReadTimestamps = JSON.parse(t);
  }

  // Tabloyu güncelle ve uzun basma eventini ekle
  function updateTable() {
    barcodeTableBody.innerHTML = '';
    const keys = Object.keys(scannedBarcodes).sort((a,b) => (lastReadTimestamps[b]||0) - (lastReadTimestamps[a]||0));
    let totalCount = 0;

    keys.forEach(code => {
      const count = scannedBarcodes[code];
      totalCount += count;

      const row = document.createElement('tr');
      row.innerHTML = `<td>${code}</td><td>${count}</td>`;

      addLongPressListener(row, code);

      barcodeTableBody.appendChild(row);
    });

    document.getElementById('itemCount').textContent = keys.length;
    document.getElementById('totalCount').textContent = totalCount;
  }

  // Uzun basma dinleyicisi ekleme
  function addLongPressListener(row, code) {
    row.addEventListener('touchstart', (e) => {
      e.preventDefault();
      longPressTimer = setTimeout(() => {
        showDeleteButton(row, code);
      }, LONG_PRESS_DURATION);
    });
    row.addEventListener('touchend', () => clearTimeout(longPressTimer));
    row.addEventListener('touchmove', () => clearTimeout(longPressTimer));

    row.addEventListener('mousedown', () => {
      longPressTimer = setTimeout(() => {
        showDeleteButton(row, code);
      }, LONG_PRESS_DURATION);
    });
    row.addEventListener('mouseup', () => clearTimeout(longPressTimer));
    row.addEventListener('mouseleave', () => clearTimeout(longPressTimer));
  }

  // Sil butonunu göster
  function showDeleteButton(row, code) {
    // Zaten varsa tekrar ekleme
    if (row.querySelector('.delete-btn')) return;

    const btn = document.createElement('button');
    btn.textContent = 'Sil';
    btn.className = 'delete-btn';

    btn.addEventListener('click', () => {
      if (confirm(`"${code}" barkodunu ve tüm adetlerini silmek istediğinize emin misiniz?`)) {
        delete scannedBarcodes[code];
        delete lastReadTimestamps[code];
        saveData();
        updateTable();
      }
    });

    row.lastElementChild.appendChild(btn);

    // 5 sn sonra otomatik gizle
    setTimeout(() => {
      if (btn.parentNode) btn.remove();
    }, 5000);
  }

  // Sayfa yüklendiğinde veri yükle
  window.onload = () => {
    loadData();
    updateTable();

    // Kamera açma (örnek olarak sadece video stream açılıyor)
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}})
        .then(stream => {
          video.srcObject = stream;
          video.play();
        })
        .catch(err => {
          console.warn("Kamera açılırken hata:", err);
        });
    }
  }
</script>

</body>
</html>
