<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Barkod Tarayıcı</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  video {
    width: 90vw;
    max-width: 400px;
    border: 1px solid #ccc;
    margin-bottom: 15px;
    border-radius: 8px;
  }
  #buttonContainer {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  button {
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
    user-select: none;
    border-radius: 6px;
    border: 1px solid #444;
    background-color: #eee;
    transition: background-color 0.2s;
  }
  button:active {
    background-color: #ccc;
  }
  #barcodeListContainer {
    width: 90vw;
    max-width: 400px;
  }
  h1 {
    margin-bottom: 10px;
  }
  ol {
    background: #f5f5f5;
    padding: 15px;
    border-radius: 6px;
    max-height: 200px;
    overflow-y: auto;
    list-style-position: inside;
  }
</style>
</head>
<body>

<video id="video" autoplay muted playsinline style="display:none;"></video>

<div id="buttonContainer">
  <button id="scanButton">Scan</button>
  <button id="okutButton" disabled>Okut</button>
</div>

<div id="barcodeListContainer">
  <h1>Barcode</h1>
  <ol id="barcodeList"></ol>
</div>

<script>
  const scanButton = document.getElementById('scanButton');
  const okutButton = document.getElementById('okutButton');
  const video = document.getElementById('video');
  const barcodeList = document.getElementById('barcodeList');
  const beepSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

  let cameraStream = null;
  let scanning = false;
  let barcodeDetector;
  let scanInterval = null;
  const scannedBarcodes = new Set();

  if ('BarcodeDetector' in window) {
    barcodeDetector = new BarcodeDetector({formats: ['code_128', 'ean_13', 'qr_code', 'upc_a']});
  } else {
    alert('Bu cihazda BarcodeDetector API desteklenmiyor.');
  }

  // Scan butonuna basınca kamera aç/kapa
  scanButton.addEventListener('click', async () => {
    if (cameraStream) {
      // Kamera açık, kapat
      stopCamera();
      scanButton.textContent = "Scan";
      okutButton.disabled = true;
      stopScanning();
    } else {
      // Kamera kapalı, aç
      await startCamera();
      scanButton.textContent = "Stop";
      okutButton.disabled = false;
    }
  });

  // Okut butonuna basılı tutulunca taramayı başlat
  okutButton.addEventListener('mousedown', startScanning);
  okutButton.addEventListener('touchstart', startScanning);

  // Okut butonu bırakılınca taramayı durdur
  okutButton.addEventListener('mouseup', stopScanning);
  okutButton.addEventListener('mouseleave', stopScanning);
  okutButton.addEventListener('touchend', stopScanning);
  okutButton.addEventListener('touchcancel', stopScanning);

  async function startCamera() {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
      video.srcObject = cameraStream;
      video.style.display = 'block';
    } catch (err) {
      alert('Kameraya erişilemedi: ' + err.message);
    }
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
    video.style.display = 'none';
  }

  function startScanning() {
    if (!cameraStream || scanning) return;
    scanning = true;
    scannedBarcodes.clear();
    scanInterval = setInterval(scanFrame, 500);
  }

  function stopScanning() {
    if (!scanning) return;
    scanning = false;
    clearInterval(scanInterval);
    scanInterval = null;
  }

  async function scanFrame() {
    if (!scanning) return;
    try {
      const barcodes = await barcodeDetector.detect(video);
      if (barcodes.length > 0) {
        barcodes.forEach(barcode => {
          if (!scannedBarcodes.has(barcode.rawValue)) {
            scannedBarcodes.add(barcode.rawValue);
            const li = document.createElement('li');
            li.textContent = barcode.rawValue;
            if (barcodeList.firstChild) {
              barcodeList.insertBefore(li, barcodeList.firstChild);
            } else {
              barcodeList.appendChild(li);
            }
            beepSound.play();
          }
        });
      }
    } catch (err) {
      console.error('Tarama hatası:', err);
    }
  }
</script>

</body>
</html>
