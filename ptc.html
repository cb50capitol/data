<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barkod Tarayıcı</title>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <style>
    /* Reset & temel */
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f7f9fc;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
      min-height: 100vh;
    }

    /* Video Container */
    #videoContainer {
      position: relative;
      width: 320px;
      max-width: 90vw;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 18px rgba(0,0,0,0.15);
      margin-bottom: 25px;
      background: #000;
      user-select: none;
    }
    video {
      width: 100%;
      height: auto;
      display: none;
      object-fit: cover;
      border-radius: 12px;
      transition: filter 0.3s ease;
      cursor: pointer; /* Tıklanabilir olduğunu göster */
    }
    #flashOverlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(255,255,255,0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      border-radius: 12px;
      z-index: 10;
    }
    /* Yeni: Barkod overlay */
    #barcodeOverlay {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(44, 62, 80, 0.8);
      color: white;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 18px;
      opacity: 0;
      pointer-events: none;
      user-select: none;
      transition: opacity 0.3s ease;
      z-index: 15;
      max-width: 90%;
      text-align: center;
    }

    /* Input ve buton satırı */
    #manualInputContainer {
      width: 320px;
      max-width: 90vw;
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    #manualBarcodeInput {
      flex-grow: 1;
      padding: 10px 15px;
      font-size: 16px;
      border-radius: 15px;
      border: 1px solid #ccc;
      outline: none;
      user-select: text;
      -moz-appearance: textfield;
    }
    #manualBarcodeInput::-webkit-inner-spin-button,
    #manualBarcodeInput::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    #addBarcodeButton {
      padding: 0 12px;
      font-size: 16px;
      border-radius: 8px;
      background-color: #3498db;
      border: none;
      color: white;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(52, 152, 219, 0.4);
      user-select: none;
      min-width: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #addBarcodeButton:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
      box-shadow: none;
    }
    #addBarcodeButton:hover:not(:disabled) {
      background-color: #2980b9;
    }

    /* Button Container */
    #buttonContainer {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 30px;
      user-select: none;
    }
    button {
      background-color: #3498db;
      border: none;
      color: white;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 3px 6px rgba(52, 152, 219, 0.4);
      transition: background-color 0.25s ease;
      min-width: 120px;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
      box-shadow: none;
    }
    button:hover:not(:disabled) {
      background-color: #2980b9;
    }
    button.scanning {
      background-color: #e74c3c !important;
      box-shadow: 0 3px 8px rgba(231, 76, 60, 0.6);
    }

    /* Toggle switch */
    .switch-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 15px;
      color: #2c3e50;
      user-select: none;
    }
    .switch {
      position: relative;
      width: 52px;
      height: 28px;
      display: inline-block;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #bdc3c7;
      transition: 0.4s;
      border-radius: 28px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.15);
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.4s;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    input:checked + .slider {
      background-color: #e74c3c;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* Table */
    #barcodeListContainer {
      width: 100%;
      max-width: 400px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.1);
      padding: 20px 15px;
      user-select: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      color: #34495e;
    }
    thead {
      background-color: #3498db;
      color: white;
      font-weight: 700;
    }
    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #ecf0f1;
    }
    tbody tr:hover {
      background-color: #f0f8ff;
    }
    tfoot td {
      font-weight: 700;
      background-color: #f9f9f9;
      color: #2c3e50;
      padding: 12px;
    }

    /* Bottom buttons */
    #bottomButtons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    #bottomButtons button {
      min-width: 140px;
      background-color: #2ecc71;
      box-shadow: 0 3px 8px rgba(46, 204, 113, 0.5);
    }
    #bottomButtons button:hover {
      background-color: #27ae60;
    }
    #bottomButtons button:nth-child(2) {
      background-color: #f39c12;
      box-shadow: 0 3px 8px rgba(243, 156, 18, 0.5);
    }
    #bottomButtons button:nth-child(2):hover {
      background-color: #d68910;
    }
    #bottomButtons button:nth-child(3) {
      background-color: #25d366;
      box-shadow: 0 3px 8px rgba(37, 211, 102, 0.5);
    }
    #bottomButtons button:nth-child(3):hover {
      background-color: #1ebe58;
    }

    /* Responsive */
    @media (max-width: 440px) {
      #manualInputContainer {
        width: 100%;
      }
      #buttonContainer {
        flex-direction: column;
        gap: 12px;
      }
      #bottomButtons {
        flex-direction: column;
      }
      button, #bottomButtons button {
        width: 100%;
        min-width: unset;
      }
      #videoContainer {
        width: 100%;
      }
      #barcodeListContainer {
        max-width: 100%;
      }
    }
  </style>
</head>
<body oncontextmenu="return false">

  <div id="manualInputContainer">
    <input
      id="manualBarcodeInput"
      type="number"
      inputmode="numeric"
      pattern="[0-9]*"
      placeholder="Manuel barkod giriniz"
      autocomplete="off"
      maxlength="20"
    />
    <button id="addBarcodeButton" disabled title="Barkodu ekle">Ekle</button>
  </div>

  <div id="videoContainer">
    <video id="video" autoplay muted playsinline></video>
    <div id="flashOverlay"></div>
    <div id="barcodeOverlay" aria-live="polite" role="alert"></div>
  </div>

  <div id="buttonContainer">
    <button id="scanButton">Kamera Aç</button>

    <div class="switch-container" title="Silmek için okut modu">
      <label class="switch">
        <input type="checkbox" id="deleteModeToggle" />
        <span class="slider"></span>
      </label>
      <span>Silmek için okut</span>
    </div>
  </div>

  <div id="barcodeListContainer">
    <table id="barcodeTable" aria-label="Okutulan barkodlar">
      <thead>
        <tr>
          <th>Barkod Değeri</th>
          <th>Adet</th>
        </tr>
      </thead>
      <tbody></tbody>
      <tfoot>
        <tr>
          <td>Kalem Miktarı</td>
          <td id="itemCount">0</td>
        </tr>
        <tr>
          <td>Toplam Adet</td>
          <td id="totalCount">0</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div id="bottomButtons">
    <button id="clearHistoryButton" title="Okutulan barkod listesini temizle">Geçmişi Temizle</button>
    <button id="downloadExcelButton" title="Barkod listesini Excel olarak indir">Excel Olarak İndir</button>
    <button id="whatsappShareButton" title="Barkod listesini WhatsApp'ta paylaş">WhatsApp'ta Paylaş</button>
  </div>

<script>
  const scanButton = document.getElementById('scanButton');
  const clearHistoryButton = document.getElementById('clearHistoryButton');
  const downloadExcelButton = document.getElementById('downloadExcelButton');
  const whatsappShareButton = document.getElementById('whatsappShareButton');
  const video = document.getElementById('video');
  const flashOverlay = document.getElementById('flashOverlay');
  const barcodeTableBody = document.querySelector('#barcodeTable tbody');
  const beepSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
  const deleteModeToggle = document.getElementById('deleteModeToggle');
  const barcodeOverlay = document.getElementById('barcodeOverlay');

  const manualBarcodeInput = document.getElementById('manualBarcodeInput');
  const addBarcodeButton = document.getElementById('addBarcodeButton');

  let cameraStream = null;
  let barcodeDetector = null;
  let barcodes = {}; // barkodlar ve adetleri { '123456789': 2, ... }

  // Barkod ekleme fonksiyonu
  function handleBarcode(value) {
    value = value.trim();
    if (!value) return;
    if (deleteModeToggle.checked) {
      // Silmek için okut modu
      if (barcodes[value]) {
        barcodes[value]--;
        if (barcodes[value] <= 0) {
          delete barcodes[value];
        }
        beepSound.play();
        updateTable();
      }
    } else {
      // Normal ekleme modu
      if (!barcodes[value]) barcodes[value] = 0;
      barcodes[value]++;
      beepSound.play();
      updateTable();
    }
    // Flash efekti
    flashOverlay.style.opacity = '1';
    setTimeout(() => {
      flashOverlay.style.opacity = '0';
    }, 150);

    // Barkodu overlayde göster
    barcodeOverlay.textContent = value;
    barcodeOverlay.style.opacity = 1;
    setTimeout(() => {
      barcodeOverlay.style.opacity = 0;
    }, 1500);
  }

  // Tablo güncelle
  function updateTable() {
    barcodeTableBody.innerHTML = '';
    let totalItems = 0;
    let totalCount = 0;
    for (const [code, count] of Object.entries(barcodes)) {
      const tr = document.createElement('tr');
      const tdCode = document.createElement('td');
      const tdCount = document.createElement('td');
      tdCode.textContent = code;
      tdCount.textContent = count;
      tr.appendChild(tdCode);
      tr.appendChild(tdCount);
      barcodeTableBody.appendChild(tr);
      totalItems++;
      totalCount += count;
    }
    document.getElementById('itemCount').textContent = totalItems;
    document.getElementById('totalCount').textContent = totalCount;
  }

  // Kamera başlat / durdur
  async function stopCamera() {
    if (cameraStream) {
      let tracks = cameraStream.getTracks();
      tracks.forEach(track => track.stop());
      cameraStream = null;
      video.srcObject = null;
      video.style.display = 'none';
      scanButton.textContent = 'Kamera Aç';
      scanButton.classList.remove('scanning');
      barcodeOverlay.style.opacity = 0;
    }
  }

  scanButton.addEventListener('click', async () => {
    if (cameraStream) {
      await stopCamera();
    } else {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = cameraStream;
        video.style.display = 'block';
        scanButton.textContent = 'Kamerayı Kapat';
        scanButton.classList.add('scanning');
        barcodeOverlay.style.opacity = 0;
      } catch (err) {
        alert('Kameraya erişim sağlanamadı: ' + err.message);
      }
    }
  });

  // Videoya dokununca tek seferlik barkod algıla
  video.addEventListener('click', async () => {
    if (!cameraStream) return;

    try {
      const detectedBarcodes = await barcodeDetector.detect(video);
      if (detectedBarcodes.length > 0) {
        handleBarcode(detectedBarcodes[0].rawValue);
      } else {
        alert('Barkod algılanamadı. Lütfen tekrar deneyin.');
      }
    } catch (err) {
      console.warn('Barkod tarama hatası:', err);
    }
  });

  // Manuel barkod input kontrolü
  manualBarcodeInput.addEventListener('input', () => {
    const val = manualBarcodeInput.value.trim();
    // Sadece rakam varsa ekle butonunu aktif et
    addBarcodeButton.disabled = !/^\d+$/.test(val);
  });

  // Manuel barkod ekle butonu
  addBarcodeButton.addEventListener('click', () => {
    const val = manualBarcodeInput.value.trim();
    if (/^\d+$/.test(val)) {
      handleBarcode(val);
      manualBarcodeInput.value = '';
      addBarcodeButton.disabled = true;
      manualBarcodeInput.focus();
    }
  });

  // Silmek için okut modu aç/kapa
  deleteModeToggle.addEventListener('change', () => {
    // İstersen buraya ek özellikler koyabilirsin
  });

  // Geçmişi temizle butonu
  clearHistoryButton.addEventListener('click', () => {
    if (confirm('Barkod geçmişi temizlensin mi?')) {
      barcodes = {};
      updateTable();
    }
  });

  // Excel indir
  downloadExcelButton.addEventListener('click', () => {
    if (Object.keys(barcodes).length === 0) {
      alert('İndirilecek barkod bulunamadı!');
      return;
    }
    const wb = XLSX.utils.book_new();
    const ws_data = [['Barkod', 'Adet']];
    for (const [code, count] of Object.entries(barcodes)) {
      ws_data.push([code, count]);
    }
    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    XLSX.utils.book_append_sheet(wb, ws, 'Barkodlar');
    XLSX.writeFile(wb, 'barkodlar.xlsx');
  });

  // WhatsApp'ta paylaş (basit metin olarak)
  whatsappShareButton.addEventListener('click', () => {
    if (Object.keys(barcodes).length === 0) {
      alert('Paylaşılacak barkod bulunamadı!');
      return;
    }
    let message = 'Barkod Listesi:%0A';
    for (const [code, count] of Object.entries(barcodes)) {
      message += `${code} - Adet: ${count}%0A`;
    }
    const url = `https://wa.me/?text=${encodeURIComponent(message)}`;
    window.open(url, '_blank');
  });

  // BarcodeDetector API kontrol ve başlat
  (async () => {
    if ('BarcodeDetector' in window) {
      const formats = await BarcodeDetector.getSupportedFormats();
      // Yalnızca bazı barkod formatlarını aktif et (dilersen değiştir)
      barcodeDetector = new BarcodeDetector({ formats: ['code_128', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_39', 'qr_code'] });
    } else {
      alert('Tarayıcı BarcodeDetector API\'sini desteklemiyor!');
    }
  })();

</script>

</body>
</html>
