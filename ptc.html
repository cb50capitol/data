<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Barkod Tarayıcı</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #fafafa;
  }
  #videoContainer {
    position: relative;
    display: inline-block;
  }
  video {
    width: 90vw;
    max-width: 400px;
    border-radius: 8px;
    background: black;
    transition: filter 0.3s ease;
  }
  video.blurred {
    filter: blur(6px);
  }
  #flashOverlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255,255,255,0.7);
    opacity: 0;
    pointer-events: none;
    border-radius: 8px;
    transition: opacity 0.2s ease;
  }
  #buttonContainer {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  button {
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
    user-select: none;
    border-radius: 6px;
    border: 1px solid #444;
    background-color: #eee;
    transition: background-color 0.2s;
  }
  button:active {
    background-color: #ccc;
  }
  button.scanning {
    background-color: #e74c3c;
    color: white;
    border-color: #c0392b;
  }
  #barcodeListContainer {
    width: 90vw;
    max-width: 400px;
  }
  h1 {
    margin-bottom: 10px;
    text-align: center;
    color: #333;
  }
  /* Tablo stili */
  #barcodeTable {
    width: 100%;
    border-collapse: collapse;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    background: #fff;
  }
  #barcodeTable thead {
    background-color: #4CAF50;
    color: white;
  }
  #barcodeTable th, #barcodeTable td {
    padding: 12px 15px;
    text-align: left;
    border-bottom: 1px solid #ddd;
  }
  #barcodeTable tbody tr:hover {
    background-color: #f1f1f1;
  }
</style>
</head>
<body>

<div id="videoContainer">
  <video id="video" autoplay muted playsinline style="display:none;"></video>
  <div id="flashOverlay"></div>
</div>

<div id="buttonContainer">
  <button id="scanButton">Scan</button>
  <button id="okutButton" disabled>Okut</button>
  <button id="clearHistoryButton" title="Geçmişi Temizle">Geçmişi Temizle</button>
</div>

<div id="barcodeListContainer">
  <h1>Okutulan Barkodlar</h1>
  <table id="barcodeTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Barkod Değeri</th>
        <th>Adet</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
  const scanButton = document.getElementById('scanButton');
  const okutButton = document.getElementById('okutButton');
  const clearHistoryButton = document.getElementById('clearHistoryButton');
  const video = document.getElementById('video');
  const flashOverlay = document.getElementById('flashOverlay');
  const barcodeTableBody = document.querySelector('#barcodeTable tbody');
  const beepSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

  let cameraStream = null;
  let scanning = false;
  let barcodeDetector;
  let scanInterval = null;

  let scannedBarcodes = JSON.parse(localStorage.getItem('scannedBarcodes') || '{}');
  let lastReadTimestamps = JSON.parse(localStorage.getItem('lastReadTimestamps') || '{}');
  let readOrder = JSON.parse(localStorage.getItem('readOrder') || '[]');

  const DEBOUNCE_TIME = 2000; // 2 saniye

  if ('BarcodeDetector' in window) {
    barcodeDetector = new BarcodeDetector({formats: ['code_128', 'ean_13', 'qr_code', 'upc_a']});
  } else {
    alert('Bu cihazda BarcodeDetector API desteklenmiyor.');
  }

  window.addEventListener('DOMContentLoaded', () => {
    updateTable();
  });

  scanButton.addEventListener('click', async () => {
    if (cameraStream) {
      stopCamera();
      scanButton.textContent = "Scan";
      okutButton.disabled = true;
      stopScanning();
      okutButton.classList.remove('scanning');
      video.classList.remove('blurred');
    } else {
      await startCamera();
      scanButton.textContent = "Stop";
      okutButton.disabled = false;
    }
  });

  okutButton.addEventListener('mousedown', startScanning);
  okutButton.addEventListener('touchstart', startScanning);
  okutButton.addEventListener('mouseup', stopScanningAndReset);
  okutButton.addEventListener('mouseleave', stopScanningAndReset);
  okutButton.addEventListener('touchend', stopScanningAndReset);
  okutButton.addEventListener('touchcancel', stopScanningAndReset);

  clearHistoryButton.addEventListener('click', () => {
    scannedBarcodes = {};
    lastReadTimestamps = {};
    readOrder = [];
    localStorage.removeItem('scannedBarcodes');
    localStorage.removeItem('lastReadTimestamps');
    localStorage.removeItem('readOrder');
    updateTable();
  });

  async function startCamera() {
    try {
      cameraStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
      video.srcObject = cameraStream;
      video.style.display = 'block';
      video.classList.remove('blurred'); // Kamera açıldığında net olsun
    } catch (err) {
      alert('Kameraya erişilemedi: ' + err.message);
    }
  }

  function stopCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }
    video.style.display = 'none';
  }

  function startScanning() {
    if (!cameraStream || scanning) return;
    scanning = true;
    if (scanInterval) {
      clearInterval(scanInterval);
    }
    scanInterval = setInterval(scanFrame, 500);
    okutButton.classList.remove('scanning');
    video.classList.remove('blurred');
  }

  function stopScanning() {
    if (!scanning) return;
    scanning = false;
    if (scanInterval) {
      clearInterval(scanInterval);
      scanInterval = null;
    }
  }

  function stopScanningAndReset() {
    stopScanning();
    okutButton.classList.remove('scanning');
    video.classList.remove('blurred');
  }

  async function scanFrame() {
    if (!scanning) return;
    try {
      const barcodes = await barcodeDetector.detect(video);
      if (barcodes.length > 0) {
        const now = Date.now();
        for (const barcode of barcodes) {
          const code = barcode.rawValue;
          if (lastReadTimestamps[code] && (now - lastReadTimestamps[code]) < DEBOUNCE_TIME) {
            continue;
          }
          lastReadTimestamps[code] = now;

          if (scannedBarcodes[code]) {
            scannedBarcodes[code]++;
          } else {
            scannedBarcodes[code] = 1;
            // Yeni barkod ilk kez okunuyorsa readOrder'a ekle
            readOrder.push(code);
          }
          saveData();
          updateTable();
          beepSound.play();
          flashEffect();

          stopScanning();
          video.classList.add('blurred');
          okutButton.classList.add('scanning');

          break;
        }
      }
    } catch (err) {
      console.error('Tarama hatası:', err);
    }
  }

  function updateTable() {
    barcodeTableBody.innerHTML = '';
    // En son okutulan en üstte olacak şekilde sıralama:
    // Ancak sıra numarası readOrder'a göre olmalı (okunma sırasına göre)
    // Önce barkodları okutulma zamanına göre sırala:
    const sortedByLastRead = Object.keys(scannedBarcodes).sort((a,b) => (lastReadTimestamps[b]||0)-(lastReadTimestamps[a]||0));

    sortedByLastRead.forEach((code, displayIndex) => {
      const count = scannedBarcodes[code];
      const row = document.createElement('tr');

      // Sıra numarasını readOrder dizisindeki index+1 olarak hesapla
      const orderIndex = readOrder.indexOf(code);
      const cellIndex = document.createElement('td');
      cellIndex.textContent = orderIndex + 1; // Okunma sırasına göre sıra numarası

      const cellCode = document.createElement('td');
      cellCode.textContent = code;
      const cellCount = document.createElement('td');
      cellCount.textContent = count;

      row.appendChild(cellIndex);
      row.appendChild(cellCode);
      row.appendChild(cellCount);

      barcodeTableBody.appendChild(row);
    });
  }

  function saveData() {
    localStorage.setItem('scannedBarcodes', JSON.stringify(scannedBarcodes));
    localStorage.setItem('lastReadTimestamps', JSON.stringify(lastReadTimestamps));
    localStorage.setItem('readOrder', JSON.stringify(readOrder));
  }

  function flashEffect() {
    flashOverlay.style.opacity = '1';
    setTimeout(() => {
      flashOverlay.style.opacity = '0';
    }, 150);
  }
</script>

</body>
</html>
